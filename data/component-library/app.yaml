# App コンポーネントライブラリ。
#
# 業務アプリケーションの利用形態を脅威モデルに載せるための 5 型：
#   - CHAT / MAIL / CRM / OTHER_APP: 用途別の業務アプリ。
#     認可状況（sanctioned / unsanctioned）と所有状況（自社 / 他社 / 個人）を
#     ノード属性（cloudSanction / cloudOwnership）として NodePanel から設定できる。
#   - SHADOW_APP: 組織が把握していないシャドー IT アプリ。
#
# 型の定義を builtin.yaml と分けて管理するための別ファイル。同梱の基本型として扱う
# （builtin: true＝サイドバーのライブラリトグルでは無効化できない）。
#
# ライセンス: Apache-2.0（同梱）
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

library:
  id: app
  title: "App Components"
  version: "1.0"
  license: "Apache-2.0"
  builtin: true
  description: "業務アプリケーション型（Chat / Mail / CRM / Other / Shadow）。認可状況・所有状況を属性で表現する。"

categories:
  - id: APP
    label: "App"
    order: 36

components:
  - id: CHAT
    label: "チャット"
    category: APP
    icon: { kind: builtin, name: "message-circle" }
    shape: rounded
    color: "bg-transparent"
    description: "チャット / メッセージングアプリ。認可状況・所有状況を属性で設定する。"

  - id: LINE
    label: "LINE"
    category: APP
    icon: { kind: builtin, name: "messages-square" }
    shape: rounded
    color: "bg-transparent"
    description: "LINE 公式アカウント／Messaging API チャネル。外部のメッセージング基盤を経由して顧客とやり取りする。"

  - id: WEB_FORM
    label: "Webフォーム"
    category: APP
    icon: { kind: builtin, name: "clipboard-pen" }
    shape: rounded
    color: "bg-transparent"
    description: "問い合わせ・資料請求・申込などの Web フォーム。外部の不特定者が自由記述を送り込む入口になる。"

  - id: MAIL
    label: "メール"
    category: APP
    icon: { kind: builtin, name: "mail" }
    shape: rounded
    color: "bg-transparent"
    description: "メールサービス / メールクライアント。認可状況・所有状況を属性で設定する。"

  - id: CRM
    label: "CRM"
    category: APP
    icon: { kind: builtin, name: "users" }
    shape: rounded
    color: "bg-transparent"
    description: "CRM（顧客管理）アプリ。認可状況・所有状況を属性で設定する。"

  - id: OTHER_APP
    label: "その他のアプリ"
    category: APP
    icon: { kind: builtin, name: "app-window" }
    shape: rounded
    color: "bg-transparent"
    description: "上記に該当しないその他の業務アプリ。認可状況・所有状況を属性で設定する。"

  - id: SHADOW_APP
    label: "シャドーアプリ"
    category: APP
    icon: { kind: builtin, name: "eye-off" }
    shape: rounded
    color: "bg-transparent"
    description: "組織が把握・統制していないシャドー IT アプリ。"
