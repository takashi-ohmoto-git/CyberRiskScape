# Built-in component library for CyberRiskScape.
# Default 13 component types covering Basic Shapes (DFD), AI/LLM components, and
# users/devices, network edge and identity primitives. Bundled with the application; cannot be disabled.
#
# To add custom components, create a separate YAML in this directory or upload
# from the UI (planned for a later phase).
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

library:
  id: builtin
  title: "Built-in Components"
  version: "1.0"
  license: "Apache-2.0"
  builtin: true
  description: "Default component set: Basic Shapes (DFD) primitives, AI components, users/devices, network edge, and identity."

categories:
  - id: CLASSIC_DFD
    label: "Basic Shapes (DFD)"
    order: 10
  - id: AI
    label: "AI Components"
    order: 20
  - id: USERS_DEVICES
    label: "Users & Devices"
    order: 15
  - id: NETWORK
    label: "Network & Edge"
    order: 30
  - id: IDENTITY
    label: "Identity & Access"
    order: 32
  - id: DOCUMENTS
    label: "Documents"
    order: 40
  - id: SERVERS
    label: "Servers"
    order: 41

components:
  # ── Basic Shapes (DFD) ─────────────────────────────────────────────
  - id: EXTERNAL_ENTITY
    label: "外部主体"
    category: CLASSIC_DFD
    icon: { kind: builtin, name: "square" }
    shape: rectangle
    color: "bg-transparent"
    description: "システム境界の外側にいるアクター（顧客、外部システム、規制当局など）。"

  - id: PROCESS
    label: "プロセス"
    category: CLASSIC_DFD
    icon: { kind: builtin, name: "circle" }
    shape: circle
    color: "bg-transparent"
    description: "データを変換・処理する機能要素。Yourdon 記法では円で表現。"

  - id: DATA_STORE
    label: "データストア"
    category: CLASSIC_DFD
    icon: { kind: builtin, name: "equal" }
    shape: data-store
    color: "bg-transparent"
    description: "永続化されたデータの格納場所（DB、ファイルストア、キャッシュ）。"
    canContain: [PERSONAL_INFO, CONFIDENTIAL_INFO, SOURCE_CODE, CREDENTIAL, LOG, VOICE_RECORDING, API_SPEC, OTHER_DOCUMENT]

  # ── AI Components ───────────────────────────────────────────
    posture: [log, encryptionAtRest]
  - id: LLM
    label: "LLMモデル"
    category: AI
    icon: { kind: builtin, name: "brain" }
    shape: rounded
    color: "bg-violet-600"
    description: "大規模言語モデル（推論API、ホスト型、ローカル型を含む）。"

  - id: DB
    label: "ベクターDB / RAG"
    category: AI
    icon: { kind: builtin, name: "database-zap" }
    shape: rounded
    color: "bg-violet-600"
    description: "埋め込みベクトルや RAG インデックスを保持するストア。"
    canContain: [PERSONAL_INFO, CONFIDENTIAL_INFO, SOURCE_CODE, CREDENTIAL, LOG, OTHER_DOCUMENT]
    posture: [log, encryptionAtRest]

  - id: TOOL
    label: "外部ツール / API"
    category: AI
    icon: { kind: builtin, name: "wrench" }
    shape: rounded
    color: "bg-violet-600"
    description: "エージェントが呼び出す外部ツール／API（function calling 先）。"

  - id: AGENT
    label: "AIエージェント"
    category: AI
    icon: { kind: builtin, name: "sparkles" }
    shape: rounded
    color: "bg-violet-600"
    description: "計画・ツール選択・推論を自律的に行う AI エージェント。"

  # ── Users & Devices / Network & Edge / Identity & Secrets ───
  - id: USER
    label: "ユーザー"
    category: USERS_DEVICES
    icon: { kind: builtin, name: "user" }
    shape: rounded
    color: "bg-yellow-600"
    description: "人間のエンドユーザー。userTrustAttribute で信頼区分を分類。"
    canContain: [PC, SMARTPHONE]

  - id: PC
    label: "パソコン"
    category: USERS_DEVICES
    icon: { kind: builtin, name: "monitor" }
    shape: rounded
    color: "bg-yellow-600"
    description: "PC 端末。managedState で MDM 配下か BYOD かを表現。"
    canContain: [PERSONAL_INFO, CONFIDENTIAL_INFO, SOURCE_CODE, CREDENTIAL, LOG, OTHER_DOCUMENT]
    posture: [encryptionAtRest, patch]

  - id: SMARTPHONE
    label: "スマートフォン"
    category: USERS_DEVICES
    icon: { kind: builtin, name: "smartphone" }
    shape: rounded
    color: "bg-yellow-600"
    description: "モバイル端末。managedState で MDM 配下か BYOD かを表現。"
    canContain: [PERSONAL_INFO, CONFIDENTIAL_INFO, SOURCE_CODE, CREDENTIAL, LOG, OTHER_DOCUMENT]
    posture: [encryptionAtRest, patch]

  - id: IOT
    label: "IoT"
    category: USERS_DEVICES
    icon: { kind: builtin, name: "cctv" }
    shape: rounded
    color: "bg-yellow-600"
    description: "IoT 機器・組込デバイス。多くは Unmanaged 扱い。"
    posture: [patch]

  - id: GATEWAY
    label: "APIゲートウェイ"
    category: NETWORK
    icon: { kind: builtin, name: "log-in" }
    shape: rounded
    color: "bg-transparent"
    description: "API ゲートウェイ／リバースプロキシ。境界での認可と流入制御を担う。クラウドでは Amazon API Gateway / Azure API Management / Google Cloud API Gateway・Apigee / OCI API Gateway 等が該当する。"
    posture: [logRetention, patch]

  - id: FRONT_END_SERVER
    label: "フロントエンドサーバー"
    category: SERVERS
    icon: { kind: builtin, name: "server" }
    shape: rounded
    color: "bg-transparent"
    description: "Web サーバー・リバースプロキシ等の外部公開ポイント。attackSurface 属性で公開条件・防御策の有無を表現する。"
    posture: [logRetention, patch]

  - id: CONNECTOR
    label: "コネクタ"
    category: NETWORK
    icon: { kind: builtin, name: "circle-dot" }
    shape: connector
    color: "bg-transparent"
    description: "中継ノード（メッセージブローカー、iPaaS、サイドカープロキシ）。クラウドでは Amazon SQS・SNS・EventBridge・MSK / Azure Service Bus・Event Hubs / Google Cloud Pub/Sub / OCI Streaming、DB プロキシの Amazon RDS Proxy 等が該当する。"

  - id: IDENTITY_PROVIDER
    label: "IdP"
    category: IDENTITY
    icon: { kind: builtin, name: "shield-check" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "アイデンティティプロバイダ（IdP）。SSO・フェデレーション・トークン発行を担う認証認可の中核。Zero Trust ではポリシー判断の起点となる。"
    posture: [log, accountReview]

  - id: DIRECTORY
    label: "ディレクトリ"
    category: IDENTITY
    icon: { kind: builtin, name: "book-user" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "ディレクトリサービス（Active Directory / LDAP）。利用者・グループ・権限とその資格情報を保持する ID の格納先であり、自身も認証（Kerberos 等）を行う。トークン発行やフェデレーションを担う場合は IdP を使う。"
    canContain: [PERSONAL_INFO, CREDENTIAL]

  # ── Documents ───────────────────────────────────────────────
    posture: [log, patch, accountReview]
  - id: PERSONAL_INFO
    label: "個人情報"
    category: DOCUMENTS
    icon: { kind: builtin, name: "id-card" }
    shape: rounded
    color: "bg-cyan-600"
    description: "氏名・住所・連絡先などの個人を識別し得る情報（PII）。"
    posture: [dataAsset]

  - id: CONFIDENTIAL_INFO
    label: "機密情報"
    category: DOCUMENTS
    icon: { kind: builtin, name: "file-lock" }
    shape: rounded
    color: "bg-cyan-600"
    description: "事業秘密・契約情報・非公開資料など、漏洩時の影響が大きい情報。"
    posture: [dataAsset]

  - id: SOURCE_CODE
    label: "ソースコード"
    category: DOCUMENTS
    icon: { kind: builtin, name: "file-code" }
    shape: rounded
    color: "bg-cyan-600"
    description: "アプリケーション／インフラのソースコード、IaC、設定ファイル。"

  - id: CREDENTIAL
    label: "認証情報"
    category: DOCUMENTS
    icon: { kind: builtin, name: "key-round" }
    shape: rounded
    color: "bg-cyan-600"
    description: "API キー・トークン・パスワード・秘密鍵・証明書などの認証材料。"

  - id: LOG
    label: "ログ"
    category: DOCUMENTS
    icon: { kind: builtin, name: "scroll-text" }
    shape: rounded
    color: "bg-cyan-600"
    description: "監査ログ・アクセスログ・アプリケーションログなどの記録情報。"

  - id: VOICE_RECORDING
    label: "通話録音"
    category: DOCUMENTS
    icon: { kind: builtin, name: "file-audio" }
    shape: rounded
    color: "bg-cyan-600"
    description: "通話の録音データ。声そのものが生体情報であり、通話内容に個人情報・機密情報を含み得る。"
    posture: [dataAsset]

  - id: OTHER_DOCUMENT
    label: "その他"
    category: DOCUMENTS
    icon: { kind: builtin, name: "file" }
    shape: rounded
    color: "bg-cyan-600"
    description: "上記カテゴリに該当しないドキュメント・データ資産。"
    posture: [dataAsset]
