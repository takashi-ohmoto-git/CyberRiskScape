# 音声 AI・コンタクトセンター拡張コンポーネントライブラリ。
#
# 電話・音声 AI・コンタクトセンターを脅威モデルに載せるための 9 型：
#   - PBX: 電話交換機・コンタクトセンター基盤（PSTN / SIP、クラウド型コンタクトセンターを含む）
#   - IVR: 自動音声応答
#   - STT / TTS / STS: 音声→テキスト／テキスト→音声／音声→音声（リアルタイム音声モデル）
#   - AVATAR: アバター・デジタルヒューマン（映像と音声で応対）
#   - HUMAN_OPERATOR: 有人オペレーター（コンタクトセンターの応対者）
#   - VOICEPRINT_AUTH: 声紋認証（生体認証）
#   - PHONE: 電話機（固定電話・携帯電話の通話。データ端末としてのスマートフォンは builtin の SMARTPHONE）
#
# STT / TTS / STS / AVATAR は AI、SBC 以外の電話系（PBX / IVR / PHONE / HUMAN_OPERATOR）は
# CONTACT_CENTER、VOICEPRINT_AUTH は IDENTITY カテゴリに置く。
# 通話録音（VOICE_RECORDING）は DOCUMENTS カテゴリのため builtin.yaml、
# LINE チャネルは CHAT と同じ APP カテゴリのため app.yaml に置く。
# 有人／AI × Chat／Call の別は型にせず、コンタクトセンターのテンプレートで組み合わせとして示す。
#
# 別ライブラリ（builtin.yaml と分離）にし、library メタに `builtin: true` を付けないことで、
# LeftSidebar のライブラリトグルで無効化できる（「音声系を使わない」運用を選べる）。
# 無効化はパレットから型を外すだけで、配置済みのノードの描画と脅威検出には影響しない。
#
# ライセンス: Apache-2.0（同梱）
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

library:
  id: voice
  title: "Voice AI & Contact Center Components"
  version: "1.0"
  license: "Apache-2.0"
  description: "音声 AI・コンタクトセンター型（PBX / IVR / STT / TTS / STS / アバター / 有人オペレーター / 声紋認証）。"

# 音声系 8 型のうち 6 型は CONTACT_CENTER にまとめる（音声 AI も AI ではなくこちらに置き、
# 電話・音声の構成要素を 1 か所で探せるようにする）。有人オペレーターは人なので USERS_DEVICES、
# 声紋認証は認証基盤なので IDENTITY。builtin と共有するカテゴリは idempotent に再宣言する。
categories:
  - id: IDENTITY
    label: "Identity & Access"
    order: 32
  - id: CONTACT_CENTER
    label: "Contact Center"
    order: 33
  - id: AI
    label: "AI Components"
    order: 20

components:
  # ── Contact Center / Users & Devices / Identity ─────────────
  - id: PBX
    label: "PBX / コンタクトセンター基盤"
    category: CONTACT_CENTER
    icon: { kind: builtin, name: "phone" }
    shape: rounded
    color: "bg-transparent"
    description: "電話交換機・コンタクトセンター基盤（PSTN / SIP、クラウド型コンタクトセンターを含む）。通話の着信・転送・録音を担う。"
    canContain: [VOICE_RECORDING, PERSONAL_INFO, LOG]
    posture: [log, patch, accountReview]

  - id: IVR
    label: "IVR"
    category: CONTACT_CENTER
    icon: { kind: builtin, name: "list-tree" }
    shape: rounded
    color: "bg-transparent"
    description: "自動音声応答（Interactive Voice Response）。番号入力や音声で通話を振り分け、本人確認や手続きを自動化する。"
    posture: [log, patch]

  - id: HUMAN_OPERATOR
    label: "有人オペレーター"
    category: CONTACT_CENTER
    icon: { kind: builtin, name: "headset" }
    shape: rounded
    color: "bg-transparent"
    description: "コンタクトセンターの有人の応対者（オペレーター・スーパーバイザー）。顧客の個人情報や通話内容に触れる。"

  - id: PHONE
    label: "電話"
    category: CONTACT_CENTER
    icon: { kind: builtin, name: "phone-call" }
    shape: rounded
    color: "bg-transparent"
    description: "固定電話・携帯電話による通話。発信者番号は偽装でき、通話相手の本人性は保証されない。"

  - id: VOICEPRINT_AUTH
    label: "声紋認証"
    category: IDENTITY
    icon: { kind: builtin, name: "audio-waveform" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "声の特徴で本人確認を行う生体認証。声紋テンプレートを保持し、なりすまし（録音再生・音声合成）が主な脅威。"
    canContain: [PERSONAL_INFO, CREDENTIAL]

  # ── Contact Center（音声 AI）────────────────────────────────
  - id: STT
    label: "STT（音声認識）"
    category: AI
    icon: { kind: builtin, name: "mic" }
    shape: rounded
    color: "bg-violet-600"
    description: "Speech-to-Text。音声をテキストに書き起こす。認識結果は後段の LLM・エージェントへの入力になる。"

  - id: TTS
    label: "TTS（音声合成）"
    category: AI
    icon: { kind: builtin, name: "volume-2" }
    shape: rounded
    color: "bg-violet-600"
    description: "Text-to-Speech。テキストを音声に変換して応答する。合成音声のなりすましへの悪用にも注意。"

  - id: STS
    label: "STS（音声対音声モデル）"
    category: AI
    icon: { kind: builtin, name: "audio-lines" }
    shape: rounded
    color: "bg-violet-600"
    description: "Speech-to-Speech。音声を直接入出力するリアルタイム音声モデル。テキストを介さないため、音声経由の指示注入の検査が難しい。"

  - id: AVATAR
    label: "アバター"
    category: AI
    icon: { kind: builtin, name: "smile" }
    shape: rounded
    color: "bg-violet-600"
    description: "アバター・デジタルヒューマン。映像と音声で利用者に応対する。顔・声の取り扱いとなりすましに注意。"
