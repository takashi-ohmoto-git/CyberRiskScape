# 非人間アイデンティティ（NHI）と ID ガバナンスのコンポーネントライブラリ。
#
# 人に紐づかない ID（NHI）を、攻撃の主体・権限の持ち主として図に描くための 6 型：
#   - SERVICE_ACCOUNT: サービスアカウント（ディレクトリやクラウドの技術アカウント・共有アカウント）
#   - WORKLOAD_IDENTITY: ワークロードID（IAM ロール・マネージド ID 等、実行基盤から短命の資格情報を受け取る ID）
#   - OAUTH_CLIENT: OAuthクライアント（client credentials で API にアクセスするサービスアプリ・M2M クライアント）
#   - RPA_BOT: RPAボット（画面操作や業務手順を自動実行するボット）
#   - PAM: 特権アクセス管理（特権資格情報の保管・払い出しと特権セッションの仲介）
#   - IGA: IDガバナンス（各システムへのアカウント配布と棚卸し）
#
# NHI は種類ごとに型を分ける（脅威の当たり方が違うため）。AI エージェントは既存の AGENT / SUB_AGENT を使う。
# NHI が持つ資格情報（API キー・クライアントシークレット等）は builtin の CREDENTIAL を内包して表す。
# 型名・説明は特定製品に寄せない汎用名とする（製品名はノードのラベルで付ける）。
#
# 出典（型の切り分けの観点）:
#   - OWASP Non-Human Identities Top 10（2025）
#     https://owasp.org/www-project-non-human-identities-top-10/
#
# 別ライブラリ（builtin.yaml と分離）にし、library メタに `builtin: true` を付けないことで、
# LeftSidebar のライブラリトグルで無効化できる（voice.yaml と同じ方針）。
#
# ライセンス: Apache-2.0（同梱）
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

library:
  id: nhi
  title: "Non-Human Identity & Identity Governance Components"
  version: "1.0"
  license: "Apache-2.0"
  description: "非人間アイデンティティ（サービスアカウント / ワークロードID / OAuthクライアント / RPAボット）と、特権アクセス管理・IDガバナンスの型。"

categories:
  - id: IDENTITY
    label: "Identity & Secrets"
    order: 32

components:
  # ── 非人間アイデンティティ（NHI）─────────────────────────────
  - id: SERVICE_ACCOUNT
    label: "サービスアカウント"
    category: IDENTITY
    icon: { kind: builtin, name: "user-cog" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "人に紐づかない技術アカウント（ディレクトリやクラウドのサービスアカウント、共有アカウント）。長期のパスワードや鍵で動くことが多い。"
    canContain: [CREDENTIAL]

  - id: WORKLOAD_IDENTITY
    label: "ワークロードID"
    category: IDENTITY
    icon: { kind: builtin, name: "container" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "IAM ロール・マネージド ID・ワークロード ID 連携など、実行基盤の証明をもとに短命の資格情報を受け取るワークロードの ID。"
    canContain: [CREDENTIAL]

  - id: OAUTH_CLIENT
    label: "OAuthクライアント"
    category: IDENTITY
    icon: { kind: builtin, name: "key-square" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "client credentials などで API にアクセスするサービスアプリ・M2M クライアント。クライアントシークレットまたは秘密鍵と、許可されたスコープを持つ。"
    canContain: [CREDENTIAL]

  - id: RPA_BOT
    label: "RPAボット"
    category: IDENTITY
    icon: { kind: builtin, name: "mouse-pointer-click" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "画面操作や業務手順を自動実行するボット。人のアカウントや共有アカウントの資格情報で動くことが多い。"
    canContain: [CREDENTIAL]

  # ── 特権アクセス管理・ID ガバナンス ─────────────────────────────
  - id: PAM
    label: "特権アクセス管理（PAM）"
    category: IDENTITY
    icon: { kind: builtin, name: "lock-keyhole" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "特権アカウントの資格情報を保管・払い出しし、特権セッションを仲介・記録する基盤。"
    canContain: [CREDENTIAL, LOG]

  - id: IGA
    label: "IDガバナンス（IGA）"
    category: IDENTITY
    icon: { kind: builtin, name: "clipboard-check" }
    shape: rounded
    color: "bg-fuchsia-600"
    description: "人と NHI のアカウントを各システムへ配布・変更・削除し、権限を棚卸しする基盤。各システムへ接続するための特権資格情報を持つ。"
    canContain: [CREDENTIAL, LOG]
