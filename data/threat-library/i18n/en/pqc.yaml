# English overlay for `data/threat-library/pqc.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. Keep a genuinely Japanese document title as
#     its original title and add an English gloss; `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  pqc-harvest-now-decrypt-later-001:
    category: "Information Disclosure"
    name: "Harvest Now, Decrypt Later"
    description: "When data requiring long-term confidentiality (sensitive information, personal data, or a path to/from a store that may hold credentials) flows from {{sourceName}} to {{targetName}} in plaintext or over TLS using classical key exchange (ECDHE/RSA, etc.), an attacker can collect and store the ciphertext now and decrypt it retroactively once a cryptographically relevant quantum computer (CRQC) becomes available. If the required confidentiality window for that long-lived data spans the arrival of a CRQC, being encrypted today does not guarantee future confidentiality. On the other hand, this path concerns future decryption and does not by itself enable real-time eavesdropping or tampering with the current session (that immediate risk is covered separately by the plaintext-path rule)."
    mitigation: "[Foundation] Encrypt paths carrying long-term-sensitive data with TLS, eliminating plaintext paths (a prerequisite). Inventory data flows with long confidentiality requirements and identify them as harvest now decrypt later (HNDL) targets. [Enterprise] Migrate TLS key exchange to a PQC hybrid (ML-KEM combined with classical ECDHE, e.g. X25519MLKEM768), making already-collected ciphertext undecryptable in the future. [Advanced] Seal long-term-sensitive data at the application layer too with PQC/hybrid KEM, and keep key management crypto-agile so re-encryption is possible when an algorithm is compromised."

  pqc-crypto-inventory-cbom-gap-001:
    category: "Cryptographic Governance"
    name: "Absence of a cryptographic inventory (CBOM)"
    description: "When an asset holding or brokering sensitive data, such as {{nodeName}}, has no systematic inventory of the cryptographic algorithms, key lengths, certificates, and libraries in use, a cryptographic bill of materials (CBOM), the organization cannot know where quantum-vulnerable classical cryptography (RSA/ECDSA/ECDH) still remains, and so cannot plan a post-quantum migration. This is not a direct attack vector by itself, but the migration gaps it leaves let compromised algorithms sit unaddressed for long periods, widening the risk surface for harvest now decrypt later (HNDL) and signature forgery (the blast radius is all sensitive data handled by that asset). On the other hand, the absence of a CBOM is not by itself a confidentiality-breaking vulnerability, it only becomes real harm in combination with the emergence of the quantum threat or another cryptographic weakness."
    mitigation: "[Foundation] Inventory the cryptographic algorithms, key lengths, certificates, and libraries used by the asset, and explicitly identify where quantum-vulnerable classical cryptography (RSA/ECDSA/ECDH) resides. [Enterprise] Auto-generate and continuously update the CBOM (integrated with dependency and TLS scanning), and detect and block new introductions of quantum-vulnerable algorithms in CI/CD. [Advanced] Integrate the CBOM with the asset inventory and post-quantum migration roadmap, so that when compromise occurs, affected assets can be identified immediately and prioritized re-encryption triggered."
    references:
      "0":
        title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards (the need for a cryptographic inventory)"
      "1":
        title: "CRYPTREC - 耐量子計算機暗号の研究動向調査報告書 (Survey Report on Research Trends in Post-Quantum Cryptography, in Japanese)"

  pqc-long-lived-device-signature-001:
    category: "Tampering"
    name: "Non-PQC signature verification on long-lived devices"
    description: "When an IOT device such as {{nodeName}} that will remain deployed in the field for a long period verifies its firmware signatures or device certificates using only classical signature algorithms (RSA/ECDSA), and the validity period of that key or certificate spans the post-quantum migration deadline, an attacker will be able to derive the signing key once a future CRQC arrives, sign counterfeit firmware with a valid-looking signature, get it past verification, and take over the device. For long-lived devices that are hard to physically recover and reprovision, updates cannot keep pace, and the compromise stays fixed for the remainder of the device's deployed life. On the other hand, this is forgery at a future point in time, and a crypto-agile boot chain able to verify post-quantum signatures (ML-DSA/SLH-DSA) can switch signature schemes before the current key is compromised, preventing the forgery."
    mitigation: "[Foundation] Inventory the signature algorithm and validity period used for each device's firmware signature and certificates, and identify devices whose deployed life spans the post-quantum migration deadline. [Enterprise] Design secure boot / firmware-update verification to be crypto-agile, able to verify post-quantum signatures (ML-DSA / SLH-DSA) or hybrid signatures. [Advanced] Anchor post-quantum signature verification to a hardware root of trust (TPM / secure element), and enforce signature-algorithm migration and rollback prevention in the field through attestation."
    references:
      "0":
        title: "NSA CNSA 2.0 - Commercial National Security Algorithm Suite 2.0 (PQC migration deadlines for long-lived systems)"

  pqc-crypto-agility-gap-001:
    category: "Cryptographic Governance"
    name: "Lack of crypto-agility"
    description: "When the cryptographic processing in {{nodeName}} is hardcoded to a specific algorithm, key length, and protocol version, with no way to swap the cryptographic scheme through configuration or key management, migrating to post-quantum standards (ML-KEM/ML-DSA) or making an emergency switch when a classical algorithm is compromised requires code changes, redeployment, and in some cases re-encrypting all data. This is not a direct attack vector by itself, but it substantially lengthens recovery time after a compromise and widens the exposure window for harvest now decrypt later (HNDL) and signature forgery (the blast radius is all data and sessions that asset protects). On the other hand, if the cryptographic scheme is abstracted and switchable through configuration, migration to post-quantum / hybrid can happen quickly after a compromise is detected, limiting the exposure window."
    mitigation: "[Foundation] Move the cryptographic algorithm, key length, and protocol version out of the code and make them switchable at the configuration/key-management layer (eliminate hardcoding). [Enterprise] Call cryptographic processing through an abstraction layer (a crypto provider) so multiple schemes, including post-quantum hybrids, can be negotiated or fallen back to, and verify switching in CI. [Advanced] Maintain a crypto-agile foundation where a configuration change alone can migrate every path to post-quantum cryptography on a compromise trigger, with re-encryption and key rotation orchestrated automatically."
    references:
      "0":
        title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards (the call for crypto-agility)"
      "1":
        title: "CRYPTREC - 電子政府推奨暗号リスト / 耐量子計算機暗号の移行に関する報告 (e-Government Recommended Ciphers List / report on migration to post-quantum cryptography, in Japanese)"

  pqc-vpn-tunnel-hndl-001:
    category: "Information Disclosure"
    name: "Harvest Now, Decrypt Later through classical key exchange in VPN tunnels"
    description: "The VPN tunnel between {{sourceName}} and {{targetName}} runs over the internet. If the tunnel's key exchange (IKEv2 Diffie-Hellman / ECDH, ECDHE in SSL-VPN TLS, etc.) uses only classical cryptography, an attacker can collect and store the tunnel's ciphertext on the internet now, break the key exchange with a future cryptographically relevant quantum computer (CRQC), and retroactively decrypt all traffic inside the tunnel (Can). VPN tunnels carry site-to-site and remote-access business traffic in bulk, so a single collection yields a lot of information. On the other hand, this is decryption at a future point in time and does not enable real-time eavesdropping or tampering with the current tunnel. If a hybrid scheme combining an additional key exchange such as ML-KEM with IKEv2 (the RFC 9370 framework) or a pre-shared post-quantum key (PPK) is used, the collected ciphertext cannot be decrypted in the future (Cannot). The blast radius is the traffic inside tunnels through {{targetName}} whose required confidentiality period extends beyond the arrival of a CRQC."
    mitigation: "[Foundation] Inventory the VPN key exchange methods (DH groups, cipher suites) and the confidentiality period of the traffic through each tunnel, and identify tunnels carrying traffic that requires long-term confidentiality. Disable old DH groups and IKEv1. [Enterprise] Update VPN gateways to versions supporting post-quantum hybrid key exchange (ML-KEM combined through IKEv2 additional key exchanges; X25519MLKEM768 or similar for SSL-VPN), and use a post-quantum pre-shared key (PPK) in addition until then. [Advanced] Encrypt data requiring long-term confidentiality at the application layer with post-quantum / hybrid cryptography instead of relying on the tunnel, and progressively replace VPN itself with per-application access such as ZTNA."

  pqc-passive-decryption-static-rsa-001:
    category: "Cryptographic Governance"
    name: "Passive decryption's dependence on static RSA blocking post-quantum migration"
    description: "If {{nodeName}} is deployed so that it imports the server's private key and passively decrypts copied traffic (out-of-band deployment), this mechanism depends on static RSA key exchange (key exchange without forward secrecy). TLS 1.3 mandates ECDHE, and post-quantum key exchange including ML-KEM also uses ephemeral keys, so after migration {{nodeName}} can no longer decrypt. Organizations that want to keep inspecting therefore tend to keep old TLS and static RSA, and migration stalls (Can). Keeping static RSA means that leaking a single server private key decrypts all recorded traffic, and a future quantum computer can do the same. Because the private key is also copied to the inspection device, there are more paths for the key to leak. On the other hand, if inspection is switched to a reverse-proxy model (inspecting after terminating TLS) or to server-side logs / agents, migration to TLS 1.3 and post-quantum key exchange can proceed without stopping inspection, and there is no need to distribute private keys to inspection devices (Cannot). The blast radius is all traffic of the servers {{nodeName}} inspects and those servers' private keys."
    mitigation: "[Foundation] Inventory devices that import private keys for passive decryption, and identify servers that keep static RSA or old TLS for the sake of inspection. [Enterprise] Switch the inspection method to a reverse-proxy model (a WAF that terminates TLS before inspecting, etc.) or to server-side inspection (application logs / agents), and migrate the servers' TLS to 1.3 and post-quantum hybrid key exchange. Recover the private keys copied to inspection devices and reissue the certificates. [Advanced] Build the inspection method into the post-quantum migration plan and standardize on a configuration where inspection continues regardless of the key exchange method (inspection at the termination point)."
    references:
      "0":
        title: "IETF RFC 8446 - The Transport Layer Security (TLS) Protocol Version 1.3 (removal of static RSA key exchange)"
      "1":
        title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations (key exchange with forward secrecy)"

  pqc-hsm-pqc-key-support-gap-001:
    category: "Cryptographic Governance"
    name: "HSM without post-quantum key support and quantum-vulnerable key wrapping"
    description: "{{nodeName}} stores the private keys of TLS-terminating devices and the keys that wrap data encryption keys (key-wrapping keys). If the firmware of {{nodeName}} does not support ML-KEM / ML-DSA, or cannot handle the large keys and signatures of post-quantum cryptography, the TLS-terminating devices, CAs, and signing infrastructure that depend on it cannot migrate to post-quantum cryptography, and the HSM replacement cycle (measured in years) ends up dictating the whole organization's migration deadline (Can). In addition, if keys are wrapped with classical public-key cryptography such as RSA-OAEP when they are backed up, replicated, or exchanged with the cloud (BYOK), an attacker can collect the wrapped keys now, open them with a future quantum computer, and decrypt all the data those keys protect (harvest now decrypt later). On the other hand, if an HSM is chosen with post-quantum firmware and a FIPS 140-3 validation roadmap, and keys are exchanged using AES-256 key wrapping (SP 800-38F) or post-quantum / hybrid key encapsulation, migration does not stall at the HSM and collected keys cannot be opened in the future (Cannot). The blast radius is all data, sessions, and signatures protected by the keys in {{nodeName}}."
    mitigation: "[Foundation] Record the HSM model, firmware version, supported algorithms, and FIPS 140-3 validation status, and confirm the manufacturer's plans for post-quantum support (ML-KEM / ML-DSA / SLH-DSA). Inventory the wrapping methods used for key exchange and backup. [Enterprise] Switch key exchange to AES-256 key wrapping or post-quantum / hybrid key encapsulation. Build HSM upgrades into the post-quantum migration plan, and verify the update to post-quantum firmware and performance with large keys and signatures. [Advanced] Treat keys that were exchanged wrapped with classical cryptography as already collected, and regenerate them and re-encrypt after post-quantum support is in place. Standardize on key management whose cryptographic schemes can be swapped (crypto-agile key management)."

  pqc-dedicated-line-hndl-001:
    category: "Information Disclosure"
    name: "Harvest Now, Decrypt Later through classical key exchange on a dedicated line / private connection"
    description: "Traffic between {{sourceName}} and {{targetName}} goes through a dedicated line / private connection and is encrypted with TLS. A private connection passes through the carrier's transmission equipment and colocation facilities, so anyone with access to that segment can collect and store the ciphertext now. If the TLS key exchange uses only classical cryptography (ECDHE, etc.), a future cryptographically relevant quantum computer (CRQC) can break the key exchange and retroactively decrypt the recorded traffic (Can). Private connections often carry large volumes of data that must stay confidential for a long time, such as database replication and backups, so the value of collecting it is high. On the other hand, this is decryption at a future point and does not enable real-time eavesdropping on or tampering with current traffic. If the TLS key exchange uses a post-quantum hybrid (X25519MLKEM768, etc.), or MACsec deriving keys from a symmetric pre-shared key or IPsec with a post-quantum pre-shared key (PPK) is layered on the circuit, collected ciphertext cannot be decrypted in the future (Cannot). The blast radius is the traffic between {{sourceName}} and {{targetName}} over the private connection whose required confidentiality period extends beyond the arrival of a CRQC."
    mitigation: "[Foundation] Inventory the encryption used for traffic over the private connection and the confidentiality period of the data it carries, and identify the segments that carry data requiring long-term confidentiality (replication, backups, etc.). [Enterprise] Update TLS on those segments to versions that support post-quantum hybrid key exchange. Layer MACsec (with a 256-bit pre-shared key) or IPsec with a post-quantum pre-shared key (PPK) on the circuit. [Advanced] Encrypt data requiring long-term confidentiality at the application layer with post-quantum / hybrid cryptography as well, so nothing depends solely on circuit or TLS encryption."
    references:
      "1":
        title: "IEEE 802.1AE - Media Access Control (MAC) Security (link encryption with MACsec)"
