# English overlay for `data/threat-library/owasp-llm-top10.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`
#     (docs/threat-schema.md §7.5).
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. Keep a genuinely Japanese document title as
#     its original title and add an English gloss; `url` is never translated.
#   - Source is the OWASP Top 10 for LLM Applications (2025); item names follow the
#     official OWASP wording.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  owasp-llm01-prompt-injection-001:
    category: "Prompt Injection"
    name: "Direct prompt injection"
    description: "An attacker embeds malicious instructions directly in user input, causing the system prompt or guardrails to be ignored and triggering information disclosure, unauthorized execution, or impersonation in the output. This risk is intrinsic to any LLM or agent that accepts a prompt and does not depend on whether an external connection exists."
    mitigation: "Structurally separate the system prompt from user input (role guarding). Detect and neutralize embedded instructions in input, guard output, and limit impact through human approval for sensitive operations and allow-listed tool calls."
    references:
      "1":
        title: "OWASP Top 10 for Agentic Applications 2026 - ASI01: Agent Goal Hijack (related mapping)"

  owasp-llm02-sensitive-info-disclosure-001:
    category: "Information Disclosure"
    name: "Sensitive information disclosure"
    description: "The LLM leaks sensitive information contained in the system prompt, training data, or another tenant's history — such as PII, credentials, or intellectual property — in its responses."
    mitigation: "Filter input and output (PII/secret detection), minimize and anonymize training data, isolate tenants, and audit responses containing sensitive information in real time."

  owasp-llm03-supply-chain-001:
    category: "Supply Chain"
    name: "Model and dependency supply chain"
    description: "Contamination or tampering in third-party models (weights, LoRA, base models), datasets, inference libraries, or plugins introduces an undetected backdoor or vulnerability."
    mitigation: "Manage SBOMs for models and datasets, verify hash signatures, restrict sourcing to a trusted registry, and build dependency scanning (CVE/model card checks) into CI."
    references:
      "1":
        title: "OWASP Top 10 for Agentic Applications 2026 - ASI04: Agentic Supply Chain Vulnerabilities (related mapping)"

  owasp-llm04-data-model-poisoning-001:
    category: "Tampering"
    name: "Training/RAG data poisoning"
    description: "Poison mixed into pre-training, fine-tuning, continual-learning, or RAG index data causes misclassification, backdoored responses, or amplified bias when a specific trigger fires."
    mitigation: "Record data source provenance, run differential inspection and outlier detection, periodically run poisoning tests, and require manual approval before retraining on data that crosses a trust boundary."

  owasp-llm05-improper-output-handling-001:
    category: "Tampering"
    name: "Improper output handling"
    description: "Passing LLM output unsanitized to a downstream system — SQL, a shell, HTML, code execution, or email sending — leads directly to SQLi, XSS, SSRF, or RCE."
    mitigation: "Always treat LLM output as untrusted, applying context-specific escaping, schema validation, and allow-list parsing. Run any generated code or commands only inside a sandbox."

  owasp-llm06-excessive-agency-001:
    category: "Agent"
    name: "Excessive agency"
    description: "The capabilities, permissions, or autonomy granted to an agent exceed what the task requires, causing large-scale side effects (fund transfers, data deletion, outbound communication) on misjudgment or when attacked."
    mitigation: "Apply least privilege to tools, require human-in-the-loop approval for actions with side effects, hard-cap rate limits and amount/count ceilings, and keep a dry-run mode always available."
    references:
      "1":
        title: "OWASP Top 10 for Agentic Applications 2026 - ASI02: Tool Misuse and Exploitation (related mapping)"

  owasp-llm07-system-prompt-leakage-001:
    category: "Information Disclosure"
    name: "System prompt leakage"
    description: "Business rules, API keys, internal identifiers, or guardrail conditions embedded in the system prompt leak through the response and give an attacker a foothold."
    mitigation: "Never place secrets in the system prompt (keep keys in an external KMS), detect system prompt recitation, and apply output filters to sensitive tokens."

  owasp-llm08-vector-embedding-weaknesses-001:
    category: "Information Disclosure"
    name: "Vector and embedding weaknesses"
    description: "Vector DB search results lack access control, letting documents from another tenant or privilege level mix into the RAG context, or the original text is reconstructed from embeddings (embedding inversion)."
    mitigation: "Apply row-level or attribute-based ACLs at the RAG retrieval stage, isolate indexes per tenant, anonymize embeddings, and audit search logs."

  owasp-llm09-misinformation-001:
    category: "Repudiation"
    name: "Misinformation and hallucination"
    description: "Using LLM hallucinations or outdated knowledge for business decisions or external communication invites legal liability, brand damage, or poor decision-making."
    mitigation: "Require fact-checking (RAG plus citations), surface a confidence score, gate with human review, show a user-facing disclaimer, and preserve response logs."

  owasp-llm10-unbounded-consumption-001:
    category: "Denial of Service"
    name: "Unbounded consumption"
    description: "A high volume of large, long, or recursive requests to the LLM exhausts inference cost, GPU time, and context budget, causing service outages or a cost blowup."
    mitigation: "Rate-limit token volume per user or key, cap maximum input length and maximum tool call count, alert on cost, and detect circular calls."
