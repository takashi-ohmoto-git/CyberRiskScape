# English overlay for `data/threat-library/dev-supply-chain.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` are translated here, keyed by rule id. Anything omitted falls back to the
# original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  dev-dependency-unlocked-001:
    category: "Supply Chain"
    name: "Dependency packages with unpinned versions (a malicious version is pulled in later)"
    description: "If {{nodeName}} is not pinned by a lockfile and is fetched with version ranges (^, ~, etc.) or a latest-version specifier, then even if the content reviewed at the time was legitimate, a malicious version published later through a takeover of the publisher's account, a transfer of the repository, or a compromise of a dependency is silently pulled in at the next install or build (Can). The pulled-in version goes straight into developer machines, CI, and production builds, and developers do not notice they are running something different from what they reviewed. On the other hand, if {{nodeName}} is pinned by a committed lockfile, installs require an exact match with the lockfile (such as npm ci), and updates follow a procedure in which the diff is reviewed first, an unreviewed version is not pulled in even if the publisher is compromised (Cannot). The blast radius is every developer machine, CI job, and build artifact that fetches {{nodeName}}, and the privileges and credentials they hold."
    mitigation: "[Foundation] Create a lockfile (package-lock.json, poetry.lock, etc.), commit it to the repository, and make installs match the lockfile exactly (npm ci, pip hash pinning, etc.). Do not fetch dependencies by version range directly. Review the diff before updating. [Enterprise] Make dependency updates dedicated pull requests and put the added or updated dependencies and their publication dates under review. Configure intake to wait a set period after a version is published. Fetch from an internal mirror and use only the versions placed in it. [Advanced] Verify the integrity hashes in the lockfile, and record and sign the build provenance. Do not let the build environment connect directly to the public registry, and place only reviewed versions in the mirror."

  dev-dependency-install-scripts-001:
    category: "Code Execution"
    name: "Dependency packages allowed to run install-time scripts (arbitrary code runs just by fetching)"
    description: "If install-time scripts (preinstall, postinstall, etc.) of the packages in {{nodeName}} are allowed without reviewing their content, a malicious or compromised package can run arbitrary code with the developer's privileges the moment it is fetched (Can). Installation happens before the app runs, so the code runs ahead of any code review or runtime defense, and it can read and send out credentials on developer machines and CI (tokens, SSH keys, cloud credentials, .env) and rewrite other files. When a coding agent adds a dependency and installs it, no person gets a chance to look at the content before it runs. On the other hand, if install-time scripts are disabled by default and only the packages that need them are allowed after their content is reviewed, merely fetching a package does not run arbitrary code (Cannot). Note that this does not stop code that runs when the app loads the package after installation, so combine it with version pinning and checking the source. The blast radius is the developer machines and CI that fetch {{nodeName}} and all the credentials placed there."
    mitigation: "[Foundation] Disable install-time scripts by default (npm ignore-scripts, etc.), and allow them individually only for packages that need them after a person reviews the content. Record the list of allowed packages in the repository. [Enterprise] Do not give the CI install step any credentials, and separate fetching from building. Put additions to the allowlist under review, and detect and notify when a package with scripts is added. [Advanced] Run the install step in a disposable isolated environment with limited writable locations and destinations, and record the commands run and the network traffic to detect unexpected behavior."

  dev-dependency-unvetted-001:
    category: "Supply Chain"
    name: "Dependencies added without checking (lookalike or pre-registered fake packages get installed)"
    description: "If no person checks the name, publisher, usage record, or content when a dependency is added to {{nodeName}}, a fake package with a spelling close to a popular package (typosquatting) can be installed by mistake (Can). Dependencies suggested by AI sometimes include names that do not exist, and in the technique where an attacker publishes such a name in advance and waits (slopsquatting), a malicious package gets in as soon as the suggestion is added as is. When a coding agent adds dependencies on its own and goes on to install them, no person sees the name, so the mix-up or the pre-registered package is taken in as it is. On the other hand, if adding a dependency follows a procedure in which a person checks it (spelling of the name, publisher, publication date, usage record, correspondence with the repository), additions by the agent also require approval, and dependencies are chosen from a list reviewed inside the organization, no path remains for a fake package to get in (Cannot). A check by automated scanning alone does not guarantee coverage of newly published malicious packages or of the content itself. The blast radius is the developer machines, CI, and build artifacts that fetch {{nodeName}}, and the privileges and credentials they hold."
    mitigation: "[Foundation] When adding a dependency, have a person check the spelling of the name, the publisher, the publication date, the usage record, and the correspondence with the repository. For a dependency suggested by AI, confirm that it exists and is the intended package before adding it. Require human approval for dependency additions and installs by a coding agent (do not put install commands in the allowlist). [Enterprise] Limit the dependencies that can be added to a reviewed list placed in an internal registry or mirror, so that names not on the list cannot be fetched. Put dependency additions under review, and detect and notify on new dependencies and recently published packages. Use scanning as an aid to human checks. [Advanced] Run the content of a dependency (scripts, network traffic, file operations) on a trial basis in an isolated environment to check it before allowing it. Do not allow packages that lack a publisher signature or provenance attestation."

  dev-registry-publisher-takeover-001:
    category: "Supply Chain"
    name: "Package registry takeover and same-name public packages (malicious version publication and dependency confusion)"
    description: "On a package registry like {{nodeName}} where anyone can publish, a person who has taken over a publisher's account or received a transferred repository can publish a malicious version as the new version of a legitimate package (Can). The consumer installs from the same name and the same distribution source, so it cannot be told apart from a legitimate update. Also, if a package with the same name as an internal package is registered on the public registry first, then in an environment where the source is specified ambiguously, the public version with a newer version number is taken in ahead of the internal one (dependency confusion). On the other hand, if the publisher accounts require multi-factor authentication, the names of internal packages are reserved on the public registry, and the source is fixed to the internal registry for each name scope, a same-name public package is not taken in (Cannot). However, when the source is compromised while still under the legitimate publisher, it can be stopped only by version pinning and review on the consumer side. The blast radius is every dependency package fetched from {{nodeName}}, and the developer machines, CI, and build artifacts that fetch them."
    mitigation: "[Foundation] Reserve the names of internal packages on the public registry as well, and fix the source to the internal registry for each name scope. Require multi-factor authentication on the publisher accounts of packages your organization publishes, and keep publishing tokens short-lived. On the consuming side, pin versions and review updates. [Enterprise] Do not let environments connect directly to the public registry; fetch through an internal mirror that holds only reviewed versions. Monitor and notify on changes of publisher or repository and on the appearance of public packages with the same name as internal packages. [Advanced] Verify provenance attestations for packages (signatures, build provenance) and do not take in versions without them. Publish only through a trusted publishing mechanism (publishing with short-lived credentials) and keep no long-lived tokens."

  dev-agent-command-allow-broad-001:
    category: "Privilege Compromise"
    name: "Command permissions that allow arbitrary code execution (npx *, Bash(*), running node/python are allowed)"
    description: "If {{nodeName}} holds permission to run commands that can execute arbitrary code without confirmation (npx *, Bash(*), running scripts with node or python, anything that starts a shell, etc.), it can run arbitrary operations without human approval (Can). An agent steered by instructions embedded in ingested text (files it reads, web pages, a dependency package's README) or by a malicious dependency package can, within the allowed scope, read and write files, communicate externally, and install more packages. Listing dangerous commands in a deny list does not help by itself, because they can be bypassed by differences in how a command is written (argument order, a different shell, a different interpreter, execution through a script file); a deny list alone is not a mitigation. On the other hand, if the permissions are limited to the individual commands and arguments the work needs (an allowlist) and commands that can run arbitrary code require human approval each time, a steered agent cannot perform operations outside the permissions (Cannot). The blast radius is every operation that can be run on the machine where {{nodeName}} runs, and the credentials placed on that machine and in the working folder."
    mitigation: "[Foundation] Make permissions an allowlist that enumerates only the individual commands and arguments the work needs, and do not broadly allow npx *, Bash(*), running node/python, or starting a shell. Require human approval each time for commands that can run arbitrary code. Keep deny lists as a supplement, and do not design protection that relies on denial alone. [Enterprise] Manage the permission settings file in the repository with review, and detect and notify when permissions are added. Also enforce the permitted scope on the execution environment side (sandbox, limits on writable locations and destinations) instead of relying on what the settings say. Record the commands that were run. [Advanced] Use an isolated execution environment per task and least-privilege credentials issued per task and revoked when it ends. Require human approval for any change that widens the permissions."

  dev-agent-workspace-secret-exfiltration-001:
    category: "Information Disclosure"
    name: "Exfiltration of secrets in the working folder (an execution environment with neither isolation nor destination limits)"
    description: "If {{nodeName}} runs without a sandbox and does not restrict its outbound destinations, secrets in the working folder (.env, credential files, SSH keys, cloud credentials) can be read by an agent steered by prompt injection or a malicious dependency package and sent to any destination (Can). Both reading the files and sending data out are the same operations as ordinary development work (reading files, fetching packages, calling APIs), so they are hard to tell apart from legitimate work. On the other hand, if either the readable locations are limited to what the work needs by a sandbox, or the destinations are limited to an allowlist, and that is enforced, either the route to read the secrets or the route to send them out is closed (Cannot). With both in place, nothing leaks even if one of them is broken. The blast radius is the machine where {{nodeName}} runs, every secret placed in the working folder, and the external services those secrets can reach."
    mitigation: "[Foundation] Run the agent inside a sandbox (reading and writing limited to the working folder) and limit destinations to an allowlist. Do not keep secrets such as .env in the working folder, and pass short-lived credentials per task as needed. [Enterprise] Enforce the destination limits on the machine or network side (proxy, firewall) instead of relying on the agent's settings alone. Record secret reads and outbound transmissions, and detect and block traffic that contains secrets. Periodically scan for secrets left in working folders. [Advanced] Use a disposable isolated environment and least-privilege credentials per task, keeping credentials outside the environment and attaching them by proxy. Detect communication to unexpected destinations and reads of secrets as anomalies, and block them automatically."

  dev-agent-action-budget-001:
    category: "Privilege Compromise"
    name: "Agent without an action budget (no limit on executions, outbound sends, spend, or recursion depth)"
    description: "If there is no limit enforced on the execution side for the number of runs, the number of outbound sends, the total spend on billed calls, or the depth of recursion and delegation of {{nodeName}}, an agent set in motion by a wrong judgment or by instructions embedded in ingested text can keep repeating within the operations it is allowed to perform (Can). An endless loop of the same step, bulk sending of emails and messages, unbounded calls to billed APIs, and chains of delegation that call other agents are each made of legitimate operations within its permissions, so permission limits and approval gates do not stop them. On the other hand, if limits on the number of runs, outbound sends, spend, and recursion depth per task are set and enforced so that the execution side stops and notifies a person when a limit is exceeded, a runaway agent causes damage only up to the limit (Cannot). An instruction in the prompt such as \"do not overdo it\" is not an enforced limit. The blast radius is every operation that can be performed before the limit is reached (destinations reached, the amount billed, the load on downstream systems)."
    mitigation: "[Foundation] Set limits on the number of runs, outbound sends, spend, and recursion or delegation depth per task on the agent's execution side (the platform's configuration, not an instruction to the model), and stop when one is exceeded. Notify a person when a limit is reached. [Enterprise] Split the limits per tool and destination, and manage budgets per user and per task separately. For billed APIs, also set quotas and usage caps on the external service side instead of relying on the agent's settings alone. Put changes to the limits under approval, and monitor the number of runs and sends. [Advanced] Detect abnormal speed or increases in counts and stop automatically, and do not resume without human approval. Issue a budget per task and revoke it when the task ends."

  dev-update-signature-unverified-001:
    category: "Tampering"
    name: "Recipients do not verify the signature of distributed updates (an attacker on the update path can distribute arbitrary code)"
    description: "If the client that receives the updates (packages and metadata) distributed by {{nodeName}} does not verify their signatures (or also accepts unsigned updates), an attacker who takes control of the distribution server, a mirror, a CDN, or the communication path can swap the update and run arbitrary code on every device that receives updates (Can). Because the update mechanism runs with high authority on the device, one swap can take control over a wide range. If the client verifies a signature tied to a root of trust and does not apply an update that fails verification, a compromised path or distribution infrastructure cannot get a malicious update accepted (Cannot). Merely calling a signature API is not enough without binding to the target product, version, and channel. The blast radius is every device that receives updates from {{nodeName}}."
    mitigation: "[Foundation] Have the client verify the signatures of updates and metadata with a root of trust (public key) stored separately from the distribution source, and not apply updates that fail verification. Disable settings that accept unsigned updates. [Enterprise] Manage the signing key in a protected place separate from the distribution server (an HSM) and record signing operations. Collect and monitor verification failures. [Advanced] Sign with separate keys per role (root, targets, timestamp, and so on) and rehearse key replacement on the assumption that a key leaks. Make the build provenance of updates verifiable."

  dev-update-rollback-binding-001:
    category: "Tampering"
    name: "No binding of version, target, channel, and expiry and no rollback protection, so old legitimate updates and mismatched metadata are accepted"
    description: "If the client that receives updates distributed by {{nodeName}} checks only the signature over the update bytes and does not check the version, product, platform, channel, target path, expiry, or rollback state, an attacker can redistribute an old legitimately signed version (containing known vulnerabilities) to have it applied, keep showing expired metadata to hide new updates, or have legitimate metadata and a payload from different transactions accepted together (Can). Because the signature is valid it passes verification, and fixed vulnerabilities become exploitable again. If the client verifies monotonically increasing versions, binding to product and channel, expiry, and the match between metadata and payload, and can return to a consistent state when an installation fails midway, even an old update with a legitimate signature is not accepted (Cannot). The blast radius is every device that receives updates from {{nodeName}}, with all the vulnerabilities contained in past versions."
    mitigation: "[Foundation] Have the client check that update versions only increase (reject versions older than the current one), that product, platform, and channel match, and the expiry of the metadata. [Enterprise] Confirm that metadata and payload belong to the same transaction (by hash binding), install atomically, and return to a consistent state on failure. Keep the minimum version in a place that cannot be tampered with. [Advanced] Raise the minimum version when a version containing a vulnerability fix is released, and monitor to detect devices running old versions. Rehearse behavior on signature revocation and partial release failure (fail closed)."
