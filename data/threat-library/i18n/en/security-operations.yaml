# English overlay for `data/threat-library/security-operations.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  secops-soar-authority-concentration-001:
    category: "Elevation of Privilege"
    name: "Concentration of integration credentials and response authority (isolate, block, suspend accounts) in the SOAR"
    description: "{{nodeName}} stores the API keys and credentials of many products (EDR, firewalls, IdP, directory, email, ticketing and so on) and uses them to automatically isolate endpoints, block traffic, and suspend accounts or reset passwords. When it serves several customer environments, as an MSSP or MDR does, each customer's credentials and authority sit together in one place. An attacker who takes hold of {{nodeName}} through a vulnerability, a stolen administrator account, theft of the integration credentials, or an over-privileged integration account can use the stored credentials to enter the connected products directly, and can also block or suspend many systems and customer environments at once as a legitimate automated response (Can). From the connected products' side, operations from {{nodeName}} look like a legitimate response, so they are hard to stop. On the other hand, if integration credentials are split by purpose with least privilege, the range each type of response can reach is narrowed, destructive responses require approval, and the management plane of {{nodeName}} is restricted, a single weakness does not lead to wide-scale blocking or entry into the connected products (Cannot). The blast radius is every connected product and customer environment, and the response operations that can be run there."
    mitigation: "[Foundation] Keep integration API keys and credentials in a dedicated secret store, and do not leave them in plaintext in the configuration of {{nodeName}} or in case records. Create a dedicated account per connected product and give it only the least privilege needed for the responses it runs (investigation only, isolation, blocking, account suspension). Limit the management console and API to a management network and require phishing-resistant MFA for administrators. [Enterprise] Separate integration credentials and execution environments per customer (tenant) so that one customer's credentials cannot read another's. Require approval from another person and set limits (count, scope) for destructive responses (account suspension, wide blocking, mass isolation of endpoints), and send the execution records to a log platform outside {{nodeName}} for monitoring. Issue credentials with short lifetimes and rotate them regularly. [Advanced] Assume {{nodeName}} is compromised and rehearse the procedure for revoking and reissuing all integration credentials at once. Detect, on the connected products' side, the source, type and volume of operations coming from {{nodeName}}. Move to a method that does not store credentials and instead issues short-lived tokens at execution time (workload identity)."
    references:
      "0":
        title: "MITRE ATT&CK T1552 - Unsecured Credentials (theft of stored integration credentials)"
      "1":
        title: "MITRE ATT&CK T1078 - Valid Accounts (abuse of stolen integration accounts)"

  secops-soar-playbook-tampering-001:
    category: "Tampering"
    name: "Tampering with playbooks and automation rules to disable responses, bury cases, or run malicious actions automatically"
    description: "{{nodeName}} holds, as playbooks (defined procedures) and automation rules, what to investigate, whom to notify, and what to block for each alert, and runs them automatically every time an alert arrives. An attacker (or an insider administrator) who gains edit rights on {{nodeName}} can stop the response to their own activity, for example by adding a condition that automatically closes alerts from a specific source or host, removing notification recipients, or disabling the containment steps. Because playbooks can contain external commands, scripts and API calls to connected products, the attacker can also make it run malicious actions on every alert as a legitimate automated response (Can). The change is made as an ordinary configuration operation, and unless someone is watching for changes to the definitions, the response stopping is only noticed after the attack has progressed. On the other hand, if playbook edits require approval and version control, change records are monitored on a log platform outside {{nodeName}}, and sudden shifts in the number of automatically closed alerts are detected, the change is found at the time it is made or as an anomaly in the response (Cannot). The blast radius is the response to every alert handled by {{nodeName}} and the operations on connected products that playbooks can run."
    mitigation: "[Foundation] Limit edit rights on playbooks and automation rules to a few people and separate view, run and edit permissions. Require phishing-resistant MFA for edits. List the conditions that automatically close alerts or exclude notifications, and review them regularly. [Enterprise] Put playbooks under version control and let only changes that passed review and approval reach production (manage them as code and prohibit direct editing in the console). Send change records to a log platform outside {{nodeName}}, such as a SIEM, and add detections for new auto-close conditions, removed notification recipients, and added steps that run external commands. Restrict by permission the operations on connected products that a playbook can run. [Advanced] Sign important playbooks and verify the signature and the approved version at run time. Have people regularly sample automatically closed alerts to find buried cases. Confirm through a separate path (a different detection product) that a response ran for the same attack."
    references:
      "0":
        title: "MITRE ATT&CK T1685 - Disable or Modify Tools (disabling or modifying response and detection mechanisms)"
      "1":
        title: "NIST SP 800-61 Rev. 3 - Incident Response Recommendations and Considerations for Cybersecurity Risk Management (preparing response procedures and change control)"

  secops-induced-automated-response-abuse-001:
    category: "Tool Misuse"
    name: "Abuse of automated response (business outage from containment induced by fake alerts or logs)"
    description: "When {{nodeName}} sends operations to a response target that can isolate endpoints, block traffic, or suspend accounts (EDR, firewalls, web gateways, IdP, directory, including cases where the tool reaches it through an AI gateway), an attacker can turn the containment mechanism itself into a weapon. The attacker creates fake alerts that invite a legitimate defensive operation, or plants strings in logs (including instructions embedded in log lines, mail subjects, file names and host names), and gets {{nodeName}} to isolate a critical server, block traffic to partners or sites, or suspend administrator or business accounts. In a configuration where an AI agent investigates and decides, instructions inside the ingested logs can steer the decision (Can). Because what runs is a legitimate response, the attacker can stop the business without breaking in, and the induced response can also serve as a diversion from the real attack. On the other hand, if critical assets and accounts are excluded from automated response or require human approval, limits are placed on the count and scope of what can run at once, and there is a procedure to reverse a wrong containment quickly, an induced response causes only limited outage (Cannot). The blast radius is every endpoint, communication path and account the response target can isolate, block or suspend, and the business that depends on them."
    mitigation: "[Foundation] Limit automatically executed responses to low-impact ones (notification, investigation, isolating a single endpoint), exclude critical servers, partner connections, and administrator or core business accounts from automated response, and require human approval before they run. Treat strings in logs and alerts as data, not instructions (distinguish them clearly in the AI agent's input). [Enterprise] Place limits on the count and scope of what can run at once and on the number of runs per period, and when a limit is reached stop and hand over to a person. Hold automated response when alerts from the same origin concentrate in a short time. Prepare and rehearse procedures to reverse containment (release isolation, remove blocks, re-enable accounts). Record who (which agent or playbook) ran each response based on which alert, and monitor it. [Advanced] Before containing, confirm the basis of the alert with an independent source (a different detection product, asset criticality, change history). Run exercises (red team) that assume induced responses through fake alerts, and have a procedure for responding to diversions."
    references:
      "2":
        title: "MITRE ATLAS AML.T0053 AI Agent Tool Invocation (invoking the response target's tools)"
      "3":
        title: "NIST SP 800-61 Rev. 3 - Incident Response Recommendations and Considerations for Cybersecurity Risk Management (preparing containment procedures and roles)"
      "1":
        title: "OWASP Top 10 for Agentic Applications 2026 - ASI01: Agent Goal Hijack (decisions steered by instructions in ingested data)"

  secops-agent-approval-ineffective-001:
    category: "Human-Agent Trust"
    name: "Human approval of high-risk operations is not effective (absent, or reduced to a formality by a flood of requests)"
    description: "In a configuration where {{nodeName}} can run high-impact operations such as isolation, blocking, deletion, payment or external sending without human approval, or with approval that is only a formality, nobody can stop a wrong operation caused by prompt injection or a misjudgment. Even when approval is in place, if requests arrive in such volume that reviewers pass them without checking (approval fatigue), the approval screen does not show the target and impact of the operation so it cannot be judged, there are exception paths that run without approval, or the approver simply trusts the agent's recommendation, approval does not work as a defense against errors (Can). The existence of approval itself becomes the reason for feeling safe, so it is rarely revisited. On the other hand, if the kinds of high-impact operations are defined and approval is required, approval requests are narrowed by count and importance, the approval screen shows the target, basis and scope of impact, and it is verified that no path runs without approval, wrong operations are stopped before they run (Cannot). The blast radius is the impact of the operations {{nodeName}} can run without approval."
    mitigation: "[Foundation] List the high-impact operations (isolation, blocking, account suspension, deletion, payment, external sending) and require approval for them. Confirm there is no exception path (another tool, API or automation) that runs them without approval. Show the target, the data that was the basis, and the scope of impact on the approval screen. [Enterprise] Handle low-risk requests automatically (with after-the-fact review) and send only high-risk ones to people, to narrow the volume. Monitor the number of approvals, the time taken, and the share of approve-all outcomes, and detect signs that content is not being read (a run of approvals within seconds). Require two-person approval for irreversible or wide-scope operations. [Advanced] Sample approval decisions afterwards to measure the wrong-approval rate. Show on the approval screen independent information that lets the approver judge without relying on the agent's recommendation (a different detection product, asset criticality, change history). Use rotation and breaks for approvers to prevent approval fatigue."
    references:
      "0":
        title: "OWASP Top 10 for Agentic Applications 2026 - ASI09: Human-Agent Trust Exploitation (approver overtrust and automation bias)"

  secops-agent-cross-tenant-operation-001:
    category: "Elevation of Privilege"
    name: "Cross-tenant investigation and response (instructions planted in one tenant's data used to investigate or contain another tenant's environment)"
    description: "In a configuration where {{nodeName}} handles the environments of several tenants (customers, organizations) with one set of privileges and one execution environment (MDR, MSSP and similar), instructions that an attacker planted in one tenant's logs, alerts, tickets or files can mix into the decisions of {{nodeName}}. Because the privileges of {{nodeName}} are not limited to a single tenant, those instructions can be carried out against another tenant's environment, as investigation (reading and taking out logs, assets and user information) or as containment (isolating endpoints, blocking traffic, suspending accounts) (Can). By placing a string in one customer's logs, an attacker can harm another customer who has no direct relation, and the harmed side has trouble noticing that the cause lies with a different customer. On the other hand, if the agent's execution environment, credentials, and tool destinations are separated per tenant, its privileges cannot operate outside the tenant being processed, and one tenant's data is not brought into another tenant's processing, planted instructions stay inside their own tenant (Cannot). The blast radius is the environments and data of every tenant that the privileges of {{nodeName}} reach."
    mitigation: "[Foundation] Limit the agent's privileges and credentials to the one tenant being processed. Always attach a tenant identifier to tool calls, and have the called side reject operations on tenants the caller has no privilege for. Treat the contents of logs, alerts and tickets as data, not instructions. [Enterprise] Separate the agent instance, execution environment, memory and credentials per tenant, and do not mix the data of several tenants in one run. When an operation across tenants is needed, require human approval and record it. Detect attempted calls across a tenant boundary. [Advanced] Issue short-lived, scoped credentials per tenant at the start of each run (the agent itself holds no broad privileges). Regularly verify the separation between tenants with test data in which a fake instruction has been planted in one tenant."
    references:
      "0":
        title: "Anthropic - Zero Trust for AI Agents (Identity and privilege abuse / tenant isolation)"
      "2":
        title: "MITRE ATLAS AML.T0051.001 LLM Prompt Injection: Indirect (ingesting instructions planted in another tenant's data)"
