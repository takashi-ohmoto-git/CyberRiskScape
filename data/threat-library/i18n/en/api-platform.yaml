# English overlay for `data/threat-library/api-platform.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  api-backend-object-level-authorization-001:
    name: "Broken object and property level authorization (BOLA / BOPLA)"
    description: "If {{nodeName}} does not check whether the record IDs and fields in a request belong to the calling user, a legitimately signed-in user can read or change other people's records just by rewriting an ID (Can). Returning fields the client does not need, or applying every field received in an update, also lets the caller read fields they have no right to see and overwrite fields such as roles or prices. An API gateway can validate tokens and scopes, but it does not know who owns a record, so this check can only be made in the backend. If, on the other hand, every data operation checks the caller's relationship to the record and the fields returned and accepted are limited by allow lists, rewriting an ID does not reach anyone else's data (Cannot). The blast radius is every record {{nodeName}} handles (every user's records if IDs are sequential or guessable)."
    mitigation: "[Foundation] In every API that handles records by ID, check the relationship between the caller (the token subject) and the record. Define, per API, an allow list of fields returned in responses and fields accepted in updates, and do not return or apply anything else. [Enterprise] Centralize authorization decisions in a shared library or policy engine instead of leaving them to each implementation. Include test cases that request other users' IDs in API tests and run them in CI every time. Use IDs that are hard to guess (random values). [Advanced] Log authorization decisions and detect a single user trying many other users' IDs. Generate authorization tests from the API specification and continuously check the gap between specification and implementation."

  api-backend-gateway-bypass-001:
    name: "Direct access to a backend API without going through the gateway"
    description: "{{sourceName}} can reach {{targetName}} without going through the API gateway. If authentication, rate limiting, input inspection, and access logging are left to the gateway, a caller who reaches the backend directly bypasses all of them (Can). Where the backend trusts headers added by the gateway (such as a user ID), the caller can also forge those headers to impersonate other users. If, on the other hand, traffic to the backend is limited to the path from the gateway (network restrictions, mutual TLS, and similar) and the backend validates tokens itself, a direct request is not accepted (Cannot). The blast radius is every function of {{targetName}} and every control the gateway is assumed to provide."
    mitigation: "[Foundation] Close any path by which users or external systems can reach the backend API directly, and route everything through the gateway (network allow lists, private connectivity). Do not trust gateway-added headers on requests that did not come from the gateway. [Enterprise] Authenticate the gateway and backend to each other with mutual TLS. Validate token signature, expiry, and scope in the backend as well, without relying on the gateway's check. [Advanced] Authorize each service-to-service call individually with a service mesh or similar, so that reaching the backend from outside the gateway is structurally impossible."

  api-control-plane-config-tampering-001:
    name: "Configuration tampering in the API control plane"
    description: "{{nodeName}} distributes routing, authentication, rate limiting, and plugin settings to the gateway. An attacker who obtains credentials for the admin API or management console can remove an authentication plugin, point a route at their own server, or stop log output, and apply that change to every API under management at once (Can). Because the change is distributed as legitimate configuration, the gateway does not treat it as abnormal. If, on the other hand, the admin API is separated from the gateway's traffic path and reachable only from administrators' devices, configuration is version-controlled as code, and only reviewed changes are applied from CI, obtaining credentials is not enough to rewrite the configuration unnoticed (Cannot). The blast radius is every API {{nodeName}} manages and all of their users."
    mitigation: "[Foundation] Place the admin API and management console on a path separate from the user-facing gateway (a management network, VPN, or similar), and require authentication with MFA. Give each administrator an individual account and separate permissions by role. [Enterprise] Manage configuration as declarative files under version control and apply only reviewed changes from CI (prohibit manual changes). Regularly detect differences between the running configuration and the repository. Record configuration changes in audit logs and forward them to the SIEM. [Advanced] Require an approval flow (such as two-person approval) for management operations. Automatically flag high-impact changes such as removing an authentication plugin or pointing a route outside the organization."

  api-control-plane-internet-exposure-001:
    name: "Remote access to the management plane (API control plane)"
    description: "{{targetName}} (the API control plane) is reachable from {{sourceName}}, which is outside the trust boundary (treated as Internet). When the admin API is exposed to the internet, attackers can go after administrative access by brute-forcing authentication or targeting default settings and known vulnerabilities (Can). With administrative access, they can rewrite authentication and routing for every API under management. If, on the other hand, the management plane is limited to a management network, VPN, or IAP and cannot be reached from the internet side, this entry point does not exist (Cannot). The blast radius is every API {{targetName}} manages."
    mitigation: "[Foundation] Do not expose the admin API or management console to the internet. Place it behind a management network, VPN, or IAP (Identity-Aware Proxy), and limit sources to administrators' devices. [Enterprise] Use MFA and short-lived tokens to authenticate to the management plane, and disable default administrator accounts. Record access to the management plane in audit logs and detect repeated failures. [Advanced] Decide each access to the management plane based on device posture and user attributes (zero trust access)."

  api-secrets-vault-concentration-001:
    name: "Concentration of privilege in the secrets manager"
    description: "{{nodeName}} gathers API keys, tokens, and certificates in one place. If read permissions are set broadly (an application credential that can read every secret, a shared administrator token, and similar), an attacker who obtains one of those credentials can retrieve every credential stored in {{nodeName}} at once (Can). Because the retrieved credentials are genuine, the systems that accept them have trouble telling the attack apart from normal use. If, on the other hand, readable paths are narrowed to the minimum per user and per application, short-lived credentials are issued dynamically, and reads are tracked in audit logs, one stolen credential yields only the secrets for that purpose, and unusual reads are detected (Cannot). The blast radius is every credential within reach of {{nodeName}}'s read permissions and everything those credentials allow."
    mitigation: "[Foundation] Narrow the secret paths each application and user can read to the minimum, and do not use credentials that can read everything in day-to-day operations. Revoke, or split and store separately, the initial administrator token and recovery keys once the system is in operation. [Enterprise] Replace long-lived secrets with short-lived credentials issued at the time of use (dynamic secrets). Record reads in audit logs and detect reads with unusual volume or timing. Automate secret rotation. [Advanced] Remove static credentials from authentication to the secrets manager itself by using workload identity. Protect keys with an HSM and require multi-person approval for administrative operations."
    references:
      "0":
        title: "OWASP Secrets Management Cheat Sheet (least privilege, dynamic secrets, auditing)"

  api-dev-workspace-secret-exposure-001:
    name: "Credentials exposed from a shared API dev tool workspace"
    description: "API keys, access tokens, and passwords used to try out APIs tend to end up in the collections and environment variables of {{nodeName}}. If a workspace is accidentally made public, an outside collaborator is invited, or a collection is exported and shared with production credentials still in it, anyone who sees it can use those credentials to call the production API directly (Can). Public workspaces can be found by search, so attackers can also look them up by organization name and harvest them. If, on the other hand, making workspaces public is prohibited by organization settings, credentials are loaded at runtime from the tool's secret feature or an external secrets manager, actual values are not left in collections or shared values, and development and production credentials are kept separate, seeing the workspace does not let anyone call the production API (Cannot). The blast radius is every API the credentials stored in {{nodeName}} allow."
    mitigation: "[Foundation] Prohibit public workspaces through organization settings, and review the visibility and members of existing workspaces. Search collections and environment variables for stored credentials, and revoke and reissue any that are found. Do not store production credentials in development tools. [Enterprise] Load credentials at runtime from the tool's secret feature or an external secrets manager, and do not leave them in shared values. Separate development and test credentials from production, and narrow their permissions and lifetimes. Regularly search public workspaces for the organization's credentials. [Advanced] Track workspace export and sharing operations in audit logs, and apply secret scanning to workspaces as well."
    references:
      "0":
        title: "OWASP Secrets Management Cheat Sheet (detecting secrets and prohibiting sharing)"

  api-ci-pipeline-poisoned-execution-001:
    name: "Poisoned CI/CD pipeline and credential theft"
    description: "{{nodeName}} runs build definitions and test scripts from the repository while holding credentials for deployment and API calls. An attacker who can write to a pull request or branch (an outside contributor, a hijacked developer account, and similar) can rewrite those build definitions or test scripts so that code runs with {{nodeName}}'s privileges, stealing credentials or changing the production environment (Can). In setups that run API tests in CI, production API keys are often passed to the pipeline. If, on the other hand, unreviewed code runs only in environments without credentials, credentials are issued short-lived only to the jobs that need them, and production deployment is limited to protected branches with approval, rewriting the build definition does not reach any credentials (Cannot). The blast radius is the credentials passed to {{nodeName}} and the entire deployment target environment."
    mitigation: "[Foundation] Run unreviewed code, such as pull requests from outside contributors, in environments that receive no credentials. Run production-related jobs only from protected branches, and require review for changes to build definitions. Make sure credentials are not printed in pipeline logs. [Enterprise] Do not store long-lived credentials in CI; issue short-lived credentials per job with OIDC or similar. Pass each job only the credentials it needs, and require approval for production deployments. [Advanced] Make build environments disposable for every run, and restrict outbound traffic with an allow list. Sign build artifacts and verify the signatures at deployment."

  api-spec-improper-inventory-001:
    name: "Improper API inventory (old versions and unregistered APIs left running)"
    description: "If {{nodeName}} does not match the APIs actually exposed, old-version endpoints, test endpoints, and APIs that were supposed to be retired keep running without appearing in the specification. These often lack the authorization and input checks added in newer versions, so an attacker can reach a weak implementation just by guessing an old version's URL (Can). When the specification is published, information about internal APIs and authentication methods also becomes reconnaissance material for attackers. If, on the other hand, running APIs are inventoried against the specification, APIs not in the specification are blocked at the gateway, and retired versions are shut down on a set deadline, unmanaged APIs cannot be reached from outside (Cannot). The blast radius is every API missing from the inventory."
    mitigation: "[Foundation] Build a list of running APIs (host, version, environment) and link each to its specification and owner. Shut down retired versions and test endpoints. Remove internal APIs from published specifications. [Enterprise] Manage the specification in the same repository as the gateway configuration, and do not expose routes that are not in the specification. Detect calls to APIs not in the specification from gateway access logs. [Advanced] Check the difference between specification and implementation in CI, and make any drift a release blocker."

  api-mobile-embedded-secret-001:
    name: "Verifying the caller with a secret embedded in the mobile app"
    description: "{{nodeName}} is called from a smartphone app. If an API key, client secret or signing key is embedded in the app and holding it is treated as proof that a call comes from the genuine app, an attacker only has to obtain and analyze the app to extract the value, then call {{nodeName}} directly from a script without the app (Can). The app is distributed to users' devices, so obfuscation cannot protect the secret (OAuth 2.0 likewise treats native apps as public clients that cannot keep a secret). Calls that bypass the app skip every restriction that relies on the app's screen flow or input checks, and combined with an authorization flaw such as BOLA they lead to bulk data retrieval. If, on the other hand, the value embedded in the app is used for neither authentication nor authorization, the calling user is verified with a per-user token (for example the authorization code flow with PKCE), and every authorization decision is made on the server, the extracted value alone achieves nothing (Cannot). The blast radius is every function of {{nodeName}} that can be called with the value embedded in the app."
    mitigation: "[Foundation] Do not use API keys or secrets embedded in the app as grounds for authentication or authorization (limit them to identifying the app or counting usage). Authenticate users with short-lived, per-user tokens issued through, for example, the OAuth 2.0 authorization code flow with PKCE. Make every authorization decision on the server, without relying on checks in the app. [Enterprise] Treat any secret contained in an app that has ever been distributed as already leaked, and design so it can be rotated. Take in OS-provided app and device integrity checks (App Attest, Play Integrity and the like) as a supplementary signal. [Advanced] Analyze release builds of the app and detect embedded secrets in CI. Detect call patterns that do not go through the app (orders and frequencies the app never produces)."
    references:
      "0":
        title: "IETF RFC 8252 - OAuth 2.0 for Native Apps (native apps are public clients)"

  api-bulk-data-harvesting-001:
    name: "No limits or detection for bulk harvesting of personal data through the API"
    description: "{{nodeName}} is called from users' devices and returns personal data such as member or order details. If there is no cap on how many records or how often one account, token or source can retrieve, and retrieval volume is not monitored for anomalies, an attacker can use an authorization flaw, a leaked token or a large batch of prepared accounts as a foothold, repeat calls from a script, and collect hundreds of thousands to millions of personal records within a few days (Can). Each response looks normal, so there are no traces of malware or intrusion, and error monitoring or server load monitoring will not notice. If, on the other hand, caps on record counts and call frequency are set per user, token and source, and counts impossible in normal use or access to many different users' data are detected and automatically blocked, a foothold yields only part of the data and is stopped quickly (Cannot). The blast radius is every record retrieved before detection and blocking, and without caps, the personal data of every user {{nodeName}} handles."
    mitigation: "[Foundation] For each API that returns personal data, set call limits per user, token and source IP. Keep the records and fields returned in one response to the minimum needed (cap paging on lists). Record in access logs both the calling user and the owner of each retrieved record. [Enterprise] Detect one account, token or source retrieving data for many different users, and block and alert automatically. Curb machine calls from outside the app with bot management or source reputation. Monitor daily usage of APIs that return personal data. [Advanced] Prepare procedures that, on detecting abnormal retrieval volume, automatically revoke tokens, suspend accounts and temporarily halt the API. Make record IDs unguessable so enumeration itself is hard."
    references:
      "2":
        title: "OWASP Automated Threats to Web Applications (OAT-011 Scraping)"
