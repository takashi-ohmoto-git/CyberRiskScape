# English overlay for `data/threat-library/api-platform.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  api-backend-object-level-authorization-001:
    name: "Broken object and property level authorization (BOLA / BOPLA)"
    description: "If {{nodeName}} does not check whether the record IDs and fields in a request belong to the calling user, a legitimately signed-in user can read or change other people's records just by rewriting an ID (Can). Returning fields the client does not need, or applying every field received in an update, also lets the caller read fields they have no right to see and overwrite fields such as roles or prices. An API gateway can validate tokens and scopes, but it does not know who owns a record, so this check can only be made in the backend. If, on the other hand, every data operation checks the caller's relationship to the record and the fields returned and accepted are limited by allow lists, rewriting an ID does not reach anyone else's data (Cannot). The blast radius is every record {{nodeName}} handles (every user's records if IDs are sequential or guessable)."
    mitigation: "[Foundation] In every API that handles records by ID, check the relationship between the caller (the token subject) and the record. Define, per API, an allow list of fields returned in responses and fields accepted in updates, and do not return or apply anything else. [Enterprise] Centralize authorization decisions in a shared library or policy engine instead of leaving them to each implementation. Include test cases that request other users' IDs in API tests and run them in CI every time. Use IDs that are hard to guess (random values). [Advanced] Log authorization decisions and detect a single user trying many other users' IDs. Generate authorization tests from the API specification and continuously check the gap between specification and implementation."
    references:
      "2":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (exploiting missing authorization in a public API)"

  api-backend-gateway-bypass-001:
    name: "Direct access to a backend API without going through the gateway"
    description: "{{sourceName}} can reach {{targetName}} without going through the API gateway. If authentication, rate limiting, input inspection, and access logging are left to the gateway, a caller who reaches the backend directly bypasses all of them (Can). Where the backend trusts headers added by the gateway (such as a user ID), the caller can also forge those headers to impersonate other users. If, on the other hand, traffic to the backend is limited to the path from the gateway (network restrictions, mutual TLS, and similar) and the backend validates tokens itself, a direct request is not accepted (Cannot). The blast radius is every function of {{targetName}} and every control the gateway is assumed to provide."
    mitigation: "[Foundation] Close any path by which users or external systems can reach the backend API directly, and route everything through the gateway (network allow lists, private connectivity). Do not trust gateway-added headers on requests that did not come from the gateway. [Enterprise] Authenticate the gateway and backend to each other with mutual TLS. Validate token signature, expiry, and scope in the backend as well, without relying on the gateway's check. [Advanced] Authorize each service-to-service call individually with a service mesh or similar, so that reaching the backend from outside the gateway is structurally impossible."

  api-control-plane-config-tampering-001:
    name: "Configuration tampering in the API control plane"
    description: "{{nodeName}} distributes routing, authentication, rate limiting, and plugin settings to the gateway. An attacker who obtains credentials for the admin API or management console can remove an authentication plugin, point a route at their own server, or stop log output, and apply that change to every API under management at once (Can). Because the change is distributed as legitimate configuration, the gateway does not treat it as abnormal. If, on the other hand, the admin API is separated from the gateway's traffic path and reachable only from administrators' devices, configuration is version-controlled as code, and only reviewed changes are applied from CI, obtaining credentials is not enough to rewrite the configuration unnoticed (Cannot). The blast radius is every API {{nodeName}} manages and all of their users."
    mitigation: "[Foundation] Place the admin API and management console on a path separate from the user-facing gateway (a management network, VPN, or similar), and require authentication with MFA. Give each administrator an individual account and separate permissions by role. [Enterprise] Manage configuration as declarative files under version control and apply only reviewed changes from CI (prohibit manual changes). Regularly detect differences between the running configuration and the repository. Record configuration changes in audit logs and forward them to the SIEM. [Advanced] Require an approval flow (such as two-person approval) for management operations. Automatically flag high-impact changes such as removing an authentication plugin or pointing a route outside the organization."
    references:
      "1":
        title: "MITRE ATT&CK T1078 - Valid Accounts (changes made with obtained management credentials)"
      "2":
        title: "MITRE ATT&CK T1556 - Modify Authentication Process (removing the authentication plugin)"

  api-control-plane-internet-exposure-001:
    name: "Remote access to the management plane (API control plane)"
    description: "{{targetName}} (the API control plane) is reachable from {{sourceName}}, which is outside the trust boundary (treated as Internet). When the admin API is exposed to the internet, attackers can go after administrative access by brute-forcing authentication or targeting default settings and known vulnerabilities (Can). With administrative access, they can rewrite authentication and routing for every API under management. If, on the other hand, the management plane is limited to a management network, VPN, or IAP and cannot be reached from the internet side, this entry point does not exist (Cannot). The blast radius is every API {{targetName}} manages."
    mitigation: "[Foundation] Do not expose the admin API or management console to the internet. Place it behind a management network, VPN, or IAP (Identity-Aware Proxy), and limit sources to administrators' devices. [Enterprise] Use MFA and short-lived tokens to authenticate to the management plane, and disable default administrator accounts. Record access to the management plane in audit logs and detect repeated failures. [Advanced] Decide each access to the management plane based on device posture and user attributes (zero trust access)."
    references:
      "1":
        title: "MITRE ATT&CK T1110 - Brute Force (brute-forcing authentication to the management API)"
      "2":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (exploiting default settings and known vulnerabilities)"

  api-secrets-vault-concentration-001:
    name: "Concentration of privilege in the secrets manager"
    description: "{{nodeName}} gathers API keys, tokens, and certificates in one place. If read permissions are set broadly (an application credential that can read every secret, a shared administrator token, and similar), an attacker who obtains one of those credentials can retrieve every credential stored in {{nodeName}} at once (Can). Because the retrieved credentials are genuine, the systems that accept them have trouble telling the attack apart from normal use. If, on the other hand, readable paths are narrowed to the minimum per user and per application, short-lived credentials are issued dynamically, and reads are tracked in audit logs, one stolen credential yields only the secrets for that purpose, and unusual reads are detected (Cannot). The blast radius is every credential within reach of {{nodeName}}'s read permissions and everything those credentials allow."
    mitigation: "[Foundation] Narrow the secret paths each application and user can read to the minimum, and do not use credentials that can read everything in day-to-day operations. Revoke, or split and store separately, the initial administrator token and recovery keys once the system is in operation. [Enterprise] Replace long-lived secrets with short-lived credentials issued at the time of use (dynamic secrets). Record reads in audit logs and detect reads with unusual volume or timing. Automate secret rotation. [Advanced] Remove static credentials from authentication to the secrets manager itself by using workload identity. Protect keys with an HSM and require multi-person approval for administrative operations."
    references:
      "0":
        title: "OWASP Secrets Management Cheat Sheet (least privilege, dynamic secrets, auditing)"
      "1":
        title: "MITRE ATT&CK T1555.006 - Credentials from Password Stores: Cloud Secrets Management Stores (bulk retrieval of credentials from secrets management)"

  api-dev-workspace-secret-exposure-001:
    name: "Credentials exposed from a shared API dev tool workspace"
    description: "API keys, access tokens, and passwords used to try out APIs tend to end up in the collections and environment variables of {{nodeName}}. If a workspace is accidentally made public, an outside collaborator is invited, or a collection is exported and shared with production credentials still in it, anyone who sees it can use those credentials to call the production API directly (Can). Public workspaces can be found by search, so attackers can also look them up by organization name and harvest them. If, on the other hand, making workspaces public is prohibited by organization settings, credentials are loaded at runtime from the tool's secret feature or an external secrets manager, actual values are not left in collections or shared values, and development and production credentials are kept separate, seeing the workspace does not let anyone call the production API (Cannot). The blast radius is every API the credentials stored in {{nodeName}} allow."
    mitigation: "[Foundation] Prohibit public workspaces through organization settings, and review the visibility and members of existing workspaces. Search collections and environment variables for stored credentials, and revoke and reissue any that are found. Do not store production credentials in development tools. [Enterprise] Load credentials at runtime from the tool's secret feature or an external secrets manager, and do not leave them in shared values. Separate development and test credentials from production, and narrow their permissions and lifetimes. Regularly search public workspaces for the organization's credentials. [Advanced] Track workspace export and sharing operations in audit logs, and apply secret scanning to workspaces as well."
    references:
      "0":
        title: "OWASP Secrets Management Cheat Sheet (detecting secrets and prohibiting sharing)"
      "1":
        title: "MITRE ATT&CK T1593 - Search Open Websites/Domains (searching for public workspaces)"
      "2":
        title: "MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials In Files (obtaining credentials left in collections and environment variables)"

  api-ci-pipeline-poisoned-execution-001:
    name: "Poisoned CI/CD pipeline and credential theft"
    description: "{{nodeName}} runs build definitions and test scripts from the repository while holding credentials for deployment and API calls. An attacker who can write to a pull request or branch (an outside contributor, a hijacked developer account, and similar) can rewrite those build definitions or test scripts so that code runs with {{nodeName}}'s privileges, stealing credentials or changing the production environment (Can). In setups that run API tests in CI, production API keys are often passed to the pipeline. If, on the other hand, unreviewed code runs only in environments without credentials, credentials are issued short-lived only to the jobs that need them, and production deployment is limited to protected branches with approval, rewriting the build definition does not reach any credentials (Cannot). The blast radius is the credentials passed to {{nodeName}} and the entire deployment target environment."
    mitigation: "[Foundation] Run unreviewed code, such as pull requests from outside contributors, in environments that receive no credentials. Run production-related jobs only from protected branches, and require review for changes to build definitions. Make sure credentials are not printed in pipeline logs. [Enterprise] Do not store long-lived credentials in CI; issue short-lived credentials per job with OIDC or similar. Pass each job only the credentials it needs, and require approval for production deployments. [Advanced] Make build environments disposable for every run, and restrict outbound traffic with an allow list. Sign build artifacts and verify the signatures at deployment."
    references:
      "1":
        title: "MITRE ATT&CK T1677 - Poisoned Pipeline Execution (execution through modified build definitions or test scripts)"

  api-spec-improper-inventory-001:
    name: "Improper API inventory (old versions and unregistered APIs left running)"
    description: "If {{nodeName}} does not match the APIs actually exposed, old-version endpoints, test endpoints, and APIs that were supposed to be retired keep running without appearing in the specification. These often lack the authorization and input checks added in newer versions, so an attacker can reach a weak implementation just by guessing an old version's URL (Can). When the specification is published, information about internal APIs and authentication methods also becomes reconnaissance material for attackers. If, on the other hand, running APIs are inventoried against the specification, APIs not in the specification are blocked at the gateway, and retired versions are shut down on a set deadline, unmanaged APIs cannot be reached from outside (Cannot). The blast radius is every API missing from the inventory."
    mitigation: "[Foundation] Build a list of running APIs (host, version, environment) and link each to its specification and owner. Shut down retired versions and test endpoints. Remove internal APIs from published specifications. [Enterprise] Manage the specification in the same repository as the gateway configuration, and do not expose routes that are not in the specification. Detect calls to APIs not in the specification from gateway access logs. [Advanced] Check the difference between specification and implementation in CI, and make any drift a release blocker."
    references:
      "1":
        title: "MITRE ATT&CK T1595.003 - Active Scanning: Wordlist Scanning (guessing old or unregistered endpoints)"

  api-mobile-embedded-secret-001:
    name: "Verifying the caller with a secret embedded in the mobile app"
    description: "{{nodeName}} is called from a smartphone app. If an API key, client secret or signing key is embedded in the app and holding it is treated as proof that a call comes from the genuine app, an attacker only has to obtain and analyze the app to extract the value, then call {{nodeName}} directly from a script without the app (Can). The app is distributed to users' devices, so obfuscation cannot protect the secret (OAuth 2.0 likewise treats native apps as public clients that cannot keep a secret). Calls that bypass the app skip every restriction that relies on the app's screen flow or input checks, and combined with an authorization flaw such as BOLA they lead to bulk data retrieval. If, on the other hand, the value embedded in the app is used for neither authentication nor authorization, the calling user is verified with a per-user token (for example the authorization code flow with PKCE), and every authorization decision is made on the server, the extracted value alone achieves nothing (Cannot). The blast radius is every function of {{nodeName}} that can be called with the value embedded in the app."
    mitigation: "[Foundation] Do not use API keys or secrets embedded in the app as grounds for authentication or authorization (limit them to identifying the app or counting usage). Authenticate users with short-lived, per-user tokens issued through, for example, the OAuth 2.0 authorization code flow with PKCE. Make every authorization decision on the server, without relying on checks in the app. [Enterprise] Treat any secret contained in an app that has ever been distributed as already leaked, and design so it can be rotated. Take in OS-provided app and device integrity checks (App Attest, Play Integrity and the like) as a supplementary signal. [Advanced] Analyze release builds of the app and detect embedded secrets in CI. Detect call patterns that do not go through the app (orders and frequencies the app never produces)."
    references:
      "0":
        title: "IETF RFC 8252 - OAuth 2.0 for Native Apps (native apps are public clients)"
      "3":
        title: "MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials In Files (extracting embedded secrets by analyzing the app)"

  api-bulk-data-harvesting-001:
    name: "No limits or detection for bulk harvesting of personal data through the API"
    description: "{{nodeName}} is called from users' devices, or from SaaS and business applications (such as a CRM) acting on users' behalf, and returns personal data such as member or order details. If there is no cap on how many records or how often one account, token or source can retrieve, and retrieval volume is not monitored for anomalies, an attacker can use an authorization flaw, a leaked token, a large batch of prepared accounts or a hijacked SaaS user account as a foothold, repeat calls from a script, and collect hundreds of thousands to millions of personal records within a few days (Can). Each response looks normal, so there are no traces of malware or intrusion, and error monitoring or server load monitoring will not notice. If, on the other hand, caps on record counts and call frequency are set per user, token and source, and counts impossible in normal use or access to many different users' data are detected and automatically blocked, a foothold yields only part of the data and is stopped quickly (Cannot). The blast radius is every record retrieved before detection and blocking, and without caps, the personal data of every user {{nodeName}} handles."
    mitigation: "[Foundation] For each API that returns personal data, set call limits per user, token and source IP. Keep the records and fields returned in one response to the minimum needed (cap paging on lists). Record in access logs both the calling user and the owner of each retrieved record. [Enterprise] Detect one account, token or source retrieving data for many different users, and block and alert automatically. Curb machine calls from outside the app with bot management or source reputation. Monitor daily usage of APIs that return personal data. Where a SaaS calls the API in bulk with a service credential, the source IP and token are shared by every user, so receive the ID of the user on whose behalf it acts and apply limits and detection per user. [Advanced] Prepare procedures that, on detecting abnormal retrieval volume, automatically revoke tokens, suspend accounts and temporarily halt the API. Make record IDs unguessable so enumeration itself is hard."
    references:
      "2":
        title: "OWASP Automated Threats to Web Applications (OAT-011 Scraping)"
      "3":
        title: "MITRE ATT&CK T1119 - Automated Collection (repeated scripted retrieval of personal data)"

  api-backend-function-level-authorization-001:
    name: "Broken function level authorization (BFLA)"
    description: "{{nodeName}} serves APIs for administrators, internal operations or system integration through the same entry point as the APIs for ordinary users. If each API does not check whether the caller's token type and role allow this function, an attacker legitimately signed in as an ordinary user only has to try URLs and methods guessed from the app's traffic (changing GET to PUT or DELETE, /users/me to /admin/users, and so on) to call administrative functions such as listing, searching or bulk-exporting other members, or changing permissions (Can). The absence of admin buttons in the app's screens is no defense. If, on the other hand, every API checks the caller's role against the functions it may use, denies by default, and admin and internal APIs are separated from user-facing ones onto a different entry point and a different token issuer, a user's token cannot reach administrative functions (Cannot). The blast radius is every administrative function callable with a user's token, and all user data those functions handle."
    mitigation: "[Foundation] In every API, check the caller's role (ordinary user, administrator, internal system) against whether it may use that API's function. Deny by default and state the permitted roles per API. Decide per method (GET, PUT, DELETE and so on) as well. [Enterprise] Serve admin and internal APIs from a host and network path separate from user-facing ones, so user tokens cannot reach them. Run test cases that call admin APIs with a user token in CI every time. [Advanced] Centralize authorization decisions in a policy engine, and continuously check for drift between the role definitions in the API specification and the implementation. Detect and alert on admin API calls made with user tokens."
    references:
      "1":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (exploiting missing authorization on administrator functions)"

  api-token-session-validation-gap-001:
    name: "Token and session validation flaws in the API"
    description: "{{nodeName}} identifies the calling user by the session token or JWT sent from the user's device, or from a SaaS or business application acting on the user's behalf. If it trusts the member ID inside the token without verifying the signature, does not check expiry, logout or revocation, or ignores the token's purpose (display only, a specific function) or its scope, an attacker can rewrite the token's contents to impersonate another member, keep using expired or stolen tokens, or call APIs that return personal data with a weakly privileged token (Can). If the signing algorithm (alg) is left to whatever the token says, unsigned tokens or tokens forged with another key are accepted as well. If, on the other hand, every request has the signature checked with the server's key along with issuer, audience, expiry and revocation, the accepted algorithms are fixed, and each API checks for the scope it requires, rewritten, expired and under-privileged tokens are all rejected (Cannot). The blast radius is the data of every user who can be impersonated, and every function callable with that token."
    mitigation: "[Foundation] On every request, verify the token's signature, issuer, audience and expiry. Fix the accepted signing algorithms on the server side and reject unsigned tokens. Take the member ID only from the subject (sub) of a token whose signature has been verified, never from request parameters or an unverified token. [Enterprise] Define the scope and purpose each API requires, and reject tokens that do not meet them (do not let display-only tokens call personal-data APIs). Keep access token lifetimes short, and have a way to revoke them on logout, password change or fraud detection. Centralize token validation in a shared library or the gateway. [Advanced] Bind tokens to the device or client (sender-constrained tokens with DPoP, mTLS and the like) so stolen tokens cannot be used from another device. Monitor validation failures and use of revoked tokens."
    references:
      "3":
        title: "MITRE ATT&CK T1550.001 - Use Alternate Authentication Material: Application Access Token (reusing expired or revoked tokens)"
      "4":
        title: "MITRE ATT&CK T1606 - Forge Web Credentials (modifying tokens whose signatures are not verified)"

  api-backend-ssrf-001:
    name: "Server-side request forgery (SSRF)"
    description: "{{nodeName}} has functions in which the server itself makes requests using a URL or host name received from the caller (fetching or previewing an image from a URL, converting documents, registering a webhook destination, retrieving external data, and so on). If the destination is not validated, an attacker can point it at an internal network address, the cloud metadata service (such as 169.254.169.254), or a local file via file://, and use {{nodeName}} as a stepping stone to reach internal admin screens, databases and other servers that cannot be reached from outside, or to extract the temporary cloud credentials granted to the server (Can). Which parameters accept a URL is easy to learn by analyzing the app, and any destination restriction in the app is bypassed by calling the API directly. If, on the other hand, the server limits the destination scheme, host and port with an allow list, checks that the resolved IP address is not internal or link-local, does not follow redirects, restricts the metadata service to a token-required mode, and limits outbound traffic from {{nodeName}} to the destinations it needs, rewriting the destination does not reach internal systems or the metadata service (Cannot). The blast radius is the entire internal network reachable from {{nodeName}}, and everything the cloud permissions granted to {{nodeName}} allow."
    mitigation: "[Foundation] Inventory the functions that accept a URL or host name and drop the ones that are not needed (for example, accept the file itself instead of a URL). For the rest, limit the destination scheme (such as https only), host and port with an allow list on the server side. Check that the IP address after name resolution is not private, loopback or link-local (including the metadata service), and do not follow redirects. [Enterprise] Restrict the cloud metadata service to a token-required mode (such as AWS IMDSv2), and keep the permissions granted to the API server to the minimum. Limit outbound traffic from the API server to internal networks and the internet to the destinations it needs, on the network side as well. Disable external references and local file reads in image processing and document conversion libraries. [Advanced] Move URL fetching into an isolated environment that cannot reach the internal network (a dedicated egress proxy or sandbox). Detect and alert on traffic from the API server to the metadata service or unexpected internal destinations."
    references:
      "3":
        title: "NICT CYNEX (LETTICE) alert: \"One cause of the recurring data leaks: server attacks based on app analysis\" (2026-10-13)"
      "4":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (exploiting a function that does not validate destinations)"
      "5":
        title: "MITRE ATT&CK T1552.005 - Unsecured Credentials: Cloud Instance Metadata API (obtaining credentials from the metadata service)"

  api-backend-query-injection-001:
    name: "SQL / NoSQL injection through API parameters"
    description: "{{nodeName}} searches and updates its database using parameters received from the caller (query strings and JSON bodies). If values are embedded into queries by string concatenation, or objects in the JSON body are passed straight into search conditions, an attacker can put query syntax into a value (SQL quotes or UNION clauses, NoSQL operators such as $ne, $gt or $where) to rewrite the conditions and pull out other people's data or every record, defeat login conditions, or tamper with and delete data (Can). Parameter names and shapes are easy to learn by analyzing the app, and input checks in the app are bypassed by calling the API directly. A WAF reduces known patterns but tends to miss things such as NoSQL operators carried in JSON structure. If, on the other hand, every query is built with placeholders (parameterized queries) or the driver's safe API, the type and shape of received values are validated on the server, objects and operators are never allowed into search conditions, and the database account's permissions are kept to the minimum, values are only ever treated as data (Cannot). The blast radius is all data in the database that {{nodeName}}'s database account can read and write."
    mitigation: "[Foundation] Build every SQL query with placeholders (parameterized queries), never by string concatenation. For NoSQL, check the type of each received value before using it in a search condition (do not accept objects or arrays where a string is expected), and do not accept operators starting with $ from requests. Validate the fields, types and lengths each API accepts against a schema. [Enterprise] Use a separate database account per API and grant only the tables and operations it needs (never connect with administrative privileges). Do not include database error details in responses. Monitor injection attempts with a WAF and access logs, and run injection checks (SAST and DAST) in CI every time. [Advanced] Replace functions that accept free-form sort fields or filter expressions with allow-listed choices. Detect unexpected queries (full-table reads, administrative commands) on the database side."
    references:
      "4":
        title: "NICT CYNEX (LETTICE) alert: \"One cause of the recurring data leaks: server attacks based on app analysis\" (2026-10-13)"
      "5":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (injecting syntax into queries)"

  api-backend-remote-code-execution-001:
    name: "Arbitrary code execution on the API server (deserialization, file writes, OS commands)"
    description: "If {{nodeName}} restores data received from the caller into program objects (unsafe deserialization), saves uploaded files under a name or location chosen by the user, or passes received values as arguments to OS commands, an attacker can send crafted data, file names (paths containing ../ and the like) or command separators to run arbitrary programs on {{nodeName}} or overwrite configuration files and the program itself (Can). If operations and maintenance functions (reading and writing files, running commands, debug screens) are exposed through the same entry point as the user-facing API, simply calling them achieves the same. Once code runs, the attacker can use the database connection details, API keys and cloud permissions held by {{nodeName}} to spread into every connected system. If, on the other hand, untrusted data is never restored into objects (it is received in a simple format such as JSON and its types are validated), uploaded files are saved under server-chosen names in a location where they cannot be executed, library functions are used instead of OS commands, and administrative functions are not exposed, crafted data does not lead to execution (Cannot). The blast radius is all data and credentials reachable with {{nodeName}}'s execution privileges, and the internal network reachable from there."
    mitigation: "[Foundation] Do not restore untrusted input into objects with language-specific formats (Java serialization, PHP unserialize, Python pickle and the like). Receive it in a simple format such as JSON and validate its types against a schema. Save uploaded files under server-generated names in a location the web server will not execute (outside the public directory, or in object storage), and never use a path specified by the user. Replace OS command calls with library functions; where unavoidable, validate arguments against an allow list and pass them without going through a shell. Do not expose operations or debug functions on the user-facing API. [Enterprise] Run the API server as a least-privileged user and make the program location read-only. Fix vulnerabilities in the libraries and frameworks in use (deserialization and the like) by a set deadline. Detect shells and unexpected processes launched by the API server with EDR or similar. [Advanced] Run the API server from a read-only container image so files cannot be rewritten at runtime. Limit traffic from the API server to internal and external destinations to the ones it needs, to contain exfiltration and lateral movement after a compromise."
    references:
      "6":
        title: "NICT CYNEX (LETTICE) alert: \"One cause of the recurring data leaks: server attacks based on app analysis\" (2026-10-13)"
      "7":
        title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application (exploiting deserialization, file writes, or OS commands)"
      "8":
        title: "MITRE ATT&CK T1505.003 - Server Software Component: Web Shell (planting a web shell through a written file)"
      "9":
        title: "MITRE ATT&CK T1059 - Command and Scripting Interpreter (executing OS commands)"

  api-error-response-disclosure-001:
    name: "Internal information exposed through error responses"
    description: "{{nodeName}} returns responses to external callers (users' devices, or SaaS and business applications acting on users' behalf). If, when processing fails, it returns exception messages, stack traces or error bodies received from downstream as they are, an attacker can simply send invalid values on purpose or aim for times when a downstream service is down, and collect internal host names and URLs, the middleware and frameworks in use and their versions, the layering of the APIs (which internal APIs a request passes through), and database table names or fragments of queries (Can). The information is used to identify known vulnerabilities, guess internal APIs that can be reached without the gateway, and build injections. Error responses rarely show up in tests of normal behaviour and appear only during downstream failures, so they are easy to overlook. If, on the other hand, callers receive only a generic error code and a tracking ID (correlation ID), details are recorded only in internal logs, and downstream error bodies are replaced at the external boundary, triggering errors reveals nothing about the internal structure (Cannot). The blast radius is the whole structure behind {{nodeName}} that can be inferred from responses; this does not leak data by itself, but it saves an attacker much of the reconnaissance for other attacks."
    mitigation: "[Foundation] Limit error responses to callers to a generic message, an error code and a correlation ID, and do not include exception messages, stack traces, internal host names or URLs, or middleware names and versions. Disable detailed debug error output in production. Remove server and framework names and versions from response headers. [Enterprise] Put common error handling at the external boundary (such as the API gateway) and replace error bodies returned from downstream with a standard format (such as RFC 9457 Problem Details). Keep details only in internal logs that can be looked up by correlation ID, and restrict who can read those logs to operators. Use tests that make downstream services stop, time out or receive invalid input to confirm that no internal information appears in error responses. [Advanced] Monitor error responses sent externally and detect and alert on strings that look like internal host names or stack traces. Detect a single caller causing many errors in a short time (reconnaissance)."
    references:
      "0":
        title: "OWASP API Security Top 10 2023 - API8:2023 Security Misconfiguration (error responses that include stack traces and the like)"
      "3":
        title: "MITRE ATT&CK T1592.002 - Gather Victim Host Information: Software (learning middleware and versions from error responses)"

  api-downstream-cascading-failure-001:
    name: "Cascading downstream failures in layered APIs (missing timeouts, circuit breakers and isolation)"
    description: "{{nodeName}} calls downstream APIs, databases and external services synchronously while processing, and waits for their responses before replying to its caller. If downstream calls have no timeout (or one longer than upstream), there is no mechanism to stop calling a downstream service that keeps failing (a circuit breaker), connections and threads are not partitioned per downstream service, or retries have no limit on count and interval, then a single downstream service stopping or slowing down fills {{nodeName}}'s connections and threads with waiting requests, halts functions unrelated to that downstream service, and spreads the outage layer by layer to the upstream layers that call {{nodeName}} (Can). An attacker can also deliberately slow a downstream service by repeating requests that trigger heavy processing (document generation, large searches and the like) and stop the whole system with a volume that stays within the entry point's rate limits. If, on the other hand, each downstream call has a timeout shorter than upstream, calls to a downstream service that keeps failing are cut off immediately by a circuit breaker, connections and threads are partitioned per downstream service (bulkheads), and heavy processing is moved to asynchronous intake, a stopped downstream service makes only that function return an error quickly while other functions and upstream layers keep running (Cannot). The blast radius is {{nodeName}} and every upstream layer and user that calls it synchronously."
    mitigation: "[Foundation] Set a timeout on every downstream call, and align them so that they get shorter the further downstream a layer is (avoid upstream timing out first while downstream work keeps running). Give retries a limit on count and a gradually increasing back-off, and retry only operations that are safe to repeat. When a downstream service is down, return a generic error quickly. [Enterprise] Put a circuit breaker on each downstream service to cut off calls to one that keeps failing. Partition connection pools and threads per downstream service (bulkheads) so that delay in one does not spread to other functions. Move heavy processing such as document generation to an asynchronous design that separates intake from processing (queues and the like), and cap concurrent executions per user and per function. [Advanced] Monitor response time, error rate and circuit breaker state per downstream service, and trace requests across layers by correlation ID. Regularly confirm, with tests that deliberately stop or slow downstream services (fault injection), that outages do not spread."
    references:
      "0":
        title: "NIST SP 800-204 - Security Strategies for Microservices-based Application Systems (circuit breakers, load balancing, throttling)"
      "1":
        title: "OWASP API Security Top 10 2023 - API4:2023 Unrestricted Resource Consumption (execution timeouts and the like)"
