# English overlay for `data/threat-library/endpoint.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. Keep a genuinely Japanese document title as
#     its original title and add an English gloss; `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  endpoint-iot-default-credentials-unpatchable-001:
    category: "Spoofing"
    name: "Default credentials and unpatchable firmware on IoT devices"
    description: "IoT and embedded devices such as {{nodeName}} are often run with factory default credentials left unchanged, or have no firmware update mechanism at all, leaving known vulnerabilities in place for years (Can). An attacker who authenticates with default credentials or exploits a published CVE gains a botnet foothold and a starting point for lateral movement into the internal network. If, on the other hand, the device forces a unique password at first boot and ships with signed over-the-air firmware updates, compromise through factory settings does not succeed (Cannot). The blast radius is the entire network segment the device sits on, since the compromised device becomes a pivot."
    mitigation: "[Foundation] Force factory default credentials to be replaced with a unique password during first-time setup, and keep the device off external networks until that happens. Maintain a device inventory and check it against published CVEs on a regular schedule. [Enterprise] Ship signed over-the-air firmware updates and define an SLA for applying them after a critical CVE is disclosed. Isolate devices on a dedicated VLAN and use micro segmentation to limit how far they can reach internally. [Advanced] Authenticate devices with hardware-attested identity (TPM or secure element) under zero trust, and quarantine a device from the network automatically when its traffic pattern deviates."
    references:
      "1":
        title: "MITRE ATT&CK T1078.001 - Valid Accounts: Default Accounts (authentication with factory-default credentials)"

  endpoint-device-loss-local-credential-exposure-001:
    category: "Information Disclosure"
    name: "Local credential exposure from a lost or stolen device"
    description: "If a PC or mobile device such as {{nodeName}} is lost or stolen, whoever physically holds it can abuse the session tokens cached on it, the stored credentials, and any local application left signed in (Can). Once the lock screen is bypassed, the cloud services and internal systems that device is already authenticated to are reachable as-is. If full-disk encryption (FileVault, BitLocker, or equivalent) and strong lock-screen authentication are enforced, and remote wipe clears the device promptly once the loss is reported, physical possession alone is not enough to steal credentials or impersonate the user (Cannot). The blast radius is every account whose session or credentials were cached on that device."
    mitigation: "[Foundation] Require full-disk encryption (FileVault, BitLocker, or equivalent) and a screen lock (PIN or biometric), and bar devices without them from business use. [Enterprise] Enable remote lock and remote wipe through MDM, and define and rehearse the process from loss report to wipe. Shorten session token lifetimes so they can be revoked when a device goes missing. [Advanced] Bind credentials to a hardware security module (TPM or Secure Enclave) so they cannot be decrypted off the device, and apply access control dynamically from a continuous device posture score."
    references:
      "2":
        title: "MITRE ATT&CK T1555 - Credentials from Password Stores (obtaining credentials saved on the device)"

  agentic-endpoint-command-unmanaged-target-001:
    category: "Tampering"
    name: "Unverified delivery of commands to unmanaged endpoints"
    description: "When an edge from {{sourceName}} to {{targetName}} terminates on an Unmanaged endpoint, the configuration changes, control commands, and payloads that {{sourceName}} (an agent, tool, or connector) sends bypass the verification, recording, and rollback that MDM or EDR would provide on the receiving side (Can). If {{sourceName}} is compromised, an attacker can push arbitrary commands to the unmanaged endpoint through that path one-way, and no audit trail of the delivery is left on the device. If only allow-listed commands are permitted and each delivery is signature-verified before it is sent, with the sender keeping a complete delivery log, arbitrary commands from a compromised source are rejected at the destination (Cannot). The blast radius is every Unmanaged endpoint reachable over that path."
    mitigation: "[Foundation] Inventory the control-command and configuration-delivery paths that target Unmanaged endpoints, and restrict them to an allow-list of command types. Log both the content and the result of every delivery on the sending side. [Enterprise] Require commands to be signed, and reject unsigned ones at the endpoint agent where one exists or at the relaying connector otherwise. Give deliveries to Unmanaged endpoints a narrower privilege scope than those to MDM-enrolled devices. [Advanced] Shrink the delivery path itself, moving to a zero trust architecture in which unmanaged devices receive read-only notifications and nothing else."
    references:
      "0":
        title: "NIST SP 800-46 Rev.2 - Guide to Enterprise Telework, Remote Access, and BYOD Security (controlling delivery to unmanaged devices)"

  endpoint-mfp-admin-stored-data-exposure-001:
    category: "Information Disclosure"
    name: "Leakage of stored documents and address books and tampering with settings through a multifunction printer's default administrator password"
    description: "When the management interface (web) or management protocols (SNMP, etc.) of {{nodeName}} still use the default password or community name and can be reached from anywhere in the organization (including guest and wireless networks), an attacker who has entered the internal network, or an insider, can sign in as administrator, read the scanned, faxed, and printed documents stored on the internal storage and the address book (email addresses and fax numbers of employees and business partners, shared-folder paths), and rewrite destination and forwarding settings so that subsequent faxes and scans are forwarded to the attacker's destination (Can). Endpoint detection products cannot be installed on multifunction printers, and changes to the management interface often go unnoticed. If the storage is not erased at disposal or when a lease ends, the stored documents leave the organization. On the other hand, if the administrator password and community names are changed to strong per-device values, access to the management interface is limited to management devices or networks, document storage is kept to the minimum with storage encryption and erasure at disposal, and setting changes are recorded, merely entering the network does not make someone an administrator, and no stored documents remain to be taken (Cannot). If it can be reached from the internet, netinfra-edge-device-exploitation-001 (edge) appears separately. The blast radius is the documents and address books stored in {{nodeName}}, and the scans and faxes after the destinations were rewritten."
    mitigation: "[Foundation] Change the administrator password from the default to a strong per-device value, and stop unused management protocols (SNMP v1/v2c, Telnet, FTP, etc.); use SNMPv3 if SNMP is needed. Limit the devices and networks that can open the management interface. Keep only the documents that are needed on the device, and enable storage encryption and automatic erasure. [Enterprise] Place multifunction printers in a segment separate from user devices and allow only the traffic needed for printing and scanning. Use individual accounts for the management interface, and send logs of setting changes and sign-ins to an external log platform. Make erasing the storage at disposal or lease return part of the procedure, and keep proof of erasure. Update the firmware regularly. [Advanced] Require user authentication (IC cards, etc.) for printing and scanning, and output documents only when the user authenticates at the device. Manage multifunction printer settings centrally and automatically detect drift from the defined settings."
    references:
      "1":
        title: "NIST SP 800-53 Rev.5 - Security and Privacy Controls for Information Systems and Organizations (IA-5 Authenticator Management [changing default authenticators] / MP-6 Media Sanitization)"
      "2":
        title: "MITRE ATT&CK T1078.001 - Valid Accounts: Default Accounts (logging in to the management interface with the initial password)"

  endpoint-mfp-scan-credential-passback-001:
    category: "Information Disclosure"
    name: "Theft of credentials stored for scan delivery (pass-back by rewriting the destination)"
    description: "{{nodeName}} keeps credentials for each server inside the device (an account that writes to shared folders, an account for sending mail, an account that reads the directory) so it can send scanned documents to shared folders (SMB) or mail (SMTP) and look up addresses in the directory (LDAP). An attacker who can get into the management interface can rewrite the address of the destination server to a server they prepared, run a connection test, and receive the stored credentials in plaintext or in an easily cracked form (pass-back) (Can). These accounts often have write rights to entire shared folders or rights to read the whole directory, and their passwords have long gone unchanged, so the attacker can move laterally as a legitimate account in the organization. On the other hand, if the stored credentials are dedicated least-privilege accounts per purpose, LDAP is limited to LDAPS, SMB to signing, and SMTP to TLS with authenticated submission, changing the destination requires administrator authentication and is recorded, and sign-ins by the dedicated accounts are limited to the multifunction printer and monitored, stolen credentials only reach the scan destinations and use from anywhere else is detected (Cannot). The blast radius is what the accounts of the stored credentials can reach (shared folders, mail, directory)."
    mitigation: "[Foundation] List the credentials stored on the multifunction printer, and replace them with dedicated accounts per purpose (able to write only to the scan destination folder, read-only for the directory). Change the administrator password and limit who can change destination settings. Encrypt traffic to the destinations (LDAPS, TLS for SMTP, SMB signing). [Enterprise] Change the dedicated accounts' passwords regularly, restrict the devices they can sign in from to the multifunction printer, and detect sign-ins from anywhere else. Record and notify changes to destination settings. Consider replacing directory lookups with mechanisms that need no credentials (distributing an address book to the device, cloud address lookup). [Advanced] Move scan destinations to methods where the device holds no individual credentials (scan services that choose the destination based on user authentication, device authentication with certificates)."
    references:
      "1":
        title: "NIST SP 800-53 Rev.5 - Security and Privacy Controls for Information Systems and Organizations (IA-5 Authenticator Management / AC-6 Least Privilege)"
      "2":
        title: "MITRE ATT&CK T1552 - Unsecured Credentials (theft of the sending credentials stored on the device)"
