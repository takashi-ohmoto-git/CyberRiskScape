# English overlay for `data/threat-library/identity.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`
#     (docs/threat-schema.md §7.5).
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. Keep a genuinely Japanese document title as
#     its original title and add an English gloss; `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  identity-directory-sync-privileged-bridge-001:
    category: "Elevation of Privilege"
    name: "Cross-boundary privilege of the directory synchronization account (on-premises compromise reaching the cloud tenant)"
    description: "The directory_sync path from {{sourceName}} to {{targetName}} is made possible by a synchronization account (the sync agent's service account) that holds standing high privilege over the directories on both sides. An attacker only has to compromise a single host running the sync agent to obtain the synchronization credential resident on it and reach the tenant on the {{targetName}} side as a legitimate account, carrying on-premises privilege straight across (Can). Synchronization accounts are commonly left permanently enabled outside business hours and exempted from multi-factor authentication, and their operations are hard to distinguish from a directory administrator's legitimate work. If, on the other hand, the sync agent is isolated and operated as a Tier 0 asset (on par with a domain controller), the synchronization account's privilege is narrowed to reading and writing only the attributes synchronization requires, and administrator roles are barred from it, a compromise of the sync host does not translate directly into tenant-wide administrative privilege (Cannot). The blast radius is every account in the {{targetName}} tenant plus every service that tenant provides authentication for."
    mitigation: "[Foundation] Treat the host running the sync agent as a Tier 0 asset and do not co-locate it with general-purpose servers or administrative workstations. Do not grant administrator roles to the synchronization account; scope it to least privilege over the attributes in synchronization scope. [Enterprise] Stop storing the synchronization account's credential statically on the agent host, moving to managed identity or certificate-based authentication with regular rotation and restrictions on where it may be used (source IP, device certificate). Continuously monitor administrative operations performed by the synchronization account in a SIEM, and alert on any API call outside synchronization itself. [Advanced] Separate synchronization privilege by direction (make read-only one-way synchronization the default and route writeback through a separate account and a separate approval path), and make export off the sync host impossible with hardware-bound (TPM/HSM) credentials."
    references:
      "0":
        title: "MITRE ATT&CK T1078.004 - Valid Accounts: Cloud Accounts (abuse of legitimate accounts, including synchronization service accounts)"
      "1":
        title: "NIST SP 800-207 - Zero Trust Architecture (protecting the policy decision point and its management plane)"

  identity-directory-sync-object-tampering-001:
    category: "Tampering"
    name: "Account takeover through tampering with synchronized objects and attribute injection"
    description: "On a path from {{sourceName}} to {{targetName}} explicitly marked as directory_sync, the sending side's directory objects (users, groups, attributes) are reflected on the receiving side as authoritative values as-is. If an attacker gains a position from which they can rewrite an ordinary user's attributes on the sending side, delegated administrative rights over an OU, help-desk privilege, or a man-in-the-middle position on the synchronization path, they can match an identifier attribute to an existing privileged account so as to induce a soft match, or inject membership of a privileged group, and thereby stand up an account on the {{targetName}} side holding privilege it could never legitimately have (Can). Because the change is applied as ordinary synchronization processing, the receiving side's audit log records nothing more than a normal update by sync. If, on the other hand, the OUs, attributes, and groups in scope are limited by an allow-list, privileged group membership is excluded from synchronization and managed independently on the receiving side, and changes to identifier attributes require approval, limited write access on the sending side is not converted into privilege escalation on the receiving side (Cannot). The blast radius is every access right tied to the synchronized objects on the {{targetName}} side."
    mitigation: "[Foundation] Declare the OUs, attributes, and groups in synchronization scope explicitly with an allow-list rather than using the default full-directory synchronization. Exclude privileged group membership from synchronization and manage it independently on the receiving side. [Enterprise] Require an approval workflow for changes to identifier attributes (UPN, mail address, immutable ID) and detect those change events in a SIEM. Disable soft match and permit only strict correlation by immutable ID (hard match). [Advanced] Combine anomaly detection on the synchronization delta (bulk attribute changes in a short window, additions to privileged groups) with automatic quarantine, holding changes before they are applied. Sign synchronized objects and verify the signature on the receiving side."
    references:
      "0":
        title: "MITRE ATT&CK T1098 - Account Manipulation (privilege acquisition and persistence through tampering with account attributes)"
      "1":
        title: "NIST SP 800-63B - Digital Identity Guidelines (integrity of identity binding)"

  identity-directory-sync-overscoped-corpus-001:
    category: "Information Disclosure"
    name: "Replication of the identity corpus outside the trust boundary through an over-scoped synchronization"
    description: "The directory_sync from {{sourceName}} to {{targetName}} crosses a trust boundary, so the contents of the internal directory, every user's name, mail address, department, job title, and group membership, and depending on the configuration their password hashes, are replicated outside the boundary and held there permanently. In a default configuration that does not narrow the synchronization scope, departments that never use the cloud service, accounts already slated for departure, and privileged administrator accounts all fall in scope as well, so an attacker who compromises the {{targetName}} side, or merely obtains a single low-privilege account with read access to that tenant, can take the organization's entire headcount and privilege structure in one go and use it to design targeted phishing and privilege-escalation paths (Can). If, on the other hand, the scope is limited to the OUs and attributes that actually use the cloud service in question, privileged accounts are excluded from synchronization and issued independently on the cloud side, and directory-read API privilege is narrowed to what the business requires, the information placed outside the boundary shrinks until it matches the damage a compromise could actually cause (Cannot). The blast radius is the attribute data of every account in synchronization scope, together with the organizational structure it reveals."
    mitigation: "[Foundation] Limit the synchronization scope to the OUs and attributes that use the cloud service in question, and retire the default full-directory synchronization. Exclude privileged administrator accounts from synchronization and issue them independently on the cloud side. [Enterprise] Apply attribute-level filtering so that attributes the business does not need (extension numbers, addresses, custom attributes) are never sent. Minimize the receiving tenant's directory-read privilege (the enumerate-all-users API) and audit its use. [Advanced] Retire password hash synchronization in favor of federated or certificate-based authentication so that authentication material itself is never replicated outside the boundary. Review the synchronization scope on a regular schedule and detect drift from it."
    references:
      "0":
        title: "CISA - Zero Trust Maturity Model v2 (Identity pillar: the governed extent of the identity store)"
      "1":
        title: "NIST SP 800-207 - Zero Trust Architecture (where data resides and minimizing its exposure)"

  identity-idp-federation-trust-tampering-001:
    category: "Spoofing"
    name: "Tampering with federation trust (adding a rogue issuer or domain)"
    description: "An attacker who reaches the management plane of {{nodeName}} can add an issuer they control, a federated domain, an external IdP, or an additional signing certificate, to the configuration as a trusted issuer without stealing a signing key at all (Can). From then on, tokens signed with the attacker's own key are accepted as legitimate assertions, so impersonation of any user becomes permanently available, and neither a password change, nor MFA re-enrollment, nor session revocation for the affected user has any effect. The configuration change is a single small administrative operation, and it surfaces in the authentication log as nothing more than a normal sign-in, which makes it hard to detect. If, on the other hand, adding a federation configuration, a trusted domain, or a signing certificate is an operation that requires approval through privileged access management (PAM), and the configuration is continuously monitored against a baseline with alerting on any drift, the addition cannot be made without approval, and if it is made it is detected immediately (Cannot). The blast radius is every service and every account that depends on {{nodeName}} for authentication, as large as the model gets."
    mitigation: "[Foundation] Enumerate and minimize the roles that can change federation configuration, trusted domains, and signing certificates, and require phishing-resistant MFA for everyone holding such a role. Preserve configuration-change events in audit logs. [Enterprise] Make configuration changes subject to time-bound elevation plus two-person approval through privileged access management (PAM), and continuously monitor the list of trusted domains and issuers against a baseline with alerting on any drift. [Advanced] Manage the federation configuration declaratively as IaC, detecting drift and reverting it automatically. Replicate issuer additions to independent evidence outside the tenant (a tamper-resistant log) so they remain verifiable even when the tenant itself is compromised."
    references:
      "1":
        title: "NIST SP 800-207 - Zero Trust Architecture (protecting the configuration of the policy decision point)"

  identity-idp-authentication-log-gap-001:
    category: "Repudiation"
    name: "Missing recording and preservation of authentication events"
    description: "{{nodeName}} is the single source of evidence for authentication across every service beneath it. If sign-in logs, MFA decision results, and configuration-change history are not recorded there, are overwritten after a short period, or exist only somewhere that {{nodeName}}'s own administrative privilege can delete, an attacker can erase or dilute the traces of their own authentication activity after a compromise, making it impossible to establish after the fact who authenticated, when, and over which path (Can). Each service's application log records nothing more than an authenticated user, so once the IdP's evidence is lost, neither the origin, nor the extent, nor the duration of the compromise can be proven, and incident response draws the containment boundary either far too wide or far too narrow. If, on the other hand, authentication and configuration-change events are forwarded the moment they occur to an external logging platform beyond the reach of {{nodeName}}'s administrative privilege, with tamper-resistant storage (WORM or append-only) and a defined retention period, evidence survives a compromise of the IdP and after-the-fact investigation still works (Cannot). The blast radius is the traceability of authentication events across every service that depends on {{nodeName}}."
    mitigation: "[Foundation] Enable recording of sign-ins, MFA decision results, and administrative configuration changes, and set a retention period that incident response can work with (90 days at minimum, or the prescribed period where regulation applies). [Enterprise] Forward logs the moment they occur to an external SIEM or logging platform beyond the reach of IdP administrator privilege, with tamper-resistant storage (WORM or append-only). Alert on any stoppage or gap in that forwarding itself. [Advanced] Preserve authentication events and service-side access logs so the two can be correlated through a shared correlation ID, and detect gaps in the evidence automatically. Attach cryptographic integrity proofs (hash chains) to long-term retention."
    references:
      "0":
        title: "NIST SP 800-63B - Digital Identity Guidelines (requirements for recording authentication events)"
      "1":
        title: "CISA - Zero Trust Maturity Model v2 (Visibility and Analytics: aggregating authentication telemetry)"

  identity-hybrid-idp-onprem-cloud-coupling-001:
    category: "Elevation of Privilege"
    name: "Trust coupling in a hybrid identity platform (an on-premises compromise reaching the cloud tenant directly)"
    description: "{{nodeName}} is declared as kind Hybrid, an on-premises directory and a cloud IDaaS synchronized so that they function as a single identity platform. In that arrangement no authentication trust boundary exists between the two sides, and an authentication result established on the on-premises side is accepted on the cloud side as authoritative proof of identity as-is. An attacker who compromises a single asset that performs authentication on premises (a domain controller, a federation server, or a host running a pass-through authentication or seamless SSO agent) can intervene in the authentication process itself and sign in to the cloud tenant as any user without knowing a password (Can). This path completes before the cloud side's MFA and Conditional Access are ever evaluated, so hardening the cloud side alone cannot cut it off. The coupling works in the other direction too: an attacker who obtains a tenant administrator role in the cloud can return to the on-premises side through the synchronization and management agents. If, on the other hand, on-premises Tier 0 assets are separated from administrative workstations, cloud privileged roles are held by cloud-only accounts excluded from on-premises synchronization (with phishing-resistant MFA required), and no cloud privilege is placed on the hosts that perform authentication, the compromise of a single on-premises machine does not chain into tenant administrative privilege (Cannot). The blast radius is every account and every service on both the on-premises and the cloud side for which {{nodeName}} provides authentication."
    mitigation: "[Foundation] Enumerate the on-premises hosts that perform authentication (domain controllers, federation servers, synchronization and authentication agents) as Tier 0 assets, and do not co-locate them with general-purpose servers or day-to-day workstations. Hold cloud privileged roles in dedicated accounts excluded from on-premises synchronization, and require phishing-resistant MFA for them. [Enterprise] Move to authentication that does not depend on assertions issued on premises (authentication that completes on the cloud side, plus Conditional Access), and bring changes to federation certificates and to authentication agent configuration under SIEM monitoring. Issue the emergency break-glass account on the cloud side only and store it offline. [Advanced] Retire the on-premises authentication path so the cloud side becomes the single authority and on-premises is treated as a resource beneath it. Permit privileged operations only from a dedicated administrative environment (PAW) with hardware-bound credentials, so that no path from on-premises credentials to cloud privilege exists at all."
    references:
      "0":
        title: "MITRE ATT&CK T1556.007 - Modify Authentication Process: Hybrid Identity (bypassing cloud authentication by intervening in the on-premises authentication process)"
      "1":
        title: "NIST SP 800-207 - Zero Trust Architecture (separating trust boundaries from the policy decision point)"

  identity-local-credential-outside-idp-001:
    category: "Spoofing"
    name: "Local credentials that bypass the central IdP"
    description: "No credential issuer is declared for authentication from {{sourceName}} to {{targetName}}. In the model this means a local credential that bypasses the central IdP, an account {{targetName}} holds on its own, so deprovisioning tied to HR events such as departure or the end of an engagement does not apply, neither Conditional Access nor a password policy can be enforced across the board, and session revocation from a single place has no effect. An attacker can obtain an account on this path as an abandoned account left behind by a departed employee or a finished engagement, or through reuse of a password leaked elsewhere, and log in legitimately to {{targetName}} in a way that never appears in the IdP's authentication log (Can). Even where the authentication strength is MFA, as long as the party that enables and revokes that MFA sits on the {{targetName}} side, the organization's only means of cutting access off is an individual request to each system. The result is that the organization cannot learn who is able to log in to this system from an IdP review, and neither detection of a compromise nor after-the-fact investigation works. If, on the other hand, authentication on this path is consolidated onto credentials issued by the central IdP (SSO / federation) and the issuer is declared both in the diagram and in the real configuration, bulk deprovisioning at departure, Conditional Access, and aggregated sign-in logs all apply directly (Cannot). The blast radius is the privilege that account holds on {{targetName}}, plus any other system where the same password is reused."
    mitigation: "[Foundation] Identify the paths that authenticate with local accounts, and declare the IdP that should be their issuer both in the diagram and in the real configuration. Document the deprovisioning procedure for departures and for the end of an engagement system by system, and review accounts on a regular schedule. [Enterprise] Migrate the path to SSO / federation with the central IdP and tie the account lifecycle to HR events (automatic provisioning and deprovisioning through SCIM or similar). Disable local logins that bypass the IdP on the target system itself. [Advanced] Do not let local credentials exist in the configuration at all, leaving only an offline-stored emergency break-glass account as the exception. Standardize authentication on phishing-resistant, hardware-bound factors, and propagate revocation immediately with continuous access evaluation (CAEP / Shared Signals)."
    references:
      "0":
        title: "MITRE ATT&CK T1078.003 - Valid Accounts: Local Accounts (abuse of system-specific local accounts)"
      "1":
        title: "CISA - Zero Trust Maturity Model v2 (Identity pillar: consolidating and centrally managing identity stores)"

  identity-social-idp-assurance-gap-001:
    category: "Spoofing"
    name: "Dependence on a social identity for authentication (no assurance level, no means of revocation)"
    description: "{{nodeName}} is declared as kind Social, an external consumer identity provider. In this kind there is effectively no identity proofing at account creation, and whether MFA is required, what authenticators are used, how long a session lives, and how it is revoked are all the provider's settings, which the organization depending on them can neither require nor enforce. If an attacker takes over a target user's social account, through phishing, password reuse, or abuse of the provider's own account-recovery channel, the consequence is that they can enter every service that trusts {{nodeName}} as that person (Can). Where account linking is keyed on the mail address, pre-hijacking also succeeds, the attacker creating an account under that address before the target registers, as does takeover through a later change of address. The organization holds neither authentication logs nor any means of revocation, and organizational events such as departure or the end of a contract have no effect whatsoever on the validity of the external account. If, on the other hand, acceptance of a social identity is limited to uses where low assurance suffices (public-facing browsing, inquiry forms, and the like), and privileged operations, employee access, and reaching sensitive data separately require credentials the organization itself issues and can revoke, takeover of an external account does not reach the organization's assets (Cannot). The blast radius is the privilege that account holds across every service that accepts {{nodeName}} as its basis for authentication."
    mitigation: "[Foundation] Explicitly limit the uses for which a social identity is accepted, and do not use one for privileged operations, employee access, or access to sensitive data. Retire implicit account linking by mail address, and require an explicit action with proof of ownership for linking. [Enterprise] Require step-up re-authentication with credentials the organization issues and can revoke immediately before an important operation, using the external identity for identification only and never as the basis for authorization. Keep sessions tied to an external identity short-lived, and run your own session management that the organization can revoke. [Advanced] Define the assurance level each use requires (identity proofing, authenticator strength) and refuse external identities that do not meet it. Require phishing-resistant, hardware-bound factors for access to organizational assets, so that takeover of an external account alone cannot reach them."
    references:
      "0":
        title: "NIST SP 800-63A - Digital Identity Guidelines: Enrollment and Identity Proofing (the identity assurance level (IAL) framework)"
      "1":
        title: "CISA - Zero Trust Maturity Model v2 (Identity pillar: governing authentication and identity stores)"

  identity-directory-kerberos-offline-cracking-001:
    category: "Information Disclosure"
    name: "Offline cracking of tickets the directory issues (Kerberoasting / AS-REP roasting)"
    description: "By the design of Kerberos, a single authenticated ordinary account is enough to request from {{nodeName}} a ticket addressed to any service account that carries a service identifier (SPN), and that ticket comes back to the requester encrypted with a key derived from the service account's password. An attacker who obtains one low-privilege account can therefore collect this ciphertext without escalating privilege or compromising anything further, and run a dictionary or brute-force attack against it offline, never once talking to {{nodeName}} (Can). Where an account has pre-authentication disabled, the same class of ciphertext can be obtained merely by enumerating account names, without authenticating at all (AS-REP roasting). The cracking leaves no trace in the logs of {{nodeName}} or in failed-logon counts and never triggers account lockout, so a defense built on limiting the number of attempts cannot work here at all. Service accounts are particularly exposed: their passwords are chosen by a person, left unchanged for long periods, and often granted high privilege for operational convenience. If, on the other hand, service accounts are moved to managed service accounts (gMSA and the like) whose passwords are generated and rotated automatically, weak encryption types such as RC4 are disabled in favor of AES only, and disabling pre-authentication is barred by configuration, deriving the original password from the returned ciphertext is not computationally feasible in the first place (Cannot). The blast radius is the privilege held by the cracked service account, and the whole domain if that account belongs to a privileged group."
    mitigation: "[Foundation] Inventory the accounts that carry an SPN and those with pre-authentication disabled, and remove every SPN and every pre-authentication exemption that is not needed. Give the service accounts that remain long random passwords and take them out of privileged groups. [Enterprise] Move service accounts to automatically generated and rotated forms such as gMSA, disable RC4 and permit AES only. Detect anomalous ticket requests for SPN-bearing accounts in a SIEM (large volumes in a short window, requests specifying a weak encryption type). [Advanced] Do not let service accounts with human-managed passwords exist at all. Move service-to-service authentication to certificates or managed identities, and protect privileged accounts with authentication policies that bind them to permitted source hosts and forbid delegation."
    references:
      "0":
        title: "MITRE ATT&CK T1558.003 - Steal or Forge Kerberos Tickets: Kerberoasting (offline cracking of SPN-addressed tickets)"
      "1":
        title: "MITRE ATT&CK T1558.004 - Steal or Forge Kerberos Tickets: AS-REP Roasting (abuse of accounts with pre-authentication disabled)"

  identity-directory-replication-credential-dump-001:
    category: "Elevation of Privilege"
    name: "Bulk extraction of the credential corpus by abusing directory replication rights"
    description: "{{nodeName}} holds the password material for every account beneath it (current and historical hashes, Kerberos keys) and exposes an interface for replicating that material between directory servers. The rights replication requires are properly needed only by the directory servers themselves, yet they tend to linger on accounts delegated for operational convenience, on service accounts granted during a past product deployment, and on ACLs that inherited the right unintentionally. An attacker who takes over any one of these can pull the credentials of every account in a single operation using nothing but a legitimate protocol request, without ever logging on to a directory server, planting malware, or touching the directory database file on disk (Can). The extracted material includes the key of the ticket-granting account (krbtgt), so from that point on the attacker can forge tickets outside {{nodeName}} asserting any user and any group membership, and the privilege survives a password reset of every user unless that key is also revoked twice in the prescribed sequence. If, instead, the subjects holding replication rights are restricted to the directory servers and explicitly approved exceptions with the ACL kept under continuous audit, privileged accounts are bound to their permitted source hosts, and replication requests from anything other than a directory server are blocked at the network and detected in the audit log, the compromise of a single account does not convert into possession of the whole corpus (Cannot). The blast radius is every account {{nodeName}} authenticates plus every system those credentials are good for, which is as large as this model gets."
    mitigation: "[Foundation] Enumerate the subjects that hold replication-related rights and strip them from everything other than the directory servers and approved exceptions. Minimize standing membership of privileged groups, and document the procedure for revoking the ticket-granting account (krbtgt) key. [Enterprise] Monitor where replication requests originate and raise an immediate SIEM alert on any request that does not come from a directory server. Restrict privileged accounts to time-bound elevation through privileged access management (PAM), usable only from dedicated administrative workstations. Detect changes to the rights ACL as configuration drift. [Advanced] Separate the administrative tier (Tier 0) at both the network and the authentication layer, and allow administrative access to directory servers only from hardware-bound credentials in a dedicated environment. Build periodic double rotation of the ticket-granting account key into operations so that a forged ticket has a structurally limited lifetime."
    references:
      "0":
        title: "MITRE ATT&CK T1003.006 - OS Credential Dumping: DCSync (credential extraction over the replication protocol)"
      "1":
        title: "MITRE ATT&CK T1558.001 - Steal or Forge Kerberos Tickets: Golden Ticket (forgery using the ticket-granting account key)"

  identity-directory-policy-object-tampering-001:
    category: "Tampering"
    name: "Lateral movement and persistence through tampering with distributed directory policy"
    description: "{{nodeName}} is not only where users and entitlements are stored; it is also the distribution point for the configuration policy that joined hosts fetch and apply automatically at boot and at logon (group policy, logon scripts, scheduled tasks, software distribution). The right to edit a policy object is commonly delegated to a help desk or an operations team per organizational unit or per department and is treated organizationally as permission to change settings, when in substance it is permission to execute arbitrary code on every host the policy reaches. An attacker only has to take one delegated junior administrator account, or gain write access to the share where the policy bodies live, to plant a local administrator account, a disabled endpoint defense, or a recurring arbitrary script on every host in scope, achieving lateral movement and persistence at once without distributing malware host by host (Can). Because the change is applied as a legitimate administrative operation, each host records nothing but the normal application of policy. If, on the other hand, the rights to edit and link policy objects are limited to approved subjects, changes are placed under an approval workflow and version control, and drift from the baseline is continuously monitored (a new script, an addition to a privileged group, a relaxed security setting), a narrow delegated editing right does not convert into code execution across every host (Cannot). The blast radius is every host the policy applies to, plus every credential used on those hosts."
    mitigation: "[Foundation] Enumerate and minimize the subjects holding edit and link rights on policy objects, and state the scope of each delegation per organizational unit. Take inventory of write access to the share where the policy bodies are stored. [Enterprise] Place policy changes under an approval workflow and version control (preserving the before-and-after diff and allowing rollback), and forward change events to a SIEM. Alert individually on high-risk changes: added script execution, additions to privileged groups, and relaxed security settings. [Advanced] Manage critical policy as a declarative baseline with automatic drift detection and restoration. Restrict policy editing to operations performed from a dedicated administrative environment with hardware-bound credentials, so that day-to-day administrative accounts cannot edit it at all."
    references:
      "0":
        title: "MITRE ATT&CK T1484.001 - Domain or Tenant Policy Modification: Group Policy Modification"
      "1":
        title: "CISA - Zero Trust Maturity Model v2 (Identity / Devices pillars: governing configuration and continuous monitoring)"

  identity-directory-kerberos-delegation-abuse-001:
    category: "Spoofing"
    name: "Abuse of Kerberos delegation (impersonating any user)"
    description: "{{nodeName}} provides delegation, which lets a service reach another service on a user's behalf, and whether it is allowed is held as an account attribute in the directory. A host with unconstrained delegation enabled retains in memory a reusable ticket for every user who authenticates to it, so an attacker need only compromise that one host and induce an authentication by a privileged account (coerced authentication, a lured file access) to collect the ticket of any user, administrators included, and act as them (Can). Where constrained delegation is in use with protocol transition, an attacker who controls the delegating account can construct a ticket for any user who has not actually authenticated at all, administrators included, and present it to the delegation target; and with resource-based delegation, write access to the target object alone is enough to create the delegation relationship after the fact. Every one of these paths is, as far as {{nodeName}} is concerned, a legitimate Kerberos procedure in which neither the target user's password nor their multi-factor authentication plays any part, so raising authentication strength does not block it. If, on the other hand, the accounts and hosts carrying delegation attributes are inventoried and unconstrained delegation is eliminated entirely, privileged accounts are placed in a configuration that cannot be delegated (marked sensitive, placed in protected groups, covered by authentication policies), and write access to delegation target objects is limited to Tier 0 approving subjects, the compromise of a single host does not widen into impersonation of arbitrary users (Cannot). The blast radius is every service reachable from a host that carries a delegation setting, plus the privilege of every user who authenticates to it."
    mitigation: "[Foundation] Inventory the accounts and hosts carrying delegation attributes (unconstrained, constrained, resource-based) and retire unconstrained delegation. Explicitly mark administrators and other privileged accounts as ineligible for delegation. [Enterprise] Limit the delegation that remains to constrained delegation scoped per use case, and restrict write access to delegation target objects to Tier 0 approving subjects only. Detect changes to delegation attributes, and anomalous ticket requests that use delegation, in a SIEM. [Advanced] Move to an architecture that does not need delegation at all (independent authorization per service, explicit token exchange), and protect privileged accounts with authentication policies binding permitted source hosts and lifetimes, so that no delegation path exists in the first place."
    references:
      "0":
        title: "MITRE ATT&CK T1550.003 - Use Alternate Authentication Material: Pass the Ticket (impersonation using a harvested ticket)"
      "1":
        title: "MITRE ATT&CK T1558 - Steal or Forge Kerberos Tickets (theft and forgery of Kerberos tickets)"
