# English overlay for `data/threat-library/network-infra.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  netinfra-edge-device-exploitation-001:
    category: "Elevation of Privilege"
    name: "Exploitation of known vulnerabilities and management interfaces on internet-exposed edge devices"
    description: "{{targetName}} is an edge device reachable from {{sourceName}}, which sits outside the trust boundary (treated as Internet). Edge devices are permanently exposed so they can accept connections from the internet, and an attacker can take one over by targeting published vulnerabilities (including ones exploitable before authentication), a management interface left open to the internet, or default credentials (Can). A compromised edge device is the legitimate path into the internal network: it can be used to eavesdrop on or tamper with the traffic passing through it, to steal the VPN credentials and certificate private keys it stores, and as a foothold into the internal network. Endpoint detection products often cannot be installed on edge devices, so compromise is hard to notice. On the other hand, if fixes for vulnerabilities known to be exploited (CISA KEV, etc.) are applied within their deadlines, the management interface is reachable only from a management network the internet cannot reach, and no end-of-support devices remain in use, published techniques and intrusion through the management interface do not succeed (Cannot). The blast radius is all traffic passing through {{targetName}} and the entire internal network behind it that trusts {{targetName}}."
    mitigation: "[Foundation] Record edge devices in the asset inventory and track model, firmware version, and end-of-support date. Prioritize fixes for vulnerabilities known to be exploited (CISA KEV, etc.) and apply them within their deadlines, and replace devices that have reached end of support. Disable the management UI and SSH on internet-facing interfaces so they are reachable only from the management network. Change default credentials. [Enterprise] Use MFA for management authentication, and forward management operations and configuration changes to an external logging platform for monitoring. Prepare a procedure for applying interim measures (disabling features, workarounds) until a fix is released. Periodically verify device configuration and integrity (firmware tampering). [Advanced] Minimize the features exposed (turn off unused VPN portals and management APIs) and replace them with ZTNA or similar, reducing the surface reachable from the internet itself. Assuming compromise, prepare procedures to revoke and reissue the credentials and keys held by edge devices."
    references:
      "0":
        title: "CISA - Known Exploited Vulnerabilities Catalog (prioritized remediation of exploited vulnerabilities)"
      "1":
        title: "NIST SP 800-41 Rev.1 - Guidelines on Firewalls and Firewall Policy (management and operation of edge devices)"
      "2":
        title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs (operating and managing VPN gateways)"
    conditions:
      - description: "{{targetName}} is a bastion reachable from {{sourceName}}, which sits outside the trust boundary (treated as Internet). Because a bastion is the entrance to the management path for the servers behind it, an attacker can exploit known vulnerabilities in the exposed SSH / RDP / web console, or brute-force passwords and try leaked credentials, and if successful reach internal servers as an administrator (Can). On a self-built bastion server, applying fixes to the OS and remote-access software is the user's responsibility. On a managed bastion the provider applies fixes, but the strength of authentication and the narrowing of reachable servers depend on the user's configuration. On the other hand, if connections to the bastion are placed behind IdP authentication (phishing-resistant MFA) or ZTNA so it is not directly reachable from the internet, or a connection method with no inbound ports (outbound connections from an agent) is used, and fixes for a self-built bastion are applied within their deadlines, brute-forcing the exposed surface and known techniques do not succeed (Cannot). The blast radius is every server reachable from {{targetName}} and its administrator privileges."

  netinfra-tls-inspection-ca-key-compromise-001:
    category: "Spoofing"
    name: "Man-in-the-middle through compromise of the TLS inspection CA key"
    description: "{{nodeName}} decrypts and inspects users' outbound TLS and re-signs certificates with the organization's CA. Because users' devices are configured to trust this CA, if the CA private key is stolen from {{nodeName}}, an attacker can forge a certificate for any site and perform a man-in-the-middle attack without warnings even on other paths the same devices use (such as Wi-Fi outside the office) (Can). {{nodeName}} itself also becomes an aggregation point handling all traffic in plaintext, so its compromise leaks all inspected traffic (credentials and business data). With a configuration that does not strictly verify upstream server certificates, users cannot notice a fake server. On the other hand, if the CA private key is kept in an HSM so it cannot be extracted, a subordinate CA restricted to inspection (name constraints, short validity) is used, and upstream certificate verification is enabled, the key itself cannot be carried off even if the device is compromised, and the scope and duration of any forgery are limited (Cannot). The blast radius is the TLS traffic of every device that trusts the CA."
    mitigation: "[Foundation] Use a subordinate CA dedicated to inspection for re-signing, and do not place the organization's root CA key on the inspection device. Enable upstream server certificate verification and block traffic that fails verification. Define destinations that are not decrypted (healthcare, finance, authentication, etc.) and exclude them. [Enterprise] Keep the re-signing CA private key in an HSM (FIPS 140-3 validated) and use it in a non-extractable form. Set name constraints and a short validity period on the subordinate CA and renew it regularly. Monitor management operations on the inspection device through audit logs. [Advanced] Prepare and rehearse a procedure to revoke the CA and replace devices' trust stores quickly. Move to inspection devices that support TLS 1.3 and post-quantum key exchange, so inspection does not force a fallback to older cryptography."
    conditions:
      - description: "{{nodeName}} connects devices to a PoP through a tunnel, and at the PoP decrypts and inspects TLS before reconnecting outward. The PoP is operated by the SASE / SSE provider, so the traffic of every site and every device becomes plaintext on the provider's infrastructure. If the re-signing CA private key is stolen on the provider's side, or the provider's operators or management console are abused, an attacker can forge a certificate for any site against devices that trust the CA and read all inspected traffic (Can). On the other hand, if a model is chosen where the re-signing CA key is held in the organization's own HSM or key management (BYOK, etc.), the inspection-only subordinate CA has name constraints and a short validity period, and the provider's management console is protected with MFA and audit logs, the key cannot be carried off even if the provider is compromised, and the scope and duration of any forgery are limited (Cannot). The blast radius is the TLS traffic of every site and device that goes through {{nodeName}}."
    references:
      "0":
        title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations (TLS certificate verification)"
      "1":
        title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management (protection and validity period of CA keys)"

  netinfra-cdn-third-party-tls-termination-001:
    category: "Information Disclosure"
    name: "Third-party TLS termination by a CDN and bypass to the origin"
    description: "{{nodeName}} terminates users' TLS at the edge and reconnects to the origin over a separate TLS session. This means the server certificate's private key (or an equivalent key) is entrusted to the CDN provider, and user traffic becomes plaintext once at the edge. If the CDN provider's infrastructure or management account is compromised, an attacker can impersonate the site with the entrusted key or read traffic passing through the edge (login credentials, personal data) (Can). In addition, if the origin is directly reachable from the internet, an attacker can bypass the CDN and attack the origin directly, so the CDN's WAF and DDoS protection do not apply. With a configuration where the edge-to-origin segment is unencrypted or certificates are not verified, that segment can be eavesdropped on or tampered with. On the other hand, if a model where the CDN provider does not hold the key is used (keyless approaches that keep the key on the server side, or a certificate issued only for the CDN), connections to the origin are limited to traffic from the CDN (mutual TLS, source restriction), and the edge-to-origin segment also uses TLS with certificate verification, abuse of the entrusted key and bypass do not succeed (Cannot). The blast radius is the traffic of all users going through {{nodeName}} and the domains for which the entrusted certificate is valid."
    mitigation: "[Foundation] Use TLS between the edge and the origin, configured to verify the origin's certificate. Limit connections to the origin to traffic from the CDN. Use MFA on the CDN management account. [Enterprise] Issue a certificate dedicated to the CDN and do not share keys with the origin or other services. Use mutual TLS for connections to the origin, cryptographically rejecting connections from anything other than the CDN. Monitor CDN configuration changes through audit logs. [Advanced] Use a model that does not hand the private key to the CDN provider (keyless approaches, signing in the organization's own HSM). Encrypt sensitive data that must not become plaintext even at the edge at the application layer before sending it."
    references:
      "0":
        title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations (TLS termination and certificate verification)"
      "1":
        title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management (protecting private keys and limiting their sharing)"

  netinfra-smtp-starttls-downgrade-001:
    category: "Information Disclosure"
    name: "Mail eavesdropping through STARTTLS downgrade"
    description: "Mail relayed between {{sourceName}} and {{targetName}} is encrypted with STARTTLS, but STARTTLS is an opportunistic scheme that encrypts only if the peer supports it, and in many cases does not verify certificates. An attacker on the path can strip the STARTTLS offer to force plaintext, or relay with a fake certificate, and read and modify message bodies, attachments, and password-reset links (Can). If the DNS MX record is spoofed, the mail itself can be redirected to the attacker's server. On the other hand, if MTA-STS or DANE is used to declare and enforce that mail to this destination is sent only over TLS with a verified certificate, and failures are monitored with TLS-RPT, downgrades and relaying with a fake certificate stop as delivery failures (Cannot). If the body is encrypted with S/MIME or similar, it cannot be read even if the relay segment is broken. The blast radius is all mail relayed between {{sourceName}} and {{targetName}}."
    mitigation: "[Foundation] As a receiver, publish an MTA-STS policy; as a sender, deliver according to the peer's MTA-STS policy. Collect TLS failures during delivery with TLS-RPT. [Enterprise] Deploy DNSSEC and publish DANE (TLSA records), and verify certificates when delivering to peers that support DANE. Configure mandatory TLS with important business partners. [Advanced] Encrypt highly sensitive mail bodies with S/MIME or similar, so confidentiality does not depend on the encryption of the relay segment."

  netinfra-l2-spoofing-001:
    category: "Spoofing"
    name: "Layer 2 spoofing (ARP spoofing, VLAN hopping, MAC flooding)"
    description: "An attacker who gets onto the same segment connected to {{nodeName}} (a compromised endpoint, a device plugged into an unused wall jack, etc.) can forge ARP replies to impersonate the gateway or other hosts, flood the MAC address table so traffic is sent to every port, or use trunk auto-negotiation or double tagging to get into another VLAN, and thereby eavesdrop on and tamper with traffic on the segment and move laterally (Can). Layer 2 does not verify the sender, so hosts on a segment implicitly trust each other. On the other hand, if devices connecting to ports are authenticated with 802.1X, DHCP snooping, dynamic ARP inspection, and port security are enabled, and trunk auto-negotiation is turned off, unauthenticated devices cannot connect and spoofed replies are discarded (Cannot). If traffic is encrypted with TLS or MACsec, its contents cannot be read even if it is captured. The blast radius is every host in the VLANs {{nodeName}} serves and their traffic."
    mitigation: "[Foundation] Disable unused ports and turn off trunk auto-negotiation on access ports. Set the native VLAN to an unused VLAN. Limit the number of MAC addresses per port with port security. [Enterprise] Authenticate devices connecting to ports with 802.1X, and enable DHCP snooping and dynamic ARP inspection. Split important segments by purpose and control traffic between segments with a firewall. [Advanced] Encrypt switch-to-switch and server links with MACsec. Make all application traffic mutually authenticated TLS so nothing depends on trust at layer 2."
    references:
      "0":
        title: "IEEE 802.1X - Port-Based Network Access Control (authenticating devices connected to ports)"
      "1":
        title: "IEEE 802.1AE - Media Access Control (MAC) Security (link encryption with MACsec)"

  netinfra-wireless-rogue-ap-001:
    category: "Spoofing"
    name: "Rogue access points (Evil Twin) and weak wireless encryption"
    description: "The radio signal of {{nodeName}} reaches beyond the building, so an attacker can target the wireless segment without physical entry. By setting up a fake access point advertising the same SSID (Evil Twin), the attacker can get devices to connect, relay and eavesdrop on their traffic, or have users enter credentials into a fake login page (Can). With WPA2 pre-shared keys (PSK), the handshake can be recorded and the key brute-forced, and anyone who knows the key can decrypt other people's traffic on the same network. Even with WPA2-Enterprise, if devices do not verify the authentication server's certificate, credentials can be stolen by a fake access point. Access points installed by employees without approval become an entrance inside the boundary. On the other hand, if connections are authenticated with WPA3-Enterprise or EAP-TLS (device certificates), devices are forced to verify the authentication server's certificate and server name, and rogue access points are detected with a wireless IDS, authentication does not succeed against a fake access point and brute-forcing a pre-shared key is meaningless (Cannot). The blast radius is every device connecting to {{nodeName}} and the business network beyond it."
    mitigation: "[Foundation] Do not use WEP or WPA (TKIP); use WPA2 or later (preferably WPA3). Do not use pre-shared keys on business SSIDs; authenticate users or devices with 802.1X (WPA2/WPA3-Enterprise). Separate guest SSIDs from the business network. [Enterprise] Authenticate with device certificates through EAP-TLS, and enforce verification of the authentication server's certificate and server name in device configuration. Detect rogue access points and spoofing of the same SSID with a wireless IDS / IPS. Enable management frame protection (802.11w). [Advanced] Do not trust the wireless segment; decide access to business applications per request with ZTNA and device posture checks."
    references:
      "0":
        title: "NIST SP 800-153 - Guidelines for Securing Wireless Local Area Networks (WLANs) (detecting rogue access points and configuring wireless)"

  netinfra-bastion-privileged-path-concentration-001:
    category: "Elevation of Privilege"
    name: "Concentration of privileged sessions and credentials on a bastion"
    description: "{{nodeName}} is an aggregation point of the management path: it accepts administrators' connections and relays them to target servers over SSH / RDP. Privileged sessions converge on {{nodeName}}, and the credentials used to connect to target servers (SSH private keys, administrator passwords, cloud permissions) are often stored on it as well. An attacker who takes over {{nodeName}} itself, its administrative rights, or a user's credentials can reach every server behind it as an administrator through the legitimate management path, and can watch or hijack privileged sessions in progress (Can). Because the operations go through the legitimate management path, they are hard to distinguish from normal administration. On the other hand, if phishing-resistant MFA through the IdP is required to use {{nodeName}}, target-server credentials are not kept on {{nodeName}} and short-lived credentials (certificates, temporary tokens) are issued for each connection, the servers each user can reach are narrowed, and sessions are recorded and sent to an independent monitoring platform, then even if one account or the bastion is taken over, the attacker cannot reach every server or carry off credentials, and suspicious operations are detected (Cannot). The blast radius is every server reachable from {{nodeName}} and its administrator privileges."
    mitigation: "[Foundation] Require MFA to use the bastion, and narrow the servers and time windows each user can reach. Do not keep target servers' SSH private keys or passwords on the bastion. Keep the bastion's OS and software up to date, and do no work on the bastion other than administration. [Enterprise] Consolidate authentication in the IdP with phishing-resistant MFA, and use short-lived certificates or temporary credentials to connect to target servers. Record privileged sessions and send operation logs to a SIEM for monitoring. Close direct management paths that bypass the bastion (open management ports). [Advanced] Grant no standing reachability; give temporary rights per approved task (just-in-time). Make the bastion disposable (rebuilt per session), or use a managed connection method with no inbound ports, so the bastion itself is not an attack surface."
    references:
      "0":
        title: "NIST SP 800-207 - Zero Trust Architecture (policy enforcement points and least-privilege grants per request)"
      "1":
        title: "NIST SP 800-53 Rev.5 - Security and Privacy Controls for Information Systems and Organizations (AC-17 Remote Access / AC-6 Least Privilege)"

  netinfra-ztna-proxy-access-concentration-001:
    category: "Elevation of Privilege"
    name: "Concentration and bypass of access decisions at a ZTNA / identity-aware proxy"
    description: "{{nodeName}} terminates users' TLS, decides access to internal applications based on the IdP's authentication result and device posture, and relays the traffic. Because the access decision for every application is concentrated in the policy of {{nodeName}} and the IdP it trusts, a policy mistake (an overly broad application scope, a rule that allows everyone, missing device posture checks), a compromise of the IdP or forged tokens, or a compromise of the management console of {{nodeName}} or of the provider lets an attacker reach every application behind it as a legitimate user (Can). Traffic becomes plaintext once at {{nodeName}}, so there is also room for its contents to be read on the provider's infrastructure. In addition, if applications are also reachable through paths other than {{nodeName}} (the internal network, VPN) and trust the user-information headers added by {{nodeName}} without verifying them, an attacker can bypass {{nodeName}}, forge the headers, and impersonate any user. On the other hand, if the users and device posture allowed for each application are defined minimally and changes are reviewed, the management console is protected with MFA and audit logs, connections to applications are limited to the path from {{nodeName}}, and applications also verify the signed user information (signed headers, JWT) added by {{nodeName}}, a single rule mistake does not open every application, and bypasses or forged user information are not accepted (Cannot). The blast radius is every application behind {{nodeName}} and its users' data."
    mitigation: "[Foundation] Specify the users, groups, and device posture allowed for each application, and do not use rules that allow everyone or broad network ranges. Limit management-console administrators to a few people and require MFA. Limit connections to applications to the path from the ZTNA proxy (or its connector), and block direct reachability from the internal network or VPN. [Enterprise] Have applications verify the signature, issuer, and audience of the signed user information (signed headers, JWT) added by the ZTNA proxy, and never trust unsigned headers. Make policy changes require review, and send audit logs to a SIEM. Confirm the impact scope and rollback procedure for an IdP outage or compromise. [Advanced] Manage policy as code and detect and stop overly broad rules in CI. Re-evaluate device posture and risk on every access, and cut the connection mid-session if conditions change. For highly sensitive applications, perform authorization in the application as well, so nothing depends on the proxy's decision alone."
    references:
      "0":
        title: "NIST SP 800-207 - Zero Trust Architecture (policy decision / enforcement points and preventing their bypass)"
      "1":
        title: "Google Cloud - Identity-Aware Proxy: Securing your app with signed headers (verifying user information added by the proxy)"

  netinfra-dedicated-line-unencrypted-001:
    category: "Information Disclosure"
    name: "Eavesdropping on unencrypted segments of a dedicated line / private connection"
    description: "Traffic between {{sourceName}} and {{targetName}} goes through a dedicated line / private connection but is not encrypted. A private connection is separated from the internet, but it passes through the carrier's transmission equipment, relay stations, and the cabling and equipment of colocation facilities, and anyone with physical or logical access to that segment (a compromise of the carrier's equipment, an unauthorized connection inside the facility, a misprovisioned circuit) can read and modify the traffic as is (Can). Business traffic that skipped authentication and encryption on the assumption that a private network is safe (database replication, file transfers, management traffic) flows through it in bulk, so a single tap yields a lot of information. Traffic recorded in plaintext can be read at any time, without waiting for a future quantum computer. On the other hand, if MACsec (IEEE 802.1AE) or IPsec is layered on the circuit, or application traffic uses TLS, the contents cannot be read even if intercepted on the carrier's equipment, and tampering is detected (Cannot). The blast radius is all traffic between {{sourceName}} and {{targetName}} that goes through the dedicated line / private connection."
    mitigation: "[Foundation] Inventory traffic that goes through the dedicated line / private connection, and switch plaintext protocols (database replication, file transfers, management traffic, etc.) to encrypted ones such as TLS. Do not skip authentication or encryption because the network is private. [Enterprise] Layer MACsec (on supporting ports and circuits) or an IPsec VPN on the circuit to encrypt it end to end. Rotate the encryption keys regularly, and configure alerts if the circuit falls back to an unencrypted state. [Advanced] Do not rely on circuit encryption alone; make all application-to-application traffic mutually authenticated TLS as well (layered encryption). Use post-quantum hybrid key exchange for traffic that must stay confidential for a long time."
    references:
      "0":
        title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations (encrypting traffic)"
      "1":
        title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs (encrypting site-to-site circuits)"
      "2":
        title: "IEEE 802.1AE - Media Access Control (MAC) Security (link encryption with MACsec)"
      "3":
        title: "Microsoft Learn - Configure MACsec on ExpressRoute Direct ports (MACsec on private connections)"

  netinfra-private-endpoint-exfiltration-001:
    category: "Information Disclosure"
    name: "Exfiltration to attacker-owned resources through a private endpoint, and fallback to the public path"
    description: "{{nodeName}} is the entry point from a private network to a cloud service, and on the network it is treated as traffic to that kind of service. If no endpoint policy (restricting the destination accounts and resources) is set, a compromised workload or an insider in the private network can write data through {{nodeName}} to storage or similar resources in a separate account owned by the attacker (Can). The traffic stays inside the private network and the destination looks like a legitimate service, so monitoring and allowlists at the internet egress do not stop it. In addition, if private DNS configuration is missing, or is not resolved in some environments (on-premises, etc.), the service name resolves to a public address and traffic goes out over the public path unnoticed, bypassing the controls that assume a private network. On the other hand, if the endpoint policy limits destinations to the organization's own accounts and resources, the service-side policy also denies access other than through {{nodeName}} (data perimeter controls), and private DNS resolution is verified in every environment inside the private network, neither exfiltration to the attacker's resources nor a detour over the public path is possible (Cannot). The blast radius is all data handled by the workloads in the private network that can use {{nodeName}}."
    mitigation: "[Foundation] Set an endpoint policy on each private endpoint and limit destinations to the organization's own accounts and resources. Confirm that service names resolve to private addresses in every environment inside the private network (including name resolution from on-premises). [Enterprise] In the service-side resource policy, allow only access that comes through the private endpoint and from the organization, and disable unneeded public endpoints. Deny writes to resources outside the organization with data perimeter controls (VPC Service Controls, etc.). Monitor operations through the private endpoint with cloud audit logs. [Advanced] Manage data perimeter policies as code and apply them uniformly to every account, and detect and alert on access to resources outside the organization or name resolution to public addresses."
    references:
      "0":
        title: "AWS - Control access to VPC endpoints using endpoint policies (restricting destinations with endpoint policies)"
      "1":
        title: "Microsoft Learn - Azure Private Endpoint DNS configuration (name resolution for private endpoints)"
      "2":
        title: "Google Cloud - VPC Service Controls overview (preventing exfiltration with a data perimeter)"

  netinfra-service-mesh-mtls-not-enforced-001:
    category: "Spoofing"
    name: "Service mesh mTLS not enforced (permissive mode) and the plaintext segment to the sidecar"
    description: "{{nodeName}} makes service-to-service traffic mTLS through each service's sidecar (or a node-level proxy). If it is left in permissive mode (accepting both mTLS and plaintext), which is common during migration, an attacker's workload outside the mesh or a compromised pod outside the mesh can connect to services directly in plaintext and bypass both mutual authentication and authorization based on service identity (Can). The same happens for services where the sidecar was not injected and for paths that do not go through the sidecar (host networking, direct connections to pod IPs). In addition, the segment between the application and its sidecar is usually plaintext, so a compromised container running in the same pod or on the same node, or an attacker with node privileges, can read traffic before it is encrypted. On the other hand, if mTLS is set to strict mode (rejecting plaintext), per-service authorization policies are defined as default-deny, missing sidecar injection is detected, and node privileges and container isolation are maintained, plaintext connections from outside the mesh and connections without a service identity are rejected (Cannot). The blast radius is the services that do not enforce mTLS and the services in the mesh reachable from them."
    mitigation: "[Foundation] Set mTLS to strict mode (rejecting plaintext). Limit permissive mode to the migration period and manage it with a deadline and a defined scope. Identify services without an injected sidecar and paths that do not go through the mesh. [Enterprise] Define per-service authorization policies as default-deny and allow by source service identity. Reject missing sidecar injection and permissive settings with admission control. Minimize node and container privileges, and do not co-locate unnecessary containers in the same pod. [Advanced] Monitor mTLS status and authorization decisions through mesh telemetry, and detect plaintext connections and unexpected sources. For highly sensitive services, have the application itself also authenticate and authorize the caller, so nothing depends solely on the mesh configuration."
    references:
      "0":
        title: "NIST SP 800-204A - Building Secure Microservices-based Applications Using Service-Mesh Architecture (service-to-service mTLS and authorization)"
      "1":
        title: "NIST SP 800-207A - A Zero Trust Architecture Model for Access Control in Cloud-Native Applications in Multi-Location Environments (access control based on service identity)"
      "2":
        title: "Istio - Security concepts (peer authentication modes and authorization policies)"

  netinfra-service-mesh-ca-key-compromise-001:
    category: "Spoofing"
    name: "Service impersonation through compromise of the mesh CA key"
    description: "The control plane of {{nodeName}} has a mesh CA that issues certificates representing service identities (SPIFFE IDs, etc.) to each service's sidecar. If the mesh CA signing key is stolen (reading a key stored in a Kubernetes secret, compromising the control plane, etc.), an attacker can create a certificate for any service, pass mTLS and service-identity-based authorization, and impersonate any service, including payment and authentication services (Can). With control-plane privileges, the attacker can also rewrite authorization policies or change where traffic is routed. On the other hand, if the mesh CA is a subordinate CA under the organization's PKI with its signing key kept non-extractable in a key management service or HSM, workload certificates have short validity periods, and access to the control plane and secrets is limited to a minimal set of administrators and monitored, the key itself cannot be carried off, and the scope and duration of any forgery are limited (Cannot). The blast radius is the identity of every service participating in {{nodeName}} and the authorization based on it."
    mitigation: "[Foundation] Check where the mesh CA signing key is stored, and do not leave a self-signed root CA in a Kubernetes secret as the default. Limit the rights to read the control-plane namespace and secrets to a minimal set of administrators. Shorten the validity period of workload certificates. [Enterprise] Make the mesh CA a subordinate CA under the organization's PKI, and keep its signing key in a key management service or HSM (integration with an external CA). Monitor control-plane configuration changes and access to secrets through audit logs. [Advanced] Prepare and rehearse a procedure to revoke and reissue the mesh CA and replace every workload's certificate quickly. Combine workload identity issuance with node and workload verification (attestation)."
    references:
      "0":
        title: "NIST SP 800-204A - Building Secure Microservices-based Applications Using Service-Mesh Architecture (issuing mesh certificates and protecting keys)"
      "1":
        title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management (protection and validity period of CA keys)"
      "2":
        title: "Istio - Security concepts (identity and certificate management)"
