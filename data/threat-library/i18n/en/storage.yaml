# English overlay for `data/threat-library/storage.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  storage-public-access-misconfiguration-001:
    category: "Information Disclosure"
    name: "Data exposure through storage public-access misconfiguration"
    description: "When a bucket or container in {{nodeName}} is mistakenly configured with a policy or ACL that allows public access (anonymous read or listing) or a long-lived sharing link, an attacker can find {{nodeName}} through automated internet scanning and list and download its files without authentication (Can). Because these settings do not appear in the diagram, storage that was meant to sit behind the application can still be public. Encryption at rest does not help against public access if the storage service decrypts transparently with its own keys. On the other hand, if blocking of public access is enforced at the account or organization level and sharing links and anonymous access are disabled, files cannot be read from outside even if an individual bucket or folder is misconfigured (Cannot). The blast radius is every file stored in {{nodeName}} (which may include personal data, confidential information, source code, and credentials)."
    mitigation: "[Foundation] Enable blocking of public access at the account or organization level (Amazon S3 Block Public Access, disabling anonymous access in Azure, Google Cloud public access prevention, etc.). Enable encryption at rest, and when storing credentials or personal data, encrypt it with keys you control (customer-managed keys). [Enterprise] Continuously detect changes to public settings, sharing links, and access policies with configuration monitoring (CSPM, etc.), and prohibit public settings outright through organization policy (SCPs, Azure Policy, organization policies). Keep content that must be public in dedicated storage and deliver it only through CDN signed URLs. [Advanced] Restrict storage access to private endpoints and traffic from within the VPC, and automatically isolate storage that can be made public according to data classification."

  storage-backup-ransomware-destruction-001:
    category: "Tampering"
    name: "Deletion or encryption of backups by ransomware"
    description: "When {{nodeName}} is managed with the same credentials or the same Active Directory domain as production, or its management console, shared folders, or backup software console can be reached from the production network, an attacker who has broken into production and obtained privileges such as domain administrator can delete or encrypt the generations in {{nodeName}} and shorten their retention before encrypting production, taking away the means of recovery (Can). Ransomware operators are known to target backups first to prevent recovery, and if backups are lost together with production, there is no way to restore operations other than paying the ransom. On the other hand, if backups are managed with credentials and a management domain separate from production (with multi-factor authentication), the management plane cannot be reached from the production network, and an offline or immutable (WORM / object lock) copy exists, every generation cannot be erased even with production administrator privileges (Cannot). The blast radius is the means of recovery for every system that {{nodeName}} protects."
    mitigation: "[Foundation] Separate backup administration accounts from the production domain and credentials, and require multi-factor authentication. Make the backup management plane and storage unreachable from the production network. Keep at least one copy offline or immutable (WORM / object lock), following the 3-2-1 approach. [Enterprise] Require approval by multiple people for deleting backups, changing retention periods, or changing encryption settings, and monitor these operations and bulk deletions with immediate alerts. Replicate backups to a vault in a separate account or tenant. [Advanced] Keep immutable copies in an isolated environment (clean room) managed by a different organization and administrators from production, and automatically scan for malware before restoring."
    references:
      "1":
        title: "CISA - #StopRansomware Guide (offline and immutable backups)"
      "2":
        title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure (separation of administrative privileges)"

  storage-backup-restore-untested-001:
    category: "Denial of Service"
    name: "Unrecoverable systems due to untested restores"
    description: "If restores from {{nodeName}} are not tried regularly, missing targets, corrupted data, lost encryption keys, and gaps in restore procedures or dependencies (identity infrastructure, DNS, licenses, etc.) are only discovered after an outage or ransomware incident, even while backup jobs report success. This is not a threat an attacker causes directly, but when a compromise or outage occurs, systems cannot be recovered or recovery far exceeds the recovery time objective (RTO) (Can). And if ransomware has slipped into the backups during its dwell time, it is unclear how far back to roll. On the other hand, if restores to a production-equivalent environment are performed regularly and the time taken and data integrity after restore are checked, an inability to recover is found in advance and gaps in procedures and keys can be fixed in peacetime (Cannot). The blast radius is every system that relies on {{nodeName}} for recovery."
    mitigation: "[Foundation] For critical systems, regularly test restores to an environment separate from production (at least once a year and whenever changes occur), and record the time taken against the recovery time objective (RTO) and recovery point objective (RPO). Store the encryption keys, credentials, and runbooks needed for restore in a location separate from the backups. [Enterprise] Automate restore testing to verify integrity for each generation, and run end-to-end recovery exercises that include dependent systems such as identity infrastructure and DNS. Scan for malware before restoring so that uncontaminated generations can be identified. [Advanced] Regularly rehearse full recovery into an isolated recovery environment (clean room), and feed the results back into the business continuity plan and the review of recovery objectives."
    references:
      "0":
        title: "NIST SP 800-34 Rev.1 - Contingency Planning Guide for Federal Information Systems (plan testing and exercises)"
      "1":
        title: "CISA - #StopRansomware Guide (testing backup restores)"

  storage-immutable-retention-lock-bypass-001:
    category: "Elevation of Privilege"
    name: "Removal or shortening of retention locks with administrator privileges"
    description: "When the retention lock on {{nodeName}} is set in governance mode (a mode in which users with special permissions can remove or shorten it), the permissions to change retention settings or delete the vault or bucket are concentrated in cloud administrator accounts, the root account, or storage appliance administrators, or generations are automatically deleted after a short retention period expires, an attacker who seizes those permissions can remove or shorten the retention lock and delete the generations, either right away or after waiting for them to expire (Can). On on-premises appliances, an administrator moving the system clock forward to make retention expire early may also work. On the other hand, if the lock is set in compliance mode (a mode in which no one, including root, can remove or shorten it during the retention period: compliance mode of Amazon S3 Object Lock, compliance mode of AWS Backup Vault Lock, locked time-based retention policies in Azure, locked retention policies in Google Cloud Storage, etc.) and the vault is kept in a separate account, generations within the retention period cannot be erased even by seizing production or administrator accounts (Cannot). The blast radius is the means of recovery for every system that {{nodeName}} protects as the last line of defense."
    mitigation: "[Foundation] Inventory the retention lock mode (governance or compliance, and whether it is locked), the retention period, and who holds the permissions to change retention settings. Put the generations that serve as the last line of defense in compliance mode (locked), and do not grant everyday administrators the permission to bypass governance mode. [Enterprise] Keep the immutable vault in an account or tenant separate from production, and restrict the permissions to change retention settings or delete the vault through organization policy. Monitor changes to retention settings, attempts to remove locks, and changes to clock settings, with immediate alerts. Set retention periods with ransomware dwell time in mind. [Advanced] Require approval by multiple people to change retention settings, and on on-premises appliances use a time source that cannot be tampered with (protected NTP, a tamper-resistant clock in the appliance). Keep immutable copies in an isolated environment managed by administrators separate from production."
    references:
      "0":
        title: "Amazon S3 User Guide - Locking objects with Object Lock (governance mode and compliance mode)"

  storage-file-share-ransomware-mass-encryption-001:
    category: "Tampering"
    name: "Bulk encryption of shared folders from an infected device (ransomware)"
    description: "When many users and devices can write broadly to the shared folders of {{nodeName}} (whole departments or all employees have change rights, or the shares are permanently mapped as drives), a single device infected with ransomware or a single stolen user account can encrypt or delete, over the network, every file that user can write to (Can). Seen from the server, the encryption looks like normal file rewrites by a legitimate user, so it is often not stopped even when the server has an endpoint detection product. If the snapshots on the server (previous versions) can be deleted with the server's administrator rights, an attacker who has taken domain administrator rights deletes them too and prevents recovery. On the other hand, if write rights are narrowed to the folders and users the business needs, snapshots that cannot be deleted with user or server administrator rights (immutable snapshots on the storage system, separately managed backups) are taken at short intervals, and a mechanism detects mass rewrites or extension changes within a short time and stops the writes, the damage is limited to what that user can write to and the state before infection can be restored (Cannot). The blast radius is every shared folder the infected device's user can write to, and the snapshot generations that were deleted."
    mitigation: "[Foundation] For each shared folder, check which users and groups can write, and narrow it to what the business needs (remove change rights for all employees or whole departments). Enable snapshots (previous versions) on the server, and keep at least one copy where user or server administrator rights cannot delete it (immutable snapshots on the storage system, offline or immutable backups). [Enterprise] Detect mass rewrites, deletions, and extension changes within a short time from the file server's audit logs, and automatically stop writes from the user or device involved. Separate the administrators of snapshots and backups from business domain administrators. Limit permanently mapping shared folders as drives to the users who need it. [Advanced] For important shared folders, grant write rights to each user only when needed, and accept connections only from devices whose management state and running detection products have been confirmed."
    references:
      "0":
        title: "CISA - #StopRansomware Guide (encryption of network shares, and offline and immutable backups)"
      "2":
        title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure (snapshots and data protection)"

  storage-file-share-permission-overgrant-001:
    category: "Information Disclosure"
    name: "Excessive shared-folder permissions (granted to Everyone or all employees, anonymous access)"
    description: "When the shared folders of {{nodeName}} grant share permissions or file permissions (NTFS, etc.) to groups that include everyone, such as Everyone, Authenticated Users, or Domain Users, broad rights on upper folders are inherited unchanged by lower ones, guest or anonymous access is allowed, or NFS exports are allowed to any client, an attacker who has taken any user account in the organization can read HR, management, and customer information, as well as password lists and configuration files containing credentials kept in the shared folders (Can). Shared folders keep multiplying with the broad rights their creators gave them, administrators often do not know what is open to whom, and after breaking in attackers automatically crawl shared folders looking for sensitive files. On the other hand, if share and file permissions are granted only to business-specific groups, groups that include everyone, guest, and anonymous access are not used, and permission settings are reviewed regularly to fix those that are too broad, compromising one account only exposes that user's own business scope (Cannot). Accounts left behind by departed or transferred staff are asked by the operational status card (account review). The blast radius is every file in shared folders open to everyone."
    mitigation: "[Foundation] For each shared folder, review the share permissions and file permissions, stop granting rights to groups that include everyone such as Everyone, Authenticated Users, and Domain Users, and replace them with business-specific groups. Disable guest and anonymous access, and limit the clients allowed for NFS exports. Do not keep password lists or configuration files containing credentials in shared folders. [Enterprise] Automatically review permission settings regularly (at least every six months), reporting folders open to everyone, rights granted directly to individuals, and inheritance exceptions. Assign an owner (the business owner) to each folder and have the owner approve its permissions. Record access to folders with sensitive information in audit logs. [Advanced] Assign permissions automatically based on data classification, and combine this with sensitive-file detection (DLP) to find and move sensitive files placed in locations open to everyone."
    references:
      "0":
        title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure (storage access control)"

  storage-file-share-legacy-protocol-001:
    category: "Spoofing"
    name: "Relay and impersonation through legacy authentication and protocols (SMBv1, NTLM, unsigned SMB, client-asserted NFS IDs)"
    description: "When {{nodeName}} accepts SMBv1, allows NTLM authentication, does not require SMB signing, or trusts the user ID asserted by the client in NFS (AUTH_SYS), an attacker who has entered the internal network can lure another device into NTLM authentication and relay it to {{nodeName}} (NTLM relay) to read and write shared folders as that user, rewrite the contents of unsigned traffic, or, with NFS, access files under someone else's ID simply by changing the client's settings (Can). SMBv1 also has vulnerabilities of the kind used by worms that spread across networks. On the other hand, if SMBv1 is disabled, SMB signing is required (and encryption for confidential shared folders), NTLM is phased out in favor of Kerberos, and NFS uses Kerberos authentication, relay, impersonation through asserted IDs, and rewriting of traffic do not succeed (Cannot). The blast radius is the shared folders the relayed user can read and write, and files in transit."
    mitigation: "[Foundation] Disable SMBv1, and require SMB signing on both servers and clients. Disable guest access (unauthenticated SMB connections). [Enterprise] Audit NTLM usage and phase it out in favor of Kerberos authentication. Require SMB encryption for confidential shared folders, and use Kerberos authentication for NFS (sec=krb5 / krb5i / krb5p). [Advanced] Limit SMB / NFS connections to the file server to the business device segments and permitted servers (do not open SMB ports to the internet or other sites). Disable NTLM entirely."
    references:
      "0":
        title: "Microsoft Learn - SMB security hardening (SMB signing and encryption, disabling guest access, restricting NTLM)"
      "3":
        title: "IETF RFC 7530 - Network File System (NFS) Version 4 Protocol (RPCSEC_GSS and Kerberos authentication)"
