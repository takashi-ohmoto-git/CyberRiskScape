# English overlay for `data/threat-library/sdv.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  sdv-in-vehicle-message-injection-001:
    category: "Spoofing"
    name: "Injection and spoofing of messages on the in-vehicle network"
    description: "When {{nodeName}} is a bus without sender authentication, such as CAN / CAN-FD / LIN, an attacker who takes over any one of the ECUs, diagnostic ports, or external interfaces attached to the bus can impersonate another ECU and send arbitrary messages with the message IDs used for braking, steering, or body control, and the receiving ECUs process them as legitimate commands (Can). As long as the message content is well-formed, the receiver cannot tell senders apart. On the other hand, if critical messages carry a message authentication code (MAC) and a freshness value, such as SecOC, that the receiver verifies, messages injected from an ECU that does not hold the key are rejected, and replaying recorded messages does not work either (Cannot). Obtaining a foothold for injection separately requires taking over a device on the bus or a physical connection. The blast radius is the functions of every ECU attached to {{nodeName}}, including those involved in driving and braking."
    mitigation: "[Foundation] Inventory the messages carried on the in-vehicle network and identify those involved in driving, braking, door locks, and similar functions. Do not attach external interfaces (TCU, IVI, OBD port) directly to the driving buses; route them through a gateway. [Enterprise] Add message authentication (a MAC and a freshness value) such as SecOC to critical messages and verify it at the receiver. Store the keys in the ECU's HSM / SHE. Deploy intrusion detection (IDS) on the in-vehicle network to detect unexpected senders, periods, and message IDs. [Advanced] Use authentication and encryption such as MACsec on automotive Ethernet segments, and collect detection results in an off-board security monitoring function (VSOC) to correlate them across the fleet."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #11 (attack example 11.1), #6 (attack example 6.1) / mitigations M15, M10 (Table B1)"

  sdv-in-vehicle-bus-flooding-dos-001:
    category: "Denial of Service"
    name: "Denial of service by flooding the in-vehicle network"
    description: "An attacker who takes over a device attached to {{nodeName}} can keep sending high-priority (low-ID) messages at a high rate to monopolize bus arbitration so that other ECUs cannot send their messages. The attacker can also keep sending messages that cause errors in a specific ECU so that it disconnects itself from the bus (bus-off) (Can). When messages involved in driving or braking stop arriving, the receivers degrade or stop their functions. On the other hand, if the gateway limits the rate and IDs of messages coming from external interfaces and the driving buses are separated from the external interfaces, a foothold obtained from outside is not enough to saturate the driving buses. If the receivers are designed to detect missing periodic messages and move to a safe state, the disruption cannot be turned into dangerous behavior (Cannot). The blast radius is the availability of every function that uses {{nodeName}}."
    mitigation: "[Foundation] Separate the driving buses from the buses for external interfaces and infotainment, and restrict the message IDs relayed by the gateway with an allow list. Confirm that receiving ECUs detect missing periodic messages and move to a safe state (fail-safe). [Enterprise] Limit the sending rate per sender at the gateway and zone controllers, and detect abnormal traffic volumes and rising error counts with in-vehicle network intrusion detection (IDS). [Advanced] Send detection results to an off-board security monitoring function (VSOC), correlate them to see whether the same signs appear across the fleet, and follow up with updates."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #24 (attack example 24.1) / mitigation M13 (Table B5)"

  sdv-gateway-network-separation-bypass-001:
    category: "Elevation of Privilege"
    name: "Bypassing in-vehicle network separation through gateway weaknesses"
    description: "{{nodeName}} is connected to external interfaces (TCU, IVI, OBD port, V2X on-board unit, diagnostic tool, EV charger) and acts as the barrier between them and the driving networks. If its relay rules are too broad (forwarding any ID from external interfaces to the driving networks), it forwards diagnostic requests without authentication, or the management functions or vulnerabilities of {{nodeName}} itself can be reached from the external interfaces, an attacker who takes over an external interface can jump the separation and send arbitrary messages onto the driving buses (Can). On the other hand, if {{nodeName}} restricts relaying with allow lists per message ID, direction, and sender, forwards diagnostic requests only within authenticated sessions, and the firmware of {{nodeName}} itself is signature-verified, taking over an external interface alone does not reach the driving networks (Cannot). The blast radius is every network behind {{nodeName}} and every ECU attached to them."
    mitigation: "[Foundation] Define the gateway's relay rules as allow lists by message ID, direction, and sender, and minimize the messages forwarded from external interfaces to the driving networks. Forward diagnostic requests only within authenticated sessions. Close unused ports and services. [Enterprise] Protect the gateway's own firmware with secure boot and signed updates, and authenticate and log operations that change the relay rules. Put each external interface in its own network segment and perform intrusion detection at the gateway. [Advanced] Use per-message or per-stream authentication (MACsec / SecOC) on automotive Ethernet segments so that, even if a message passes the gateway, receivers do not accept messages without the legitimate sender's key."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #29 (attack example 29.2) / mitigation M23 (Table B6)"

  sdv-obd-port-diagnostic-access-abuse-001:
    category: "Tampering"
    name: "Attacks and vehicle parameter tampering through the OBD diagnostic port"
    description: "{{nodeName}} is inside the cabin, and a device plugged into it can send messages directly onto the in-vehicle network. An attacker can plug in a device during a short time in the cabin, or hijack an off-the-shelf dongle the owner plugged in (one connected over cellular, Bluetooth, or Wi-Fi), and use diagnostic requests to rewrite vehicle settings (mileage, control parameters, feature activation, and so on) or inject malicious messages (Can). If the dongle is connected externally, the same can be done remotely without physical proximity. On the other hand, if traffic from {{nodeName}} goes through a gateway and the ECUs refuse writes unless the diagnostic request is authenticated (UDS authentication / security access with per-vehicle keys), a plugged-in device can neither rewrite settings nor send arbitrary messages onto the driving buses (Cannot). The blast radius is the settings and functions of every ECU reachable from {{nodeName}}."
    mitigation: "[Foundation] Do not attach the OBD port directly to the driving buses; route it through a gateway. Restrict diagnostic requests while driving and write-type diagnostic requests. [Enterprise] Allow diagnostic writes and ECU reprogramming only within sessions authenticated with per-vehicle keys (UDS authentication service, certificate-based authentication). Include traffic from the OBD port in intrusion detection to detect unexpected devices and large volumes of diagnostic requests. [Advanced] Tie diagnostic authorization to short-lived authorization tokens issued by the backend (per job and per vehicle), and log changes to settings so that tampering can be detected."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #18 (attack example 18.3), #25 (attack example 25.1) / mitigations M22 (Table B4), M7 (Table B5)"

  sdv-diagnostic-tool-session-abuse-001:
    category: "Elevation of Privilege"
    name: "Unauthorized reprogramming through a compromised diagnostic tool or weak diagnostic session authentication"
    description: "{{nodeName}} connects to vehicles with high privileges that allow ECU reprogramming and writing settings. If diagnostic session authentication relies on a key shared across all vehicles or on an algorithm that can be guessed or reverse-engineered (a fixed seed-key), an attacker who takes over the terminal or software of {{nodeName}}, or extracts the key from the diagnostic software, can send malicious diagnostic messages to any vehicle and rewrite ECU software and settings (Can). The same happens if a technician is tricked into writing malicious software. On the other hand, if diagnostic authentication uses per-vehicle or per-ECU keys or certificates, ECUs verify the signature of the software being written, and users of {{nodeName}} are authenticated individually, taking over one diagnostic tool does not pass authentication on other vehicles and unsigned software cannot be written (Cannot). The blast radius is every ECU that can be rewritten through diagnostics, in every vehicle {{nodeName}} can connect to."
    mitigation: "[Foundation] Authenticate users of the diagnostic tool individually and keep the diagnostic software and terminal up to date. Do not use security access based on a fixed key shared across all vehicles. [Enterprise] Use per-vehicle or per-ECU keys, or certificate-based authentication (UDS authentication service), for diagnostics, and have the backend issue keys on demand instead of storing them in the tool. Verify signatures of software being written on the ECU side. Log diagnostic operations. [Advanced] Turn diagnostic privileges into short-lived authorization tokens scoped by work order, vehicle, and time, and narrow the diagnostic services each user can run according to their role (least privilege)."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #11 (attack example 11.3), #9 (attack example 9.1), #15 (attack example 15.1) / mitigations M10, M9 (Table B1), M18 (Table B3)"

  sdv-telematics-remote-attack-001:
    category: "Elevation of Privilege"
    name: "Remote attacks via telematics and abuse of remote operation functions"
    description: "{{nodeName}} is reachable from the cellular network and accepts remote operations from the backend, such as unlocking doors, climate control, and starting charging. If unnecessary ports or services are open on the cellular side, the sender and authenticity of remote operation commands are not verified, or known vulnerabilities remain in the software of {{nodeName}}, an attacker can take over {{nodeName}} or forge remote operation commands without approaching the vehicle, and spread the attack to every vehicle with the same configuration at once (Can). Once the attacker reaches the in-vehicle network from {{nodeName}}, it also becomes a foothold for attacking the driving systems. On the other hand, if {{nodeName}} does not accept incoming connections from outside (the vehicle initiates the connection), verifies remote operation commands with backend signatures and mutual authentication, and {{nodeName}} is separated from the driving systems by a gateway, {{nodeName}} can neither be attacked directly from the cellular network nor be made to execute forged commands (Cannot). The blast radius is every vehicle carrying the same {{nodeName}} and every remotely operable function."
    mitigation: "[Foundation] Inventory the ports and services the TCU listens on from the cellular network and close unnecessary ones, using a dedicated APN so that incoming connections from outside are not accepted. Receive remote operation commands over mutually authenticated TLS. [Enterprise] Verify the backend signature on each remote operation command and check the user's authorization, the time, and the vehicle state (for example, reject while driving). Continuously manage vulnerabilities in the TCU software and fix them over the air. Separate the TCU from the driving systems with a gateway. [Advanced] Monitor TCU behavior and remote operation requests in an off-board security monitoring function (VSOC), and be able to disable remote operation functions across the fleet at once when anomalies appear."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #16 (attack examples 16.1, 16.2), #29 (attack example 29.1) / mitigations M20 (Table B4), M23 (Table B6)"

  sdv-ivi-third-party-app-media-malware-001:
    category: "Tampering"
    name: "Malware through third-party apps or USB / media on the infotainment system"
    description: "{{nodeName}} runs third-party apps and accepts external devices and media over USB, Bluetooth, Wi-Fi, and smartphone integration. If it accepts poorly secured or tampered apps, crafted media files, or USB devices, an attacker can execute code on {{nodeName}}, extract personal data such as contacts and location history, and use {{nodeName}} as a foothold to spread the attack to the in-vehicle network (Can). On the other hand, if only signed and reviewed apps run in a sandbox, media parsing is split into low-privilege processes, and {{nodeName}} is separated from the driving systems by a gateway, code execution on {{nodeName}} neither reaches the driving systems nor reads other apps' data (Cannot). The blast radius is the personal data held by {{nodeName}} and the in-vehicle networks reachable from {{nodeName}}."
    mitigation: "[Foundation] Restrict the apps that can be installed on the IVI to reviewed apps whose signatures are verified. Narrow the types of USB devices accepted and disable writing software from USB. [Enterprise] Run apps in a sandbox with minimal privileges and run media parsing in isolated processes. Separate the IVI from the driving systems with a gateway and restrict the messages the IVI can send. [Advanced] Monitor the behavior of software running on the IVI and send it to an off-board security monitoring function (VSOC), and be able to remotely disable malicious apps across the fleet."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #17 (attack example 17.1), #18 (attack examples 18.1, 18.2), #10 (attack example 10.1) / mitigations M21, M22 (Table B4), M14 (Table B1)"

  sdv-ota-update-compromise-001:
    category: "Tampering"
    name: "Compromise of the OTA update procedure and tampering with software before the update"
    description: "{{nodeName}} distributes signed update packages to the fleet. An attacker who gets into any part of the build, signing, or distribution procedure can have tampered software signed through the legitimate procedure (the update procedure itself works correctly, but the software was altered before signing), or rewrite the distribution targets, order, or metadata, and push malicious updates to the fleet at once (Can). On the other hand, if the software to be signed is checked with reproducible builds and acceptance verification, signing roles are separated and signed with multiple keys (with vehicles verifying role-based metadata, as in Uptane), and the vehicle-side ECUs verify the signature, version, and target vehicle, getting into a single place is not enough to produce an update the vehicle will accept (Cannot). The blast radius is every ECU subject to updates in every vehicle {{nodeName}} serves."
    mitigation: "[Foundation] Separate the steps of creating, signing, and distributing update packages, and minimize the people and privileges for each step. Verify the signature, version, and target vehicle on the vehicle side before applying. [Enterprise] Confirm the software to be signed through its build provenance (SBOM and build records) and acceptance verification before signing. Use a scheme in which vehicles verify metadata signed with separate keys per role (such as Uptane). Roll out updates in stages and stop if anomalies appear. [Advanced] Collect and monitor update distribution and installation results from the fleet, and be able to stop distribution and roll back when unexpected updates are detected. Align with the procedures of the software update management system under UN R156."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #12 (attack examples 12.1, 12.3) / mitigation M16 (Table B2)"

  sdv-software-signing-key-compromise-001:
    category: "Spoofing"
    name: "Malicious updates through leakage of the software provider's signing key"
    description: "If the update signing key used by {{nodeName}} sits in a file on the signing server, a variable in the build environment, or a developer's terminal, an attacker who extracts it can put a legitimate signature on any software and get vehicles to apply a malicious update that passes signature verification (Can). The signing key is the root of trust for updates to every vehicle, and replacing it requires replacing the vehicle-side trust anchors (public keys and certificates), so recovery from a leak takes time. On the other hand, if the signing key is generated and used inside an HSM so that it cannot be extracted, signing operations are governed by multi-person approval and logging, and separate keys are used per role, the key itself cannot be taken out, and no single key or single person can produce an update vehicles will accept (Cannot). The blast radius is every ECU in every vehicle that trusts signatures from {{nodeName}}."
    mitigation: "[Foundation] Generate and store signing keys in an HSM, configured so that keys cannot be exported as files. Minimize the people and systems that can use signing keys and log signing operations. [Enterprise] Require multi-person approval for signing and record what is signed (hash, target vehicles, version). Use separate keys per role (such as Uptane's root and targets) so that an offline key (root) can revoke and replace day-to-day signing keys. [Advanced] Rehearse key replacement procedures that assume a signing key leak, including updating the vehicle-side trust anchors, and make the signing record verifiable by third parties through a transparency log."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #12 (attack example 12.4) / mitigation M11 (Table B2)"

  sdv-firmware-downgrade-replay-001:
    category: "Tampering"
    name: "Firmware downgrade (reapplying an old legitimate version)"
    description: "If update verification on {{nodeName}} only checks that the signature is valid and does not check the version, an attacker can record old firmware that was legitimately signed in the past (containing known vulnerabilities) and get it reapplied to {{nodeName}} through the update path or the gateway (Can). Because the signature is valid, it passes verification, and already-fixed vulnerabilities become exploitable again. On the other hand, if {{nodeName}} keeps a minimum version in a tamper-resistant area (HSM / SHE counters, OTP) and refuses to apply or boot anything older, even an old version with a legitimate signature cannot be applied (Cannot). The blast radius is the functions of {{nodeName}} and every vulnerability contained in past versions."
    mitigation: "[Foundation] Check the version in addition to the signature during update verification and refuse to apply versions older than the current one. [Enterprise] Keep the minimum version in a tamper-resistant area such as HSM / SHE counters or OTP, and also refuse to boot old versions during secure boot (rollback protection). Give update metadata an expiry and reject replays of old metadata. [Advanced] Raise the minimum version when releasing a version that fixes vulnerabilities, and monitor fleet versions to detect vehicles running old versions."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #6 (attack example 6.3) / mitigations M10 (Table B1), M16 (Table B2)"

  sdv-update-denial-001:
    category: "Denial of Service"
    name: "Blocking the distribution of legitimate updates"
    description: "Through denial of service against {{nodeName}} or the network in front of it, or by keeping stale update information in front of vehicles (making it look as if there is no new update), an attacker can keep updates containing important fixes from reaching the fleet (Can). Until the fixes arrive, the fleet keeps driving with known vulnerabilities. On the other hand, if {{nodeName}} is redundant with DDoS protection, vehicles check the expiry of update information and reject stale information, and vehicles that do not receive updates are monitored, disruption of distribution remains a temporary delay and does not go unnoticed (Cannot). The blast radius is the period during which fixes are delayed for every vehicle receiving updates from {{nodeName}}."
    mitigation: "[Foundation] Make the distribution server redundant and use a distribution platform with DDoS protection (such as a CDN). Prepare recovery procedures for when distribution is unavailable. [Enterprise] Give update metadata an expiry checked on the vehicle side to reject attacks that keep showing stale information (freeze attacks). Monitor update status per vehicle and detect vehicles that have not received updates for a set period. [Advanced] Maintain multiple distribution paths (cellular, Wi-Fi, updates at dealers) so that important fixes can be delivered over a different path."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #13 (attack example 13.1) / mitigation M3 (Table B2, Table C1)"

  sdv-v2x-message-spoofing-sybil-001:
    category: "Spoofing"
    name: "V2X message spoofing and Sybil attacks"
    description: "{{nodeName}} receives wireless messages from other vehicles and roadside units (position, speed, hazard information, signal information) and uses them for driver assistance decisions. If it does not verify the signature and the sender's certificate on received messages, or a device holding a legitimate certificate is taken over, an attacker can send messages describing vehicles, accidents, or congestion that do not exist, or switch among multiple certificates to make it look as if many vehicles are present (Sybil attack), misleading the decisions of nearby vehicles (Can). On the other hand, if the signature of every received message is verified, revoked certificates are rejected, and message content is checked against the vehicle's own sensors and the plausibility of positions, forged messages from an attacker without keys are not accepted, and misuse of legitimate certificates can be detected as inconsistencies and revoked (Cannot). The blast radius is the decisions of every vehicle within radio range of {{nodeName}}."
    mitigation: "[Foundation] Always verify the signature and certificate of received V2X messages, and do not use messages that cannot be verified in driver assistance decisions. Store private keys in an HSM. [Enterprise] Regularly import revocation information and reject revoked certificates. Check message content (position, speed) against the vehicle's own sensors, maps, and physical plausibility (misbehavior detection). [Advanced] When inconsistencies are detected, report the sender to an off-board misbehavior detection function (such as SCMS misbehavior reporting) so that its certificates can be revoked."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #4 (attack examples 4.1, 4.2), #11 (attack example 11.2) / mitigations M10, M11 (Table B1)"

  sdv-vehicle-pki-trust-compromise-001:
    category: "Spoofing"
    name: "Vehicle PKI CA key compromise, mis-issuance, and revocation gaps"
    description: "{{nodeName}} issues certificates for ECUs, V2X, and Plug & Charge, and vehicles and devices use them as the root of trust to verify their peers. If the CA private keys sit outside an HSM, requesters are checked loosely (issuing large numbers of certificates to a single device, or continuing to issue to scrapped or stolen devices), or revocation information does not reach vehicles, an attacker can obtain legitimate certificates to impersonate ECUs, V2X devices, or chargers, mount Sybil attacks with many certificates, and leaked certificates cannot be stopped (Can). On the other hand, if CA keys are stored in an HSM with the root CA kept offline, issuance is restricted by device authentication (keys provisioned at manufacturing) and issuance limits, and revocation information is regularly distributed to vehicles, an attacker without a legitimate device key cannot obtain certificates, and leaked certificates can be stopped through revocation (Cannot). The blast radius is every vehicle and device that uses {{nodeName}} as its root of trust."
    mitigation: "[Foundation] Generate and store CA private keys in an HSM and operate the root CA offline. Require device authentication (enrollment with keys provisioned at manufacturing) before issuing certificates. [Enterprise] Set limits on the number and frequency of certificates issued per device and detect abnormal issuance. Regularly distribute revocation information (such as CRLs) to vehicles and devices, and revoke certificates of scrapped, stolen, or misbehaving devices. Require multi-person approval and logging for CA operations. [Advanced] Review certificate validity periods and key lengths against vehicle lifetimes, and prepare procedures for replacing the root of trust, including on the vehicle side, in case of CA key compromise."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #4 (attack example 4.2), #20 (attack example 20.1), #26 (attack example 26.1) / mitigations M11 (Table B1), M7 (Table B5), M23 (Table B6)"

  sdv-ecu-key-extraction-debug-access-001:
    category: "Information Disclosure"
    name: "Extraction of cryptographic keys from ECUs and leftover development debug ports"
    description: "If a debug port such as JTAG remains enabled on the board of {{nodeName}}, development certificates or passwords remain, or cryptographic keys are stored in ordinary flash memory rather than in an HSM / SHE, an attacker who obtains a vehicle or a used part can extract the firmware and cryptographic keys (for message authentication, diagnostic authentication, and certificate private keys) from {{nodeName}} (Can). If the key is shared across all vehicles and ECUs, a key extracted from one vehicle also breaks message authentication and diagnostic authentication on other vehicles. On the other hand, if debug ports are disabled (or protected by authentication) in production units, keys are generated and used inside the HSM / SHE and never leave it, and keys are unique per vehicle and per ECU, touching the board does not yield the keys, and even if a key is extracted the impact stays with that one vehicle (Cannot). The blast radius is the communications and authentication protected by the keys of {{nodeName}} and, if keys are shared, every vehicle holding the same key."
    mitigation: "[Foundation] Disable debug ports (such as JTAG) in production units and remove development certificates, passwords, and test functions. Do not share keys across all vehicles or ECUs. [Enterprise] Generate and use cryptographic keys inside the HSM / SHE so that they cannot be exported. If a debug port must remain, protect it with authentication using per-ECU keys. [Advanced] Use HSMs evaluated for resistance to side-channel and fault-injection attacks, and be able to replace per-vehicle keys remotely on the assumption that keys may leak."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #19 (attack example 19.3), #28 (attack example 28.2) / mitigations M11 (Table B5), M23 (Table B6)"

  sdv-ev-charging-manipulation-001:
    category: "Tampering"
    name: "Charging parameter tampering and attacks on the vehicle through the charger"
    description: "{{nodeName}} communicates with the vehicle over the charging cable using ISO 15118 and with the charge point operator's backend using OCPP. An attacker who takes over {{nodeName}}, or who gets between {{nodeName}} and the backend, can falsify charging parameters such as charging voltage, power, and battery temperature limits, or forge commands to start and stop charging, damaging the battery or disrupting charging. Stealing a Plug & Charge certificate lets the attacker bill charging to someone else's contract, and vulnerabilities in the vehicle's charging communication stack can also make the charger an entry point into the vehicle (Can). On the other hand, if the vehicle's battery management enforces voltage, current, and temperature limits from its own measurements, communications between {{nodeName}} and the vehicle and backend are protected by mutually authenticated TLS with certificates, and the firmware of {{nodeName}} is signature-verified, false parameters cannot push the battery into a dangerous state and impersonation cannot be used to bill others (Cannot). The blast radius is every vehicle charged at {{nodeName}} and the contracts of its users."
    mitigation: "[Foundation] Have the vehicle's battery management enforce voltage, current, and temperature limits from its own measurements regardless of charger commands. Protect communications between the charger and the backend (OCPP) with TLS and per-charger authentication. [Enterprise] Protect ISO 15118 communications with certificate-based TLS, and store Plug & Charge certificates and private keys in secure areas of the charger and the vehicle. Update the charger firmware with signed updates and close maintenance ports and accounts. [Advanced] Reconcile charging records (commands and measurements) between the vehicle and the backend to detect anomalies, and be able to remotely shut down a charger suspected of being taken over."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #25 (attack example 25.2), #16 (attack example 16.1) / mitigations M7 (Table B5), M20 (Table B4)"

  sdv-adas-sensor-spoofing-001:
    category: "Spoofing"
    name: "Spoofing and jamming of sensor inputs (GNSS spoofing, etc.)"
    description: "Because {{nodeName}} directly receives radio waves, light, and images, an attacker can, without touching the vehicle, mislead its position with fake GNSS signals, return fake reflections to radar or LiDAR to show objects that do not exist, stop recognition with strong light or jamming, or tamper with signs or road markings to mislead camera recognition. An attacker with physical access can also replace the sensor with an unauthorized part or insert a device between the sensor and the ECU to rewrite the data (Can). On the other hand, if results from multiple kinds of sensors (camera, radar, LiDAR, maps, wheel speed) are cross-checked to detect inconsistencies, GNSS uses authenticated signals or cross-checks with inertial navigation, and communications between the sensor and the ECU are authenticated, deceiving one kind of sensor does not mislead the overall decision, and part replacement or inserted devices can be detected (Cannot). The blast radius is the driver assistance and automated driving decisions that use the output of {{nodeName}}."
    mitigation: "[Foundation] Do not use the sensor's output alone; check its plausibility against other kinds of sensors, maps, and vehicle motion. When jamming or inconsistencies are detected, degrade driver assistance and hand over to the driver. [Enterprise] Authenticate communications between the sensor and the ECU (such as SecOC) and authenticate sensor parts to detect replacement with unauthorized parts. Use authenticated GNSS signals (such as Galileo OSNMA) or cross-checks with inertial navigation. [Advanced] Send sensor inconsistency and jamming detections to an off-board security monitoring function (VSOC) and correlate attacks at the same location across the fleet."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #4 (attack example 4.1), #16 (attack example 16.3), #32 (attack example 32.1) / mitigations M10 (Table B1), M20 (Table B4), M9 (Table B8), cross-checking multiple information sources (mitigation for #20.3 to 20.4 in Table B5)"

  sdv-ownership-change-personal-data-residue-001:
    category: "Information Disclosure"
    name: "Personal data left behind when the owner or user changes"
    description: "{{nodeName}} holds personal data such as contacts, call history, location history, frequently visited places, paired smartphones, and app accounts. If this data is not erased and the previous user's account links are not removed when the vehicle passes to someone else through sale, return, rental, or car sharing, the next user or a used car dealer can read the previous user's personal data, and the previous user can keep operating the vehicle from an app whose link remains (Can). On the other hand, if each user's data is encrypted with a per-user key that is erased along with the data when the owner changes, and unlinking accounts and resetting are carried out reliably in coordination with the backend, the next user cannot read the previous user's personal data and the previous user cannot keep operating the vehicle (Cannot). The blast radius is the personal data of every past user remaining in {{nodeName}}."
    mitigation: "[Foundation] Provide a reset function that lets users erase their own personal data and unlink accounts, and build it into the procedures for sale and return. [Enterprise] Encrypt each user's data with a per-user key and erase the key on reset (cryptographic erasure). Manage ownership changes in the backend and automatically remove the previous owner's account links and remote operation privileges. [Advanced] Keep personal data held in the vehicle to the minimum necessary, define retention periods, and erase it automatically. For rental and car sharing, reset automatically at the end of each use."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #31 (attack example 31.1), #19 (attack example 19.2) / mitigations M24 (Table B7), M8 (Table B5)"

  sdv-central-compute-isolation-escalation-001:
    category: "Elevation of Privilege"
    name: "Insufficient isolation between software of different criticality on the central compute and privilege escalation"
    description: "On {{nodeName}}, less critical software connected to the outside, such as infotainment and connectivity, runs alongside safety-related software, such as driver assistance and vehicle control, on a hypervisor or containers. If there are hypervisor vulnerabilities, excessive privileges on shared memory or communication channels between virtual machines, or services running as root, an attacker who executes code on the externally connected side can gain privileges and manipulate the safety-related software, its keys, and its communications (Can). On the other hand, if software of different criticality is separated by a hypervisor whose isolation strength has been evaluated, communication between virtual machines is authorized only where necessary, and each service runs with least privilege, code execution on the externally connected side does not reach the safety-related side (Cannot). The blast radius is every function running on {{nodeName}} and the in-vehicle networks connected from {{nodeName}}."
    mitigation: "[Foundation] Classify the software running on the central compute by criticality and run externally connected software and safety-related software in separate virtual machines or partitions. Do not run services as root. [Enterprise] Restrict and authorize shared memory and communication channels between virtual machines to what is necessary, and separate keys and debug privileges per partition. Continuously manage vulnerabilities in the hypervisor and OS and fix them over the air. [Advanced] Use a hypervisor whose isolation strength has been evaluated (such as a microkernel), and apply per-partition mandatory access control and runtime integrity verification."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #9 (attack example 9.1), #29 (attack example 29.2) / mitigations M9 (Table B1), M23 (Table B6)"

  sdv-firmware-signature-pqc-001:
    category: "Tampering"
    name: "Quantum-vulnerable firmware signature verification relative to vehicle lifetime"
    description: "If {{nodeName}} verifies firmware signatures only with RSA / ECDSA and its verification key (trust anchor) cannot be replaced, then because vehicles stay in use for nearly 20 years from development to scrapping, a cryptographically relevant quantum computer (CRQC) appearing during that time would let an attacker derive the signing key from the public key, put a valid signature on fake firmware, and pass verification (Can). In terms of Mosca's inequality, the time signatures must be trusted (the vehicle's service life) plus the time needed to migrate the signature scheme (vehicle development and ECU procurement lead times) easily exceeds the time until a CRQC appears, and noticing after start of production is too late to replace the verification mechanism. On the other hand, if secure boot and update verification can verify LMS / XMSS (SP 800-208) or ML-DSA / SLH-DSA signatures and the trust anchor can be replaced securely, the signature scheme can be switched before classical signatures are broken, preventing forgery (Cannot). This is a future forgery and does not break current signatures immediately. PQC signatures are large, and CAN-FD bandwidth and ECU processing power are constraints, so the design must, for example, concentrate signature verification in the gateway or central compute. The blast radius is the remaining service life of every vehicle carrying {{nodeName}}."
    mitigation: "[Foundation] For each ECU in the vehicle, inventory the firmware signature scheme, key length, where the trust anchor is stored and whether it can be rewritten, and the expected service life, and identify those whose service life extends past PQC migration deadlines (cryptographic inventory). [Enterprise] Make secure boot and update verification on newly developed ECUs support LMS / XMSS (SP 800-208) or ML-DSA / SLH-DSA, and design them so that the signature scheme and trust anchor can be replaced later (crypto-agility). Decide where signature verification takes place (gateway, central compute, individual ECUs) in light of CAN-FD bandwidth and ECU processing power. [Advanced] Migrate using hybrid signatures that combine classical and PQC signatures, and include PQC support in the HSM / SHE in ECU procurement requirements. Build firmware signing migration deadlines such as CNSA 2.0 into the vehicle development plan."
    conditions:
      - description: "If {{nodeName}} signs updates only with RSA / ECDSA, vehicles keep verifying with that public key, so if a cryptographically relevant quantum computer (CRQC) appears during the vehicle's service life (nearly 20 years), an attacker can derive the signing key of {{nodeName}} from the public key, put a valid signature on any software, and get the fleet to apply it (Can). In terms of Mosca's inequality, the time signatures must be trusted plus the time to migrate the signature scheme (including replacing vehicle-side verification) easily exceeds the time until a CRQC appears. On the other hand, if {{nodeName}} supports LMS / XMSS (SP 800-208) or ML-DSA / SLH-DSA signatures (or their combination with classical signatures) and vehicles have been migrated in advance so that they can verify the new scheme, the switch can be made before classical signatures are broken, preventing forgery (Cannot). Because LMS / XMSS are stateful signatures, the signature state (which key indices have been used) must be managed strictly in an HSM. The blast radius is the remaining service life of every vehicle that trusts signatures from {{nodeName}}."
      - description: "If the root and intermediate CA keys of {{nodeName}} are RSA / ECDSA with long validity periods set to match the vehicle service life (nearly 20 years), a cryptographically relevant quantum computer (CRQC) appearing during that time would let an attacker derive the CA private key from the public key and freely issue legitimate certificates for ECUs, V2X, and Plug & Charge (Can). The combination of short keys and long validity gives time for compromise even without a quantum computer. On the other hand, if a PQC (such as ML-DSA) or hybrid CA is prepared and vehicles can add and replace trust anchors in advance, migration to the new CA can happen before the classical CA is compromised (Cannot). The blast radius is the remaining service life of every vehicle and device that uses {{nodeName}} as its root of trust."
    references:
      "0":
        title: "UN R155 Annex 5 Table A1 #26 (attack examples 26.1, 26.2, 26.3) / mitigation M23 (Table B6)"
      "1":
        title: "NIST SP 800-208 - Recommendation for Stateful Hash-Based Signature Schemes (LMS / XMSS)"
      "3":
        title: "NSA CNSA 2.0 - Commercial National Security Algorithm Suite 2.0 (migration deadlines for firmware signing)"
