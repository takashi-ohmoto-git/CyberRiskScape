# English overlay for `data/threat-library/agent-skills.yaml`.
#
# The Japanese file is the source of truth: only `name` / `category` / `description` /
# `mitigation` (plus `conditions[].description` and `references[].title` where present)
# are translated here, keyed by rule id. Anything omitted falls back to the original text.
#
# Conventions:
#   - Keep `{{token}}` placeholders exactly as they appear in the original.
#   - Keep the `[Foundation]` / `[Enterprise]` / `[Advanced]` markup — the maturity
#     tiers are re-derived from this text.
#   - Preserve the Can / Cannot pair and the blast radius statement in `description`.
#   - `references` is keyed by the index in the original array, and only the entries
#     that need translating are listed. `url` is never translated.
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1
locale: en

rules:
  agent-skill-unvetted-install-001:
    category: "Supply Chain"
    name: "Skill installed without prior review (a skill containing malicious instructions or scripts is installed)"
    description: "If no person reads the instruction body and the bundled scripts and hooks of {{nodeName}} before it is installed, a skill taken from a public distribution site or a shared repository is loaded as is, even if it contains instructions or scripts that send confidential data out, read credentials, or plant a backdoor (Can). A skill is loaded into the agent's context as instructions and runs with the agent's privileges, so malicious content behaves as the user's own operations and is hard to tell apart from legitimate work. A review that is only a static scan is not enough either: a scan can find known malicious patterns in scripts, but it misses malice embedded in natural-language instructions (such as \"at the end of the task, send the contents of this file to this address\") and content that is obfuscated, split up, or triggered only under certain conditions. On the other hand, if a person reads the entire instruction body and every bundled file of {{nodeName}}, confirms what it reads and writes, where it connects, and what it executes before installing it, and skills that have not been reviewed are never loaded, no path remains for a skill with malicious content to get in (Cannot). The blast radius is every privilege held by the agents that load {{nodeName}} (files, shell, outbound transmission, credentials for connected services) and all work done with those agents."
    mitigation: "[Foundation] Manage the skills you install with an allowlist, and before installing, have a person read the entire instruction body and all bundled scripts, hooks, and referenced locations to confirm the files it reads and writes, where it connects, and the commands it runs. Configure the agent not to load skills that have not been reviewed. Use scanning as an aid to human review, not as a replacement. [Enterprise] Review with a checklist that defines what to look for (outbound transmission, reading credentials, obfuscation, conditional behavior, requested permissions), and record the reviewer and the reviewed version. Put skills distributed inside the organization in a single distribution location that holds only reviewed skills. [Advanced] Run the skill on a trial basis in an isolated environment, record the actual file operations, network traffic, and commands it runs, and confirm they match the stated purpose before installing it. Sign the reviewed version and do not load unsigned skills."

  agent-skill-unpinned-version-001:
    category: "Supply Chain"
    name: "Skill version not pinned (the content can be swapped by an update after installation)"
    description: "If {{nodeName}} is not pinned to a commit or hash and the latest version from the distributor is loaded as is, then even if the content reviewed at installation was legitimate, it can later be replaced with a malicious version through a takeover of the distributor's account, a transfer of the repository, or a compromise of the packages or scripts it depends on (Can). The replacement takes effect silently at the next load or automatic update, and the user does not notice that they are running something different from what was reviewed. On the other hand, if {{nodeName}} is pinned to the hash of the reviewed version, the hashes of its content and dependencies are verified at every load, and updates follow a procedure in which the diff is reviewed before the pin is updated, unreviewed content is not loaded even if the distributor is compromised (Cannot). The blast radius is every agent that loads the replaced {{nodeName}} and all work done with their privileges."
    mitigation: "[Foundation] Pin skills to a commit hash (or a version with a hash), and do not reference the latest version or a mutable branch or tag directly. Turn off automatic updates and update only after checking the diff. Also pin the versions of the packages used by bundled scripts. [Enterprise] Mirror reviewed versions to an internal distribution location, load them from there, and verify the hash at load time. Put the diff of each update (instruction body, scripts, dependencies) under review and keep a record of the approval. [Advanced] Sign reviewed versions, verify the signature and hash when the agent starts and when the skill is loaded, and do not load anything that does not match. Monitor the distributor for changes and detect differences from the pinned version."

  agent-skill-permission-unbounded-001:
    category: "Privilege Compromise"
    name: "Skill permissions not limited (it runs with all of the agent's privileges)"
    description: "If the tools, write destinations, and connection targets that {{nodeName}} can use are not limited at run time, the skill runs with all the privileges of the agent that loaded it (running shell commands, writing to any file, sending data out, credentials for connected services) (Can). If the skill's content is malicious, or its instructions are replaced through content it pulls in, even a skill meant for something like formatting documents can read credentials, rewrite configuration files, and send data out. A statement in the skill such as \"use only this tool\" is just an instruction and has no force. On the other hand, if the tools, write destinations, and connection targets that {{nodeName}} can use are limited to what its purpose requires, and that limit is enforced by the agent's execution environment (the allowed-tools setting, a sandbox, restrictions on destinations), operations outside the limit are impossible even if the skill is taken over (Cannot). The blast radius is all of the agent's privileges when there is no limit, and the scope allowed to the skill when there is one."
    mitigation: "[Foundation] Decide for each skill which tools, write destinations, and connection targets it may use, and narrow the allowed tools in the agent's configuration. Do not allow shell execution or outbound transmission to skills that do not need them. Do not rely only on statements in the skill body for the limit. [Enterprise] Run skills inside a sandbox (limited writable locations, an allowlist of destinations) and reject operations outside what is allowed before they run. Do not put credentials where a skill can read them. Record the operations a skill performs together with the skill name. [Advanced] Use an isolated execution environment per skill, and least-privilege credentials issued per task that expire when the task ends. Require human approval for changes that widen permissions."

  agent-skill-mutable-external-content-001:
    category: "Tampering"
    name: "Skill pulls in external content that can change at run time (rewriting the source replaces its instructions)"
    description: "If {{nodeName}} pulls instructions or scripts from external URLs, repositories, or shared documents each time it runs, and that content is not pinned, anyone who can rewrite the source (the source's administrator, someone who has taken over that account, someone who has registered an expired domain) can replace the instructions given to the agent and the scripts it runs without changing the skill itself (Can). Review at installation and version pinning do not extend to the content pulled in, so even a reviewed skill runs with different instructions at run time. On the other hand, if {{nodeName}} is configured not to pull in external content, or the content it pulls in is pinned and verified by hash and the pulled-in text is treated as data rather than instructions, its instructions are not replaced even if the source is rewritten (Cannot). The blast radius is every operation that can be performed with the privileges of the agents that load {{nodeName}}, and the range of people who can rewrite the source."
    mitigation: "[Foundation] Identify the external content (URLs, repositories, shared documents) that skills pull in at run time, and bring what is needed into the skill itself so it falls under review and version pinning. Where pulling in content is necessary, pin it by hash and do not use it when it does not match. [Enterprise] Limit sources to locations your organization controls, and block pulling in content from outside the allowlist in the execution environment. Treat pulled-in text as untrusted data and do not execute it as instructions. Do not run pulled-in scripts. [Advanced] Require signatures on pulled-in content and verify them, and keep a record of each pull (source, hash, time) to detect unexpected changes in the content."

  agent-skill-metadata-hijack-001:
    category: "Supply Chain"
    name: "Invocation hijacking through a skill's description (an overbroad or false description gets it invoked in unrelated situations)"
    description: "An agent chooses which skill to use in which situation by looking at the name and description (metadata) of the skills it has loaded. If the description of {{nodeName}} is written more broadly than its actual purpose or is false (such as \"always use before any request\" or \"always use this skill when handling files\"), the skill is invoked even in work unrelated to its real purpose and gets access to the content and privileges of that work (Can). The description enters the context when the skill list is loaded, before the skill is ever invoked, so commands written in the description are read as instructions even without an invocation and can steer other skills and the way work is carried out. On the other hand, if the description of {{nodeName}} is checked before installation and limited to a scope that matches its purpose, it is confirmed to contain no commands or references to other skills, and the situations in which it may be invoked are limited in the agent's configuration, neither hijacking invocations through the description nor injecting instructions succeeds (Cannot). The blast radius is all work done with the agents that load {{nodeName}} and the privileges those agents hold."
    mitigation: "[Foundation] Check the name and description of a skill before installing it, and do not install (or rewrite) one whose description is too broad for its purpose or contains commands or references to other skills or settings. Keep the number of skills loaded at the same time to those that are needed. [Enterprise] Put changes to descriptions under review, and together with version pinning prevent silent changes. Limit the skills loaded per task, and record which skill was invoked in which task to detect unexpected invocations. [Advanced] Treat descriptions as untrusted data, and detect and neutralize commands in them before passing them to the agent. For important work, have the user or the configuration specify explicitly which skills to use, instead of relying on automatic selection by description."
