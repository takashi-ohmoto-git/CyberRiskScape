# API 基盤（API 管理・API 開発ツール）の脅威ルール。
#
# 対象は data/component-library/api-platform.yaml の 6 型
# （BACKEND_API / API_CONTROL_PLANE / SECRETS_VAULT / API_DEV_WORKSPACE / CI_PIPELINE / API_SPEC）。
# 型名は特定製品に寄せない汎用名で、API ゲートウェイ製品（Admin API を持つもの）や
# API 開発・テストツール（コレクション・環境変数をクラウドで共有するもの）の構成を表す。
#
# 発火の考え方（接続前提モデリング）:
#   - 攻撃面属性（attackSurface）は FRONT_END_SERVER / GATEWAY でしか入力できないため、
#     本ファイルの型には使わない（未入力扱いで常に insecure baseline になり、利用者が
#     打ち消せない）。露出の有無はエッジの trust（信頼境界）と peerType で表す。
#   - ドキュメント型（API_SPEC）と、存在そのものがリスクの型（API_DEV_WORKSPACE /
#     CI_PIPELINE）は内在的脅威として connection.required:false にする。
#
# 出典:
#   - OWASP API Security Top 10 2023
#     https://owasp.org/API-Security/editions/2023/en/0x11-t10/
#     （API1 BOLA / API3 BOPLA / API8 Security Misconfiguration / API9 Improper Inventory Management）
#   - OWASP Top 10 CI/CD Security Risks
#     https://owasp.org/www-project-top-10-ci-cd-security-risks/
#     （CICD-SEC-4 Poisoned Pipeline Execution / CICD-SEC-6 Insufficient Credential Hygiene）
#   - OWASP Secrets Management Cheat Sheet
#     https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
#   - OWASP API Security Top 10 2023（API4 Unrestricted Resource Consumption /
#     API6 Unrestricted Access to Sensitive Business Flows / API2 Broken Authentication /
#     API5 Broken Function Level Authorization）、OWASP JSON Web Token Cheat Sheet、
#     OWASP Automated Threats to Web Applications（OAT-011 Scraping）、OWASP MASVS
#   - IETF RFC 8252（OAuth 2.0 for Native Apps）、RFC 7636（PKCE）、RFC 8725（JWT BCP）
#   - OWASP API Security Top 10 2023（API7 Server Side Request Forgery）、OWASP Cheat Sheet Series
#     （Server-Side Request Forgery Prevention / Injection Prevention / Query Parameterization /
#     Deserialization / File Upload / OS Command Injection Defense）
#   - MITRE CWE（CWE-918 / CWE-89 / CWE-943 / CWE-502 / CWE-78 / CWE-434）
#     https://cwe.mitre.org/
#   - NICT CYNEX（脅威情報分析チーム LETTICE）注意喚起「相次ぐ情報漏洩、その原因の一つは
#     『アプリ解析からのサーバ攻撃』」（2026-10-13、A2B 攻撃＝App-to-Backend Attack）
#     https://cynex.nict.go.jp/library/261013-01.html
#     （報道発表 https://www.nict.go.jp/press/2026/10/13-1.html）
#   - OWASP API Security Top 10 2023（API8 Security Misconfiguration のエラー処理）、MITRE CWE-209
#     （Generation of Error Message Containing Sensitive Information）、OWASP Error Handling Cheat Sheet
#   - NIST SP 800-204「Security Strategies for Microservices-based Application Systems」
#     https://csrc.nist.gov/pubs/sp/800/204/final （サーキットブレーカー・負荷分散・スロットリング）
#   - MITRE ATT&CK (Enterprise) v20.0（2026-10-24 に既存ルールの references へ対応づけ。技術 ID と正式名のみ
#     出典つきで参照し本文は転載しない）:
#     T1190 "Exploit Public-Facing Application"、T1078 "Valid Accounts"、
#     T1556 "Modify Authentication Process"、T1110 "Brute Force"、
#     T1555.006 "Credentials from Password Stores: Cloud Secrets Management Stores"、
#     T1593 "Search Open Websites/Domains"、T1552.001 "Unsecured Credentials: Credentials In Files"、
#     T1677 "Poisoned Pipeline Execution"、T1595.003 "Active Scanning: Wordlist Scanning"、
#     T1119 "Automated Collection"、
#     T1550.001 "Use Alternate Authentication Material: Application Access Token"、
#     T1606 "Forge Web Credentials"、T1552.005 "Unsecured Credentials: Cloud Instance Metadata API"、
#     T1505.003 "Server Software Component: Web Shell"、T1059 "Command and Scripting Interpreter"、
#     T1592.002 "Gather Victim Host Information: Software"。
#     https://attack.mitre.org/techniques/
#   本文は逐語転載せず日本語要約のみ。
#
#   SPDX-License-Identifier: Apache-2.0
#   ライセンス: 本ファイルは Apache License 2.0（LICENSE 参照）。
#   出典の帰属表示は NOTICE を参照。
#
# 重複回避方針:
#   - ゲートウェイ層の認可不備（スコープ検証・管理 API への横展開＝機能単位の認可、API5 BFLA 相当）は
#     stride-gateway-elevation-of-privilege-001（canonicalId: gateway-authorization-gap、GATEWAY 型）
#     でカバー済み。本ファイルの BOLA ルールは「ゲートウェイでは判定できない、レコード・項目単位の
#     所有者チェック」をバックエンド側の責務として扱う。別 canonicalId。
#     ゲートウェイを置かずに利用者が直接呼ぶ構成もあるため、機能単位の認可（API5 BFLA）も
#     api-backend-function-level-authorization-001（canonicalId: api-function-level-authorization）として
#     バックエンド側に置く。subject が異なるため GATEWAY のルールとは別カードになる。
#   - ゲートウェイのレート制限（API4 相当）は stride-gateway-dos-001（gateway-resource-exhaustion）で
#     カバー済み。本ファイルでは扱わない。ただし api-bulk-data-harvesting-001 は可用性ではなく
#     「正常な応答を積み上げた個人情報の大量取得」を扱うため別 canonicalId とする。
#   - api-mobile-embedded-secret-001 / api-bulk-data-harvesting-001 は BOLA ルールと同じノードで
#     発火しうるが、それぞれ「アプリを介さない直接呼び出し」「取得量の制限・検知」という別の問いで、
#     BOLA と組み合わさって大量漏えいに至る経路の構成要素として別カードにする。
#   - 管理面のインターネット露出は stride-web-remote-mgmt-exposed-001
#     （canonicalId: web-remote-management-exposure、攻撃面属性）と同じ脅威。API_CONTROL_PLANE は 2026-10-25 に
#     攻撃面属性を持つ型になり stride-web-remote-mgmt-exposed-001 の対象にも入ったが、Internet から線を引いた図でも
#     出るよう、エッジ視点のルールを同じ canonicalId で残す（提示層で 1 枚にまとまる）。
#   - 認証材料そのものの静的保管・散在は zt-credential-sprawl-static-secret-001
#     （canonicalId: credential-sprawl、CREDENTIAL 型）が扱う。本ファイルは「認証材料を集約する
#     基盤（SECRETS_VAULT）」と「クラウドで共有される開発ツール（API_DEV_WORKSPACE）」「CI」という
#     置き場所ごとの固有の経路を扱い、subject が異なるため別 canonicalId とする。
#   - 呼び出し時の静的 API キー利用（弱いサービス認証）は weak-service-auth 群が扱う。
#   - IdP が発行したトークンの受け側検証は zt-idp-token-validation-gap-001（canonicalId:
#     idp-relying-party-validation-gap、IdP からのエッジ）が扱う。api-token-session-validation-gap-001 は
#     IdP を描かない構成（アプリのサーバーが自前でセッション・JWT を発行・検証する）も含め、
#     利用者の端末や、利用者の操作を代行する SaaS・業務アプリから呼ばれる API 側の検証を扱う。
#     subject が異なるため別 canonicalId とする。
#   - アプリを解析してバックエンド API を直接狙う攻撃（A2B 攻撃）で狙われる SSRF・SQL / NoSQL
#     インジェクション・コード実行を、バックエンド側の実装の問いとして 3 ルール（api-backend-ssrf-001 /
#     api-backend-query-injection-001 / api-backend-remote-code-execution-001）で扱う。IDOR は BOLA
#     ルール、アプリ埋め込みの秘密情報は api-mobile-embedded-secret-001 でカバー済み。
#   - SQL / NoSQL インジェクションは、フォームの値が下流で解釈される webform-input-injection-001
#     （canonicalId: web-form-input-injection、WEB_FORM 型。XSS・メールヘッダーも含む）と近接するが、
#     subject（WEB_FORM / BACKEND_API）と範囲（API の JSON 本文・NoSQL の演算子）が異なるため
#     別 canonicalId（api-query-injection）とする。公開サーバーに WAF が無いこと自体は
#     stride-web-no-waf-001（canonicalId: web-missing-waf）が扱う別の問い（WAF の有無）で、
#     本ファイルはバックエンドの実装（パラメーター化・型検証）を問う。
#   - コード実行は、公開 Web サーバーへの Web シェルの設置・常駐を扱う webserver-webshell-implant-001
#     （canonicalId: web-shell-implant、FRONT_END_SERVER の攻撃面属性で発火）と近接するが、
#     本ファイルは BACKEND_API の入力処理（デシリアライズ・ファイルの保存先・OS コマンド）を問うため
#     別 canonicalId（api-server-code-execution）とする。AI エージェントのコード実行
#     （agent-code-execution-rce）も subject が異なり別。
#   - エラー応答による内部情報の露出（api-error-response-disclosure-001、canonicalId:
#     api-error-information-disclosure）は既存に該当ルールが無い。API 仕様書からの偵察
#     （api-improper-inventory）とは情報源（仕様書／実行時のエラー応答）が異なり別。インジェクションの
#     ルールが mitigation で触れる「データベースのエラーを返さない」は対策の一部で、問いは別。
#     外部の呼び出し元に応答を返す出口（BACKEND_API / GATEWAY）でだけ発火させ、ゲートウェイの背後の
#     内部 API には出さない。FRONT_END_SERVER（Web サーバーのエラーページ）は本ファイルの対象外とした。
#   - 多層 API での下流障害の連鎖（api-downstream-cascading-failure-001、canonicalId:
#     api-downstream-cascading-failure）は、入口での量の制限（gateway-resource-exhaustion、
#     GATEWAY / REVERSE_PROXY）とは別の問い（下流を呼ぶ側のタイムアウト・サーキットブレーカー・
#     隔離）。同じ問いを GATEWAY に重ねないため対象は BACKEND_API だけにする。AI エージェント間の
#     誤った判断の波及（cascading-failures、ASI08）とも機構と subject が異なり別。
#
# mitigation は 3 段階成熟度（[Foundation] / [Enterprise] / [Advanced]）をインライン markup で示す。
# description は Can/Cannot ペアと blast radius を意識して記述する。

schemaVersion: 1

rules:
  # ── BACKEND_API: オブジェクト・プロパティ単位の認可不備（API1 / API3）──────
  - id: api-backend-object-level-authorization-001
    canonicalId: api-object-level-authorization
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "オブジェクト・プロパティ単位の認可不備（BOLA / BOPLA）"
    severity: High
    description: "{{nodeName}} がリクエストに含まれるレコード ID や項目を、呼び出し元の利用者が扱ってよいものか照合していない場合、正規にログインした利用者が ID を書き換えるだけで他人のレコードを参照・変更できる（Can）。応答に不要な項目を返したり、更新時に受け取った項目をそのまま反映したりすると、閲覧権限の無い項目の読み出しや、権限・価格などの項目の書き換えも成立する。API ゲートウェイはトークンとスコープは検証できるが、レコードの所有者が誰かは知らないため、この判定はバックエンドでしか行えない。一方、すべてのデータ操作で呼び出し元とレコードの所有関係を照合し、応答と更新の対象項目を許可リストで限定していれば、ID を書き換えても他人のデータには届かない（Cannot）。blast radius は {{nodeName}} が扱う全レコード（ID が連番や推測可能なら全利用者分）。"
    mitigation: "[Foundation] レコードを ID で扱うすべての API で、呼び出し元の利用者（トークンの主体）とレコードの所有関係を照合する。応答で返す項目と、更新で受け付ける項目を API ごとに許可リストで定め、それ以外は返さない・反映しない。 [Enterprise] 認可の判定を共通のライブラリまたはポリシーエンジンに集約し、個々の実装に任せない。他人の ID を指定するテストケースを API テストに含め、CI で毎回実行する。推測しにくい ID（ランダムな値）を使う。 [Advanced] 認可の判定結果をログに残し、同じ利用者が多数の他人の ID を試すパターンを検知する。API 仕様書から認可テストを自動生成し、仕様と実装の差を継続的に検査する。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 呼び出し元（ゲートウェイ・利用者・他サービス）からの入力を受けるとき発火する。
      connection:
        direction: inbound
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      - title: "OWASP API Security Top 10 2023 - API1:2023 Broken Object Level Authorization"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"
      - title: "OWASP API Security Top 10 2023 - API3:2023 Broken Object Property Level Authorization"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/"
      # ゲートウェイ層の認可（スコープ・機能単位）は gateway-authorization-gap が扱う（別 canonicalId）。
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（公開 API の認可不備の悪用）"
        url: "https://attack.mitre.org/techniques/T1190/"

  # ── BACKEND_API: ゲートウェイを経由しない直接アクセス ──────────────
  - id: api-backend-gateway-bypass-001
    canonicalId: api-gateway-bypass
    framework: STRIDE
    category: "Spoofing/Tampering"
    name: "ゲートウェイを経由しないバックエンド API への直接アクセス"
    severity: High
    description: "{{targetName}} に {{sourceName}} から API ゲートウェイを経由せずに到達できる構成です。認証・レート制限・入力検査・アクセスログをゲートウェイに任せている場合、直接到達した呼び出し元はそれらをすべて素通りできる（Can）。ゲートウェイが付けるヘッダー（利用者 ID 等）をバックエンドが信用している構成では、ヘッダーを偽装して他の利用者になりすますこともできる。一方、バックエンドへの通信をゲートウェイからの経路だけに限定し（ネットワーク制限と相互 TLS 等）、バックエンド自身もトークンを検証していれば、直接到達しても処理は受け付けられない（Cannot）。blast radius は {{targetName}} の全機能と、ゲートウェイで守っているつもりの全制御。"
    mitigation: "[Foundation] 利用者や外部システムからバックエンド API へ直接到達できる経路を塞ぎ、ゲートウェイ経由に一本化する（ネットワークの許可リスト、プライベート接続）。ゲートウェイが付けたヘッダーを、ゲートウェイ以外からのリクエストでは信用しない。 [Enterprise] ゲートウェイとバックエンドの間を相互 TLS で認証する。バックエンド側でもトークンの署名・有効期限・スコープを検証する（ゲートウェイの検証に依存しない）。 [Advanced] サービスメッシュ等でサービス間の通信を個別に認可し、ゲートウェイの外側からの到達を構造的に不可能にする。"
    appliesTo:
      kind: edge
      # TCU（sdv ライブラリ）は車両からバックエンドを呼ぶ外部の呼び出し元のため加える（車両バックエンドは BACKEND_API で描く）。
      when:
        sourceType: [USER, PC, SMARTPHONE, IOT, EXTERNAL_ENTITY, OTHER_APP, API_DEV_WORKSPACE, TCU]
        targetType: [BACKEND_API]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
    references:
      - title: "OWASP API Security Top 10 2023 - API8:2023 Security Misconfiguration"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"

  # ── API_CONTROL_PLANE: 構成の改ざんによる全 API への波及 ─────────────
  - id: api-control-plane-config-tampering-001
    canonicalId: api-control-plane-tampering
    framework: STRIDE
    category: "Tampering"
    name: "API 管理プレーンの構成改ざん"
    severity: High
    description: "{{nodeName}} はルーティング・認証・レート制限・プラグインの設定をゲートウェイに配布する。管理用の API や管理画面の資格情報を入手した攻撃者は、認証プラグインを外す、ルートを攻撃者のサーバーへ向ける、ログ出力を止めるといった変更を、配下のすべての API に一度に反映できる（Can）。変更は正規の設定として配布されるため、ゲートウェイ側では異常として扱われない。一方、管理用の API をゲートウェイの通信経路から分離して管理者の端末からだけ到達できるようにし、構成をコードとしてバージョン管理し、レビュー済みの変更だけを CI から適用していれば、資格情報を入手しても気付かれずに構成を書き換えることはできない（Cannot）。blast radius は {{nodeName}} が管理する全 API と、その利用者全員。"
    mitigation: "[Foundation] 管理用の API・管理画面を、利用者向けのゲートウェイと別の経路（管理用ネットワーク・VPN 等）に置き、認証と MFA を必須にする。管理者アカウントを個人ごとに分け、権限を役割で分ける。 [Enterprise] 構成を宣言的なファイルでバージョン管理し、レビュー済みの変更だけを CI から適用する（手作業の変更を禁止する）。稼働中の構成とリポジトリの構成の差分を定期的に検出する。構成変更を監査ログに残し、SIEM に送る。 [Advanced] 管理操作に承認フロー（2 人の承認等）を設ける。認証プラグインの削除やルートの外部向け変更など、影響の大きい変更を検知して自動で警告する。"
    appliesTo:
      kind: node
      nodeType: API_CONTROL_PLANE
      # 構成を配布する先（ゲートウェイ）または操作する管理者と接続されているとき発火する。
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
    references:
      - title: "OWASP API Security Top 10 2023 - API8:2023 Security Misconfiguration"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"
      - title: "MITRE ATT&CK T1078 - Valid Accounts（入手した管理用の資格情報での変更）"
        url: "https://attack.mitre.org/techniques/T1078/"
      - title: "MITRE ATT&CK T1556 - Modify Authentication Process（認証プラグインの除去）"
        url: "https://attack.mitre.org/techniques/T1556/"

  # ── API_CONTROL_PLANE: 管理面のインターネット露出（エッジ視点）──────────
  - id: api-control-plane-internet-exposure-001
    canonicalId: web-remote-management-exposure
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "管理面リモートアクセス（API 管理プレーン）"
    severity: Critical
    description: "{{targetName}}（API の管理プレーン）に、信頼境界の外（Internet 扱い）にある {{sourceName}} から到達できる構成です。管理用の API がインターネットに公開されていると、攻撃者は認証の総当たりや、既定の設定・既知の脆弱性を狙って管理権限を取りに行ける（Can）。管理権限を取られると、配下のすべての API の認証とルーティングを書き換えられる。一方、管理面を管理用ネットワーク・VPN・IAP の背後に限定し、インターネット側から到達できないようにしていれば、この入口そのものが無くなる（Cannot）。blast radius は {{targetName}} が管理する全 API。"
    mitigation: "[Foundation] 管理用の API・管理画面をインターネットに公開しない。管理用ネットワーク・VPN・IAP（Identity-Aware Proxy）の背後に置き、送信元を管理者の端末に限定する。 [Enterprise] 管理面の認証に MFA と短命のトークンを使い、既定の管理者アカウントを無効にする。管理面へのアクセスを監査ログに残し、失敗の連続を検知する。 [Advanced] 管理面への到達自体をデバイスの状態と利用者の属性で都度判定する（ゼロトラストアクセス）。"
    appliesTo:
      kind: edge
      when:
        targetType: [API_CONTROL_PLANE]
        sourceTrust: [Internet]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
    references:
      - title: "OWASP API Security Top 10 2023 - API8:2023 Security Misconfiguration"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"
      # 攻撃面属性による管理面露出は stride-web-remote-mgmt-exposed-001 が扱う（同じ canonicalId）。
      - title: "MITRE ATT&CK T1110 - Brute Force（管理用 API への認証の総当たり）"
        url: "https://attack.mitre.org/techniques/T1110/"
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（既定の設定・既知の脆弱性の悪用）"
        url: "https://attack.mitre.org/techniques/T1190/"

  # ── SECRETS_VAULT: 認証材料の集約点としてのリスク ──────────────────
  - id: api-secrets-vault-concentration-001
    canonicalId: secrets-vault-concentration
    framework: STRIDE
    category: "Information Disclosure"
    name: "シークレット管理への権限集中"
    severity: High
    description: "{{nodeName}} は API キー・トークン・証明書を一か所に集める。読み出しの権限を広く設定している場合（全シークレットを読めるアプリケーション用の資格情報、共有の管理者トークン等）、その資格情報を 1 つ入手した攻撃者は、{{nodeName}} に保管されたすべての認証材料をまとめて取得できる（Can）。取得した認証材料は正規のものとして使えるため、利用先のシステムでは攻撃と区別しにくい。一方、利用者ごと・アプリケーションごとに読み出せるパスを最小に絞り、短命の資格情報を動的に発行し、読み出しを監査ログで追跡していれば、1 つの資格情報を入手しても取得できるのはその用途の認証材料に限られ、異常な読み出しは検知される（Cannot）。blast radius は {{nodeName}} の読み出し権限が届くすべての認証材料と、それが許すアクセス範囲。"
    mitigation: "[Foundation] アプリケーション・利用者ごとに読み出せるシークレットのパスを最小に絞り、全体を読める資格情報を日常の運用で使わない。初期の管理者トークンや復旧用の鍵は運用後に無効化または分割保管する。 [Enterprise] 長寿命のシークレットを、利用時に発行する短命の資格情報（動的シークレット）に置き換える。読み出しを監査ログに残し、通常と異なる量・時間帯の読み出しを検知する。シークレットのローテーションを自動化する。 [Advanced] ワークロードアイデンティティでシークレット管理への認証自体から静的な資格情報を無くす。鍵の保護に HSM を使い、管理操作に複数人の承認を求める。"
    appliesTo:
      kind: node
      nodeType: SECRETS_VAULT
      # シークレットを読み出す利用元と接続されているとき発火する。
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-01"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
    references:
      - title: "OWASP Secrets Management Cheat Sheet（最小権限・動的シークレット・監査）"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      # 置き場所を問わない認証材料の散在は credential-sprawl が扱う（別 canonicalId）。
      - title: "MITRE ATT&CK T1555.006 - Credentials from Password Stores: Cloud Secrets Management Stores（シークレット管理からの認証材料の一括取得）"
        url: "https://attack.mitre.org/techniques/T1555/006/"

  # ── API_DEV_WORKSPACE: 共有ワークスペースからの認証材料の露出 ──────────
  - id: api-dev-workspace-secret-exposure-001
    canonicalId: api-workspace-secret-exposure
    framework: STRIDE
    category: "Information Disclosure"
    name: "API 開発ツールの共有ワークスペースからの認証材料の露出"
    severity: High
    description: "{{nodeName}} のコレクションや環境変数には、API を試すための API キー・アクセストークン・パスワードが書き込まれやすい。ワークスペースを誤って公開設定にしたり、社外の協力者を招待したり、本番の認証材料を入れたままコレクションを書き出して共有したりすると、それを見た第三者は認証材料をそのまま使って本番の API を呼び出せる（Can）。公開されたワークスペースは検索で見つけられるため、攻撃者が組織名で探して収集することもできる。一方、ワークスペースの公開を組織の設定で禁止し、認証材料をツールのシークレット機能や外部のシークレット管理から実行時に読み込み、コレクションや共有する値に実際の値を残さず、開発用と本番用の認証材料を分けていれば、ワークスペースが見られても本番の API は呼び出せない（Cannot）。blast radius は {{nodeName}} に保存された認証材料が許す全 API。"
    mitigation: "[Foundation] ワークスペースの公開を組織の設定で禁止し、既存のワークスペースの公開範囲と参加者を棚卸しする。コレクション・環境変数に保存された認証材料を探し、見つかったものは失効させて再発行する。本番の認証材料を開発ツールに保存しない。 [Enterprise] 認証材料はツールのシークレット機能や外部のシークレット管理から実行時に読み込み、共有される値には残さない。開発・テスト用の認証材料を本番と分け、権限と有効期限を絞る。公開ワークスペースに自組織の認証材料が無いかを定期的に検索する。 [Advanced] ワークスペースの書き出し・共有の操作を監査ログで追跡し、シークレットスキャンをワークスペースにも適用する。"
    appliesTo:
      kind: node
      nodeType: API_DEV_WORKSPACE
      # 保存された認証材料の露出はワークスペースの存在そのものに伴う内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-01"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      - title: "OWASP Secrets Management Cheat Sheet（シークレットの検出と共有の禁止）"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      # 認証材料の置き場所を問わない一般論は credential-sprawl が扱う（別 canonicalId）。
      - title: "MITRE ATT&CK T1593 - Search Open Websites/Domains（公開されたワークスペースの検索）"
        url: "https://attack.mitre.org/techniques/T1593/"
      - title: "MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials In Files（コレクション・環境変数に残った認証材料の取得）"
        url: "https://attack.mitre.org/techniques/T1552/001/"

  # ── CI_PIPELINE: 汚染されたパイプラインの実行と認証材料の窃取 ──────────
  - id: api-ci-pipeline-poisoned-execution-001
    canonicalId: ci-pipeline-poisoned-execution
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "CI/CD パイプラインの汚染と認証材料の窃取"
    severity: High
    description: "{{nodeName}} はリポジトリにあるビルド定義やテストスクリプトを、デプロイ用・API 呼び出し用の認証材料を持った状態で実行する。プルリクエストやブランチへの書き込みができる攻撃者（外部からの貢献者、乗っ取られた開発者アカウント等）は、ビルド定義やテストスクリプトを書き換えて、{{nodeName}} の権限でコードを実行させ、認証材料の窃取や本番環境への変更ができる（Can）。API テストを CI で実行する構成では、本番の API キーがパイプラインに渡されていることも多い。一方、レビュー前のコードを認証材料の無い環境でだけ実行し、認証材料を必要なジョブだけに短命で発行し、本番への適用を保護されたブランチと承認に限定していれば、ビルド定義を書き換えても認証材料には届かない（Cannot）。blast radius は {{nodeName}} に渡された認証材料と、デプロイ先の環境全体。"
    mitigation: "[Foundation] 外部からのプルリクエストなど未レビューのコードは、認証材料を渡さない環境で実行する。本番に関わるジョブは保護されたブランチからだけ実行し、ビルド定義の変更をレビュー必須にする。パイプラインのログに認証材料が出力されないようにする。 [Enterprise] 長寿命の認証材料を CI に保存せず、OIDC 等でジョブごとに短命の資格情報を発行する。ジョブごとに渡す認証材料を必要最小にし、本番へのデプロイには承認を求める。 [Advanced] ビルド環境を毎回使い捨てにし、外部への通信を許可リストで制限する。成果物に署名し、デプロイ時に検証する。"
    appliesTo:
      kind: node
      nodeType: CI_PIPELINE
      # ビルド定義を実行する仕組みそのものに伴う内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-06"
      - standard: nist-csf-2.0
        ref: "PR.AA-01"
    references:
      - title: "OWASP Top 10 CI/CD Security Risks - CICD-SEC-4 Poisoned Pipeline Execution / CICD-SEC-6 Insufficient Credential Hygiene"
        url: "https://owasp.org/www-project-top-10-ci-cd-security-risks/"
      - title: "MITRE ATT&CK T1677 - Poisoned Pipeline Execution（ビルド定義・テストスクリプトの書き換えによる実行）"
        url: "https://attack.mitre.org/techniques/T1677/"

  # ── API_SPEC: API の棚卸しと仕様の乖離 ──────────────────────────
  - id: api-spec-improper-inventory-001
    canonicalId: api-improper-inventory
    framework: STRIDE
    category: "Information Disclosure"
    name: "API の棚卸し不備（古い版・未登録の API の残存）"
    severity: Medium
    description: "{{nodeName}} が実際に公開されている API と一致していない場合、仕様書に載っていない古い版のエンドポイント、テスト用のエンドポイント、廃止したはずの API が稼働し続ける。これらは新しい版で入れた認可や入力検査が適用されていないことが多く、攻撃者は古い版の URL を推測するだけで弱い実装に到達できる（Can）。仕様書を公開している場合は、内部向けの API や認証方式の情報も攻撃者の偵察材料になる。一方、稼働中の API を仕様書と突き合わせて棚卸しし、仕様書に無い API をゲートウェイで遮断し、廃止した版を期限を決めて停止していれば、管理外の API は外部から到達できない（Cannot）。blast radius は棚卸しから漏れたすべての API。"
    mitigation: "[Foundation] 稼働中の API（ホスト・版・環境）の一覧を作り、仕様書と所有者を紐づける。廃止した版・テスト用のエンドポイントを停止する。公開する仕様書から内部向けの API を除く。 [Enterprise] 仕様書をゲートウェイの構成と同じリポジトリで管理し、仕様書に無いルートを公開しない。ゲートウェイのアクセスログから仕様書に無い API への呼び出しを検出する。 [Advanced] 仕様書と実装の差分を CI で検査し、乖離をリリースの阻止条件にする。"
    appliesTo:
      kind: node
      nodeType: API_SPEC
      # ドキュメント型は canContain で他コンポーネント内に置かれる設計で、エッジ接続を前提としない。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "ID.AM-02"
      - standard: nist-csf-2.0
        ref: "ID.AM-07"
    references:
      - title: "OWASP API Security Top 10 2023 - API9:2023 Improper Inventory Management"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa9-improper-inventory-management/"
      - title: "MITRE ATT&CK T1595.003 - Active Scanning: Wordlist Scanning（古い版・未登録のエンドポイントの推測）"
        url: "https://attack.mitre.org/techniques/T1595/003/"

  # ── BACKEND_API / GATEWAY: モバイルアプリに埋め込んだ秘密情報への依存（経路依存）──
  - id: api-mobile-embedded-secret-001
    canonicalId: api-mobile-embedded-client-secret
    framework: STRIDE
    category: "Spoofing"
    name: "モバイルアプリに埋め込んだ秘密情報による呼び出し元の確認"
    severity: High
    description: "{{nodeName}} はスマートフォンのアプリから呼び出される。アプリの中に API キー・クライアントシークレット・署名用の鍵を埋め込み、それを持っていることを「正規のアプリからの呼び出し」の証明にしている場合、攻撃者はアプリを入手して解析するだけでその値を取り出し、アプリを介さずにスクリプトから {{nodeName}} を直接呼び出せる（Can）。アプリは利用者の端末に配布されるため、難読化しても秘密情報は守れない（OAuth 2.0 でも、ネイティブアプリはシークレットを秘匿できない公開クライアントとして扱う）。アプリを経由しない呼び出しは、アプリ側の画面遷移や入力チェックを前提にした制限をすべて素通りし、BOLA などの認可不備と組み合わさると大量の情報取得につながる。一方、アプリに埋め込んだ値を認証にも認可にも使わず、利用者ごとのトークン（PKCE を用いた認可コードフロー等）で呼び出し元の利用者を確かめ、すべての認可判断をサーバー側で行っていれば、取り出した値だけでは何もできない（Cannot）。blast radius はアプリに埋め込んだ値で呼び出せる {{nodeName}} の全機能。"
    mitigation: "[Foundation] アプリに埋め込んだ API キーやシークレットを、認証・認可の根拠として使わない（アプリの識別や利用量の集計に限る）。利用者の認証は、PKCE を用いた OAuth 2.0 の認可コードフロー等で発行した、利用者ごとの短命なトークンで行う。認可の判断はすべてサーバー側で行い、アプリ側のチェックに頼らない。 [Enterprise] 一度でも配布したアプリに含まれていた秘密情報は漏えい済みとして扱い、ローテーションできる設計にする。OS が提供するアプリ・端末の正当性確認（App Attest / Play Integrity 等）を、補助的なシグナルとして取り入れる。 [Advanced] リリースするアプリのビルドを解析し、秘密情報の埋め込みを CI で検出する。アプリを経由しない呼び出しのパターン（アプリでは起こらない順序・頻度）を検知する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: BACKEND_API
        - nodeType: GATEWAY
      # スマートフォンのアプリから呼び出される経路があるときのみ発火する。
      connection:
        direction: inbound
        peerType: [SMARTPHONE]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-01"
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
    references:
      - title: "IETF RFC 8252 - OAuth 2.0 for Native Apps（ネイティブアプリは公開クライアント）"
        url: "https://www.rfc-editor.org/rfc/rfc8252"
      - title: "IETF RFC 7636 - Proof Key for Code Exchange by OAuth Public Clients（PKCE）"
        url: "https://www.rfc-editor.org/rfc/rfc7636"
      - title: "OWASP Mobile Application Security Verification Standard（MASVS）"
        url: "https://mas.owasp.org/MASVS/"
      - title: "MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials In Files（アプリの解析による埋め込みの秘密情報の取り出し）"
        url: "https://attack.mitre.org/techniques/T1552/001/"

  # ── BACKEND_API / GATEWAY: 個人情報の大量取得の制限・検知の欠如（経路依存）──
  - id: api-bulk-data-harvesting-001
    canonicalId: api-bulk-data-harvesting
    framework: STRIDE
    category: "Information Disclosure"
    name: "API を使った個人情報の大量取得の制限・検知の欠如"
    severity: High
    description: "{{nodeName}} は利用者の端末や、利用者の操作を代行する SaaS・業務アプリケーション（CRM 等）から呼び出され、会員情報や注文情報などの個人情報を返す。1 つのアカウント・トークン・送信元から取得できる件数や頻度に上限が無く、取得量の異常を監視していない場合、攻撃者は認可不備・漏えいしたトークン・大量に用意したアカウント・乗っ取った SaaS の利用者アカウントのいずれかを足がかりに、スクリプトで呼び出しを繰り返し、数日のうちに数十万〜数百万件の個人情報を集められる（Can）。一件ずつの応答は正常な形をしているため、マルウェアや侵入の痕跡が無く、エラー監視やサーバーの負荷監視では気づけない。一方、利用者・トークン・送信元ごとに取得件数と頻度の上限を設け、通常の利用ではありえない件数や、多数の異なる利用者のデータへのアクセスを検知して自動で遮断していれば、足がかりを得られても取得できるのは一部にとどまり、短時間で止められる（Cannot）。blast radius は検知・遮断までの間に取得された全件で、上限が無ければ {{nodeName}} が扱う全利用者の個人情報。"
    mitigation: "[Foundation] 個人情報を返す API ごとに、利用者・トークン・送信元 IP 単位の呼び出し回数の上限を設ける。1 回の応答で返す件数と項目を必要最小限にする（一覧にページングの上限を設ける）。アクセスログに呼び出し元の利用者と取得したレコードの所有者を残す。 [Enterprise] 1 つのアカウント・トークン・送信元が多数の異なる利用者のデータを取得するパターンを検知し、自動で遮断・通知する。Bot 管理や送信元の評価で、アプリ以外からの機械的な呼び出しを抑える。個人情報を返す API の利用量を日次で監視する。SaaS がサービス用の資格情報でまとめて呼び出す構成では、送信元 IP とトークンが全利用者で共通になるため、操作を代行している利用者の ID を受け取り、利用者単位で上限と検知を掛ける。 [Advanced] 取得量の異常を検知したときに、トークンの失効・アカウント停止・API の一時停止まで自動で実行する手順を整える。レコードの ID を推測できない値にし、列挙そのものを難しくする。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: BACKEND_API
        - nodeType: GATEWAY
      # 利用者の端末・利用者、または利用者の操作を代行する SaaS・業務アプリ（CRM / SAAS / OTHER_APP）から
      # 呼び出される経路があるときのみ発火する。
      connection:
        direction: inbound
        peerType: [SMARTPHONE, PC, USER, EXTERNAL_ENTITY, CRM, SAAS, OTHER_APP]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "DE.CM-01"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      - title: "OWASP API Security Top 10 2023 - API6:2023 Unrestricted Access to Sensitive Business Flows"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa6-unrestricted-access-to-sensitive-business-flows/"
      - title: "OWASP API Security Top 10 2023 - API4:2023 Unrestricted Resource Consumption"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
      - title: "OWASP Automated Threats to Web Applications（OAT-011 Scraping）"
        url: "https://owasp.org/www-project-automated-threats-to-web-applications/"
      - title: "MITRE ATT&CK T1119 - Automated Collection（スクリプトによる個人情報の繰り返しの取得）"
        url: "https://attack.mitre.org/techniques/T1119/"

  # ── BACKEND_API: 機能単位の認可不備（API5 BFLA）──────────────────
  - id: api-backend-function-level-authorization-001
    canonicalId: api-function-level-authorization
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "機能単位の認可不備（BFLA）"
    severity: High
    description: "{{nodeName}} が、管理者用・社内業務用・他システム連携用の API と、一般の利用者向けの API を同じ入口で提供している。各 API が「呼び出し元のトークンの種類・役割で、この機能を使ってよいか」を確かめていない場合、一般の利用者として正規にログインした攻撃者は、アプリの通信から推測した URL やメソッド（GET を PUT・DELETE に変える、/users/me を /admin/users に変える等）を試すだけで、他の会員の一覧取得・検索・一括出力や、権限の変更などの管理機能を呼び出せる（Can）。アプリの画面に管理機能のボタンが無いことは防御にならない。一方、すべての API で呼び出し元の役割と許可された機能を照合し、既定を拒否にして、管理用・内部用の API を利用者向けとは別の入口・別のトークン発行元に分けていれば、利用者のトークンでは管理機能に届かない（Cannot）。blast radius は利用者のトークンで呼び出せてしまう管理機能すべてと、それらが扱う全利用者のデータ。"
    mitigation: "[Foundation] すべての API で、呼び出し元の役割（一般利用者・管理者・内部システム）と、その API の機能を使ってよいかを照合する。既定は拒否とし、許可する役割を API ごとに明示する。メソッドごと（GET・PUT・DELETE 等）にも判定する。 [Enterprise] 管理用・内部用の API を、利用者向けとは別のホスト・別のネットワーク経路で提供し、利用者向けのトークンでは到達できない構成にする。利用者のトークンで管理用 API を呼ぶテストケースを CI で毎回実行する。 [Advanced] 認可の判定をポリシーエンジンに集約し、API 仕様書の役割定義と実装の差を継続的に検査する。利用者のトークンによる管理用 API の呼び出しを検知・通知する。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 呼び出し元からの入力を受けるとき発火する（BOLA ルールと同じ前提）。
      connection:
        direction: inbound
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
    references:
      - title: "OWASP API Security Top 10 2023 - API5:2023 Broken Function Level Authorization"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/"
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（管理者用の機能の認可不備の悪用）"
        url: "https://attack.mitre.org/techniques/T1190/"

  # ── BACKEND_API / GATEWAY: トークン・セッションの検証不備（API2）──────
  - id: api-token-session-validation-gap-001
    canonicalId: api-token-validation-gap
    framework: STRIDE
    category: "Spoofing"
    name: "API でのトークン・セッションの検証不備"
    severity: High
    description: "{{nodeName}} は、利用者の端末や、利用者の操作を代行する SaaS・業務アプリケーションから送られるセッショントークンや JWT で呼び出し元の利用者を確かめている。署名を検証せずにトークンの中の会員 ID を信用している、有効期限やログアウト・失効を確認していない、トークンの用途（表示用・特定機能用）や権限の範囲（スコープ）を見ていない、のいずれかがあると、攻撃者はトークンの中身を書き換えて他の会員になりすましたり、期限切れや盗んだトークンを使い続けたり、権限の弱いトークンで個人情報を返す API まで呼び出したりできる（Can）。署名アルゴリズムの指定（alg）を受け取ったトークン任せにしていると、署名なしや別の鍵による偽造トークンも受理してしまう。一方、すべてのリクエストでサーバー側の鍵による署名・発行元・宛先（audience）・有効期限・失効を検証し、受け付けるアルゴリズムを固定し、API ごとに必要なスコープを確かめていれば、書き換えたトークンも期限切れのトークンも権限の足りないトークンも拒否される（Cannot）。blast radius はなりすませる全利用者のデータと、そのトークンで呼べる全機能。"
    mitigation: "[Foundation] すべてのリクエストで、トークンの署名・発行元・宛先（audience）・有効期限を検証する。受け付ける署名アルゴリズムをサーバー側で固定し、署名なしのトークンを拒否する。会員 ID は、リクエストのパラメーターや署名を検証していないトークンの値ではなく、署名を検証したトークンの主体（sub）だけから得る。 [Enterprise] API ごとに必要なスコープ・用途を定め、それを満たさないトークンを拒否する（表示用のトークンで個人情報 API を呼ばせない）。アクセストークンの有効期限を短くし、ログアウト・パスワード変更・不正検知時に失効させる仕組みを持つ。トークン検証を共通のライブラリやゲートウェイに集約する。 [Advanced] トークンを端末やクライアントに紐づけ（DPoP・mTLS 等による送信者制約）、盗まれたトークンを別の端末から使えないようにする。検証失敗や失効済みトークンの利用を監視する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: BACKEND_API
        - nodeType: GATEWAY
      # 利用者の端末・利用者、または利用者の操作を代行する SaaS・業務アプリ（CRM / SAAS / OTHER_APP）から
      # トークン付きで呼び出される経路があるときのみ発火する。
      connection:
        direction: inbound
        peerType: [SMARTPHONE, PC, USER, EXTERNAL_ENTITY, CRM, SAAS, OTHER_APP]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
    references:
      - title: "OWASP API Security Top 10 2023 - API2:2023 Broken Authentication"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa2-broken-authentication/"
      - title: "IETF RFC 8725 - JSON Web Token Best Current Practices"
        url: "https://www.rfc-editor.org/rfc/rfc8725"
      - title: "OWASP Cheat Sheet Series - JSON Web Token for Java Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"
      - title: "MITRE ATT&CK T1550.001 - Use Alternate Authentication Material: Application Access Token（期限切れ・失効済みのトークンの再利用）"
        url: "https://attack.mitre.org/techniques/T1550/001/"
      - title: "MITRE ATT&CK T1606 - Forge Web Credentials（署名を検証しないトークンの書き換え）"
        url: "https://attack.mitre.org/techniques/T1606/"

  # ── BACKEND_API: サーバー側リクエストフォージェリ（API7 SSRF）──────────
  - id: api-backend-ssrf-001
    canonicalId: api-server-side-request-forgery
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "サーバー側リクエストフォージェリ（SSRF）"
    severity: High
    description: "{{nodeName}} に、呼び出し元から受け取った URL やホスト名を使ってサーバー自身が通信する機能（URL を指定した画像の取り込み・プレビュー、文書の変換、Webhook の送信先の登録、外部データの取得等）がある。宛先を検証していない場合、攻撃者は宛先に内部ネットワークのアドレス、クラウドのメタデータサービス（169.254.169.254 等）、file:// などのローカルファイルを指定し、{{nodeName}} を踏み台にして、外部からは届かない内部の管理画面・データベース・別のサーバーに到達したり、サーバーに付与されたクラウドの一時的な認証情報を取り出したりできる（Can）。どのパラメーターが URL を受け取るかはアプリを解析すれば分かり、アプリ側で宛先を制限していても、API を直接呼び出せば素通りできる。一方、サーバー側で宛先のスキーム・ホスト・ポートを許可リストで限定し、名前解決後の IP アドレスが内部・リンクローカルでないことを確かめ、リダイレクトを追わず、メタデータサービスをトークン必須の方式に限り、{{nodeName}} からの送信を必要な宛先だけに絞っていれば、宛先を書き換えても内部やメタデータには届かない（Cannot）。blast radius は {{nodeName}} から到達できる内部ネットワークのすべてと、{{nodeName}} に付与されたクラウドの権限が許す範囲。"
    mitigation: "[Foundation] URL・ホスト名を受け取る機能を洗い出し、不要なものはやめる（URL ではなくファイルそのものを受け取る等）。残す機能では、サーバー側で宛先のスキーム（https のみ等）・ホスト・ポートを許可リストで限定する。名前解決した後の IP アドレスが、プライベート・ループバック・リンクローカル（メタデータサービスを含む）でないことを確かめ、リダイレクトは追わない。 [Enterprise] クラウドのメタデータサービスをトークン必須の方式（AWS の IMDSv2 等）に限定し、API サーバーに付与する権限を最小にする。API サーバーから内部ネットワーク・インターネットへの送信を、ネットワーク側でも必要な宛先だけに制限する。画像処理・文書変換のライブラリで、外部の参照やローカルファイルの読み込みを無効にする。 [Advanced] URL を取得する処理を、内部ネットワークに届かない分離した環境（専用の送信用プロキシ・サンドボックス）に移す。API サーバーからメタデータサービスや想定外の内部宛先への通信を検知・通知する。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 呼び出し元からの入力を受けるとき発火する（BOLA ルールと同じ前提）。
      # 到達先はエッジに描かれていなくても成立する（メタデータサービス等）ため、outbound は条件にしない。
      connection:
        direction: inbound
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-06"
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
    references:
      - title: "OWASP API Security Top 10 2023 - API7:2023 Server Side Request Forgery"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa7-server-side-request-forgery/"
      - title: "MITRE CWE-918: Server-Side Request Forgery (SSRF)"
        url: "https://cwe.mitre.org/data/definitions/918.html"
      - title: "OWASP Cheat Sheet Series - Server-Side Request Forgery Prevention Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
      - title: "NICT CYNEX（LETTICE）注意喚起「相次ぐ情報漏洩、その原因の一つは『アプリ解析からのサーバ攻撃』」（2026-10-13）"
        url: "https://cynex.nict.go.jp/library/261013-01.html"
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（宛先を検証しない機能の悪用）"
        url: "https://attack.mitre.org/techniques/T1190/"
      - title: "MITRE ATT&CK T1552.005 - Unsecured Credentials: Cloud Instance Metadata API（メタデータサービスからの認証情報の取得）"
        url: "https://attack.mitre.org/techniques/T1552/005/"

  # ── BACKEND_API: SQL / NoSQL インジェクション ─────────────────────
  - id: api-backend-query-injection-001
    canonicalId: api-query-injection
    framework: STRIDE
    category: "Tampering"
    name: "API パラメーターによる SQL / NoSQL インジェクション"
    severity: High
    description: "{{nodeName}} は、呼び出し元から受け取ったパラメーター（クエリ文字列・JSON の本文）を使ってデータベースを検索・更新する。値を文字列の連結でクエリに埋め込んでいる場合や、JSON 本文のオブジェクトをそのまま検索条件に渡している場合、攻撃者は値の中にクエリの構文（SQL の引用符や UNION 句、NoSQL の $ne・$gt・$where 等の演算子）を入れて、条件を書き換えて他人のデータや全件を取り出したり、ログインの条件を無効にしたり、データを改ざん・削除したりできる（Can）。パラメーターの名前と形はアプリを解析すれば分かり、アプリ側の入力チェックは API を直接呼び出せば素通りできる。WAF は既知の書き方を減らせるが、JSON の構造を使った NoSQL の演算子などは見逃しやすい。一方、すべてのクエリをプレースホルダー（パラメーター化クエリ）やドライバーの安全な API で組み立て、受け取る値の型と形をサーバー側で検証し、オブジェクトや演算子を検索条件に入れさせず、データベースの接続アカウントの権限を必要最小にしていれば、値はデータとしてしか扱われない（Cannot）。blast radius は {{nodeName}} の接続アカウントで読み書きできるデータベースの全データ。"
    mitigation: "[Foundation] SQL はすべてプレースホルダー（パラメーター化クエリ）で組み立て、文字列の連結でクエリを作らない。NoSQL では、受け取った値を検索条件に入れる前に型を確かめ（文字列が来るはずの項目にオブジェクトや配列を受け付けない）、$ で始まる演算子をリクエストから受け付けない。受け取る項目・型・長さを API ごとにスキーマで検証する。 [Enterprise] データベースの接続アカウントを API ごとに分け、必要な表・操作だけを許可する（管理者権限で接続しない）。データベースのエラー内容を応答に含めない。インジェクションの試行を WAF やアクセスログで監視し、インジェクションの検査（SAST・DAST）を CI で毎回実行する。 [Advanced] 並べ替えの項目やフィルターの式を自由に受け取る機能を、許可リストの選択肢に置き換える。データベース側で想定外のクエリ（全件の取得・管理用の命令）を検知する。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 呼び出し元からの入力を受けるとき発火する（BOLA ルールと同じ前提）。
      connection:
        direction: inbound
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-06"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      - title: "MITRE CWE-89: Improper Neutralization of Special Elements used in an SQL Command (SQL Injection)"
        url: "https://cwe.mitre.org/data/definitions/89.html"
      - title: "MITRE CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
        url: "https://cwe.mitre.org/data/definitions/943.html"
      - title: "OWASP Cheat Sheet Series - Injection Prevention Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html"
      - title: "OWASP Cheat Sheet Series - Query Parameterization Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html"
      - title: "NICT CYNEX（LETTICE）注意喚起「相次ぐ情報漏洩、その原因の一つは『アプリ解析からのサーバ攻撃』」（2026-10-13）"
        url: "https://cynex.nict.go.jp/library/261013-01.html"
      # フォームの値が下流で解釈される経路は web-form-input-injection（WEB_FORM）が扱う（別 canonicalId）。
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（クエリへの構文の注入）"
        url: "https://attack.mitre.org/techniques/T1190/"

  # ── BACKEND_API: デシリアライズ・ファイル書き込み・OS コマンドによるコード実行 ──
  - id: api-backend-remote-code-execution-001
    canonicalId: api-server-code-execution
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "API サーバー上での任意のコード実行（デシリアライズ・ファイル書き込み・OS コマンド）"
    severity: Critical
    description: "{{nodeName}} が、呼び出し元から受け取ったデータをプログラムのオブジェクトとして復元する（危険なデシリアライズ）、アップロードされたファイルを利用者の指定した名前・場所に保存する、受け取った値を OS コマンドの引数に渡す、のいずれかを行っている場合、攻撃者は細工したデータ・ファイル名（../ を含むパス等）・コマンドの区切り文字を送り、{{nodeName}} の上で任意のプログラムを実行させたり、設定ファイルやプログラム自体を上書きしたりできる（Can）。運用・保守用の機能（ファイルの読み書き、コマンドの実行、デバッグ用の画面）が利用者向けの API と同じ入口で公開されていれば、それを呼ぶだけで同じことができる。コードを実行されると、{{nodeName}} が持つデータベースの接続情報・API キー・クラウドの権限を使って、つながる全システムへ侵入を広げられる。一方、信頼できないデータをオブジェクトとして復元せず（JSON 等の単純な形式で受け、型を検証する）、アップロードしたファイルをサーバーが決めた名前で実行されない場所に保存し、OS コマンドを呼ばずにライブラリの機能を使い、管理用の機能を公開していなければ、細工したデータを送っても実行には至らない（Cannot）。blast radius は {{nodeName}} の実行権限で触れられる全データと認証情報、そこから到達できる内部ネットワーク。"
    mitigation: "[Foundation] 信頼できない入力を、言語固有の形式（Java のシリアライズ、PHP の unserialize、Python の pickle 等）でオブジェクトに復元しない。JSON 等の単純な形式で受け取り、型をスキーマで検証する。アップロードしたファイルは、サーバーが生成した名前で、Web から実行されない場所（公開ディレクトリの外・オブジェクトストレージ）に保存し、利用者が指定したパスを使わない。OS コマンドの呼び出しをライブラリの機能に置き換え、やむを得ない場合も引数を許可リストで検証し、シェルを介さずに渡す。運用・デバッグ用の機能を利用者向けの API に公開しない。 [Enterprise] API サーバーを最小権限の実行ユーザーで動かし、プログラムの置き場所を書き込み不可にする。使っているライブラリ・フレームワークの脆弱性（デシリアライズ等）を期限を決めて修正する。API サーバーから起動されるシェルや想定外のプロセスを EDR 等で検知する。 [Advanced] API サーバーを読み取り専用のコンテナイメージで動かし、実行中にファイルを書き換えられない構成にする。API サーバーから内部・外部への通信を必要な宛先だけに制限し、侵害時の持ち出しと横展開を抑える。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 呼び出し元からの入力を受けるとき発火する（BOLA ルールと同じ前提）。
      connection:
        direction: inbound
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-06"
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
    references:
      - title: "MITRE CWE-502: Deserialization of Untrusted Data"
        url: "https://cwe.mitre.org/data/definitions/502.html"
      - title: "MITRE CWE-78: Improper Neutralization of Special Elements used in an OS Command (OS Command Injection)"
        url: "https://cwe.mitre.org/data/definitions/78.html"
      - title: "MITRE CWE-434: Unrestricted Upload of File with Dangerous Type"
        url: "https://cwe.mitre.org/data/definitions/434.html"
      - title: "OWASP Cheat Sheet Series - Deserialization Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
      - title: "OWASP Cheat Sheet Series - File Upload Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"
      - title: "OWASP Cheat Sheet Series - OS Command Injection Defense Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html"
      - title: "NICT CYNEX（LETTICE）注意喚起「相次ぐ情報漏洩、その原因の一つは『アプリ解析からのサーバ攻撃』」（2026-10-13）"
        url: "https://cynex.nict.go.jp/library/261013-01.html"
      # 公開 Web サーバーへの Web シェルの設置・常駐は web-shell-implant（FRONT_END_SERVER）が扱う（別 canonicalId）。
      - title: "MITRE ATT&CK T1190 - Exploit Public-Facing Application（デシリアライズ・ファイル書き込み・OS コマンドの悪用）"
        url: "https://attack.mitre.org/techniques/T1190/"
      - title: "MITRE ATT&CK T1505.003 - Server Software Component: Web Shell（書き込んだファイルによる Web シェルの設置）"
        url: "https://attack.mitre.org/techniques/T1505/003/"
      - title: "MITRE ATT&CK T1059 - Command and Scripting Interpreter（OS コマンドの実行）"
        url: "https://attack.mitre.org/techniques/T1059/"

  # ── BACKEND_API / GATEWAY: エラー応答による内部情報の露出（API8 / CWE-209）──
  - id: api-error-response-disclosure-001
    canonicalId: api-error-information-disclosure
    framework: STRIDE
    category: "Information Disclosure"
    name: "エラー応答による内部情報の露出"
    severity: Medium
    description: "{{nodeName}} は外部の呼び出し元（利用者の端末や、利用者の操作を代行する SaaS・業務アプリケーション）に応答を返す。処理に失敗したときに、例外のメッセージやスタックトレース、下流から返ったエラー本文をそのまま返している場合、攻撃者は不正な値をわざと送ったり、下流が止まっている時間帯を狙ったりするだけで、内部のホスト名・URL、使っているミドルウェア・フレームワークとその版、API の層の構成（どの内部 API を経由しているか）、データベースのテーブル名や問い合わせの一部を集められる（Can）。集めた情報は、既知の脆弱性の特定、ゲートウェイを経由しない内部 API の推測、インジェクションの組み立てに使われる。エラーの応答は正常系の試験では目に入りにくく、下流の障害時にだけ現れるため見落とされやすい。一方、呼び出し元には汎用的なエラーコードと追跡用の ID（相関 ID）だけを返し、詳細は内部のログにだけ記録し、外部との境界で下流のエラー本文を置き換えていれば、エラーを起こさせても内部の構成は分からない（Cannot）。blast radius は応答から推測できる {{nodeName}} の背後の構成全体で、これ自体はデータを漏らさないが、他の攻撃の下調べを大きく省かせる。"
    mitigation: "[Foundation] 呼び出し元へのエラー応答は、汎用的なメッセージ・エラーコード・相関 ID に限り、例外のメッセージ・スタックトレース・内部のホスト名や URL・ミドルウェアの名前と版を含めない。本番環境でデバッグ用の詳細なエラー表示を無効にする。応答ヘッダーからサーバー・フレームワークの名前と版を除く。 [Enterprise] 外部との境界（API ゲートウェイ等）に共通のエラー処理を設け、下流から返ったエラー本文を標準の形式（RFC 9457 Problem Details 等）に置き換える。詳細は相関 ID で引ける内部のログにだけ残し、ログを見られる人を運用者に限る。下流の停止・タイムアウト・不正な入力を起こす試験で、エラー応答に内部の情報が出ないことを確かめる。 [Advanced] 外部へのエラー応答を監視し、内部のホスト名やスタックトレースの形をした文字列を検知して通知する。同じ呼び出し元が短時間に多数のエラーを起こすパターン（偵察）を検知する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: BACKEND_API
        - nodeType: GATEWAY
      # 外部の呼び出し元（利用者の端末・利用者、または利用者の操作を代行する SaaS・業務アプリ）に
      # 応答を返す経路があるときのみ発火する。ゲートウェイの背後の内部 API には出さない。
      connection:
        direction: inbound
        peerType: [SMARTPHONE, PC, USER, EXTERNAL_ENTITY, CRM, SAAS, OTHER_APP]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "OWASP API Security Top 10 2023 - API8:2023 Security Misconfiguration（エラー応答にスタックトレース等を含める）"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"
      - title: "MITRE CWE-209: Generation of Error Message Containing Sensitive Information"
        url: "https://cwe.mitre.org/data/definitions/209.html"
      - title: "OWASP Cheat Sheet Series - Error Handling Cheat Sheet"
        url: "https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html"
      - title: "MITRE ATT&CK T1592.002 - Gather Victim Host Information: Software（エラー応答からのミドルウェア・版の把握）"
        url: "https://attack.mitre.org/techniques/T1592/002/"

  # ── BACKEND_API: 多層 API での下流障害の連鎖（タイムアウト・サーキットブレーカー・隔離の欠如）──
  - id: api-downstream-cascading-failure-001
    canonicalId: api-downstream-cascading-failure
    framework: STRIDE
    category: "Denial of Service"
    name: "多層 API での下流障害の連鎖（タイムアウト・サーキットブレーカー・隔離の欠如）"
    severity: Medium
    description: "{{nodeName}} は処理の途中で下流の API・データベース・外部サービスを同期的に呼び出し、その応答を待ってから呼び出し元に返す。下流の呼び出しにタイムアウトが無い（または上流より長い）、失敗し続ける下流への呼び出しを止める仕組み（サーキットブレーカー）が無い、下流ごとに接続・スレッドの枠を分けていない、再試行に回数の上限と間隔が無い、のいずれかがあると、下流の 1 つが止まったり遅くなったりしただけで {{nodeName}} の接続とスレッドが応答待ちで埋まり、その下流と関係の無い機能まで止まり、さらに {{nodeName}} を呼ぶ上流の層へと順に停止が広がる（Can）。攻撃者は、重い処理（文書の生成・大量の検索等）を起こす要求を繰り返して下流を意図的に遅くし、入口のレート制限の範囲内の量で全体を止めることもできる。一方、下流の呼び出しごとに上流より短いタイムアウトを設け、失敗が続く下流への呼び出しをサーキットブレーカーで即座に打ち切り、下流ごとに接続・スレッドの枠を分け（バルクヘッド）、重い処理を非同期の受付に分けていれば、1 つの下流が止まってもその機能だけが速やかにエラーを返し、他の機能と上流の層は動き続ける（Cannot）。blast radius は {{nodeName}} と、それを同期的に呼ぶ上流のすべての層と利用者。"
    mitigation: "[Foundation] 下流の呼び出しすべてにタイムアウトを設け、下流の層ほど短くなるように揃える（上流が先にタイムアウトして下流の処理だけが残る状態を避ける）。再試行には回数の上限と、間隔を徐々に広げる待ち時間を設け、繰り返しても安全な操作に限る。下流が止まっているときは速やかに汎用のエラーを返す。 [Enterprise] 失敗が続く下流への呼び出しを打ち切るサーキットブレーカーを下流ごとに設ける。接続プール・スレッドを下流ごとに分け（バルクヘッド）、1 つの下流の遅延が他の機能に広がらないようにする。文書の生成など重い処理は受付と処理を分けた非同期の方式（キュー等）にし、利用者ごと・機能ごとの同時実行数に上限を設ける。 [Advanced] 下流ごとの応答時間・エラー率・サーキットブレーカーの状態を監視し、相関 ID で層をまたいで追跡する。下流を意図的に止める・遅くする試験（障害注入）で、停止が広がらないことを定期的に確かめる。"
    appliesTo:
      kind: node
      nodeType: BACKEND_API
      # 下流（他の API・データベース・SaaS・業務アプリ）を呼び出す経路があるときのみ発火する。
      # 入口での量の制限は gateway-resource-exhaustion（GATEWAY / REVERSE_PROXY）が扱うため GATEWAY は含めない。
      connection:
        direction: outbound
        peerType: [BACKEND_API, DATABASE, DATA_STORE, SAAS, CRM, OTHER_APP]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-03"
      - standard: nist-csf-2.0
        ref: "PR.IR-04"
    references:
      - title: "NIST SP 800-204 - Security Strategies for Microservices-based Application Systems（サーキットブレーカー・負荷分散・スロットリング）"
        url: "https://csrc.nist.gov/pubs/sp/800/204/final"
      - title: "OWASP API Security Top 10 2023 - API4:2023 Unrestricted Resource Consumption（実行のタイムアウト等）"
        url: "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
      # 入口での量の制限は gateway-resource-exhaustion、AI エージェント間の波及は cascading-failures が扱う（別 canonicalId）。
