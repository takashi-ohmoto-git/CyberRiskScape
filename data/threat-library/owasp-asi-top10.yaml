# OWASP Top 10 for Agentic Applications 2026 (ASI Top 10) ベースの脅威ルール。
# 出典: OWASP GenAI Security Project - Agentic Security Initiative,
#       "OWASP Top 10 for Agentic Applications 2026", Version 2026 (December 2025).
#       https://genai.owasp.org/
# 出典のライセンス: OWASP GenAI Security Project の成果物は CC BY-SA 4.0。
#   本ファイルはカテゴリ名・ID を参照し概念を日本語要約したものであり、
#   本文の逐語転載・翻案は行っていない。
# MITRE ATLAS 2026.09（2026-10-24 に既存ルールの references へ対応づけ。技術 ID と正式名のみ
#   出典つきで参照し本文は転載しない）:
#   AML.T0050 "Command and Scripting Interpreter"、AML.T0053 "AI Agent Tool Invocation"、
#   AML.T0067 "LLM Trusted Output Components Manipulation"、
#   AML.T0081 "Modify AI Agent Configuration"、AML.T0105 "Escape to Host"。
#   https://atlas.mitre.org/techniques/
#
# SPDX-License-Identifier: Apache-2.0
# ライセンス: 本ファイルは Apache License 2.0（LICENSE 参照）。
# 出典の帰属表示は NOTICE を参照。
#
# 重複回避方針（[[anthropic-zt-agents.yaml]] と同じ運用）:
#   ASI Top 10 は既存ライブラリと広範に重なる。本ファイルには既存で未カバー／薄い項目のみ追加する。
#   - ASI01 Goal Hijack       → maestro-agent-goal-misalignment / -untrusted-ingress, atlas-t0051, owasp-llm01 でカバー済
#   - ASI02 Tool Misuse       → maestro-tool-edge / -tool-output-handling, anthropic-zt-tool-chaining, owasp-llm06 でカバー済
#   - ASI03 Identity & Priv   → anthropic-zt-agent-identity-attribution / -confused-deputy / -memory-privilege-retention でカバー済
#   - ASI04 Supply Chain      → anthropic-zt-tool-poisoning-rug-pull, maestro-partner-supply-chain, owasp-llm03, atlas-t0010 でカバー済
#   - ASI06 Memory Poisoning  → maestro-agent-memory-poisoning, anthropic-zt-memory-store-tampering / -shared-context-poisoning でカバー済
#   本ファイルが追加するのは ASI05 / ASI07 / ASI08 / ASI09 / ASI10 の差分のみ。
#   例外として、ASI02 / ASI03 のうち既存でカバーしていない 3 つの問い（承認ゲートの欠落・ツールによる
#   対象範囲外への作用・エージェント自身による能力の拡張）を追加する（2026-10-21）。
#   注: 上記カバー済の各ルールには、references に「ASI0x: …（関連マッピング）」の
#   クロスマッピング出典を併記済み。UI 上でもどの ASI 項目に対応するか確認できる。
#
# mitigation は 3 段階成熟度（[Foundation] / [Enterprise] / [Advanced]）をインライン markup で示す。
# description は Can/Cannot ペアと blast radius を意識して記述する。

schemaVersion: 1

rules:
  # ── ASI05: Unexpected Code Execution (RCE) ──────────────────
  # 既存の owasp-llm05（LLM 出力の不適切な取り扱い）は下流注入を扱うが、
  # エージェント自身のコード生成＋実行（vibe coding / eval ベースメモリ / サンドボックス脱出）は未カバー。
  - id: owasp-asi05-unexpected-code-execution-001
    canonicalId: agent-code-execution-rce
    framework: AgenticAI
    category: "Code Execution"
    name: "エージェント生成コードの予期せぬ実行"
    severity: Critical
    description: "{{nodeName}} がコードを生成・実行する設計（vibe coding・自己修復・eval ベースのメモリ等）の場合、プロンプトインジェクションや安全でないデシリアライズが実行可能挙動に転化し、攻撃者はホスト／コンテナの掌握・永続化・サンドボックス脱出まで到達できる。一方、実行が非 root の読取専用サンドボックスに隔離され egress が遮断されていれば、コード生成自体は成立してもホスト侵害には至らない。"
    mitigation: "[Foundation] eval・任意シェル実行を本番エージェントから排除し、生成コードは入力検証・出力エンコードのうえ専用作業ディレクトリに限定する。 [Enterprise] コード生成と実行を分離して検証ゲートを挟み、非 root のサンドボックスコンテナで egress 許可リスト・静的スキャン後のみ実行する。 [Advanced] microVM/gVisor によるハードウェア分離 + taint-tracking を行い、本番反映前に敵対的ユニットテストと unsafe eval 検知、検知時は自動隔離する。"
    appliesTo:
      kind: node
      # SUB_AGENT もコード生成・実行を担う場合は同等の RCE リスク（§2.22 1.6e anyOf 展開）。
      anyOf:
        - nodeType: AGENT
        - nodeType: SUB_AGENT
      # コード生成・実行能力はエージェント設計自体の性質で、接続関係に依存しない内在的リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI05: Unexpected Code Execution (RCE)"
        url: "https://genai.owasp.org/"
      - title: "MITRE ATLAS AML.T0050 Command and Scripting Interpreter（エージェントが生成したコマンド・コードの実行）"
        url: "https://atlas.mitre.org/techniques/AML.T0050"
      - title: "MITRE ATLAS AML.T0105 Escape to Host（サンドボックスからホストへの脱出）"
        url: "https://atlas.mitre.org/techniques/AML.T0105"

  # ── ASI07: Insecure Inter-Agent Communication ───────────────
  # anthropic-zt-delegation-integrity は委譲経路の認証/暗号化欠如を扱うが、
  # リプレイ・プロトコルダウングレード・ディスカバリ偽装（A2A registration spoofing）は未カバー。
  - id: owasp-asi07-insecure-inter-agent-comms-001
    canonicalId: inter-agent-comms-integrity
    framework: AgenticAI
    category: "Inter-Agent Comm"
    name: "リプレイ・プロトコルダウングレード・ディスカバリ偽装"
    severity: High
    description: "{{sourceName}} から {{targetName}} へのエージェント間メッセージが nonce／タイムスタンプによるリプレイ防止やプロトコル版数固定を欠く場合、攻撃者は委譲・信頼メッセージのリプレイ、旧弱プロトコルへのダウングレード、ディスカバリ／レジストリへの偽エージェント登録により、正規の交換を装って権限混同・誤情報・協調操作を引き起こせる。一方、メッセージが署名・相互認証済みで版数固定されていれば、傍受してもリプレイ・なりすまし登録は成立しない。委譲経路そのものの認証／暗号化欠如は別途 anthropic-zt-delegation-integrity が扱う。"
    mitigation: "[Foundation] エージェント間メッセージに nonce + セッション ID + タイムスタンプを必須化しリプレイを拒否、許可プロトコル版数を固定して旧モード／未知スキーマを拒否する。 [Enterprise] ディスカバリ／レジストリのメッセージを暗号学的アイデンティティで認証し、署名済み agent card のみ受理する。 [Advanced] PKI 信頼ルートと attested registry で継続検証し、メタデータ推論対策に固定長／パディングメッセージを用いる。"
    appliesTo:
      kind: edge
      when:
        sourceType: [AGENT]
        targetType: [AGENT, SUB_AGENT]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI07: Insecure Inter-Agent Communication"
        url: "https://genai.owasp.org/"

  # ── ASI08: Cascading Failures ───────────────────────────────
  # 初期欠陥の「発生源」ではなく、その「波及・増幅」に着目する独立リスク。既存に該当ルール無し。
  - id: owasp-asi08-cascading-failures-001
    canonicalId: cascading-failures
    framework: AgenticAI
    category: "Cascading Failures"
    name: "障害の波及・増幅"
    severity: High
    description: "{{nodeName}} が他エージェントへ計画委譲・自動実行・状態永続化を行う構成では、単一の欠陥（ハルシネーション・汚染メモリ・偽メッセージ）が下流エージェントへ fan-out し、人手チェックを飛び越えて全体障害・大量誤実行へ増幅できる。一方、planner→executor 間に blast-radius ガード（quota・進捗上限・サーキットブレーカー）と独立ポリシーエンジンがあれば、初期欠陥が連鎖反応に発展する前に遮断できる。初期欠陥の発生源（供給網=ASI04／メモリ=ASI06／通信=ASI07）ではなく、その波及・増幅に着目する。"
    mitigation: "[Foundation] planner と executor を分離し、高影響アクションをポリシー検証ゲートに通す。レート制限と異常時の一時停止を備える。 [Enterprise] エージェント毎の blast-radius ガード（quota・進捗上限・planner-executor 間サーキットブレーカー）を設け、独立ポリシーエンジンで計画と実行を分離する。 [Advanced] digital twin リプレイで波及をテストしてポリシー拡張を blast-radius 上限合格にゲートし、tamper-evident な系譜ログで非否認性を確保する。"
    appliesTo:
      kind: node
      # SUB_AGENT も波及・増幅の起点／中継になりうるため同等（§2.22 1.6e anyOf 展開）。
      anyOf:
        - nodeType: AGENT
        - nodeType: SUB_AGENT
      # 他エージェントと連結したマルチエージェント構成でのみ波及が成立する。
      connection:
        peerType: [AGENT, SUB_AGENT]
      # 自律実行かつ影響範囲が自分を越えるエージェントのみ対象（ReadOnly/Self は波及しにくい）。
      agentAttributes:
        agency: [Autonomous]
        blastRadius: [Tenant, CrossTenant, Admin]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-04"
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI08: Cascading Failures"
        url: "https://genai.owasp.org/"

  # ── ASI09: Human-Agent Trust Exploitation ───────────────────
  # 人間の過信（権威バイアス・自動化バイアス・擬人化）の悪用。既存ライブラリに完全に欠落。
  - id: owasp-asi09-human-agent-trust-exploitation-001
    canonicalId: human-agent-trust-exploitation
    framework: AgenticAI
    category: "Human-Agent Trust"
    name: "擬人化・自動化バイアスの悪用"
    severity: Medium
    description: "{{nodeName}} が自然言語の流暢さ・自信ある説明で人間ユーザと強い信頼を築く場合、攻撃者や誤設計はその信頼（権威バイアス・自動化バイアス・擬人化）を悪用し、ユーザに独立検証なしで高影響アクションを承認させたり機微情報を引き出せる。最終操作は人間が行うためフォレンジックにエージェントの関与が見えにくい。一方、高影響承認に根拠提示・出典リンク・二者承認を必須化し、エージェント発話を権威ではなく要検証の提案として UI 表示すれば、説得のみでの承認誘導は成立しにくい。"
    mitigation: "[Foundation] エージェント推奨は『要検証の提案』として提示し、自信度・出典・前提を明示する。高影響アクションには人間の独立確認を必須化する。 [Enterprise] 不可逆／高額アクションに二者承認とドライラン差分プレビューを設け、過信を促す断定的 UI 表現を抑制する。 [Advanced] 人間承認イベントとエージェント推奨の対応をログ化してフォレンジック追跡可能にし、利用者向けに自動化バイアス教育を行う。"
    appliesTo:
      kind: node
      nodeType: AGENT
      # 人間ユーザが意思決定ループに存在する（USER と連結する）場合のみ成立する。
      connection:
        peerType: [USER]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AT-01"
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI09: Human-Agent Trust Exploitation"
        url: "https://genai.owasp.org/"
      - title: "MITRE ATLAS AML.T0067 LLM Trusted Output Components Manipulation（利用者に信頼させる応答の操作）"
        url: "https://atlas.mitre.org/techniques/AML.T0067"

  # ── ASI10: Rogue Agents ─────────────────────────────────────
  # ドリフト開始後のふるまい整合性・自己複製・報酬ハックに着目。
  # maestro-agent-goal-misalignment（目標逸脱）/ -multi-agent-collusion（協調逸脱）と相補。
  - id: owasp-asi10-rogue-agent-001
    canonicalId: rogue-agent-drift
    framework: AgenticAI
    category: "Rogue Agent"
    name: "ふるまい整合性の喪失・自己複製"
    severity: High
    description: "{{nodeName}} が自律実行する場合、外部侵害（プロンプトインジェクション／目標ハイジャック／供給網）を契機にふるまい整合性を失い、個々の行動は正規に見えても全体として有害・欺瞞的・寄生的に逸脱できる。プロビジョニング API 経由の自己複製、報酬ハック（コスト最小化のためバックアップ削除等）、観測エージェントのなりすましにより、検知・テイクダウンを回避して持続化できる。一方、署名付き behavioral manifest を起動時検証し、キルスイッチ・資格情報失効・watchdog による逸脱監視があれば、逸脱開始後も即時隔離でき被害を限定できる。初期侵入（ASI01／ASI04）ではなく、ドリフト開始後のふるまい整合性とガバナンスに着目する。"
    mitigation: "[Foundation] 全アクション・ツール呼出・エージェント間通信を immutable な署名付き監査ログに記録し、未承認の委譲・複製を検知する。 [Enterprise] Trust Zone と最小権限スコープで隔離し、watchdog エージェントで協調逸脱／異常実行を検知、キルスイッチと資格情報失効で即時停止する。 [Advanced] エージェント毎の暗号学的アイデンティティ attestation と署名付き behavioral manifest を毎アクション検証し、隔離→再 attestation→人手承認を経た復帰のみ許可する。"
    appliesTo:
      kind: node
      # SUB_AGENT も外部侵害を契機にふるまい整合性を失いうるため同等（§2.22 1.6e anyOf 展開）。
      anyOf:
        - nodeType: AGENT
        - nodeType: SUB_AGENT
      # 自律設計のエージェントのみ対象（Advisory/Bounded は逸脱しても副作用が抑制済み）。
      connection:
        required: false
      agentAttributes:
        agency: [Autonomous]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "DE.CM-09"
      - standard: nist-csf-2.0
        ref: "PR.PS-04"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI10: Rogue Agents"
        url: "https://genai.owasp.org/"

  # ── ツール実行の承認ゲートの欠落（ASI02 / ASI09 の補完）────────────
  # zt-guardrail-probabilistic-bypass-001 は「確率的な検知の迂回」を扱う。本ルールは決定論的な承認ゲート
  # 自体の設計（既定の判定・対象範囲・ルールの改変可能性）が欠けている問いで、対策も別なので別グループにする。
  # 承認者の過信は owasp-asi09-human-agent-trust-exploitation-001 が扱う。
  - id: owasp-asi02-tool-approval-gate-gap-001
    canonicalId: tool-approval-gate-gap
    framework: AgenticAI
    category: "Tool Misuse"
    name: "ツール実行の承認ゲートの欠落（既定許可・対象の限定・ルールの改変）"
    severity: High
    description: "{{nodeName}} がエージェントのツール実行を仲介する承認ゲートとして置かれていても、どのルールにも当たらない呼び出しを既定で許可する、審査の対象を一部のツールに限り MCP や後から追加したツールが対象外になる、拒否ルールを利用者やエージェントが無効化・削除できる、のいずれかに当てはまる場合、プロンプトインジェクション等で乗っ取られたエージェントの操作は、ルールの想定外の形や対象外のツールを通るだけで審査を経ずに実行される（Can）。人の承認待ちが大量に発生する構成では、承認者が内容を確かめずに許可する状態にもなりやすい。一方、既定の判定を拒否（deny by default）とし、すべてのツール（MCP・カスタムツールを含む）を審査の対象にして、ルールの変更を人の承認と監査ログ付きに限っていれば、想定外の呼び出しは実行前に止まる（Cannot）。blast radius は承認ゲートを通過したツールが実行環境で持つすべての権限。"
    mitigation: "[Foundation] 承認ゲートの既定の判定を拒否にし、許可するツールと操作を allowlist で明示する。MCP ツール・カスタムツールを含むすべてのツール呼び出しを審査の対象にする。 [Enterprise] 承認ルールの追加・無効化・削除をエージェントの権限から外し、人の承認と監査ログを必須にする。高影響の操作は操作内容の要約と差分を示して承認させ、承認の件数と所要時間を監視して形骸化を検知する。 [Advanced] 承認ルールをポリシーエンジン（policy as code）で管理し、変更をレビューと署名付きで配布する。承認ゲートの判定ログを改ざんできない場所へ転送し、定期的にゲートを迂回する呼び出しの有無を検証する。"
    appliesTo:
      kind: node
      nodeType: GUARDRAIL
      # ツール実行を仲介しているとき（ツール側と接続しているとき）だけ発火する。
      # プロンプトの入出力だけを検査するガードレールには当てはまらない。
      connection:
        peerType: [TOOL, MCP_SERVER]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI02: Tool Misuse and Exploitation"
        url: "https://genai.owasp.org/"
      - title: "OWASP Agentic AI - Threats and Mitigations (Overwhelming Human in the Loop)"
        url: "https://genai.owasp.org/"
      - title: "MITRE ATLAS AML.T0053 AI Agent Tool Invocation（審査を経ないツールの呼び出し）"
        url: "https://atlas.mitre.org/techniques/AML.T0053"

  # ── エージェントのツールによる対象範囲外への作用（ASI02 の補完）────────
  # maestro-agent-internet-egress-001（canonicalId: agent-uncontrolled-egress）は AGENT から公衆網への
  # 接続をデータ流出の経路として扱う。本ルールはツールが第三者のシステムへ「作用する」こと（許可された
  # 対象の外への能動的な操作）を扱い、問い（対象範囲の強制）と対策が違うため別グループにする。
  - id: owasp-asi02-tool-action-scope-escape-001
    canonicalId: agent-action-scope-escape
    framework: AgenticAI
    category: "Tool Misuse"
    name: "エージェントのツールによる対象範囲外への作用"
    severity: High
    description: "{{sourceName}} から {{targetName}} への公衆網経由の通信について、ツールが働きかけてよい対象（ドメイン・IP アドレス・テナント）が実行時に強制されていない場合、エージェントが目標の誤解・ハルシネーション・プロンプトインジェクションで対象を取り違えると、ツールは許可されていない第三者のシステムへそのまま操作を行う（Can）。操作の主体は利用者の組織になるため、第三者への損害・契約違反・法的責任を負う。対象の制限がプロンプトの指示だけにある構成では、指示を上書きされれば制限も消える。一方、対象の allowlist をツールの実行環境の外側（送信元のファイアウォール・プロキシ・ネットワークの分離）で強制し、allowlist 外への通信を実行前に遮断していれば、エージェントが対象を取り違えても範囲外へは届かない（Cannot）。blast radius はツールの実行環境から到達できるすべての外部システムと、それに対する組織の責任。"
    mitigation: "[Foundation] ツールが働きかけてよい対象を allowlist として明示し、実行環境の送信元ファイアウォールまたはプロキシで allowlist 外への通信を遮断する。対象の制限をプロンプトの指示だけに頼らない。 [Enterprise] 対象の allowlist を作業ごとに発行し、作業の終了とともに失効させる。名前解決の結果と実際の接続先を照合し、すべての外部への操作を送信先付きで記録する。 [Advanced] ツールの実行環境を作業ごとに隔離したネットワークで起動し、許可された対象への経路しか存在しない構成にする。allowlist の変更は人の承認と署名を必須にする。"
    appliesTo:
      kind: edge
      when:
        sourceType: [TOOL]
        network: [Internet]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
      - standard: nist-csf-2.0
        ref: "GV.SC-07"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI02: Tool Misuse and Exploitation"
        url: "https://genai.owasp.org/"
      - title: "MITRE ATLAS AML.T0053 AI Agent Tool Invocation（対象範囲外へのツールの呼び出し）"
        url: "https://atlas.mitre.org/techniques/AML.T0053"

  # ── エージェント自身による能力の拡張（ASI03 の補完）──────────────────
  # anthropic-zt-config-integrity-001（canonicalId: agent-config-integrity）は第三者による設定の改ざんを扱う。
  # 本ルールは正規の権限を持つエージェント自身がツール・MCP・スキルを登録・変更して自分の能力を広げる問いで、
  # 対策（自己変更の権限分離）が違うため別グループにする。自己複製は owasp-asi10-rogue-agent-001 が扱う。
  # スキーマに「能力の登録先へ書き込む」条件が無いため、自律 × 管理者相当の影響範囲で近似する。
  - id: owasp-asi03-agent-self-capability-expansion-001
    canonicalId: agent-self-capability-expansion
    framework: AgenticAI
    category: "Privilege Compromise"
    name: "エージェント自身による能力の拡張（ツール・MCP・スキルの登録）"
    severity: High
    description: "{{nodeName}} が自律的に動き、管理者相当の権限でツール・MCP サーバー・スキル・承認ルールなど自分の能力を定める設定を登録・変更できる場合、プロンプトインジェクションや目標の誤解で乗っ取られたエージェントは、新しいツールを登録して審査の対象外の操作を行い、汚染したスキルを残して以後のセッションにも影響を持続させられる（Can）。能力の追加はエージェントの正規の操作として記録されるため、改ざんとして検知されにくい。一方、能力を定める設定の変更権限をエージェントから分離し、追加・変更を人の承認と署名付きの配布に限っていれば、乗っ取られたエージェントも自分の能力を広げられない（Cannot）。blast radius は登録できるツールが持つ権限の上限と、変更された設定を読み込むすべてのエージェントとセッション。"
    mitigation: "[Foundation] ツール・MCP サーバー・スキル・承認ルールの登録と変更を、作業を行うエージェントの権限から外す。必要な場合は専用のエージェントに分け、すべての変更を人の承認制にする。 [Enterprise] 能力を定める設定をバージョン管理し、変更の差分をレビューしてから配布する。エージェントが読み込む設定の一覧と変更履歴を監査ログに残し、承認されていない追加を検知して無効化する。 [Advanced] 承認済みの設定を署名し、エージェントの起動時と読み込み時に署名を検証する。未署名の能力は読み込まない。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: AGENT
        - nodeType: SUB_AGENT
      connection:
        required: false
      agentAttributes:
        agency: [Autonomous]
        blastRadius: [Admin]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "OWASP Top 10 for Agentic Applications 2026 - ASI03: Identity and Privilege Abuse"
        url: "https://genai.owasp.org/"
      - title: "OWASP Agentic AI - Threats and Mitigations (Privilege Compromise)"
        url: "https://genai.owasp.org/"
      - title: "MITRE ATLAS AML.T0081 Modify AI Agent Configuration（能力を定める設定の登録・変更）"
        url: "https://atlas.mitre.org/techniques/AML.T0081"
