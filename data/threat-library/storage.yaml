# データの保管先（storage コンポーネントライブラリの 5 型：DATABASE / STORAGE / FILE_SERVER / BACKUP_STORAGE /
# IMMUTABLE_BACKUP）の固有脅威。ストレージの公開設定の誤り、ランサムウェアによるバックアップの破壊、
# 復元テストの欠如による復旧不能、イミュータブルバックアップの保持ロックの解除と、ファイルサーバーの
# 共有フォルダの一括暗号化・アクセス権の過大・古い認証とプロトコルを扱う。
# バックアップの鍵ラッピングによる HNDL など PQC に直結するものは pqc.yaml に置く。
#
# 出典（一般的な基準のみを根拠とする。個別の事故報告は出典・事例に用いない）:
#   - NIST SP 800-209 "Security Guidelines for Storage Infrastructure"
#     （ストレージ・バックアップの保護、管理権限の分離、データ保護の検証）。
#   - NIST SP 800-34 Rev.1 "Contingency Planning Guide for Federal Information Systems"
#     （バックアップと復旧手順、計画の試験・訓練）。
#   - NIST IR 8374 "Ransomware Risk Management: A Cybersecurity Framework Profile"
#     （ランサムウェア対策としてのバックアップの保護と復旧）。
#   - CISA "#StopRansomware Guide"（オフライン・イミュータブルなバックアップと復元の試験）。
#   - クラウド事業者の公式ドキュメント（Amazon S3 のパブリックアクセスのブロック、Amazon S3 Object Lock、
#     AWS Backup Vault Lock、Azure Blob Storage の不変ストレージ、Google Cloud Storage のバケットロック）。
#   - NIST SP 800-53 Rev.5（AC-3 / AC-6）、Microsoft Learn の SMB のセキュリティの公式ドキュメント
#     （SMB security hardening・SMBv1 の無効化・SMB の署名）、IETF RFC 7530（NFSv4）。ファイルサーバーのルール（2026-10-21）。
#   本文は逐語転載せず日本語要約のみ。
#
#   SPDX-License-Identifier: Apache-2.0
#   ライセンス: 本ファイルは Apache License 2.0（LICENSE 参照）。
#   出典の帰属表示は NOTICE を参照。
#
# 重複回避方針:
#   DATABASE は既存のストア向けルールの対象を広げることで足り、本ファイルに専用ルールを置かない:
#   - 情報漏洩 / 改ざん / 監査追跡不能 → stride-data-store-*-001（canonicalId: data-store-info-disclosure /
#     data-store-tampering / data-store-repudiation）に DATABASE（改ざん・否認は STORAGE も、情報漏洩は
#     バックアップ 2 型も）を追加した。
#   - 長期機密データの HNDL・CBOM 欠如・crypto-agility → pqc.yaml の各ルールに追加した。
#   - 未管理端末・境界外からの直接到達・VPN の広域到達・外部協働者 → stride-ai.yaml / zero-trust-access.yaml
#     の各エッジルールの targetType に DATABASE / STORAGE を追加した。
#   本ファイルが新規に追加するのは、既存に同義のルールが無い 4 脅威:
#   - STORAGE の公開設定の誤り → 汎用の情報漏洩（data-store-info-disclosure）の特化版。公開設定という
#     固有の機構と対策（パブリックアクセスのブロック等）を持つため別 canonicalId とし、STORAGE には汎用の
#     情報漏洩のルールを当てない（同じノードに情報漏洩のカードを 2 枚出さない）。境界外からの直接到達を
#     図に描いた場合は stride-edge-internet-exposed-sensitive-001（エッジ）が別 subject で出る。
#   - BACKUP_STORAGE のランサムウェアによる破壊 → 汎用の改ざん（data-store-tampering）とは「本番と同じ
#     資格情報・ドメイン・ネットワークから到達できる」という固有の原因と、復旧手段が失われる影響を持つため
#     別 canonicalId。エージェントの復旧手段の欠如（agent-recovery-gap）とは対象が異なる。
#   - 復元テストの欠如 → 既存に同義のルールは無い。新規。
#   - IMMUTABLE_BACKUP の保持ロックの解除 → 既存に同義のルールは無い。新規。特権の集中という点で
#     pam-privileged-concentration と近いが、対象が保持設定という特定の操作で対策も異なるため別 canonicalId。
#
#   FILE_SERVER（2026-10-21 追加。端末から共有フォルダとしてマウントする保管先。NAS・Azure Files 等を STORAGE から移した）:
#   - 改ざん（data-store-tampering）・情報漏洩（data-store-info-disclosure）の汎用ルールは当てない。書き込み権限の広さと
#     感染端末からの書き換えは一括暗号化のルール、読み取りの権限の広さはアクセス権の過大のルールが具体的に扱い、
#     保管時暗号化は posture-encryption-at-rest-missing-001 が問う（同じノードに同じ問いのカードを 2 枚出さない）。
#     監査追跡不能（data-store-repudiation）・PQC（HNDL・CBOM・crypto-agility）・未管理端末・境界外からの直接到達・
#     VPN の広域到達・外部協働者・間接プロンプトインジェクションの接続先は STORAGE と同じ理由で対象に加えた。
#   - 共有フォルダの一括暗号化 → 新規（file-share-mass-encryption）。バックアップの破壊（backup-ransomware-destruction）は
#     復旧手段を狙う脅威で、こちらは本番の共有フォルダそのものを感染端末から書き換える点が異なる。
#   - アクセス権の過大 → 新規（file-share-permission-overgrant）。STORAGE の公開設定の誤り（storage-public-access-misconfiguration、
#     インターネットからの匿名の読み取り）とは、読めるのが社内の全員である点と対策（共有と NTFS のアクセス権の見直し）が
#     異なる。退職者・異動者のアカウントの残存は posture-account-review-missing-001 が問う。
#   - 古い認証・プロトコル（SMBv1・NTLM リレー・SMB 署名なし・NFS の AUTH_SYS）→ 既存に同義のルールは無い。新規
#     （file-share-legacy-protocol）。平文の通信そのものは stride-edge-plain-encryption-001 が扱う。
#
#   攻撃面属性（attackSurface）は FRONT_END_SERVER / GATEWAY でしか入力できないため使わない。
#   公開設定・資格情報の共有・保持モードはいずれも図に現れない設定の性質のため、内在的な脅威
#   （connection.required: false）として扱う。
#
# mitigation は 3 段階成熟度（[Foundation] / [Enterprise] / [Advanced]）をインライン markup で示す。
# description は Can/Cannot ペアと blast radius を意識して記述する。

schemaVersion: 1

rules:
  # ── ストレージの公開設定の誤りによるデータ露出 ─────────────────────────
  - id: storage-public-access-misconfiguration-001
    canonicalId: storage-public-access-misconfiguration
    framework: STRIDE
    category: "Information Disclosure"
    name: "ストレージの公開設定の誤りによるデータ露出"
    severity: High
    description: "{{nodeName}} のバケット・コンテナで、公開アクセス（匿名の読み取り・一覧取得）を許すポリシーや ACL、期限の長い共有リンクが誤って設定されている場合、攻撃者はインターネットからの自動スキャンで {{nodeName}} を見つけ、認証なしで中のファイルを一覧・取得できる（Can）。設定は図に現れないため、構成図ではアプリケーションの内側に置いたつもりのストレージでも公開されていることがある。保管時暗号化も、ストレージ側の鍵で透過的に復号される方式であれば公開アクセスに対しては効かない。一方、アカウント・組織の単位でパブリックアクセスのブロックを強制し、共有リンクと匿名アクセスを無効にしていれば、個々のバケットやフォルダの設定を誤っても外部から読み取ることはできない（Cannot）。blast radius は {{nodeName}} に保管された全ファイル（個人情報・機密情報・ソースコード・資格情報を含み得る）。"
    mitigation: "[Foundation] アカウント・組織の単位でパブリックアクセスのブロック（Amazon S3 Block Public Access、Azure の匿名アクセスの無効化、Google Cloud の公開アクセス防止等）を有効にする。保管時暗号化を有効にし、資格情報や個人情報をストレージに置く場合は利用者側の鍵（顧客管理鍵）で暗号化する。 [Enterprise] 公開設定・共有リンク・アクセスポリシーの変更を構成監視（CSPM 等）で継続的に検出し、組織のポリシー（SCP・Azure Policy・組織ポリシー）で公開設定そのものを禁止する。公開が必要なコンテンツは専用のストレージに分け、CDN の署名付き URL 経由でのみ配信する。 [Advanced] ストレージへのアクセスをプライベートエンドポイントと VPC 内からに限定し、データの分類に応じて公開可能なストレージを自動で隔離する。"
    appliesTo:
      kind: node
      # NAS・ファイル共有（Everyone・ゲストのアクセス）は FILE_SERVER に移し、storage-file-share-permission-overgrant-001 が扱う（2026-10-21）。
      nodeType: STORAGE
      # 公開設定は図に現れない設定の性質で、接続関係に依存しない内在リスク（誤設定は描いた経路と無関係に起きる）。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure"
        url: "https://csrc.nist.gov/pubs/sp/800/209/final"
      - title: "Amazon S3 User Guide - Blocking public access to your Amazon S3 storage"
        url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"

  # ── ランサムウェアによるバックアップの削除・暗号化 ─────────────────────
  - id: storage-backup-ransomware-destruction-001
    canonicalId: backup-ransomware-destruction
    framework: STRIDE
    category: "Tampering"
    name: "ランサムウェアによるバックアップの削除・暗号化"
    severity: High
    description: "{{nodeName}} を本番と同じ資格情報・同じ Active Directory ドメインで管理している、または本番と同じネットワークから管理画面・共有フォルダ・バックアップソフトのコンソールに到達できる場合、本番に侵入してドメイン管理者などの権限を得た攻撃者は、本番を暗号化する前に {{nodeName}} の世代を削除・暗号化し、保持期間を短縮して、復旧手段を奪える（Can）。ランサムウェアの攻撃者は復旧を妨げるためにバックアップを先に狙うことが知られており、バックアップが本番と一緒に失われると、身代金の支払い以外に業務を戻す手段が無くなる。一方、バックアップを本番とは別の資格情報・別の管理ドメイン（多要素認証つき）で管理し、本番のネットワークから管理面へ到達できず、さらにオフラインかイミュータブル（WORM / オブジェクトロック）の複製を持っていれば、本番の管理者権限を奪っても全世代を消すことはできない（Cannot）。blast radius は {{nodeName}} が保護する全システムの復旧手段。"
    mitigation: "[Foundation] バックアップの管理アカウントを本番のドメイン・資格情報から切り離し、多要素認証を必須にする。本番のネットワークからバックアップの管理面・保管先へ到達できないようにする。少なくとも 1 つの複製をオフラインかイミュータブル（WORM / オブジェクトロック）で保管する（3-2-1 の考え方）。 [Enterprise] バックアップの削除・保持期間の変更・暗号化設定の変更に複数人の承認を求め、これらの操作と大量削除を監視して即時に通知する。バックアップは別アカウント・別テナントの保管庫へ複製する。 [Advanced] イミュータブルな複製を本番とは別の組織・別の管理者が管理する隔離環境（クリーンルーム）に置き、復元前にマルウェアの検査を自動で行う。"
    appliesTo:
      kind: node
      nodeType: BACKUP_STORAGE
      # 資格情報・ドメインの共有と管理面への到達性は図に現れない運用の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-11"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "RC.RP-03"
    references:
      - title: "NIST IR 8374 - Ransomware Risk Management: A Cybersecurity Framework Profile"
        url: "https://csrc.nist.gov/pubs/ir/8374/final"
      - title: "CISA - #StopRansomware Guide（オフライン・イミュータブルなバックアップ）"
        url: "https://www.cisa.gov/stopransomware/ransomware-guide"
      - title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure（管理権限の分離）"
        url: "https://csrc.nist.gov/pubs/sp/800/209/final"

  # ── 復元テストの欠如による復旧不能 ───────────────────────────────
  - id: storage-backup-restore-untested-001
    canonicalId: backup-restore-untested
    framework: STRIDE
    category: "Denial of Service"
    name: "復元テストの欠如による復旧不能"
    severity: Medium
    description: "{{nodeName}} からの復元を定期的に試していない場合、バックアップジョブが成功と表示されていても、対象の漏れ・データの破損・暗号鍵の紛失・復元手順や依存関係（ID 基盤・DNS・ライセンス等）の欠落に、障害やランサムウェアの被害を受けてから気付く。攻撃者が直接起こす脅威ではないが、侵害や障害が起きたときに復旧できない、または目標復旧時間（RTO）を大きく超える（Can）。また、ランサムウェアが潜伏期間中にバックアップへ入り込んでいると、どの世代まで戻ればよいかも分からない。一方、本番相当の環境へ定期的に復元し、所要時間と復元後のデータの整合性を確かめていれば、復旧できないことは事前に判明し、手順と鍵の不備を平時に直せる（Cannot）。blast radius は {{nodeName}} に依存して復旧するすべてのシステム。"
    mitigation: "[Foundation] 重要システムについて、本番とは別の環境への復元テストを定期的に（少なくとも年 1 回、変更時にも）行い、所要時間を目標復旧時間（RTO）・目標復旧時点（RPO）と比べて記録する。復元に必要な暗号鍵・資格情報・手順書をバックアップとは別の場所に保管する。 [Enterprise] 復元テストを自動化して世代ごとに整合性を検証し、ID 基盤・DNS など依存するシステムを含めた全体の復旧訓練を行う。復元前にマルウェアの検査を行い、汚染されていない世代を特定できるようにする。 [Advanced] 隔離された復旧環境（クリーンルーム）への全面的な復旧を定期的に演習し、結果を事業継続計画と目標値の見直しに反映する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: BACKUP_STORAGE
        - nodeType: IMMUTABLE_BACKUP
      # 復元テストの有無は運用の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-11"
      - standard: nist-csf-2.0
        ref: "ID.IM-04"
      - standard: nist-csf-2.0
        ref: "RC.RP-01"
    references:
      - title: "NIST SP 800-34 Rev.1 - Contingency Planning Guide for Federal Information Systems（計画の試験・訓練）"
        url: "https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final"
      - title: "CISA - #StopRansomware Guide（バックアップの復元の試験）"
        url: "https://www.cisa.gov/stopransomware/ransomware-guide"
      - title: "NIST IR 8374 - Ransomware Risk Management: A Cybersecurity Framework Profile"
        url: "https://csrc.nist.gov/pubs/ir/8374/final"

  # ── イミュータブルバックアップの保持ロックの解除・短縮 ──────────────────
  - id: storage-immutable-retention-lock-bypass-001
    canonicalId: immutable-retention-lock-bypass
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "管理者権限による保持ロックの解除・短縮"
    severity: High
    description: "{{nodeName}} の保持ロックがガバナンスモード（特別な権限を持つ利用者なら解除・短縮できる方式）で設定されている、保持期間の設定や保管庫・バケットの削除を変更できる権限がクラウドの管理者アカウント・ルートアカウント・ストレージ装置の管理者に集中している、または保持期間が切れたあとの世代が自動で消える設定のまま期間が短い場合、その権限を奪った攻撃者は保持ロックを外すか短縮し、期限切れを待って、あるいはその場で世代を削除できる（Can）。オンプレミスの装置では、管理者がシステム時刻を進めて保持期限を早めに到来させる手口も成立し得る。一方、コンプライアンスモード（ルートを含む誰も保持期間中は解除・短縮できない方式。Amazon S3 Object Lock のコンプライアンスモード、AWS Backup Vault Lock のコンプライアンスモード、Azure のロックされた時間ベースの保持ポリシー、Google Cloud Storage のロックされた保持ポリシー等）で設定し、保管庫を別アカウントに置いていれば、本番や管理者アカウントを奪っても保持期間中の世代は消せない（Cannot）。blast radius は {{nodeName}} が最後の砦として守る全システムの復旧手段。"
    mitigation: "[Foundation] 保持ロックの方式（ガバナンスモードかコンプライアンスモードか、ロック済みか）と保持期間、保持設定を変えられる権限の持ち主を棚卸しする。復旧の最後の砦にする世代はコンプライアンスモード（ロック済み）にし、ガバナンスモードを解除できる権限（解除用の特権）は日常の管理者に与えない。 [Enterprise] イミュータブルの保管庫を本番とは別のアカウント・テナントに置き、保持設定と保管庫の削除を変更できる権限を組織のポリシーで制限する。保持設定の変更・解除の試行・時刻設定の変更を監視して即時に通知する。保持期間はランサムウェアの潜伏期間を見込んで決める。 [Advanced] 保持設定の変更に複数人の承認を必須にし、オンプレミスの装置では時刻源を改ざんできない構成（保護された NTP・装置内の改ざん耐性のある時計）にする。イミュータブルな複製を本番とは別の管理者が管理する隔離環境に置く。"
    appliesTo:
      kind: node
      nodeType: IMMUTABLE_BACKUP
      # 保持モードと権限の持ち主は設定の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-11"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
    references:
      - title: "Amazon S3 User Guide - Locking objects with Object Lock（ガバナンスモードとコンプライアンスモード）"
        url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
      - title: "AWS Backup Developer Guide - AWS Backup Vault Lock"
        url: "https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html"
      - title: "Microsoft Learn - Store business-critical blob data with immutable storage"
        url: "https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview"
      - title: "Google Cloud Storage - Bucket Lock"
        url: "https://cloud.google.com/storage/docs/bucket-lock"
      - title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure"
        url: "https://csrc.nist.gov/pubs/sp/800/209/final"

  # ── 感染した端末からの共有フォルダの一括暗号化（ランサムウェア）─────────────────
  - id: storage-file-share-ransomware-mass-encryption-001
    canonicalId: file-share-mass-encryption
    framework: STRIDE
    category: "Tampering"
    name: "感染した端末からの共有フォルダの一括暗号化（ランサムウェア）"
    severity: High
    description: "{{nodeName}} の共有フォルダに、多くの利用者や端末が広い範囲で書き込める（部署全体・全社員に変更の権限がある、ドライブとして常時マウントしている）場合、ランサムウェアに感染した 1 台の端末や奪われた 1 つの利用者アカウントから、その利用者が書き込めるすべてのファイルがネットワーク越しに暗号化・削除される（Can）。暗号化はサーバーから見ると正規の利用者による通常のファイルの書き換えに見え、サーバーにエンドポイントの検知製品があっても止まらないことが多い。サーバー上のスナップショット（以前のバージョン）がサーバーの管理者権限で消せる設定だと、ドメインの管理者権限を奪った攻撃者はそれも消して戻せなくする。一方、書き込みの権限を業務に必要なフォルダと利用者に絞り、利用者やサーバーの管理者の権限では消せないスナップショット（ストレージ装置側の不変のスナップショット・別に管理するバックアップ）を短い間隔で取り、短時間の大量の書き換え・拡張子の変更を検知して書き込みを止める仕組みがあれば、被害はその利用者が書き込める範囲に限られ、感染前の状態に戻せる（Cannot）。blast radius は感染した端末の利用者が書き込めるすべての共有フォルダと、消された世代のスナップショット。"
    mitigation: "[Foundation] 共有フォルダごとに書き込める利用者・グループを確かめ、業務に必要な範囲に絞る（全社員・部署全体への変更の権限をなくす）。サーバーのスナップショット（以前のバージョン）を有効にし、少なくとも 1 つの複製を、利用者やサーバーの管理者の権限では消せない場所（ストレージ装置側の不変のスナップショット・オフラインやイミュータブルなバックアップ）に置く。 [Enterprise] 短時間の大量の書き換え・削除・拡張子の変更をファイルサーバーの監査ログで検知し、該当する利用者・端末の書き込みを自動で止める。スナップショットとバックアップの管理者を業務のドメイン管理者から分ける。共有フォルダを常時ドライブとしてマウントする設定を、必要な利用者に限る。 [Advanced] 重要な共有フォルダは、利用者ごとに必要なときだけ書き込みの権限を与える方式にし、管理状態と検知製品の稼働を確かめた端末からの接続に限る。"
    appliesTo:
      kind: node
      nodeType: FILE_SERVER
      # 書き込み権限の広さとスナップショットの設定は図に現れない設定の性質で、接続関係に依存しない内在リスク
      # （ファイルサーバーは端末からマウントして使うことが型の定義そのもので、端末の線の有無で出し分けない）。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-11"
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "DE.CM-03"
    references:
      - title: "CISA - #StopRansomware Guide（ネットワーク共有の暗号化と、オフライン・イミュータブルなバックアップ）"
        url: "https://www.cisa.gov/stopransomware/ransomware-guide"
      - title: "NIST IR 8374 - Ransomware Risk Management: A Cybersecurity Framework Profile"
        url: "https://csrc.nist.gov/pubs/ir/8374/final"
      - title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure（スナップショットとデータ保護）"
        url: "https://csrc.nist.gov/pubs/sp/800/209/final"

  # ── 共有フォルダのアクセス権の過大（全員への付与・匿名のアクセス）─────────────────
  - id: storage-file-share-permission-overgrant-001
    canonicalId: file-share-permission-overgrant
    framework: STRIDE
    category: "Information Disclosure"
    name: "共有フォルダのアクセス権の過大（Everyone・全社員への付与・匿名のアクセス）"
    severity: High
    description: "{{nodeName}} の共有フォルダで、共有のアクセス権やファイルのアクセス権（NTFS 等）を Everyone・Authenticated Users・Domain Users のような全員を含むグループに与えている、上位のフォルダの広い権限が下位へそのまま引き継がれている、ゲスト・匿名のアクセスを許している、NFS のエクスポートを任意のクライアントに許している、のいずれかの場合、社内のどの利用者のアカウントを奪った攻撃者でも、人事・経営・顧客の情報や、共有フォルダに置かれたパスワードの一覧・資格情報を含む設定ファイルを読み出せる（Can）。共有フォルダは作った人が権限を広めに付けたまま増え続け、どこが誰に開いているかを管理者も把握していないことが多く、攻撃者は侵入後に共有フォルダを自動で巡回して機微なファイルを探す。一方、共有とファイルのアクセス権を業務ごとのグループに限って付け、全員を含むグループ・ゲスト・匿名のアクセスを使わず、権限の設定を定期的に洗い出して広すぎるものを直していれば、1 つのアカウントの侵害で読めるのはその利用者の業務の範囲に限られる（Cannot）。退職者・異動者のアカウントが残る問題は運用状況のカード（アカウント棚卸し）で問う。blast radius は全員に開いた共有フォルダのすべてのファイル。"
    mitigation: "[Foundation] 共有フォルダごとに共有のアクセス権とファイルのアクセス権を洗い出し、Everyone・Authenticated Users・Domain Users 等の全員を含むグループへの付与をやめて、業務ごとのグループに置き換える。ゲスト・匿名のアクセスを無効にし、NFS のエクスポートは許可するクライアントを限る。共有フォルダにパスワードの一覧や資格情報を含む設定ファイルを置かない。 [Enterprise] アクセス権の設定を定期的に（少なくとも半年に 1 回）自動で洗い出し、全員に開いたフォルダ・個人に直接付けた権限・継承の例外を報告する。フォルダの所有者（業務の責任者）を決め、所有者がアクセス権を承認する。機微な情報のフォルダはアクセスを監査ログに残す。 [Advanced] データの分類にもとづいてアクセス権を自動で付け、機微なファイルの検出（DLP）と組み合わせて、全員に開いた場所に置かれた機微なファイルを見つけて移す。"
    appliesTo:
      kind: node
      nodeType: FILE_SERVER
      # アクセス権の設定は図に現れない設定の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      - title: "NIST SP 800-209 - Security Guidelines for Storage Infrastructure（ストレージのアクセス制御）"
        url: "https://csrc.nist.gov/pubs/sp/800/209/final"
      - title: "NIST SP 800-53 Rev.5 - Security and Privacy Controls for Information Systems and Organizations（AC-3 Access Enforcement / AC-6 Least Privilege）"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"

  # ── 古い認証・プロトコル（SMBv1・NTLM・SMB 署名なし・NFS の申告 ID）による中継・盗聴 ──
  - id: storage-file-share-legacy-protocol-001
    canonicalId: file-share-legacy-protocol
    framework: STRIDE
    category: "Spoofing"
    name: "古い認証・プロトコル（SMBv1・NTLM・SMB 署名なし・NFS の申告 ID）による中継となりすまし"
    severity: Medium
    description: "{{nodeName}} が SMBv1 を受け付ける、NTLM による認証を許す、SMB の署名を必須にしていない、NFS でクライアントが申告する利用者 ID（AUTH_SYS）をそのまま信じる、のいずれかの場合、社内のネットワークに入った攻撃者は、他の端末の NTLM 認証を誘い出して {{nodeName}} へ中継し（NTLM リレー）、その利用者になりすまして共有フォルダを読み書きしたり、署名のない通信の中身を書き換えたり、NFS ではクライアント側の設定を変えるだけで他人の ID でファイルにアクセスしたりできる（Can）。SMBv1 には、ネットワーク越しに感染を広げるワームに使われた種類の脆弱性もある。一方、SMBv1 を無効にし、SMB の署名（機密な共有フォルダは暗号化も）を必須にし、NTLM を段階的に止めて Kerberos に寄せ、NFS では Kerberos による認証を使っていれば、中継や申告した ID によるなりすまし・通信の書き換えは成立しない（Cannot）。blast radius は中継された利用者が読み書きできる共有フォルダと、通信の途中のファイル。"
    mitigation: "[Foundation] SMBv1 を無効にし、SMB の署名をサーバーとクライアントの両方で必須にする。ゲストのアクセス（認証しない SMB の接続）を無効にする。 [Enterprise] NTLM の利用状況を監査して段階的に止め、Kerberos による認証に寄せる。機密な共有フォルダは SMB の暗号化を必須にし、NFS は Kerberos による認証（sec=krb5 / krb5i / krb5p）を使う。 [Advanced] ファイルサーバーへの SMB / NFS の接続を、業務の端末のセグメントと許可したサーバーからに限る（SMB のポートをインターネットや他の拠点へ開かない）。NTLM を全面的に無効にする。"
    appliesTo:
      kind: node
      nodeType: FILE_SERVER
      # 受け付けるプロトコルと認証方式は図に現れない設定の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
    references:
      - title: "Microsoft Learn - SMB security hardening（SMB の署名・暗号化、ゲストのアクセスの無効化、NTLM の制限）"
        url: "https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-security-hardening"
      - title: "Microsoft Learn - How to detect, enable and disable SMBv1, SMBv2, and SMBv3 in Windows"
        url: "https://learn.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3"
      - title: "Microsoft Learn - Overview of Server Message Block signing"
        url: "https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/overview-server-message-block-signing"
      - title: "IETF RFC 7530 - Network File System (NFS) Version 4 Protocol（RPCSEC_GSS と Kerberos による認証）"
        url: "https://www.rfc-editor.org/rfc/rfc7530"
