# ネットワーク機器・セキュリティ製品（network-infra コンポーネントライブラリの 18 型）の固有脅威。
# 境界機器の侵入起点化、TLS インスペクション用 CA 鍵、CDN による第三者の TLS 終端、
# STARTTLS のダウングレード、L2 のなりすまし、不正アクセスポイントに加え、
# 踏み台への管理経路の集中、ZTNA プロキシへのアクセス判定の集中と迂回、専用線の平文区間、
# プライベートエンドポイント経由の持ち出し、サービスメッシュの mTLS 非強制とメッシュ CA の侵害を扱う。
# PQC 移行に直結するもの（受動復号・HSM・VPN トンネルの HNDL）は pqc.yaml に置く。
#
# 出典（一般的な基準のみを根拠とする。個別の事故報告は出典・事例に用いない）:
#   - NIST SP 800-41 Rev.1 "Guidelines on Firewalls and Firewall Policy"。
#   - NIST SP 800-77 Rev.1 "Guide to IPsec VPNs"。
#   - NIST SP 800-52 Rev.2 "Guidelines for the Selection, Configuration, and Use of TLS Implementations"。
#   - NIST SP 800-57 Part 1 Rev.5 "Recommendation for Key Management"。
#   - NIST SP 800-153 "Guidelines for Securing Wireless Local Area Networks (WLANs)"。
#   - CISA "Known Exploited Vulnerabilities Catalog"（悪用が確認された脆弱性の一覧）。
#   - IETF RFC 8461（SMTP MTA Strict Transport Security）/ RFC 7672（SMTP Security via
#     Opportunistic DANE TLS）。
#   - IEEE 802.1X（ポートベースのネットワークアクセス制御）/ IEEE 802.1AE（MACsec）。
#   - NIST SP 800-207 "Zero Trust Architecture" / SP 800-207A "A Zero Trust Architecture Model for
#     Access Control in Cloud-Native Applications in Multi-Location Environments"。
#   - NIST SP 800-204A "Building Secure Microservices-based Applications Using Service-Mesh Architecture"。
#   - NIST SP 800-53 Rev.5 "Security and Privacy Controls for Information Systems and Organizations"
#     （AC-17 リモートアクセス・AC-6 最小権限）。
#   - クラウド事業者の公式ドキュメント（AWS PrivateLink のエンドポイントポリシー、Azure Private Link の
#     DNS 構成、Azure ExpressRoute の MACsec、Google Cloud IAP の署名付きヘッダー、Google Cloud VPC
#     Service Controls）と Istio のセキュリティの概念の説明。
#   本文は逐語転載せず日本語要約のみ。
#
#   SPDX-License-Identifier: Apache-2.0
#   ライセンス: 本ファイルは Apache License 2.0（LICENSE 参照）。
#   出典の帰属表示は NOTICE を参照。
#
# 重複回避方針:
#   - 平文の通信そのもの（LB の SSL オフロード後の平文区間等）→ stride-edge-plain-encryption-001
#     （canonicalId: plaintext-transmission、encryption:[Plain]）でカバー済み。本ファイルは平文区間を
#     別途検出しない。STARTTLS のルールは「暗号化しているつもりでも経路上で外される」点を扱い別 canonicalId。
#   - FRONT_END_SERVER / GATEWAY の管理面露出 → stride-web-remote-mgmt-exposed-001、API 管理プレーンの
#     露出 → api-control-plane-internet-exposure-001（canonicalId: web-remote-management-exposure）。
#     本ファイルの境界機器ルールは管理面に加え、利用者向けのサービス面（VPN ポータル・SMTP・SIP 等）の
#     既知脆弱性の悪用までを扱い、パッチ適用・KEV 追跡という別の対策軸を持つため別 canonicalId とする。
#     攻撃面属性（attackSurface）は FRONT_END_SERVER / GATEWAY でしか入力できないため、露出は
#     エッジの sourceTrust:[Internet] で表す。
#   - VPN の広域到達・閉域網の無認証 → zt-vpn-broad-network-access-001 / zt-implicit-trust-network-location-001
#     （エッジの network 軸）でカバー済み。本ファイルの L2 ルールはスイッチ（ノード）視点で、同一セグメントに
#     入った攻撃者が L2 の仕組みを悪用する点を扱い、subject も機構も異なる。
#   - SASE / SSE 事業者への検査データ集中は、TLS インスペクション CA 鍵のルールの SASE 向け description
#     （conditions）で扱い、独立したルールを作らない。
#   - FIREWALL の TLS インスペクションは任意機能（既定は透過）のため CA 鍵のルールの対象から外す
#     （全ファイアウォールでの過検知を避ける）。終端判定の属性（docs 側の設計で予定）が入れば再検討する。
#   - CDN（第三者が運用するエッジ）は境界機器ルールの対象から外す（パッチ適用の主体が利用者ではない）。
#     CDN の固有脅威は CDN のルールで扱う。
#
#   network-infra に追加した 4 型（BASTION / ZTNA_PROXY / PRIVATE_ENDPOINT / SERVICE_MESH）について:
#   - BASTION の Internet 露出 → 境界機器ルールの targetType に BASTION を足し、conditions で踏み台向けの
#     description を出す（自前の踏み台は修正の適用が利用者の責任で、マネージド型でも認証と到達範囲は
#     利用者の設定に依存するため。CDN と違い除外しない）。
#   - 踏み台への特権セッション・資格情報の集中 → PAM の pam-privileged-concentration-001 と同じ脅威
#     （管理経路の集約点の侵害で配下の全システムへ管理者として到達）。canonicalId を共有し、踏み台専用の
#     description を持つ別ルールにする（ノード型が違うため同一 subject では畳み込まれない）。
#     踏み台を経由しない直接の管理経路は pam-bypass-path と同種だが、本ルールの mitigation で触れるに留める。
#   - ZTNA_PROXY → zt-implicit-trust-network-location-001（閉域網の無認証、エッジ）・zt-vpn-broad-network-
#     access-001（VPN の到達範囲、エッジ）は ZTNA を導入していない経路の欠陥で、本ファイルのルールは
#     ZTNA プロキシ自体（ノード）へのアクセス判定の集中と迂回を扱う。IdP 自体の侵害は idp-token-forgery /
#     idp-single-point-of-failure（IdP ノード）が扱い、本ルールは ZTNA 側から見た依存として述べるに留める。
#     迂回と利用者情報ヘッダーの偽装は api-gateway-bypass（BACKEND_API 宛てエッジ）と機構が近いが、
#     subject（ZTNA ノード / API 宛てエッジ）が異なるため別 canonicalId とする。
#   - PRIVATE_ENDPOINT の持ち出し・公開経路へのフォールバック → 既存に同義のルールは無い。新規。
#   - SERVICE_MESH → mTLS の非強制とメッシュ CA の侵害は機構も対策も異なるため 2 ルールに分ける。
#     メッシュ CA は TLS インスペクション用 CA（利用者端末が信頼する CA で外部サイトを偽造）とは
#     信頼する主体と偽造の対象が異なるため別 canonicalId とする。
#
#   専用線 / 閉域接続はノード型を設けず、エッジの network: [VPN]（画面表示「専用線 (VPN)」）で表す
#   （専用線は機器ではなくリンクのため）:
#   - network:[VPN] かつ平文の区間 → netinfra-dedicated-line-unencrypted-001。汎用の平文ルール
#     （stride-edge-plain-encryption-001）と同じ脅威のため canonicalId: plaintext-transmission を共有する。
#     同じエッジでは 1 枚に畳み込まれ、二重計上しない。本ルールは「閉域だから安全」と考えてアプリ層を
#     暗号化しないことの危険を述べる。内部値 VPN は専用線（既定で暗号化されない）と IPsec VPN（トンネル
#     自体は暗号化される）の両方を含むため、どちらの解釈でも誤りにならない文面にした。
#   - network:[VPN, VPC] かつ無認証 → zt-implicit-trust-network-location-001 が扱う。問いが認証で
#     平文ルールとは対象が異なるため統合しない。
#   - 専用線・VPN の TLS の区間の HNDL（古典鍵交換）→ pqc.yaml の pqc-dedicated-line-hndl-001 が扱う。
#
# mitigation は 3 段階成熟度（[Foundation] / [Enterprise] / [Advanced]）をインライン markup で示す。
# description は Can/Cannot ペアと blast radius を意識して記述する。

schemaVersion: 1

rules:
  # ── 境界機器の既知脆弱性・管理面の悪用（経路依存）────────────────────
  - id: netinfra-edge-device-exploitation-001
    canonicalId: network-edge-device-exploitation
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "インターネットに露出した境界機器の既知脆弱性・管理面の悪用"
    severity: High
    description: "{{targetName}} は信頼境界の外（Internet 扱い）にある {{sourceName}} から到達できる境界機器である。境界機器はインターネットからの接続を受けるために常時公開されており、攻撃者は公開された脆弱性（認証前に実行できるものを含む）や、インターネット側に開いた管理画面・既定の資格情報を狙って機器を掌握できる（Can）。掌握された境界機器は内部への正規の通り道であり、通過する通信の盗聴・改ざん、保存された VPN 資格情報や証明書の秘密鍵の窃取、内部ネットワークへの足場として悪用される。境界機器にはエンドポイントの検知製品を入れられないことが多く、侵害に気づきにくい。一方、悪用が確認された脆弱性（CISA KEV 等）の修正を期限内に適用し、管理面をインターネットから到達できない管理用ネットワークに限定し、サポートが終了した機器を使わずにいれば、公開済みの手口と管理面からの侵入は成立しない（Cannot）。blast radius は {{targetName}} を通過する全通信と、その背後で {{targetName}} を信頼する内部ネットワーク全体。"
    mitigation: "[Foundation] 境界機器を資産台帳に載せ、型番・ファームウェア版数・サポート期限を管理する。悪用が確認された脆弱性（CISA KEV 等）の修正は優先して期限内に適用し、サポートが終了した機器は更新する。管理画面・SSH をインターネット側のインターフェースで無効にし、管理用ネットワークからのみ到達できるようにする。既定の資格情報を変更する。 [Enterprise] 管理面の認証に MFA を使い、管理操作と設定変更を外部のログ基盤へ送って監視する。修正が出るまでの暫定対策（機能の無効化・回避策）を適用する手順を用意する。機器の設定と整合性（ファームウェアの改ざん）を定期的に確認する。 [Advanced] 公開する機能を最小にし（使わない VPN ポータルや管理 API を止める）、ZTNA 等に置き換えてインターネットから到達できる面そのものを減らす。侵害を前提に、境界機器が保持する資格情報・鍵の失効と再発行の手順を整える。"
    appliesTo:
      kind: edge
      when:
        # 境界機器が Internet 側の送信元から接続を受けるときに発火する。
        # CDN は第三者が運用するエッジのため対象外（netinfra-cdn-third-party-tls-termination-001 が扱う）。
        # BASTION を追加（2026-10）：Internet から到達できる踏み台は管理経路の入口で、自前の踏み台は
        # 修正の適用が利用者の責任になる。マネージド型でも認証の強さと到達範囲は利用者の設定に依存するため
        # CDN と違い除外しない。踏み台向けの description は conditions で出し分ける。
        targetType: [FIREWALL, VPN_GATEWAY, LOAD_BALANCER, WAF, ROUTER, SBC, EMAIL_GATEWAY, BASTION]
        sourceTrust: [Internet]
      conditions:
        - when:
            targetType: [BASTION]
          description: "{{targetName}} は信頼境界の外（Internet 扱い）にある {{sourceName}} から到達できる踏み台である。踏み台は配下のサーバーへの管理経路の入口のため、攻撃者は公開された SSH / RDP / Web コンソールに対して既知の脆弱性を悪用したり、パスワードの総当たりや流出した資格情報の試行を行ったりして、成功すれば内部のサーバーへ管理者として到達できる（Can）。自前で構築した踏み台サーバーでは、OS とリモート接続ソフトウェアの修正の適用が利用者の責任になる。マネージドの踏み台では修正は事業者が行うが、認証の強さと到達できるサーバーの絞り込みは利用者の設定に依存する。一方、踏み台への接続を IdP の認証（フィッシング耐性のある MFA）や ZTNA の後ろに置いてインターネットから直接到達できないようにするか、受信ポートを持たない接続方式（エージェントからの外向き接続）を使い、自前の踏み台の修正を期限内に適用していれば、公開された面への総当たりや既知の手口は成立しない（Cannot）。blast radius は {{targetName}} から到達できるすべてのサーバーと、その管理者権限。"
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "ID.RA-01"
      - standard: nist-csf-2.0
        ref: "PR.PS-02"
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
    references:
      - title: "CISA - Known Exploited Vulnerabilities Catalog（悪用が確認された脆弱性の優先修正）"
        url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
      - title: "NIST SP 800-41 Rev.1 - Guidelines on Firewalls and Firewall Policy（境界機器の管理と運用）"
        url: "https://csrc.nist.gov/pubs/sp/800/41/r1/final"
      - title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs（VPN ゲートウェイの運用と管理）"
        url: "https://csrc.nist.gov/pubs/sp/800/77/r1/final"

  # ── TLS インスペクション用 CA 鍵の侵害（内在）──────────────────────────
  - id: netinfra-tls-inspection-ca-key-compromise-001
    canonicalId: tls-inspection-ca-key-compromise
    framework: STRIDE
    category: "Spoofing"
    name: "TLS インスペクション用 CA 鍵の侵害による中間者攻撃"
    severity: High
    description: "{{nodeName}} は利用者の外向き TLS を復号して検査し、組織の CA で証明書を再署名する。利用者の端末はこの CA を信頼するよう設定されているため、CA の秘密鍵が {{nodeName}} から盗まれると、攻撃者は任意のサイトの証明書を偽造でき、同じ端末が通る別の経路（社外の Wi-Fi 等）でも警告なしに中間者攻撃を行える（Can）。また {{nodeName}} 自体が全通信を平文で扱う集約点になり、侵害されると検査対象の全通信（認証情報・業務データ）が漏れる。上流サーバーの証明書を厳密に検証しない設定では、利用者は偽のサーバーに気づけない。一方、CA の秘密鍵を HSM に置いて取り出せないようにし、用途を検査用に限定した中間 CA（名前制約・短い有効期間）を使い、上流の証明書検証を有効にしていれば、機器が侵害されても鍵そのものは持ち出せず、偽造できる範囲と期間も限られる（Cannot）。blast radius は CA を信頼する全端末の TLS 通信。"
    mitigation: "[Foundation] 再署名用の CA は検査専用の中間 CA にし、組織のルート CA の鍵を検査装置に置かない。上流サーバーの証明書検証を有効にし、検証に失敗した通信を遮断する。医療・金融・認証など復号しない宛先を決めて除外する。 [Enterprise] 再署名用 CA の秘密鍵を HSM（FIPS 140-3 認証）に置き、取り出せない形で使う。中間 CA に名前制約と短い有効期間を設定し、定期的に更新する。検査装置の管理操作を監査ログで監視する。 [Advanced] CA の失効と端末の信頼ストアの入れ替えを短時間で行える手順を用意し、訓練する。TLS 1.3 と PQC の鍵交換に対応した検査装置へ移行し、検査のために古い暗号へ落とさない。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: SECURE_WEB_GATEWAY
        - nodeType: SASE
      # 再署名用 CA を持つこと自体が機器の機能で、接続関係に依存しない内在リスク。
      connection:
        required: false
      conditions:
        - when:
            nodeType: [SASE]
          description: "{{nodeName}} は端末から PoP までをトンネルで結び、PoP で TLS を復号・検査してから外部へ再接続する。PoP は SASE / SSE の事業者が運用するため、全拠点・全端末の通信が事業者の設備で平文になる。再署名用 CA の秘密鍵が事業者側で盗まれたり、事業者の運用者や管理コンソールが悪用されたりすると、攻撃者は CA を信頼する端末に対して任意のサイトの証明書を偽造でき、検査対象の全通信を読める（Can）。一方、再署名用 CA の鍵を自組織の HSM や鍵管理で保持する方式（BYOK 等）を選び、検査専用の中間 CA に名前制約と短い有効期間を付け、事業者の管理コンソールを MFA と監査ログで保護していれば、事業者側の侵害でも鍵は持ち出せず、偽造できる範囲と期間も限られる（Cannot）。blast radius は {{nodeName}} を経由する全拠点・全端末の TLS 通信。"
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations（TLS の証明書検証）"
        url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
      - title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management（CA 鍵の保護と有効期間）"
        url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"

  # ── CDN による第三者の TLS 終端（内在）─────────────────────────────────
  - id: netinfra-cdn-third-party-tls-termination-001
    canonicalId: cdn-third-party-tls-termination
    framework: STRIDE
    category: "Information Disclosure"
    name: "CDN による第三者の TLS 終端とオリジンへの迂回"
    severity: Medium
    description: "{{nodeName}} は利用者からの TLS をエッジで終端し、オリジンへ別の TLS で再接続する。このためサーバー証明書の秘密鍵（または同等の鍵）を CDN 事業者に預け、利用者の通信はエッジで一度平文になる。CDN 事業者の設備や管理アカウントが侵害されると、攻撃者は預けた鍵でサイトになりすましたり、エッジを通る通信（ログイン情報・個人情報）を読んだりできる（Can）。また、オリジンがインターネットから直接到達できる場合、攻撃者は CDN を迂回してオリジンを直接攻撃でき、CDN 側の WAF・DDoS 対策が効かない。エッジとオリジンの間を暗号化していない、または証明書を検証していない設定では、その区間で盗聴・改ざんされる。一方、CDN 事業者が鍵を保持しない方式（鍵をサーバー側に残すキーレス方式や、CDN 専用の証明書の発行）を使い、オリジンへの接続を CDN からの通信だけに限定し（相互 TLS・送信元の限定）、エッジとオリジンの間も証明書を検証する TLS にしていれば、預けた鍵の悪用と迂回は成立しない（Cannot）。blast radius は {{nodeName}} を経由する全利用者の通信と、預けた証明書が有効なドメイン。"
    mitigation: "[Foundation] エッジとオリジンの間を TLS にし、オリジン側の証明書を検証する設定にする。オリジンへの接続を CDN からの通信だけに限定する。CDN の管理アカウントに MFA を使う。 [Enterprise] CDN には CDN 専用の証明書を発行し、オリジンや他のサービスと鍵を共有しない。オリジンへの接続に相互 TLS を使い、CDN 以外からの接続を暗号学的に拒否する。CDN の設定変更を監査ログで監視する。 [Advanced] 秘密鍵を CDN 事業者に渡さない方式（キーレス方式・自組織 HSM での署名）を使う。エッジでも平文にしたくない機密データは、アプリ層で暗号化してから送る。"
    appliesTo:
      kind: node
      nodeType: CDN
      # 鍵の預託とエッジでの平文化は CDN の動作そのもので、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "GV.SC-07"
    references:
      - title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations（TLS 終端と証明書検証）"
        url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
      - title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management（秘密鍵の保護と共有の制限）"
        url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"

  # ── STARTTLS のダウングレード / ストリッピング（経路依存）──────────────
  - id: netinfra-smtp-starttls-downgrade-001
    canonicalId: smtp-starttls-downgrade
    framework: STRIDE
    category: "Information Disclosure"
    name: "STARTTLS のダウングレードによるメールの盗聴"
    severity: Medium
    description: "{{sourceName}} と {{targetName}} の間のメール中継は STARTTLS で暗号化するが、STARTTLS は相手が対応していれば暗号化する「日和見的な」方式で、多くの場合は証明書も検証しない。経路上の攻撃者は STARTTLS の提示を消して平文に落としたり、偽の証明書で中継したりして、メール本文・添付ファイル・パスワードリセットのリンクを読み、書き換えられる（Can）。DNS の MX レコードを偽装されると、メールそのものを攻撃者のサーバーへ誘導される。一方、MTA-STS や DANE で「この宛先には証明書を検証した TLS でしか送らない」ことを宣言・強制し、TLS-RPT で失敗を監視していれば、ダウングレードや偽の証明書による中継は配送失敗として止まる（Cannot）。S/MIME 等で本文を暗号化していれば、中継区間が破られても本文は読めない。blast radius は {{sourceName}} と {{targetName}} の間で中継される全メール。"
    mitigation: "[Foundation] 受信側として MTA-STS のポリシーを公開し、送信側として相手の MTA-STS ポリシーに従って配送する。TLS-RPT で配送時の TLS の失敗を収集する。 [Enterprise] DNSSEC を導入して DANE（TLSA レコード）を公開し、相手が DANE に対応していれば証明書を検証して配送する。重要な取引先との間は TLS を必須にする設定にする。 [Advanced] 機密性の高いメールは S/MIME 等で本文を暗号化し、中継区間の暗号に依存しない。"
    appliesTo:
      kind: edge
      # Internet 側とのメール中継（受信・送信の両方向）で発火する。
      anyOf:
        - targetType: [EMAIL_GATEWAY]
          sourceTrust: [Internet]
        - sourceType: [EMAIL_GATEWAY]
          targetTrust: [Internet]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
    references:
      - title: "IETF RFC 8461 - SMTP MTA Strict Transport Security (MTA-STS)"
        url: "https://www.rfc-editor.org/rfc/rfc8461"
      - title: "IETF RFC 7672 - SMTP Security via Opportunistic DNS-Based Authentication of Named Entities (DANE) Transport Layer Security (TLS)"
        url: "https://www.rfc-editor.org/rfc/rfc7672"

  # ── L2 のなりすまし（内在）──────────────────────────────────────────
  - id: netinfra-l2-spoofing-001
    canonicalId: l2-spoofing-lateral-movement
    framework: STRIDE
    category: "Spoofing"
    name: "L2 のなりすまし（ARP スプーフィング・VLAN ホッピング・MAC フラッディング）"
    severity: Medium
    description: "{{nodeName}} につながる同じセグメントに入った攻撃者（侵害された端末、空いている情報コンセントに接続した機器等）は、ARP の応答を偽ってゲートウェイや他の端末になりすましたり、MAC アドレス表をあふれさせて通信を全ポートに流させたり、トランクの自動交渉や二重タグで別の VLAN に入り込んだりして、同じセグメントの通信を盗聴・改ざんし、横展開できる（Can）。L2 は送信元を検証しないため、セグメント内の端末は互いを暗黙に信頼している。一方、802.1X でポートに接続する機器を認証し、DHCP スヌーピングとダイナミック ARP インスペクション、ポートセキュリティを有効にし、トランクの自動交渉を止めていれば、未認証の機器は接続できず、なりすましの応答は破棄される（Cannot）。通信を TLS や MACsec で暗号化していれば、盗聴できても中身は読めない。blast radius は {{nodeName}} が収容する VLAN の全端末と、その通信。"
    mitigation: "[Foundation] 未使用のポートを無効にし、端末用ポートのトランクの自動交渉を止める。ネイティブ VLAN を使わない VLAN にする。ポートセキュリティで 1 ポートあたりの MAC アドレス数を制限する。 [Enterprise] 802.1X でポートに接続する機器を認証し、DHCP スヌーピングとダイナミック ARP インスペクションを有効にする。重要なセグメントは用途ごとに分け、セグメント間の通信をファイアウォールで制御する。 [Advanced] スイッチ間・サーバー接続のリンクを MACsec で暗号化する。アプリケーションの通信をすべて相互認証付きの TLS にし、L2 の信頼に依存しない。"
    appliesTo:
      kind: node
      nodeType: L2_SWITCH
      # L2 の送信元非検証はスイッチの性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
      - standard: nist-csf-2.0
        ref: "DE.CM-01"
    references:
      - title: "IEEE 802.1X - Port-Based Network Access Control（ポートに接続する機器の認証）"
        url: "https://standards.ieee.org/"
      - title: "IEEE 802.1AE - Media Access Control (MAC) Security（MACsec によるリンク暗号化）"
        url: "https://standards.ieee.org/"

  # ── 不正アクセスポイント / Evil Twin・弱い無線暗号（内在）───────────────
  - id: netinfra-wireless-rogue-ap-001
    canonicalId: wireless-rogue-ap-weak-encryption
    framework: STRIDE
    category: "Spoofing"
    name: "不正アクセスポイント（Evil Twin）と弱い無線暗号"
    severity: Medium
    description: "{{nodeName}} の電波は建物の外まで届くため、攻撃者は物理的に侵入せずに無線区間を狙える。同じ SSID を名乗る偽のアクセスポイント（Evil Twin）を置いて端末を接続させ、通信を中継・盗聴したり、偽のログイン画面で資格情報を入力させたりできる（Can）。WPA2 の事前共有鍵（PSK）では接続時のやりとりを記録して鍵を総当たりでき、鍵を知る者は同じネットワークの他人の通信も復号できる。WPA2-Enterprise でも端末が認証サーバーの証明書を検証していなければ、偽のアクセスポイントで認証情報を盗まれる。社員が無断で設置したアクセスポイントは、境界の内側への入口になる。一方、WPA3-Enterprise または EAP-TLS（端末証明書）で接続を認証し、端末側で認証サーバーの証明書とサーバー名の検証を強制し、無線 IDS で不正なアクセスポイントを検知していれば、偽のアクセスポイントでは認証が成立せず、事前共有鍵の総当たりも意味を持たない（Cannot）。blast radius は {{nodeName}} に接続する全端末と、その先の業務ネットワーク。"
    mitigation: "[Foundation] WEP・WPA（TKIP）を使わず、WPA2 以上（できれば WPA3）にする。業務用の SSID では事前共有鍵を使わず、802.1X（WPA2/WPA3-Enterprise）で利用者または端末を認証する。来客用の SSID は業務ネットワークと分離する。 [Enterprise] EAP-TLS で端末証明書による認証を行い、端末の設定で認証サーバーの証明書とサーバー名の検証を強制する。無線 IDS / IPS で不正なアクセスポイントと同じ SSID の偽装を検知する。管理フレームの保護（802.11w）を有効にする。 [Advanced] 無線区間を信頼せず、業務アプリケーションへのアクセスを ZTNA と端末の状態の確認で都度判定する。"
    appliesTo:
      kind: node
      nodeType: WIRELESS_AP
      # 電波の到達と無線の暗号方式はアクセスポイントの性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
    references:
      - title: "NIST SP 800-153 - Guidelines for Securing Wireless Local Area Networks (WLANs)（不正アクセスポイントの検知と無線の構成）"
        url: "https://csrc.nist.gov/pubs/sp/800/153/final"

  # ── 踏み台への特権セッション・資格情報の集中（内在）────────────────────
  # PAM の pam-privileged-concentration-001 と同じ脅威。踏み台専用の description を持つ別ルール。
  - id: netinfra-bastion-privileged-path-concentration-001
    canonicalId: pam-privileged-concentration
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "踏み台への特権セッションと資格情報の集中"
    severity: High
    description: "{{nodeName}} は管理者の接続を受けて対象サーバーへ SSH / RDP で中継する、管理経路の集約点である。{{nodeName}} には特権セッションが集まり、対象サーバーへの接続に使う資格情報（SSH の秘密鍵・管理者パスワード・クラウドの権限）が置かれていることも多い。{{nodeName}} 自体や、その管理権限・利用者の資格情報を奪った攻撃者は、配下のすべてのサーバーへ正規の管理経路で管理者として到達でき、実行中の特権セッションを盗み見たり乗っ取ったりできる（Can）。操作は正規の管理経路を通るため、通常の運用と区別しにくい。一方、{{nodeName}} の利用に IdP 経由のフィッシング耐性のある MFA を必須にし、対象サーバーの資格情報を {{nodeName}} に置かず接続のたびに短命の資格情報（証明書・一時トークン）を発行し、利用者ごとに到達できるサーバーを絞り、セッションを記録して独立した監視基盤へ送っていれば、1 つのアカウントや踏み台が奪われても全サーバーへの到達や資格情報の持ち出しはできず、不審な操作は検知される（Cannot）。blast radius は {{nodeName}} から到達できるすべてのサーバーと、その管理者権限。"
    mitigation: "[Foundation] 踏み台の利用に MFA を必須にし、利用者ごとに到達できるサーバーと時間帯を絞る。踏み台に対象サーバーの SSH の秘密鍵やパスワードを置かない。踏み台の OS・ソフトウェアを最新に保ち、踏み台の上で管理以外の作業をしない。 [Enterprise] 認証を IdP に集約してフィッシング耐性のある MFA を使い、対象サーバーへの接続に短命の証明書や一時的な資格情報を使う。特権セッションを記録し、操作ログを SIEM に送って監視する。踏み台を経由しない直接の管理経路（管理ポートの開放）を塞ぐ。 [Advanced] 常設の到達権限を持たせず、作業の承認ごとに一時的な権限を与える（ジャストインタイム）。踏み台をセッションごとに作り直す使い捨ての構成にするか、受信ポートを持たないマネージドの接続方式にして、踏み台そのものを攻撃面にしない。"
    appliesTo:
      kind: node
      nodeType: BASTION
      # 特権セッションと資格情報が集まることは踏み台の役割そのもので、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "DE.CM-03"
    references:
      - title: "NIST SP 800-207 - Zero Trust Architecture（ポリシー強制点と、リクエストごとの最小権限の付与）"
        url: "https://csrc.nist.gov/pubs/sp/800/207/final"
      - title: "NIST SP 800-53 Rev.5 - Security and Privacy Controls for Information Systems and Organizations（AC-17 リモートアクセス / AC-6 最小権限）"
        url: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"

  # ── ZTNA プロキシへのアクセス判定の集中と迂回（内在）────────────────────
  - id: netinfra-ztna-proxy-access-concentration-001
    canonicalId: ztna-proxy-access-concentration
    framework: STRIDE
    category: "Elevation of Privilege"
    name: "ZTNA / ID 認識プロキシへのアクセス判定の集中と迂回"
    severity: High
    description: "{{nodeName}} は利用者の TLS を終端し、IdP の認証結果と端末の状態をもとに社内アプリへのアクセスを判定して中継する。すべてのアプリへのアクセスの可否が {{nodeName}} のポリシーと、それが信頼する IdP に集約されるため、ポリシーの誤り（広すぎるアプリの範囲・全員を許可する規則・端末状態の確認漏れ）、IdP の侵害やトークンの偽造、{{nodeName}} の管理コンソールや事業者の侵害があると、攻撃者は配下の全アプリへ正規の利用者として到達できる（Can）。通信は {{nodeName}} で一度平文になるため、事業者の設備で中身を読まれる余地もある。また、アプリが {{nodeName}} 以外の経路（社内ネットワーク・VPN）からも到達でき、{{nodeName}} が付けた利用者情報のヘッダーを検証せずに信用している場合、攻撃者は {{nodeName}} を迂回してヘッダーを偽装し、任意の利用者になりすませる。一方、アプリごとに許可する利用者と端末の状態を最小限に定義して変更をレビューし、管理コンソールを MFA と監査ログで保護し、アプリへの接続を {{nodeName}} からの経路に限ったうえで、アプリ側でも {{nodeName}} が付けた署名付きの利用者情報（署名付きヘッダー・JWT）を検証していれば、1 つの規則の誤りで全アプリが開くことはなく、迂回や偽装した利用者情報は受け付けられない（Cannot）。blast radius は {{nodeName}} の背後にある全アプリと、その利用者のデータ。"
    mitigation: "[Foundation] アプリごとに許可する利用者・グループ・端末の状態を明示し、全員を許可する規則や広いネットワーク範囲の規則を使わない。管理コンソールの管理者を少数に限り MFA を必須にする。アプリへの接続を ZTNA プロキシ（またはそのコネクタ）からの経路に限り、社内ネットワークや VPN からの直接の到達を塞ぐ。 [Enterprise] アプリ側で、ZTNA プロキシが付けた署名付きの利用者情報（署名付きヘッダー・JWT）の署名・発行者・オーディエンスを検証し、署名の無いヘッダーを信用しない。ポリシーの変更をレビュー必須にし、監査ログを SIEM に送る。IdP の障害・侵害時の影響範囲と切り戻しの手順を確認する。 [Advanced] ポリシーをコードとして管理し、広すぎる規則を CI で検出して止める。アクセスのたびに端末の状態とリスクを再評価し、セッション中でも条件が変われば接続を切る。機密性の高いアプリはアプリ側でも認可を行い、プロキシ単独の判定に依存しない。"
    appliesTo:
      kind: node
      nodeType: ZTNA_PROXY
      # アクセス判定と TLS 終端が集まることは ZTNA プロキシの役割そのもので、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-05"
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
    references:
      - title: "NIST SP 800-207 - Zero Trust Architecture（ポリシー決定点・ポリシー強制点と、その迂回の防止）"
        url: "https://csrc.nist.gov/pubs/sp/800/207/final"
      - title: "Google Cloud - Identity-Aware Proxy: Securing your app with signed headers（プロキシが付けた利用者情報の検証）"
        url: "https://cloud.google.com/iap/docs/signed-headers-howto"

  # ── 専用線・VPN（network: VPN）の暗号化していない区間（経路依存）──────────
  # 汎用の平文ルール（stride-edge-plain-encryption-001）と同じ脅威。canonicalId を共有し、同じエッジでは
  # 1 枚に畳み込まれる（severity が同じ High のため、ライブラリの読み込み順で先に来る本ルールが代表になる）。
  - id: netinfra-dedicated-line-unencrypted-001
    canonicalId: plaintext-transmission
    framework: STRIDE
    category: "Information Disclosure"
    name: "専用線・VPN の区間で暗号化していない通信の盗聴"
    severity: High
    description: "{{sourceName}} と {{targetName}} の間の通信は専用線・VPN（画面表示「専用線 (VPN)」）の区間を通るが、通信自体は暗号化されていない。専用線（AWS Direct Connect / Azure ExpressRoute / Google Cloud Interconnect / OCI FastConnect 等の閉域接続を含む）はインターネットから隔てられているが、既定では暗号化されず、通信事業者の伝送設備・中継局・コロケーション施設の配線や機器を経由する。IPsec VPN の場合も、トンネルで暗号化されるのは終端装置どうしの間だけで、トンネルの終端点より内側の区間と終端装置の上では平文になる。そのため、事業者の設備・終端装置・終端点より内側のネットワークのいずれかにアクセスできる者（設備や終端装置の侵害、施設内での不正な接続、回線の誤った収容、内側の区間に入り込んだ攻撃者）は、通信をそのまま読み、改ざんできる（Can）。「閉域だから安全」「VPN を通るから安全」という前提でアプリ層の暗号化や認証を省いた業務通信（データベースの複製・ファイル転送・管理通信）がまとめて流れるため、1 か所の盗聴で得られる情報が多い。平文のまま記録された通信は、将来の量子計算機を待たずにいつでも読める。一方、アプリの通信を TLS 等で端から端まで暗号化していれば、回線や終端装置の上で傍受されても中身は読めず、改ざんは検知される（Cannot）。回線の暗号化（MACsec・IPsec）は事業者の設備での傍受を防ぐが、終端点より内側の区間は守らない。blast radius は {{sourceName}} と {{targetName}} の間で専用線・VPN を通る全通信。"
    mitigation: "[Foundation] 専用線・VPN を通る通信を棚卸しし、平文のプロトコル（データベースの複製・ファイル転送・管理通信等）を TLS 等の暗号化された方式に切り替える。閉域であること、VPN を通ることを理由にアプリ層の暗号化や認証を省かない。 [Enterprise] 暗号化されていない専用線（クラウドの閉域接続を含む）には、対応するポート・回線で MACsec（IEEE 802.1AE）を有効にするか IPsec VPN を重ね、回線全体を暗号化する。暗号化の鍵を定期的に更新し、暗号化されていない状態に落ちたら警告する設定にする。IPsec VPN では、トンネルの終端点より内側の区間も平文のままにしない。 [Advanced] 回線やトンネルの暗号化だけに頼らず、アプリ間の通信もすべて相互認証付きの TLS にする（多層の暗号化）。長期の秘匿が必要な通信は PQC ハイブリッドの鍵交換に対応した方式にする。"
    appliesTo:
      kind: edge
      # 専用線・VPN（network: VPN）の区間のうち、平文のものだけで発火する（TLS の区間は pqc-dedicated-line-hndl-001）。
      when:
        network: [VPN]
        encryption: [Plain]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
    references:
      - title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations（通信の暗号化）"
        url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
      - title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs（拠点間の回線の暗号化）"
        url: "https://csrc.nist.gov/pubs/sp/800/77/r1/final"
      - title: "IEEE 802.1AE - Media Access Control (MAC) Security（MACsec によるリンク暗号化）"
        url: "https://standards.ieee.org/"
      - title: "Microsoft Learn - Configure MACsec on ExpressRoute Direct ports（閉域接続での MACsec）"
        url: "https://learn.microsoft.com/azure/expressroute/expressroute-howto-macsec"

  # ── プライベートエンドポイント経由の持ち出しと公開経路へのフォールバック（内在）──
  - id: netinfra-private-endpoint-exfiltration-001
    canonicalId: private-endpoint-data-exfiltration
    framework: STRIDE
    category: "Information Disclosure"
    name: "プライベートエンドポイント経由の攻撃者所有リソースへの持ち出しと公開経路へのフォールバック"
    severity: Medium
    description: "{{nodeName}} は閉域ネットワークからクラウドサービスへ接続する入口で、ネットワーク上は同じ種類のサービスへの通信として扱われる。エンドポイントポリシー（接続先のアカウント・リソースの制限）を設定していない場合、閉域内の侵害されたワークロードや内部の利用者は、{{nodeName}} を通じて攻撃者が所有する別のアカウントのストレージ等へデータを書き出せる（Can）。通信は閉域内で完結し、宛先も正規のサービスに見えるため、インターネットへの出口の監視や許可リストでは止まらない。また、プライベート DNS の設定が欠けている、または一部の環境（オンプレミス等）で解決されない場合、サービス名は公開のアドレスに解決され、通信は気づかれないまま公開経路へ出て、閉域を前提にした制御を通らない。一方、エンドポイントポリシーで接続先を自組織のアカウント・リソースに限定し、サービス側のポリシーでも {{nodeName}} 経由以外のアクセスを拒否し（データ境界の制御）、閉域内の全環境でプライベート DNS の解決を確認していれば、攻撃者のリソースへの持ち出しも公開経路への迂回もできない（Cannot）。blast radius は {{nodeName}} を使える閉域内のワークロードが扱う全データ。"
    mitigation: "[Foundation] プライベートエンドポイントごとにエンドポイントポリシーを設定し、接続先を自組織のアカウント・リソースに限定する。閉域内のすべての環境（オンプレミスからの名前解決を含む）で、サービス名がプライベートアドレスに解決されることを確認する。 [Enterprise] サービス側のリソースポリシーで、プライベートエンドポイント経由かつ自組織からのアクセスだけを許可し、不要な公開エンドポイントを無効にする。データ境界の制御（VPC Service Controls 等）で組織外のリソースへの書き出しを拒否する。プライベートエンドポイント経由の操作をクラウドの監査ログで監視する。 [Advanced] データ境界のポリシーをコードとして管理して全アカウントに一律に適用し、自組織外のリソースへのアクセスや公開アドレスへの名前解決を検知して警告する。"
    appliesTo:
      kind: node
      nodeType: PRIVATE_ENDPOINT
      # 接続先を制限しない限り同種のサービスなら何にでも届くことはプライベートエンドポイントの性質で、
      # 接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "PR.IR-01"
    references:
      - title: "AWS - Control access to VPC endpoints using endpoint policies（エンドポイントポリシーによる接続先の制限）"
        url: "https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html"
      - title: "Microsoft Learn - Azure Private Endpoint DNS configuration（プライベートエンドポイントの名前解決）"
        url: "https://learn.microsoft.com/azure/private-link/private-endpoint-dns"
      - title: "Google Cloud - VPC Service Controls overview（データ境界による持ち出しの防止）"
        url: "https://cloud.google.com/vpc-service-controls/docs/overview"

  # ── サービスメッシュの mTLS の非強制とサイドカーまでの平文区間（内在）────────
  - id: netinfra-service-mesh-mtls-not-enforced-001
    canonicalId: service-mesh-mtls-not-enforced
    framework: STRIDE
    category: "Spoofing"
    name: "サービスメッシュの mTLS の非強制（permissive モード）とサイドカーまでの平文区間"
    severity: Medium
    description: "{{nodeName}} はサービス間の通信を各サービスのサイドカー（またはノードのプロキシ）で mTLS にする。移行中によく使われる permissive モード（mTLS と平文の両方を受け付ける）のままにしている場合、メッシュの外にある攻撃者のワークロードや侵害されたメッシュ外のポッドは、平文でサービスに直接接続し、相互認証もサービス ID による認可も素通りできる（Can）。サイドカーを入れ忘れたサービスや、サイドカーを経由しない経路（ホストネットワーク・ポッド IP への直接の接続）でも同じことが起きる。また、アプリとサイドカーの間は通常は平文で、同じポッドやノードで動く侵害されたコンテナ、ノードの権限を持つ攻撃者は暗号化される前の通信を読める。一方、mTLS を strict モード（平文を拒否）にし、サービスごとの認可ポリシーを既定拒否で定義し、サイドカーの注入漏れを検知して、ノードの権限とコンテナの分離を保っていれば、メッシュの外からの平文の接続やサービス ID を持たない接続は拒否される（Cannot）。blast radius は mTLS を強制していないサービスと、そこから到達できるメッシュ内のサービス。"
    mitigation: "[Foundation] mTLS を strict モード（平文を拒否）にする。permissive モードは移行期間に限り、期限と対象を決めて管理する。サイドカーが注入されていないサービスと、メッシュを経由しない経路を洗い出す。 [Enterprise] サービスごとの認可ポリシーを既定拒否で定義し、送信元のサービス ID ごとに許可する。サイドカーの注入漏れや permissive の設定をアドミッション制御で拒否する。ノードとコンテナの権限を最小にし、同じポッドに不要なコンテナを同居させない。 [Advanced] mTLS の状態と認可の判定をメッシュのテレメトリーで監視し、平文の接続や想定外の送信元を検知する。機密性の高いサービスはアプリ自身でも送信元を認証・認可し、メッシュの設定だけに依存しない。"
    appliesTo:
      kind: node
      nodeType: SERVICE_MESH
      # mTLS の強制の度合いとサイドカーまでの平文区間はメッシュの構成の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
    references:
      - title: "NIST SP 800-204A - Building Secure Microservices-based Applications Using Service-Mesh Architecture（サービス間の mTLS と認可）"
        url: "https://csrc.nist.gov/pubs/sp/800/204/a/final"
      - title: "NIST SP 800-207A - A Zero Trust Architecture Model for Access Control in Cloud-Native Applications in Multi-Location Environments（サービス ID に基づくアクセス制御）"
        url: "https://csrc.nist.gov/pubs/sp/800/207/a/final"
      - title: "Istio - Security concepts（ピア認証のモードと認可ポリシー）"
        url: "https://istio.io/latest/docs/concepts/security/"

  # ── メッシュ CA の鍵の侵害によるサービスのなりすまし（内在）─────────────
  - id: netinfra-service-mesh-ca-key-compromise-001
    canonicalId: service-mesh-ca-key-compromise
    framework: STRIDE
    category: "Spoofing"
    name: "メッシュ CA の鍵の侵害によるサービスのなりすまし"
    severity: High
    description: "{{nodeName}} の制御プレーンは、各サービスのサイドカーへサービス ID（SPIFFE ID 等）を表す証明書を発行するメッシュ CA を持つ。メッシュ CA の署名鍵が盗まれる（Kubernetes のシークレットに置かれた鍵の読み出し、制御プレーンの侵害等）と、攻撃者は任意のサービスの証明書を作り、mTLS とサービス ID に基づく認可を通過して、決済・認証などあらゆるサービスになりすませる（Can）。制御プレーンの権限があれば、認可ポリシーの書き換えや通信の転送先の変更もできる。一方、メッシュ CA を組織の PKI の配下の中間 CA にして署名鍵を鍵管理サービスや HSM に置いて取り出せないようにし、ワークロード証明書の有効期間を短くし、制御プレーンとシークレットへのアクセスを最小限の管理者に絞って監視していれば、鍵そのものは持ち出せず、偽造できる範囲と期間も限られる（Cannot）。blast radius は {{nodeName}} に参加するすべてのサービスの ID と、それに基づく認可。"
    mitigation: "[Foundation] メッシュ CA の署名鍵の保管場所を確認し、自己署名のルート CA を既定のまま Kubernetes のシークレットに置かない。制御プレーンの名前空間とシークレットを読める権限を最小限の管理者に絞る。ワークロード証明書の有効期間を短くする。 [Enterprise] メッシュ CA を組織の PKI の配下の中間 CA にし、署名鍵を鍵管理サービスや HSM に置く（外部 CA との連携）。制御プレーンの設定変更とシークレットへのアクセスを監査ログで監視する。 [Advanced] メッシュ CA の失効と再発行、全ワークロードの証明書の入れ替えを短時間で行える手順を用意し、訓練する。ワークロード ID の発行に、ノードやワークロードの検証（アテステーション）を組み合わせる。"
    appliesTo:
      kind: node
      nodeType: SERVICE_MESH
      # サービス ID を発行する CA を持つことはメッシュの機能そのもので、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.AA-03"
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
    references:
      - title: "NIST SP 800-204A - Building Secure Microservices-based Applications Using Service-Mesh Architecture（メッシュの証明書の発行と鍵の保護）"
        url: "https://csrc.nist.gov/pubs/sp/800/204/a/final"
      - title: "NIST SP 800-57 Part 1 Rev.5 - Recommendation for Key Management（CA 鍵の保護と有効期間）"
        url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
      - title: "Istio - Security concepts（ID と証明書の管理）"
        url: "https://istio.io/latest/docs/concepts/security/"
