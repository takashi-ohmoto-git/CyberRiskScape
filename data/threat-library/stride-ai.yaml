  - id: stride-web-unprotected-traffic-from-user-001
    canonicalId: web-frontend-plaintext-ingress
    framework: STRIDE
    category: "Information Disclosure"
    name: "Front-end への平文流入"
    severity: High
    description: "{{sourceName}} から {{targetName}}（Front-end Server）への通信が平文で、認証情報・セッショントークン・PII が盗聴・改ざんされるリスクがあります。"
    mitigation: "Front-end は HTTPS / HSTS を強制し、HTTP→HTTPS リダイレクト・HSTS preload を有効化。内部通信も mTLS を推奨。"
