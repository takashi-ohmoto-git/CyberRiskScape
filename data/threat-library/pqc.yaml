# PQC（耐量子計算機暗号）移行リスクに関する脅威ルール。
# 出典:
#   - NIST IR 8547 "Transition to Post-Quantum Cryptography Standards"
#     （PQC 移行・古典暗号の deprecation/disallow スケジュール）。https://csrc.nist.gov/
#   - NIST FIPS 203 (ML-KEM) / FIPS 204 (ML-DSA) / FIPS 205 (SLH-DSA)
#     （標準化された PQC 鍵カプセル化・署名アルゴリズム）。https://csrc.nist.gov/
#   - NSA CNSA 2.0 "Commercial National Security Algorithm Suite 2.0"
#     （長寿命システム・ファームウェア署名の PQC 移行期限）。https://www.nsa.gov/
#   - CRYPTREC「電子政府推奨暗号リスト」および耐量子計算機暗号に関する調査報告
#     （日本国内の暗号アルゴリズム移行方針）。https://www.cryptrec.go.jp/
#   - IETF RFC 8446 "The Transport Layer Security (TLS) Protocol Version 1.3"
#     （静的 RSA 鍵交換の廃止）。https://www.rfc-editor.org/rfc/rfc8446
#   - IETF RFC 9370 "Multiple Key Exchanges in the Internet Key Exchange Protocol Version 2 (IKEv2)"
#     （IKEv2 への追加の鍵交換＝PQC ハイブリッドの枠組み）。https://www.rfc-editor.org/rfc/rfc9370
#   - NIST SP 800-77 Rev.1 "Guide to IPsec VPNs"。https://csrc.nist.gov/
#   - NIST SP 800-38F "Recommendation for Block Cipher Modes of Operation: Methods for Key Wrapping"
#     （対称鍵による鍵ラッピング）。https://csrc.nist.gov/
#   - NIST FIPS 140-3 "Security Requirements for Cryptographic Modules"。https://csrc.nist.gov/
#   - IEEE 802.1AE "Media Access Control (MAC) Security"（MACsec による回線の暗号化）。https://standards.ieee.org/
#   本文は逐語転載せず日本語要約のみ。クロスマッピングは references にコメント併記する。
#
#   SPDX-License-Identifier: Apache-2.0
#   ライセンス: 本ファイルは Apache License 2.0（LICENSE 参照）。
#   出典の帰属表示は NOTICE を参照。
#
# 重複回避方針:
#   暗号・通信保護の脅威は既存ライブラリと一部重なるが、PQC 特有の「将来の量子計算機による
#   遡及的失効」「暗号アルゴリズムの差し替え可能性（crypto-agility）」「移行管理（ガバナンス）」は
#   現行ライブラリ未カバーのため、本ファイルで差分のみ追加する。
#   - 現在時点の平文盗聴      → stride-edge-plain-encryption-001（encryption:[Plain]）でカバー済。
#     本ファイルの HNDL は TLS（古典鍵交換）でも将来復号され得る点を扱い、別 canonicalId とする。
#   - 委譲経路の暗号化欠如    → anthropic-zt-delegation-integrity-001 / maestro-agent-untrusted-response-001 でカバー済。
#   - 保管時暗号化の不備      → stride-datastore-info-disclosure（保管時暗号化）でカバー済。
#   本ファイルが追加するのは PQC 移行固有の 4 リスク（HNDL / CBOM 欠如 / 長寿命署名 / crypto-agility）。
#
#   network-infra コンポーネントライブラリ（暗号を終端しうる機器の 14 型）に合わせて追加した 3 ルール:
#   - VPN トンネルの古典鍵交換による HNDL → pqc-vpn-tunnel-hndl-001。既存 HNDL と同じ脅威なので
#     canonicalId: harvest-now-decrypt-later を共有する。既存ルールはストア宛ての経路だけを対象にし、
#     description もストア前提のため、anyOf を足さず VPN 専用の description を持つ別ルールにした。
#   - 受動復号（WAF / IDS_IPS が秘密鍵を取り込む構成）の静的 RSA 依存 → PQC 移行の阻害要因として新規。
#     crypto-agility-gap は「暗号方式を差し替えられない実装」で、こちらは「検査の仕組みが古い鍵交換を
#     前提にしており、移行すると検査が止まる」という別の問いのため canonicalId を分ける。
#   - HSM の PQC 鍵非対応と鍵ラッピングの量子脆弱性 → HSM ノード視点で新規。crypto-agility-gap と
#     近接するが、対象が鍵の保管装置（ハードウェアの更新周期に縛られる）で、鍵ラッピング経由の HNDL を
#     含むため別 canonicalId とする（統合の可否は人間判断に残す）。
#   - TLS インスペクション・CDN・STARTTLS 等、PQC 以外の終端機器の脅威は network-infra.yaml が扱う。
#
#   network-infra に追加した DEDICATED_LINE（専用線 / 閉域接続）に合わせて追加した 1 ルール:
#   - 閉域接続の TLS の古典鍵交換による HNDL → pqc-dedicated-line-hndl-001。既存 HNDL と同じ脅威なので
#     canonicalId: harvest-now-decrypt-later を共有する。VPN 版と同じく対象区間専用の description を持つ
#     別ルール。encryption は [TLS] のみ（平文の区間は今すぐ読めるため、network-infra.yaml の
#     netinfra-dedicated-line-unencrypted-001（canonicalId: plaintext-transmission）が扱う）。
#
# framework について:
#   スキーマの FrameworkSchema は enum ['STRIDE','AI','AgenticAI'] で閉じており、新値 "PQC" の
#   追加はスキーマ破壊変更となるため行わない（YAML 内表現を優先）。PQC リスクは本質的に
#   暗号・情報保護（STRIDE の Information Disclosure / Tampering）に属するため framework:STRIDE とし、
#   PQC 固有性は category / name / description / references で表現する。enum 拡張の要否は人間判断。
#
# encryption enum について:
#   EncryptionTypeSchema は ['Plain','TLS','E2EE'] のまま。古典鍵交換 vs PQC 鍵交換の区別は
#   enum 拡張せず、HNDL ルールの description と条件設計（[Plain, TLS] を対象に含める）で表現する。
#
# mitigation は 3 段階成熟度（[Foundation] / [Enterprise] / [Advanced]）をインライン markup で示す。
# description は Can/Cannot ペアと blast radius を意識して記述する。

schemaVersion: 1

rules:
  # ── Harvest Now, Decrypt Later（HNDL）─────────────────────────
  # 平文だけでなく、TLS（古典鍵交換 ECDHE/RSA）でも収集後に将来の量子計算機で
  # 遡及復号され得る点が要点。現在時点の盗聴は stride-edge-plain-encryption-001 が扱う。
  - id: pqc-harvest-now-decrypt-later-001
    canonicalId: harvest-now-decrypt-later
    framework: STRIDE
    category: "Information Disclosure"
    name: "Harvest Now, Decrypt Later（収集後・将来復号）"
    severity: Medium
    description: "{{sourceName}} から {{targetName}} へ流れる長期機密性が必要なデータ（機密情報・個人情報・認証情報を保持し得るストア等と送受する経路）が、平文または古典鍵交換（ECDHE/RSA 等）の TLS で運ばれる場合、攻撃者は今のうちに暗号文を収集・保存し、将来の暗号学的に十分な量子計算機（CRQC）が登場した時点で遡及的に復号できる。長期機密データの秘匿期間が CRQC 出現時期を跨ぐと、現時点で「暗号化済み」でも将来の機密性は保証されない。一方、この経路自体は将来時点の復号であり、現在のセッションのリアルタイム盗聴・改ざんを直ちに可能にするものではない（その即時リスクは平文経路ルールが別途扱う）。"
    mitigation: "[Foundation] 長期機密データを運ぶ経路を TLS で暗号化し、平文経路を排除する（前提）。秘匿要求期間が長いデータフローを棚卸しし、HNDL 対象として識別する。 [Enterprise] TLS の鍵交換を PQC ハイブリッド（ML-KEM + 古典 ECDHE の併用、X25519MLKEM768 等）へ移行し、収集済み暗号文の将来復号を不可能化する。 [Advanced] 長期機密データはアプリ層でも PQC/ハイブリッド KEM により封緘し、鍵管理を crypto-agile に保ってアルゴリズム危殆化時に再暗号化できる体制を維持する。"
    appliesTo:
      kind: edge
      # 長期機密データはストアへ書き込む経路とストアから読み出す経路の両方を流れる
      anyOf:
        - encryption: [Plain, TLS]
          targetType: [DATA_STORE, DB]
        - encryption: [Plain, TLS]
          sourceType: [DATA_STORE, DB]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
    references:
      # 要約参照のみ（逐語転載なし）。HNDL の概念と PQC 鍵交換移行の根拠。
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "NIST FIPS 203 - Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM)"
        url: "https://csrc.nist.gov/pubs/fips/203/final"

  # ── 暗号インベントリ（CBOM）欠如 ─────────────────────────────
  # PQC 移行の前提となる「どこで何の暗号が使われているか」の可視化が無い、というガバナンス
  # 系の内在リスク。接続関係に依存しないため required:false。
  - id: pqc-crypto-inventory-cbom-gap-001
    canonicalId: crypto-inventory-gap
    framework: STRIDE
    category: "Cryptographic Governance"
    name: "暗号インベントリ（CBOM）の欠如"
    severity: Medium
    description: "{{nodeName}} のような機密データを保持・仲介する資産で、利用中の暗号アルゴリズム・鍵長・証明書・ライブラリを体系的に棚卸しした暗号部品表（CBOM）が無い場合、組織は量子脆弱な古典暗号（RSA/ECDSA/ECDH）がどこに残存するかを把握できず、PQC 移行計画を立てられない。攻撃者の直接的な侵入手段ではないが、移行漏れにより危殆化アルゴリズムが長期間放置され、HNDL や署名偽造のリスク面を広げる（blast radius は当該資産が扱う全機密データ）。一方、CBOM 欠如それ自体は単独で機密性を破る脆弱性ではなく、量子脅威の顕在化や別の暗号弱点と組み合わさって初めて実害となる。"
    mitigation: "[Foundation] 当該資産で使用する暗号アルゴリズム・鍵長・証明書・暗号ライブラリを台帳化し、量子脆弱な古典暗号（RSA/ECDSA/ECDH）の所在を明示する。 [Enterprise] CBOM を自動生成・継続更新し（依存スキャン・TLS スキャン連携）、CI/CD で量子脆弱アルゴリズムの新規導入を検知・ブロックする。 [Advanced] CBOM を資産インベントリ・PQC 移行ロードマップに統合し、危殆化時に影響資産を即時特定して優先度付き再暗号化を発動できる体制を維持する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: DATA_STORE
        - nodeType: DB
        - nodeType: GATEWAY
        - nodeType: FRONT_END_SERVER
      # 暗号インベントリの有無は資産の運用ガバナンスの性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "ID.AM-02"
      - standard: nist-csf-2.0
        ref: "ID.AM-08"
    references:
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards（暗号インベントリの必要性）"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "CRYPTREC - 耐量子計算機暗号の研究動向調査報告書"
        url: "https://www.cryptrec.go.jp/"

  # ── 長寿命デバイスの非PQC署名検証 ────────────────────────────
  # IOT 向け。ファームウェア署名・デバイス証明書の有効期間が PQC 移行期限（CNSA 2.0 等）を
  # 跨ぐと、フィールド配備後に署名が量子脆弱なまま固定化される内在リスク。
  - id: pqc-long-lived-device-signature-001
    canonicalId: long-lived-non-pqc-signature
    framework: STRIDE
    category: "Tampering"
    name: "長寿命デバイスの非PQC署名検証"
    severity: Medium
    description: "{{nodeName}} のような長期間フィールド配備される IOT デバイスが、ファームウェア署名やデバイス証明書を古典署名アルゴリズム（RSA/ECDSA）のみで検証し、その鍵・証明書の有効期間が PQC 移行期限を跨ぐ場合、将来 CRQC が署名鍵を導出できるようになると、攻撃者は偽造ファームウェアに正規署名を付して配信し、検証を通過させてデバイスを掌握できる。物理回収・再プロビジョニングが困難な長寿命デバイスでは更新自体が間に合わず、危殆化が配備寿命の残期間にわたり固定化される。一方、これは将来時点の署名偽造であり、ML-DSA/SLH-DSA 等の PQC 署名を検証できる crypto-agile なブートチェーンであれば、現行鍵の危殆化前に署名方式を切り替えて偽造を防げる。"
    mitigation: "[Foundation] デバイスのファームウェア署名・証明書に使う署名アルゴリズムと有効期間を棚卸しし、配備寿命が PQC 移行期限を跨ぐデバイスを識別する。 [Enterprise] セキュアブート／ファームウェア更新の検証を crypto-agile に設計し、PQC 署名（ML-DSA / SLH-DSA）またはハイブリッド署名を検証できるようにする。 [Advanced] ハードウェア信頼の起点（TPM/セキュアエレメント）に PQC 署名検証を束ね、フィールドでの署名アルゴリズム移行とロールバック防止を attestation で強制する。"
    appliesTo:
      kind: node
      nodeType: IOT
      # 署名検証方式と証明書寿命はデバイス自体の設計の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.PS-01"
      - standard: nist-csf-2.0
        ref: "PR.PS-02"
    references:
      - title: "NSA CNSA 2.0 - Commercial National Security Algorithm Suite 2.0（長寿命システムの PQC 移行期限）"
        url: "https://www.nsa.gov/"
      - title: "NIST FIPS 204 - Module-Lattice-Based Digital Signature Standard (ML-DSA)"
        url: "https://csrc.nist.gov/pubs/fips/204/final"
      - title: "NIST FIPS 205 - Stateless Hash-Based Digital Signature Standard (SLH-DSA)"
        url: "https://csrc.nist.gov/pubs/fips/205/final"

  # ── Crypto-agility 欠如 ──────────────────────────────────────
  # 暗号アルゴリズムを差し替えられない実装・プロトコル固定化。HNDL/署名偽造の前提を
  # 悪化させる横断的な内在リスク。対象は暗号を担う資産（DATA_STORE/DB/GATEWAY/
  # FRONT_END_SERVER/CONNECTOR）。
  - id: pqc-crypto-agility-gap-001
    canonicalId: crypto-agility-gap
    framework: STRIDE
    category: "Cryptographic Governance"
    name: "Crypto-agility（暗号俊敏性）の欠如"
    severity: Medium
    description: "{{nodeName}} の暗号処理が特定アルゴリズム・鍵長・プロトコル版数にハードコードされ、設定や鍵管理から暗号方式を差し替えられない場合、PQC 標準（ML-KEM/ML-DSA）への移行や古典アルゴリズム危殆化時の緊急切替に、コード改修・再デプロイ・場合により全データ再暗号化を要する。攻撃者の直接的な攻撃ベクタではないが、危殆化からの復旧時間を著しく延ばし、HNDL や署名偽造の暴露期間を広げる（blast radius は当該資産が保護する全データ・全セッション）。一方、暗号方式が抽象化され設定駆動で切替可能であれば、危殆化検知から短期間で PQC/ハイブリッドへ移行でき、暴露期間を限定できる。"
    mitigation: "[Foundation] 暗号アルゴリズム・鍵長・プロトコル版数をコードから外し、設定・鍵管理層で切替可能にする（ハードコード排除）。 [Enterprise] 暗号処理を抽象化レイヤ（crypto provider）越しに呼び出し、PQC ハイブリッドを含む複数方式をネゴシエーション／フォールバックできるようにし、切替を CI で検証する。 [Advanced] アルゴリズム危殆化を契機に設定変更のみで全経路を PQC へ移行し、再暗号化・鍵ローテーションを自動オーケストレーションできる crypto-agile 基盤を維持する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: DATA_STORE
        - nodeType: DB
        - nodeType: GATEWAY
        - nodeType: FRONT_END_SERVER
        - nodeType: CONNECTOR
      # アルゴリズム差替え可能性は実装設計の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
      - standard: nist-csf-2.0
        ref: "ID.IM-01"
    references:
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards（crypto-agility の要請）"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "CRYPTREC - 電子政府推奨暗号リスト / 耐量子計算機暗号の移行に関する報告"
        url: "https://www.cryptrec.go.jp/"

  # ── VPN トンネルの古典鍵交換による HNDL ───────────────────────────────
  # 既存 HNDL（ストア宛て経路）と同じ脅威。Internet をまたぐ VPN トンネルを対象にした別ルール。
  - id: pqc-vpn-tunnel-hndl-001
    canonicalId: harvest-now-decrypt-later
    framework: STRIDE
    category: "Information Disclosure"
    name: "VPN トンネルの古典鍵交換による Harvest Now, Decrypt Later"
    severity: Medium
    description: "{{sourceName}} と {{targetName}} の間の VPN トンネルはインターネットを通る。トンネルの鍵交換（IKEv2 の Diffie-Hellman / ECDH、SSL-VPN の TLS の ECDHE 等）が古典暗号だけで行われている場合、攻撃者はインターネット上でトンネルの暗号文を今のうちに収集・保存し、将来の暗号学的に十分な量子計算機（CRQC）で鍵交換を破って、トンネル内のすべての通信を遡って復号できる（Can）。VPN トンネルは拠点間・リモートアクセスの業務通信をまとめて運ぶため、1 本の収集で得られる情報が多い。一方、これは将来時点の復号であり、現在のトンネルのリアルタイムな盗聴・改ざんを可能にするものではない。IKEv2 に ML-KEM 等の追加の鍵交換を組み合わせたハイブリッド方式（RFC 9370 の枠組み）や、事前共有の量子耐性鍵（PPK）を使っていれば、収集された暗号文を将来復号することはできない（Cannot）。blast radius は {{targetName}} を経由するトンネル内の全通信のうち、秘匿期間が CRQC の出現時期を超えるもの。"
    mitigation: "[Foundation] VPN の鍵交換方式（DH グループ・暗号スイート）と、トンネルを通る通信の秘匿期間を棚卸しし、長期の秘匿が必要な通信を運ぶトンネルを特定する。古い DH グループと IKEv1 を無効にする。 [Enterprise] VPN ゲートウェイを PQC ハイブリッドの鍵交換（IKEv2 の追加鍵交換で ML-KEM を併用、SSL-VPN は X25519MLKEM768 等）に対応した版へ更新し、対応までの間は量子耐性の事前共有鍵（PPK）を併用する。 [Advanced] 長期の秘匿が必要なデータはトンネルに頼らずアプリ層でも PQC / ハイブリッドで暗号化し、VPN 自体も ZTNA 等のアプリ単位の接続へ置き換えていく。"
    appliesTo:
      kind: edge
      # Internet 側と VPN ゲートウェイの間（トンネルが公衆網を通る区間）で発火する。
      anyOf:
        - targetType: [VPN_GATEWAY]
          sourceTrust: [Internet]
        - sourceType: [VPN_GATEWAY]
          targetTrust: [Internet]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
    references:
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "IETF RFC 9370 - Multiple Key Exchanges in the Internet Key Exchange Protocol Version 2 (IKEv2)"
        url: "https://www.rfc-editor.org/rfc/rfc9370"
      - title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs"
        url: "https://csrc.nist.gov/pubs/sp/800/77/r1/final"

  # ── 受動復号の静的 RSA 依存による PQC 移行の阻害 ─────────────────────────
  # WAF（アウトオブバンド型）/ IDS_IPS が秘密鍵を取り込んで受動的に復号する構成。
  - id: pqc-passive-decryption-static-rsa-001
    canonicalId: passive-decryption-static-rsa-dependency
    framework: STRIDE
    category: "Cryptographic Governance"
    name: "受動復号の静的 RSA 依存による PQC 移行の阻害"
    severity: Medium
    description: "{{nodeName}} がサーバーの秘密鍵を取り込み、通信をコピーして受動的に復号する構成（アウトオブバンド型）の場合、この仕組みは静的 RSA 鍵交換（前方秘匿性のない鍵交換）に依存する。TLS 1.3 は ECDHE を必須にしており、ML-KEM を含む PQC の鍵交換も同じく一時鍵を使うため、移行すると {{nodeName}} は復号できなくなる。そのため検査を続けたい組織が古い TLS と静的 RSA を残し、移行が止まりやすい（Can）。静的 RSA を残すと、サーバーの秘密鍵が 1 つ漏れるだけで記録済みの全通信が復号され、将来の量子計算機でも同じことが起きる。秘密鍵が検査装置にも複製されるため、鍵の漏えい経路も増える。一方、検査をリバースプロキシ型（TLS を終端してから検査する方式）やサーバー側のログ・エージェントに切り替えていれば、検査を止めずに TLS 1.3 と PQC の鍵交換へ移行でき、秘密鍵を検査装置へ配る必要もない（Cannot）。blast radius は {{nodeName}} が検査するサーバーの全通信と、そのサーバーの秘密鍵。"
    mitigation: "[Foundation] 秘密鍵を取り込んで受動復号している装置を棚卸しし、検査のために静的 RSA や古い TLS を残しているサーバーを特定する。 [Enterprise] 検査方式をリバースプロキシ型（TLS を終端してから検査する WAF 等）か、サーバー側での検査（アプリのログ・エージェント）に切り替え、サーバーの TLS を 1.3 と PQC ハイブリッドの鍵交換へ移行する。検査装置に複製した秘密鍵を回収し、証明書を再発行する。 [Advanced] 検査の方式を PQC 移行計画に組み込み、鍵交換方式を変えても検査が続けられる構成（終端点での検査）に統一する。"
    appliesTo:
      kind: node
      anyOf:
        - nodeType: WAF
        - nodeType: IDS_IPS
      # 受動復号の可否は装置の構成の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
      - standard: nist-csf-2.0
        ref: "ID.IM-01"
    references:
      - title: "IETF RFC 8446 - The Transport Layer Security (TLS) Protocol Version 1.3（静的 RSA 鍵交換の廃止）"
        url: "https://www.rfc-editor.org/rfc/rfc8446"
      - title: "NIST SP 800-52 Rev.2 - Guidelines for the Selection, Configuration, and Use of TLS Implementations（前方秘匿性のある鍵交換）"
        url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"

  # ── HSM の PQC 鍵非対応と鍵ラッピングの量子脆弱性 ───────────────────────
  - id: pqc-hsm-pqc-key-support-gap-001
    canonicalId: hsm-pqc-key-support-gap
    framework: STRIDE
    category: "Cryptographic Governance"
    name: "HSM の PQC 鍵非対応と鍵ラッピングの量子脆弱性"
    severity: Medium
    description: "{{nodeName}} は TLS 終端機器の秘密鍵や、データ暗号鍵を包む鍵（鍵ラッピング用の鍵）を保管する。{{nodeName}} のファームウェアが ML-KEM / ML-DSA に対応していない、または PQC の大きな鍵・署名を扱えない場合、これに依存する TLS 終端機器・CA・署名基盤は PQC へ移行できず、HSM の更新周期（数年単位）が組織全体の移行期限を決めてしまう（Can）。また、鍵のバックアップ・複製・クラウドとの鍵の受け渡し（BYOK）で、鍵を RSA-OAEP 等の古典的な公開鍵暗号で包んで送っている場合、攻撃者は包まれた鍵を今のうちに収集し、将来の量子計算機で開いて、その鍵が守る全データを復号できる（HNDL）。一方、PQC 対応のファームウェアと FIPS 140-3 認証の更新計画を持つ HSM を選び、鍵の受け渡しを AES-256 による鍵ラッピング（SP 800-38F）か PQC / ハイブリッドの鍵カプセル化で行っていれば、移行は HSM で止まらず、収集された鍵を将来開くこともできない（Cannot）。blast radius は {{nodeName}} の鍵が守る全データ・全セッション・全署名。"
    mitigation: "[Foundation] HSM の型番・ファームウェア版数・対応アルゴリズム・FIPS 140-3 の認証状況を台帳化し、PQC（ML-KEM / ML-DSA / SLH-DSA）への対応予定を製造元に確認する。鍵の受け渡し・バックアップで使っているラッピング方式を棚卸しする。 [Enterprise] 鍵の受け渡しを AES-256 の鍵ラッピングか PQC / ハイブリッドの鍵カプセル化に切り替える。HSM の更新を PQC 移行計画に組み込み、PQC 対応のファームウェアへの更新と、大きな鍵・署名での性能を検証する。 [Advanced] 古典暗号で包んで受け渡した鍵は収集済みとみなし、PQC 対応後に鍵を作り直して再暗号化する。暗号方式を差し替えられる鍵管理（crypto-agile な鍵管理）に統一する。"
    appliesTo:
      kind: node
      nodeType: HSM
      # HSM の対応アルゴリズムと鍵ラッピング方式は装置と運用の性質で、接続関係に依存しない内在リスク。
      connection:
        required: false
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-01"
      - standard: nist-csf-2.0
        ref: "ID.AM-08"
    references:
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "NIST FIPS 140-3 - Security Requirements for Cryptographic Modules"
        url: "https://csrc.nist.gov/pubs/fips/140-3/final"
      - title: "NIST SP 800-38F - Recommendation for Block Cipher Modes of Operation: Methods for Key Wrapping"
        url: "https://csrc.nist.gov/pubs/sp/800/38/f/final"
      - title: "NIST FIPS 203 - Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM)"
        url: "https://csrc.nist.gov/pubs/fips/203/final"

  # ── 専用線 / 閉域接続の TLS の古典鍵交換による HNDL ─────────────────────
  # 既存 HNDL と同じ脅威。専用線 / 閉域接続の TLS の区間を対象にした別ルール（平文の区間は
  # network-infra.yaml の netinfra-dedicated-line-unencrypted-001 が扱う）。
  - id: pqc-dedicated-line-hndl-001
    canonicalId: harvest-now-decrypt-later
    framework: STRIDE
    category: "Information Disclosure"
    name: "専用線 / 閉域接続の古典鍵交換による Harvest Now, Decrypt Later"
    severity: Medium
    description: "{{sourceName}} と {{targetName}} の間の通信は専用線 / 閉域接続を通り、TLS で暗号化されている。閉域接続は通信事業者の伝送設備・コロケーション施設を経由するため、その区間にアクセスできる者は暗号文を今のうちに収集・保存できる。TLS の鍵交換が古典暗号（ECDHE 等）だけで行われている場合、将来の暗号学的に十分な量子計算機（CRQC）で鍵交換を破り、記録された通信を遡って復号できる（Can）。閉域接続はデータベースの複製やバックアップなど、量が多く長期の秘匿が必要なデータを運ぶことが多く、収集の価値が高い。一方、これは将来時点の復号であり、現在の通信のリアルタイムな盗聴・改ざんを可能にするものではない。TLS の鍵交換を PQC ハイブリッド（X25519MLKEM768 等）にするか、対称の事前共有鍵から鍵を導出する MACsec や、量子耐性の事前共有鍵（PPK）を併用した IPsec を回線に重ねていれば、収集された暗号文を将来復号することはできない（Cannot）。blast radius は {{sourceName}} と {{targetName}} の間で閉域接続を通る通信のうち、秘匿期間が CRQC の出現時期を超えるもの。"
    mitigation: "[Foundation] 閉域接続を通る通信の暗号方式と、運ぶデータの秘匿期間を棚卸しし、長期の秘匿が必要なデータ（複製・バックアップ等）が通る区間を特定する。 [Enterprise] その区間の TLS を PQC ハイブリッドの鍵交換に対応した版へ更新する。回線に MACsec（事前共有の 256 ビット鍵）や、量子耐性の事前共有鍵（PPK）を併用した IPsec を重ねる。 [Advanced] 長期の秘匿が必要なデータはアプリ層でも PQC / ハイブリッドで暗号化し、回線や TLS の暗号だけに依存しない。"
    appliesTo:
      kind: edge
      # 専用線 / 閉域接続の両側の区間のうち、TLS のものだけで発火する（平文は netinfra-dedicated-line-unencrypted-001）。
      anyOf:
        - targetType: [DEDICATED_LINE]
          encryption: [TLS]
        - sourceType: [DEDICATED_LINE]
          encryption: [TLS]
    complianceRefs:
      - standard: nist-csf-2.0
        ref: "PR.DS-02"
    references:
      - title: "NIST IR 8547 - Transition to Post-Quantum Cryptography Standards"
        url: "https://csrc.nist.gov/pubs/ir/8547/ipd"
      - title: "IEEE 802.1AE - Media Access Control (MAC) Security（MACsec によるリンク暗号化）"
        url: "https://standards.ieee.org/"
      - title: "NIST SP 800-77 Rev.1 - Guide to IPsec VPNs"
        url: "https://csrc.nist.gov/pubs/sp/800/77/r1/final"
