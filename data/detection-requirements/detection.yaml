      - "管理系パスへの認証失敗の連続"
      - "公開面の設定変更（ルール追加・ポート開放）"
    logs: ["境界の FW・WAF のログ", "管理画面の認証・操作ログ", "クラウドの構成変更の監査ログ"]
    attack: [T1133, T1190]

