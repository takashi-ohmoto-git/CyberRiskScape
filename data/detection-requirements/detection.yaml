# 検出した脅威 → 攻撃経路上のノードで「継続的に監視すべき振る舞い」と「必要なログ」の対応表。
#
# 検出した脅威の canonicalId がここに載っていれば、攻撃経路上のノードに、その要件
# （何を監視すべきか・どのログが要るか）を添える。同じノードに同じ要件が複数の脅威から当たる場合は 1 回だけ載せる。
#
# 方針:
#   - **平時から監視すべき振る舞いと、それに要るログ**を書く。侵害後の調査（investigation-templates）とは別物。
#   - ここに書いた内容は「監視すべきこと」であり、CRS や利用者が実際に検知できることを意味しない。
#     ログが監視先に届くかは図の入力（logSinkId・hasAccessLog・logCollection）で別に示す。
#   - 攻撃手順・エクスプロイトのコードは置かない。被害企業の事例は書かない。
#   - 本文は日本語の要約。英語は i18n/en/detection.yaml の翻訳オーバーレイ（title / watch / logs）。
#   - attack は参考の ATT&CK テクニック ID（任意）。
#
# 出典（考え方）:
#   - MITRE ATT&CK Data Sources / Techniques（テクニック ID）
#     https://attack.mitre.org/datasources/
#   - NIST SP 800-92 Guide to Computer Security Log Management
#     https://csrc.nist.gov/pubs/sp/800/92/final
#   - CISA Best Practices for Event Logging and Threat Detection
#     https://www.cisa.gov/resources-tools/resources/best-practices-event-logging-and-threat-detection
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

requirements:
  - id: web-exploit-and-shell
    match:
      canonicalIds: [web-shell-implant, api-server-code-execution, known-vulnerability-unpatched, network-edge-device-exploitation, process-tampering]
    title: "公開面での悪用と想定外のコード実行"
    watch:
      - "Web サーバー・アプリのプロセスからのシェルや子プロセスの起動"
      - "Web ルート・アプリ配置先での実行可能ファイルの新規作成・変更"
      - "同一の送信元からの異常なエラー応答（5xx）やワーカー異常終了の急増"
      - "想定外の宛先への外向き通信"
    logs: ["Web サーバーのアクセスログ・エラーログ", "EDR・OS のプロセス生成ログ", "ファイル整合性監視のログ"]
    attack: [T1190, T1505.003]

  - id: edge-management-exposure
