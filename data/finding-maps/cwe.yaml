# 静的・動的解析ツール（Veracode）の指摘の CWE → 脅威ライブラリの canonicalId の対応表。
#
# 指摘の CWE がここに載っていれば、構成図から検出した脅威（同じ canonicalId）と突き合わせる。
# 突き合わせの結果は「構成図の脅威が実際のコードで確認された」「構成図に無い脅威の候補」の判断材料になる。
#
# 方針:
#   - CWE 番号だけを置く。CWE の本文は転載しない。`note` は日本語の短い分類名。
#   - 1 つの CWE は 1 つの mapping にだけ書く（重複は読み込み時にエラー）。
#     1 つの CWE が複数の canonicalId に対応してよい。
#   - 構成図の脅威として当てはまりにくい CWE は意図的に載せない。載せない CWE は
#     レポートの「対応づけできない指摘」に出る（例: 79 XSS・80・22 パストラバーサル・352 CSRF・326/327 暗号強度）。
#
# 出典:
#   - MITRE CWE（Common Weakness Enumeration） https://cwe.mitre.org/
#
# SPDX-License-Identifier: Apache-2.0

