# AI によるソース監査（Cloudflare security-audit スキル）の攻撃クラス → 脅威ライブラリの canonicalId の対応表。
#
# coverage-ledger.json の canonical_refs.attack_class（`FILE.md#型名`）がここに載っていれば、
# その台帳の単位に紐づく指摘に canonicalId を付け、構成図から検出した脅威と突き合わせる。
#
# 方針:
#   - 攻撃クラスの名前（参照文字列）だけを置く。相手の文書の本文は転載しない。`note` は日本語の短い分類名。
#   - 構成図で表せる境界・権限・信頼・サプライチェーンの型だけを載せる。コードの局所的な欠陥の型
#     （XSS・CSRF・パストラバーサル・メモリ安全性・業務ロジック・プロトタイプ汚染など）と、
#     複数の欠陥を含む広い型（Injection・Resource and file handling など）は意図的に載せない。
#     載せない型は取り込み報告の「対応づけできない指摘」に出る（data/finding-maps/cwe.yaml と同じ方針）。
#   - 1 つの型は 1 つの mapping にだけ書く（重複は読み込み時にエラー）。1 つの型が複数の canonicalId に対応してよい。
#
# 出典:
#   - Cloudflare security-audit スキル（MIT） https://github.com/cloudflare/skills （コミット c1c8a8c）
#     型の名前の参照のみ。説明文は転載していない。
#
# SPDX-License-Identifier: Apache-2.0

schemaVersion: 1

mappings:
