# AI 事業者ガイドライン（第1.01版）のマッピング表。
# 出典: 経済産業省・総務省「AI 事業者ガイドライン（第1.01版）」2024年4月
#   https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/index.html
# title は公式表記、summary は独自要約（1〜2 行）。本文の直接転載は行わない。
# ref 命名規則: 共通の指針-N / 開発者-N / 提供者-N / 利用者-N

schemaVersion: 1

standard:
  id: jp-ai-business-guideline
  title: "AI 事業者ガイドライン"
  version: "1.01"
  url: "https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/index.html"
  license: "経済産業省・総務省（出典明記の上で要約可）"
  disclaimer: "title / summary は v1.01 (2024年4月) の独自要約。原文は出典 URL を参照。"

items:
  # ────────────────────────────────────────────────
  # 第2部 共通の指針（全主体共通の 10 原則）
  # ────────────────────────────────────────────────
  - ref: "共通の指針-1"
    title: "人間中心"
    summary: "AI が人間の意思決定や感情を不当に操作することなく、人間の尊厳・自律を尊重するよう設計・運用する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "GOVERN 3.2" }
      - { standard: nist-ai-rmf, ref: "MAP 3.5" }

  - ref: "共通の指針-2"
    title: "安全性"
    summary: "生命・身体・財産・精神・環境に危害を及ぼさないよう、AI システムの安全性を確保する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "MEASURE 2.6" }
      - { standard: nist-ai-rmf, ref: "GOVERN 4.1" }

  - ref: "共通の指針-3"
    title: "公平性"
    summary: "特定の個人・集団への不当な差別を生じさせない公平な AI を実現し、バイアスを最小化する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "MEASURE 2.11" }

  - ref: "共通の指針-4"
    title: "プライバシー保護"
    summary: "個人情報・プライバシーを適切に保護し、関連法令（個人情報保護法等）を遵守する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "MEASURE 2.10" }

  - ref: "共通の指針-5"
    title: "セキュリティ確保"
    summary: "AI システムへの攻撃・改ざん・データ漏えいを防ぎ、機密性・完全性・可用性を維持する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "MEASURE 2.7" }
      - { standard: nist-ai-rmf, ref: "GOVERN 6.1" }

  - ref: "共通の指針-6"
    title: "透明性"
    summary: "AI システムの判断根拠・利用状況・限界に関する情報を、関係者が理解できる形で開示する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "MEASURE 2.8" }
      - { standard: nist-ai-rmf, ref: "MEASURE 2.9" }

  - ref: "共通の指針-7"
    title: "アカウンタビリティ"
    summary: "AI システムによる結果や影響について、関与する各主体が責任ある説明を行える体制を整備する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "GOVERN 2.3" }
      - { standard: nist-ai-rmf, ref: "MANAGE 4.3" }

  - ref: "共通の指針-8"
    title: "教育・リテラシー"
    summary: "AI を扱う関係者に対し、適切な利用・リスク理解のための教育とリテラシー向上機会を提供する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "GOVERN 2.2" }

  - ref: "共通の指針-9"
    title: "公正競争確保"
    summary: "AI による市場支配・不公正な競争を排し、新規参入と健全な競争環境を維持する。"
    relatedTo:
      - { standard: nist-ai-rmf, ref: "GOVERN 1.1" }

  - ref: "共通の指針-10"
    title: "イノベーション"
    summary: "AI のイノベーションを促進し、社会的便益とリスク低減を両立する開発・利用環境を整備する。"

  # ────────────────────────────────────────────────
  # 第3部 AI 開発者に関する事項
  # ────────────────────────────────────────────────
  - ref: "開発者-1"
    title: "人間中心の設計"
    summary: "学習データ・アルゴリズム選定段階から、人間の尊厳・自律尊重を組み込み、悪用可能な機能を抑制する。"

  - ref: "開発者-2"
    title: "適正な学習データの選定と検証"
    summary: "学習データの代表性・適法性・品質を検証し、バイアスや権利侵害の混入を防ぐ。"

  - ref: "開発者-3"
    title: "安全性を考慮した開発"
    summary: "想定される誤動作・敵対的入力に対し堅牢性を持つ AI を開発し、安全性試験を実施する。"

  - ref: "開発者-4"
    title: "公平性の確保"
    summary: "不当な差別・偏りを生じない設計とし、開発段階でバイアス評価・低減策を講じる。"

  - ref: "開発者-5"
    title: "プライバシー保護への配慮"
    summary: "個人情報を含む学習データの取扱いについて、適法性・最小化・匿名化等の措置を講じる。"

  - ref: "開発者-6"
    title: "セキュリティ対策"
    summary: "モデル抽出・データ汚染・敵対的入力等への対策を組み込み、サプライチェーンの完全性を確保する。"

  - ref: "開発者-7"
    title: "透明性の確保"
    summary: "モデルの目的・性能・制約・学習データ概要等を、利用者・提供者が判断可能な粒度で開示する。"

  - ref: "開発者-8"
    title: "検証可能性の確保"
    summary: "第三者による評価・監査が可能となるよう、評価指標・テスト方法・出力ログ等を整備する。"

  - ref: "開発者-9"
    title: "関連ステークホルダーへの説明"
    summary: "提供者・利用者・社会一般に対し、AI の特性・想定用途・残存リスクを説明する。"

  # ────────────────────────────────────────────────
  # 第4部 AI 提供者に関する事項
  # ────────────────────────────────────────────────
  - ref: "提供者-1"
    title: "人間中心の利用環境提供"
    summary: "利用者が AI の判断を盲従せず、必要に応じて人間が関与・上書きできる利用環境を提供する。"

  - ref: "提供者-2"
    title: "適正利用に資する仕組み"
    summary: "想定外用途・悪用・過信を防ぐためのガイダンス・利用条件・ガードレールを実装する。"

  - ref: "提供者-3"
    title: "プライバシー保護"
    summary: "入力データ・対話履歴等のプライバシーを保護し、保存期間・学習利用の有無を明示する。"

  - ref: "提供者-4"
    title: "セキュリティ対策"
    summary: "API・データ・モデルへの不正アクセス・乱用を防ぐセキュリティ対策を講じる。"

  - ref: "提供者-5"
    title: "透明性の確保"
    summary: "サービスとして AI を提供する旨、利用条件、想定リスクを利用者に分かりやすく開示する。"

  - ref: "提供者-6"
    title: "動作検証とモニタリング"
    summary: "提供開始前・運用中ともに AI システムの動作を検証し、異常時に介入可能な仕組みを設ける。"

  - ref: "提供者-7"
    title: "サービス内容の見直し"
    summary: "利用者フィードバック・インシデントを踏まえ、サービス内容・ガードレールを継続的に見直す。"

  - ref: "提供者-8"
    title: "関連ステークホルダーへの説明"
    summary: "開発者・利用者・第三者に対し、提供する AI サービスの特性・利用条件・対応窓口を説明する。"

  # ────────────────────────────────────────────────
  # 第5部 AI 利用者に関する事項
  # ────────────────────────────────────────────────
  - ref: "利用者-1"
    title: "安全な利用"
    summary: "提供者が示す利用条件・限界を遵守し、想定外用途や危険な利用方法を避ける。"

  - ref: "利用者-2"
    title: "入力データに関する留意"
    summary: "AI に入力する個人情報・機密情報の範囲を必要最小限とし、提供者の取扱条件を確認する。"

  - ref: "利用者-3"
    title: "公平性への配慮"
    summary: "AI の出力を意思決定に用いる際、特定の個人・集団への不当な影響が生じないか確認する。"

  - ref: "利用者-4"
    title: "プライバシー保護"
    summary: "AI の利用に伴って取得・処理されるデータについて、第三者のプライバシーに配慮する。"

  - ref: "利用者-5"
    title: "セキュリティ対策"
    summary: "AI 経由で取得した出力・コードを利用する際、マルウェア混入・改ざんリスクを検証する。"

  - ref: "利用者-6"
    title: "関連ステークホルダーへの説明"
    summary: "業務に AI を組み込む場合、関係者・顧客に対し AI 利用の事実と限界を説明する。"

  - ref: "利用者-7"
    title: "提供者への適切な情報提供"
    summary: "AI システムの異常動作・不具合・インシデントを提供者にフィードバックし改善に資する。"
