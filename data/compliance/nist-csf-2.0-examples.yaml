# NIST Cybersecurity Framework 2.0 — Implementation Examples のマッピング表。
# 出典: U.S. National Institute of Standards and Technology, NIST CSWP 29, February 2024
#   https://www.nist.gov/cyberframework
#   https://csrc.nist.gov/Projects/Cybersecurity-Framework/Filters
# ライセンス: U.S. 政府著作物 (パブリックドメイン)。
# summary は CSF 2.0 (CSWP 29) Implementation Examples の独自要約 (日本語)、text は英語原文を保持。
# 脅威ルール側 complianceRefs では subcategory ref (例: GV.OC-01) を参照すること。
# このファイルは緩和策表示等の二次的リファレンス用。parent で対応 subcategory に紐付く。

schemaVersion: 1

standard:
  id: nist-csf-2.0-examples
  title: "NIST Cybersecurity Framework — Implementation Examples"
  version: "2.0"
  url: "https://www.nist.gov/cyberframework"
  license: "Public Domain (U.S. Government Work)"
  disclaimer: "summary は CSF 2.0 (CSWP 29, 2024年2月) の独自要約 (日本語)。text は英語原文 (NIST 原文ママ)。"
  parentStandard: "nist-csf-2.0"  # 各 example は同フォルダの nist-csf-2.0.yaml の subcategory に紐付く

items:

  # ──── GV.OC-01 ────
  - ref: "GV.OC-01.001"
    parent: "GV.OC-01"
    title: "Ex1"
    summary: "ビジョン・ミッション声明やマーケティング等を通じて組織ミッションを共有し、リスク特定の基盤とする。"
    text: "Share the organization's mission (e.g., through vision and mission statements, marketing, and service strategies) to provide a basis for identifying risks that may impede that mission"

  # ──── GV.OC-02 ────
  - ref: "GV.OC-02.002"
    parent: "GV.OC-02"
    title: "Ex1"
    summary: "経営層・取締役・従業員等、内部ステークホルダの業績/リスク/文化面の期待を特定する。"
    text: "Identify relevant internal stakeholders and their cybersecurity-related expectations (e.g., performance and risk expectations of officers, directors, and advisors; cultural expectations of employees)"
  - ref: "GV.OC-02.003"
    parent: "GV.OC-02"
    title: "Ex2"
    summary: "顧客・パートナー・規制当局・社会等、外部ステークホルダのプライバシー/コンプラ/倫理面の期待を特定する。"
    text: "Identify relevant external stakeholders and their cybersecurity-related expectations (e.g., privacy expectations of customers, business expectations of partnerships, compliance expectations of regulators, ethics expectations of society)"

  # ──── GV.OC-03 ────
  - ref: "GV.OC-03.004"
    parent: "GV.OC-03"
    title: "Ex1"
    summary: "HIPAA、CCPA、GDPR 等、個人情報保護に関する法規制要求を追跡管理するプロセスを定める。"
    text: "Determine a process to track and manage legal and regulatory requirements regarding protection of individuals' information (e.g., Health Insurance Portability and Accountability Act, California Consumer Privacy Act, General Data Protection Regulation)"
  - ref: "GV.OC-03.005"
    parent: "GV.OC-03"
    title: "Ex2"
    summary: "サプライヤ・顧客・パートナー情報の管理に関する契約上のサイバー要件を追跡管理するプロセスを定める。"
    text: "Determine a process to track and manage contractual requirements for cybersecurity management of supplier, customer, and partner information"
  - ref: "GV.OC-03.006"
    parent: "GV.OC-03"
    title: "Ex3"
    summary: "サイバーセキュリティ戦略を法規制・契約要求と整合させる。"
    text: "Align the organization's cybersecurity strategy with legal, regulatory, and contractual requirements"

  # ──── GV.OC-04 ────
  - ref: "GV.OC-04.007"
    parent: "GV.OC-04"
    title: "Ex1"
    summary: "内外ステークホルダから見た能力・サービスの重要度を判定する基準を確立する。"
    text: "Establish criteria for determining the criticality of capabilities and services as viewed by internal and external stakeholders"
  - ref: "GV.OC-04.008"
    parent: "GV.OC-04"
    title: "Ex2"
    summary: "ビジネスインパクト分析等を通じて、ミッション達成に不可欠な資産と業務、その喪失の潜在影響を特定する。"
    text: "Determine (e.g., from a business impact analysis) assets and business operations that are vital to achieving mission objectives and the potential impact of a loss (or partial loss) of such operations"
  - ref: "GV.OC-04.009"
    parent: "GV.OC-04"
    title: "Ex3"
    summary: "通常時/攻撃下/復旧中の各状態における重要能力提供のレジリエンス目標(例: RTO)を確立し伝達する。"
    text: "Establish and communicate resilience objectives (e.g., recovery time objectives) for delivering critical capabilities and services in various operating states (e.g., under attack, during recovery, normal operation)"

  # ──── GV.OC-05 ────
  - ref: "GV.OC-05.010"
    parent: "GV.OC-05"
    title: "Ex1"
    summary: "外部リソース(設備、クラウドホスティング等)への依存をインベントリ化し、資産・業務との関係を記録する。"
    text: "Create an inventory of the organization's dependencies on external resources (e.g., facilities, cloud-based hosting providers) and their relationships to organizational assets and business functions"
  - ref: "GV.OC-05.011"
    parent: "GV.OC-05"
    title: "Ex2"
    summary: "重要能力の単一障害点となりうる外部依存を特定・文書化し、関係者に共有する。"
    text: "Identify and document external dependencies that are potential points of failure for the organization's critical capabilities and services, and share that information with appropriate personnel"

  # ──── GV.OV-01 ────
  - ref: "GV.OV-01.058"
    parent: "GV.OV-01"
    title: "Ex1"
    summary: "リスク管理戦略と結果が、リーダの意思決定と組織目標達成にどれだけ貢献したかを測定する。"
    text: "Measure how well the risk management strategy and risk results have helped leaders make decisions and achieve organizational objectives"
  - ref: "GV.OV-01.059"
    parent: "GV.OV-01"
    title: "Ex2"
    summary: "業務やイノベーションを阻害するリスク戦略を調整すべきか検討する。"
    text: "Examine whether cybersecurity risk strategies that impede operations or innovation should be adjusted"

  # ──── GV.OV-02 ────
  - ref: "GV.OV-02.060"
    parent: "GV.OV-02"
    title: "Ex1"
    summary: "監査結果をレビューし、既存戦略が内外要件への準拠を確保しているか確認する。"
    text: "Review audit findings to confirm whether the existing cybersecurity strategy has ensured compliance with internal and external requirements"
  - ref: "GV.OV-02.061"
    parent: "GV.OV-02"
    title: "Ex2"
    summary: "サイバー関連の役割を担う者のパフォーマンス監督をレビューし、ポリシー変更要否を判定する。"
    text: "Review the performance oversight of those in cybersecurity-related roles to determine whether policy changes are necessary"
  - ref: "GV.OV-02.062"
    parent: "GV.OV-02"
    title: "Ex3"
    summary: "発生したインシデントに照らして戦略を見直す。"
    text: "Review strategy in light of cybersecurity incidents"

  # ──── GV.OV-03 ────
  - ref: "GV.OV-03.063"
    parent: "GV.OV-03"
    title: "Ex1"
    summary: "KPI をレビューし、組織横断のポリシー・手順が目標達成しているか確認する。"
    text: "Review key performance indicators (KPIs) to ensure that organization-wide policies and procedures achieve objectives"
  - ref: "GV.OV-03.064"
    parent: "GV.OV-03"
    title: "Ex2"
    summary: "KRI をレビューし、発生可能性・影響を含む組織直面リスクを把握する。"
    text: "Review key risk indicators (KRIs) to identify risks the organization faces, including likelihood and potential impact"
  - ref: "GV.OV-03.065"
    parent: "GV.OV-03"
    title: "Ex3"
    summary: "サイバーリスク管理に関するメトリクスを収集し、経営層に伝達する。"
    text: "Collect and communicate metrics on cybersecurity risk management with senior leadership"

  # ──── GV.PO-01 ────
  - ref: "GV.PO-01.049"
    parent: "GV.PO-01"
    title: "Ex1"
    summary: "経営の意図・期待・方向性を明示した、理解可能で実用的なリスク管理ポリシーを作成・配布・維持する。"
    text: "Create, disseminate, and maintain an understandable, usable risk management policy with statements of management intent, expectations, and direction"
  - ref: "GV.PO-01.050"
    parent: "GV.PO-01"
    title: "Ex2"
    summary: "戦略目標・優先度・サイバーポリシー方針との整合のため、ポリシー・関連プロセス・手順を定期レビューする。"
    text: "Periodically review policy and supporting processes and procedures to ensure that they align with risk management strategy objectives and priorities, as well as the high-level direction of the cybersecurity policy"
  - ref: "GV.PO-01.051"
    parent: "GV.PO-01"
    title: "Ex3"
    summary: "ポリシーには経営層の承認を要件とする。"
    text: "Require approval from senior management on policy"
  - ref: "GV.PO-01.052"
    parent: "GV.PO-01"
    title: "Ex4"
    summary: "サイバーリスク管理ポリシーと関連プロセス・手順を組織全体に伝達する。"
    text: "Communicate cybersecurity risk management policy and supporting processes and procedures across the organization"
  - ref: "GV.PO-01.053"
    parent: "GV.PO-01"
    title: "Ex5"
    summary: "従業員に対し、入社時・毎年・ポリシー改訂時の受領確認を必須とする。"
    text: "Require personnel to acknowledge receipt of policy when first hired, annually, and whenever policy is updated"

  # ──── GV.PO-02 ────
  - ref: "GV.PO-02.054"
    parent: "GV.PO-02"
    title: "Ex1"
    summary: "定期的なサイバーリスク管理結果のレビューに基づきポリシーを更新し、リスクを許容水準に維持する。"
    text: "Update policy based on periodic reviews of cybersecurity risk management results to ensure that policy and supporting processes and procedures adequately maintain risk at an acceptable level"
  - ref: "GV.PO-02.055"
    parent: "GV.PO-02"
    title: "Ex2"
    summary: "リスク環境の変化(リスク変動、ミッション目的変更等)のレビュー時期を定め、推奨更新を伝達する。"
    text: "Provide a timeline for reviewing changes to the organization's risk environment (e.g., changes in risk or in the organization's mission objectives), and communicate recommended policy updates"
  - ref: "GV.PO-02.056"
    parent: "GV.PO-02"
    title: "Ex3"
    summary: "法規制要求の変化を反映してポリシーを更新する。"
    text: "Update policy to reflect changes in legal and regulatory requirements"
  - ref: "GV.PO-02.057"
    parent: "GV.PO-02"
    title: "Ex4"
    summary: "技術変化(AI 採用等)や事業変化(M&A、新契約要件等)を反映してポリシーを更新する。"
    text: "Update policy to reflect changes in technology (e.g., adoption of artificial intelligence) and changes to the business (e.g., acquisition of a new business, new contract requirements)"

  # ──── GV.RM-01 ────
  - ref: "GV.RM-01.012"
    parent: "GV.RM-01"
    title: "Ex1"
    summary: "年次戦略計画と重大な変化発生時に、短期・長期のリスク管理目標を更新する。"
    text: "Update near-term and long-term cybersecurity risk management objectives as part of annual strategic planning and when major changes occur"
  - ref: "GV.RM-01.013"
    parent: "GV.RM-01"
    title: "Ex2"
    summary: "ユーザ訓練の質、ICS 保護等、測定可能なサイバーリスク管理目標を確立する。"
    text: "Establish measurable objectives for cybersecurity risk management (e.g., manage the quality of user training, ensure adequate risk protection for industrial control systems)"
  - ref: "GV.RM-01.014"
    parent: "GV.RM-01"
    title: "Ex3"
    summary: "経営層がサイバー目標で合意し、リスク・パフォーマンスの計測と管理に活用する。"
    text: "Senior leaders agree about cybersecurity objectives and use them for measuring and managing risk and performance"

  # ──── GV.RM-02 ────
  - ref: "GV.RM-02.015"
    parent: "GV.RM-02"
    title: "Ex1"
    summary: "組織にとって適切なリスク水準を示すリスク選好声明を確立し伝達する。"
    text: "Determine and communicate risk appetite statements that convey expectations about the appropriate level of risk for the organization"
  - ref: "GV.RM-02.016"
    parent: "GV.RM-02"
    title: "Ex2"
    summary: "リスク選好声明を、具体的・測定可能・広く理解可能なリスク許容度声明に変換する。"
    text: "Translate risk appetite statements into specific, measurable, and broadly understandable risk tolerance statements"
  - ref: "GV.RM-02.017"
    parent: "GV.RM-02"
    title: "Ex3"
    summary: "既知のリスクエクスポージャーと残存リスクに基づき、組織目標とリスク選好を定期的に見直す。"
    text: "Refine organizational objectives and risk appetite periodically based on known risk exposure and residual risk"

  # ──── GV.RM-03 ────
  - ref: "GV.RM-03.018"
    parent: "GV.RM-03"
    title: "Ex1"
    summary: "サイバーリスクを、コンプラ・財務・運用・規制・評判・安全等の他エンタープライズリスクと統合管理する。"
    text: "Aggregate and manage cybersecurity risks alongside other enterprise risks (e.g., compliance, financial, operational, regulatory, reputational, safety)"
  - ref: "GV.RM-03.019"
    parent: "GV.RM-03"
    title: "Ex2"
    summary: "サイバーリスク管理者を ERM 計画策定に参加させる。"
    text: "Include cybersecurity risk managers in enterprise risk management planning"
  - ref: "GV.RM-03.020"
    parent: "GV.RM-03"
    title: "Ex3"
    summary: "ERM 内でサイバーリスクをエスカレーションする基準を確立する。"
    text: "Establish criteria for escalating cybersecurity risks within enterprise risk management"

  # ──── GV.RM-04 ────
  - ref: "GV.RM-04.021"
    parent: "GV.RM-04"
    title: "Ex1"
    summary: "データ分類ごとに、サイバーリスクを受容/回避する基準を明示する。"
    text: "Specify criteria for accepting and avoiding cybersecurity risk for various classifications of data"
  - ref: "GV.RM-04.022"
    parent: "GV.RM-04"
    title: "Ex2"
    summary: "サイバー保険購入の要否を判断する。"
    text: "Determine whether to purchase cybersecurity insurance"
  - ref: "GV.RM-04.023"
    parent: "GV.RM-04"
    title: "Ex3"
    summary: "共有責任モデルが許容される条件(特定機能の外部委託、公開クラウド利用等)を文書化する。"
    text: "Document conditions under which shared responsibility models are acceptable (e.g., outsourcing certain cybersecurity functions, having a third party perform financial transactions on behalf of the organization, using public cloud-based services)"

  # ──── GV.RM-05 ────
  - ref: "GV.RM-05.024"
    parent: "GV.RM-05"
    title: "Ex1"
    summary: "合意間隔で経営幹部・取締役・管理者に組織のサイバー姿勢を共有する方法を定める。"
    text: "Determine how to update senior executives, directors, and management on the organization's cybersecurity posture at agreed-upon intervals"
  - ref: "GV.RM-05.025"
    parent: "GV.RM-05"
    title: "Ex2"
    summary: "経営、運用、内部監査、法務、調達、物理セキュリティ、HR 等の部門間でサイバーリスクを伝達する方法を特定する。"
    text: "Identify how all departments across the organization - such as management, operations, internal auditors, legal, acquisition, physical security, and HR - will communicate with each other about cybersecurity risks"

  # ──── GV.RM-06 ────
  - ref: "GV.RM-06.026"
    parent: "GV.RM-06"
    title: "Ex1"
    summary: "定量的サイバーリスク分析の利用基準を確立し、確率とエクスポージャーの算出式を定める。"
    text: "Establish criteria for using a quantitative approach to cybersecurity risk analysis, and specify probability and exposure formulas"
  - ref: "GV.RM-06.027"
    parent: "GV.RM-06"
    title: "Ex2"
    summary: "リスク登録簿等のテンプレートを用意し、リスク情報(説明、エクスポージャー、対応、所有者)を文書化する。"
    text: "Create and use templates (e.g., a risk register) to document cybersecurity risk information (e.g., risk description, exposure, treatment, and ownership)"
  - ref: "GV.RM-06.028"
    parent: "GV.RM-06"
    title: "Ex3"
    summary: "組織内の適切なレベルでリスク優先順位付けする基準を確立する。"
    text: "Establish criteria for risk prioritization at the appropriate levels within the enterprise"
  - ref: "GV.RM-06.029"
    parent: "GV.RM-06"
    title: "Ex4"
    summary: "一貫したリスクカテゴリのリストを使用し、サイバーリスクの統合・集約・比較を支援する。"
    text: "Use a consistent list of risk categories to support integrating, aggregating, and comparing cybersecurity risks"

  # ──── GV.RM-07 ────
  - ref: "GV.RM-07.030"
    parent: "GV.RM-07"
    title: "Ex1"
    summary: "SWOT 分析等、機会の特定とリスク議論への組み込みのためのガイダンス・手法を定義し伝達する。"
    text: "Define and communicate guidance and methods for identifying opportunities and including them in risk discussions (e.g., strengths, weaknesses, opportunities, and threats [SWOT] analysis)"
  - ref: "GV.RM-07.031"
    parent: "GV.RM-07"
    title: "Ex2"
    summary: "ストレッチゴールを特定し文書化する。"
    text: "Identify stretch goals and document them"
  - ref: "GV.RM-07.032"
    parent: "GV.RM-07"
    title: "Ex3"
    summary: "ネガティブリスクと並んでポジティブリスクを算定、文書化、優先順位付けする。"
    text: "Calculate, document, and prioritize positive risks alongside negative risks"

  # ──── GV.RR-01 ────
  - ref: "GV.RR-01.033"
    parent: "GV.RR-01"
    title: "Ex1"
    summary: "経営層(取締役等)がサイバー戦略の策定・実装・評価における自らの役割と責任に合意する。"
    text: "Leaders (e.g., directors) agree on their roles and responsibilities in developing, implementing, and assessing the organization's cybersecurity strategy"
  - ref: "GV.RR-01.034"
    parent: "GV.RR-01"
    title: "Ex2"
    summary: "セキュアで倫理的な文化に関する経営層の期待を共有する(特に時事的な事例提示時)。"
    text: "Share leaders' expectations regarding a secure and ethical culture, especially when current events present the opportunity to highlight positive or negative examples of cybersecurity risk management"
  - ref: "GV.RR-01.035"
    parent: "GV.RR-01"
    title: "Ex3"
    summary: "経営層は CISO に、年次および重大事象後の包括的なサイバーリスク戦略の維持・更新を指示する。"
    text: "Leaders direct the CISO to maintain a comprehensive cybersecurity risk strategy and review and update it at least annually and after major events"
  - ref: "GV.RR-01.036"
    parent: "GV.RR-01"
    title: "Ex4"
    summary: "サイバーリスク管理責任者間の権限と連携が十分か、レビューを実施する。"
    text: "Conduct reviews to ensure adequate authority and coordination among those responsible for managing cybersecurity risk"

  # ──── GV.RR-02 ────
  - ref: "GV.RR-02.037"
    parent: "GV.RR-02"
    title: "Ex1"
    summary: "リスク管理の役割と責任をポリシーで文書化する。"
    text: "Document risk management roles and responsibilities in policy"
  - ref: "GV.RR-02.038"
    parent: "GV.RR-02"
    title: "Ex2"
    summary: "サイバーリスク管理活動の責任者と説明責任者、相談・通知の経路を文書化する。"
    text: "Document who is responsible and accountable for cybersecurity risk management activities and how those teams and individuals are to be consulted and informed"
  - ref: "GV.RR-02.039"
    parent: "GV.RR-02"
    title: "Ex3"
    summary: "職務記述書にサイバーセキュリティ責任とパフォーマンス要件を含める。"
    text: "Include cybersecurity responsibilities and performance requirements in personnel descriptions"
  - ref: "GV.RR-02.040"
    parent: "GV.RR-02"
    title: "Ex4"
    summary: "サイバーリスク管理責任者のパフォーマンス目標を文書化し、定期測定で改善領域を特定する。"
    text: "Document performance goals for personnel with cybersecurity risk management responsibilities, and periodically measure performance to identify areas for improvement"
  - ref: "GV.RR-02.041"
    parent: "GV.RR-02"
    title: "Ex5"
    summary: "運用、リスク機能、内部監査内でのサイバー責任を明確に説明する。"
    text: "Clearly articulate cybersecurity responsibilities within operations, risk functions, and internal audit functions"

  # ──── GV.RR-03 ────
  - ref: "GV.RR-03.042"
    parent: "GV.RR-03"
    title: "Ex1"
    summary: "サイバーリスク管理責任者に必要な権限があるか、定期マネジメントレビューで確認する。"
    text: "Conduct periodic management reviews to ensure that those given cybersecurity risk management responsibilities have the necessary authority"
  - ref: "GV.RR-03.043"
    parent: "GV.RR-03"
    title: "Ex2"
    summary: "リスク許容度と対応に沿ったリソース配分と投資を特定する。"
    text: "Identify resource allocation and investment in line with risk tolerance and response"
  - ref: "GV.RR-03.044"
    parent: "GV.RR-03"
    title: "Ex3"
    summary: "サイバー戦略を支える人・プロセス・技術リソースを十分に提供する。"
    text: "Provide adequate and sufficient people, process, and technical resources to support the cybersecurity strategy"

  # ──── GV.RR-04 ────
  - ref: "GV.RR-04.045"
    parent: "GV.RR-04"
    title: "Ex1"
    summary: "サイバーリスク管理を HR プロセス(スクリーニング、オンボード、変更通知、オフボード)に統合する。"
    text: "Integrate cybersecurity risk management considerations into human resources processes (e.g., personnel screening, onboarding, change notification, offboarding)"
  - ref: "GV.RR-04.046"
    parent: "GV.RR-04"
    title: "Ex2"
    summary: "採用・訓練・リテンション判断において、サイバー知識を肯定的要因とみなす。"
    text: "Consider cybersecurity knowledge to be a positive factor in hiring, training, and retention decisions"
  - ref: "GV.RR-04.047"
    parent: "GV.RR-04"
    title: "Ex3"
    summary: "機微役割の新規採用前にバックグラウンドチェックを行い、当該役割の従業員には定期的に再実施する。"
    text: "Conduct background checks prior to onboarding new personnel for sensitive roles, and periodically repeat background checks for personnel with such roles"
  - ref: "GV.RR-04.048"
    parent: "GV.RR-04"
    title: "Ex4"
    summary: "役割に応じてセキュリティポリシーを認識・遵守・支持する従業員の義務を定義し施行する。"
    text: "Define and enforce obligations for personnel to be aware of, adhere to, and uphold security policies as they relate to their roles"

  # ──── GV.SC-01 ────
  - ref: "GV.SC-01.066"
    parent: "GV.SC-01"
    title: "Ex1"
    summary: "サイバーサプライチェーンリスク管理プログラムの目標を表す戦略を確立する。"
    text: "Establish a strategy that expresses the objectives of the cybersecurity supply chain risk management program"
  - ref: "GV.SC-01.067"
    parent: "GV.SC-01"
    title: "Ex2"
    summary: "プログラムを開発(計画・マイルストーン・ポリシー・手順を含む)し、ステークホルダと共有する。"
    text: "Develop the cybersecurity supply chain risk management program, including a plan (with milestones), policies, and procedures that guide implementation and improvement of the program, and share the policies and procedures with the organizational stakeholders"
  - ref: "GV.SC-01.068"
    parent: "GV.SC-01"
    title: "Ex3"
    summary: "戦略・目標・ポリシー・手順に基づきプログラムプロセスを開発・実装し、ステークホルダで合意・実行する。"
    text: "Develop and implement program processes based on the strategy, objectives, policies, and procedures that are agreed upon and performed by the organizational stakeholders"
  - ref: "GV.SC-01.069"
    parent: "GV.SC-01"
    title: "Ex4"
    summary: "サイバー、IT、運用、法務、HR、エンジニアリング等の機能間連携を確保する組織横断機構を確立する。"
    text: "Establish a cross-organizational mechanism that ensures alignment between functions that contribute to cybersecurity supply chain risk management, such as cybersecurity, IT, operations, legal, human resources, and engineering"

  # ──── GV.SC-02 ────
  - ref: "GV.SC-02.070"
    parent: "GV.SC-02"
    title: "Ex1"
    summary: "C-SCRM 活動の計画・リソース配分・実行を担う特定の役割または職位を1つ以上特定する。"
    text: "Identify one or more specific roles or positions that will be responsible and accountable for planning, resourcing, and executing cybersecurity supply chain risk management activities"
  - ref: "GV.SC-02.071"
    parent: "GV.SC-02"
    title: "Ex2"
    summary: "C-SCRM の役割と責任をポリシーで文書化する。"
    text: "Document cybersecurity supply chain risk management roles and responsibilities in policy"
  - ref: "GV.SC-02.072"
    parent: "GV.SC-02"
    title: "Ex3"
    summary: "C-SCRM 活動の責任者と説明責任者、相談・通知の経路を示す責任マトリクスを作成する。"
    text: "Create responsibility matrixes to document who will be responsible and accountable for cybersecurity supply chain risk management activities and how those teams and individuals will be consulted and informed"
  - ref: "GV.SC-02.073"
    parent: "GV.SC-02"
    title: "Ex4"
    summary: "明確化と説明責任向上のため、職務記述書に C-SCRM 責任とパフォーマンス要件を含める。"
    text: "Include cybersecurity supply chain risk management responsibilities and performance requirements in personnel descriptions to ensure clarity and improve accountability"
  - ref: "GV.SC-02.074"
    parent: "GV.SC-02"
    title: "Ex5"
    summary: "C-SCRM 担当者のパフォーマンス目標を文書化し、定期測定で実証・改善する。"
    text: "Document performance goals for personnel with cybersecurity risk management-specific responsibilities, and periodically measure them to demonstrate and improve performance"
  - ref: "GV.SC-02.075"
    parent: "GV.SC-02"
    title: "Ex6"
    summary: "サプライヤ・顧客・取引先の共有責任に対応する役割を策定し、ポリシーや第三者契約に統合する。"
    text: "Develop roles and responsibilities for suppliers, customers, and business partners to address shared responsibilities for applicable cybersecurity risks, and integrate them into organizational policies and applicable third-party agreements"
  - ref: "GV.SC-02.076"
    parent: "GV.SC-02"
    title: "Ex7"
    summary: "第三者向けの C-SCRM 役割と責任を組織内に伝達する。"
    text: "Internally communicate cybersecurity supply chain risk management roles and responsibilities for third parties"
  - ref: "GV.SC-02.077"
    parent: "GV.SC-02"
    title: "Ex8"
    summary: "組織とサプライヤ間の情報共有・報告プロセスのルールとプロトコルを確立する。"
    text: "Establish rules and protocols for information sharing and reporting processes between the organization and its suppliers"

  # ──── GV.SC-03 ────
  - ref: "GV.SC-03.078"
    parent: "GV.SC-03"
    title: "Ex1"
    summary: "サイバーリスク管理および ERM との整合領域・重複領域を特定する。"
    text: "Identify areas of alignment and overlap with cybersecurity and enterprise risk management"
  - ref: "GV.SC-03.079"
    parent: "GV.SC-03"
    title: "Ex2"
    summary: "サイバーリスク管理と C-SCRM の統合された統制セットを確立する。"
    text: "Establish integrated control sets for cybersecurity risk management and cybersecurity supply chain risk management"
  - ref: "GV.SC-03.080"
    parent: "GV.SC-03"
    title: "Ex3"
    summary: "C-SCRM を改善プロセスに統合する。"
    text: "Integrate cybersecurity supply chain risk management into improvement processes"
  - ref: "GV.SC-03.081"
    parent: "GV.SC-03"
    title: "Ex4"
    summary: "サプライチェーンの重大サイバーリスクを経営層にエスカレーションし、ERM レベルで対処する。"
    text: "Escalate material cybersecurity risks in supply chains to senior management, and address them at the enterprise risk management level"

  # ──── GV.SC-04 ────
  - ref: "GV.SC-04.082"
    parent: "GV.SC-04"
    title: "Ex1"
    summary: "データ機微度、組織システムへのアクセス度、ミッション重要度等に基づくサプライヤ重要度基準を策定する。"
    text: "Develop criteria for supplier criticality based on, for example, the sensitivity of data processed or possessed by suppliers, the degree of access to the organization's systems, and the importance of the products or services to the organization's mission"
  - ref: "GV.SC-04.083"
    parent: "GV.SC-04"
    title: "Ex2"
    summary: "全サプライヤの記録を維持し、重要度基準に基づき優先順位付けする。"
    text: "Keep a record of all suppliers, and prioritize suppliers based on the criticality criteria"

  # ──── GV.SC-05 ────
  - ref: "GV.SC-05.084"
    parent: "GV.SC-05"
    title: "Ex1"
    summary: "サプライヤ・製品・サービスの重要度と侵害時影響に見合ったセキュリティ要件を確立する。"
    text: "Establish security requirements for suppliers, products, and services commensurate with their criticality level and potential impact if compromised"
  - ref: "GV.SC-05.085"
    parent: "GV.SC-05"
    title: "Ex2"
    summary: "第三者が従うべきサイバー・サプライチェーン要件と検証方法を、デフォルト契約文言に含める。"
    text: "Include all cybersecurity and supply chain requirements that third parties must follow and how compliance with the requirements may be verified in default contractual language"
  - ref: "GV.SC-05.086"
    parent: "GV.SC-05"
    title: "Ex3"
    summary: "サプライヤおよびサブティアサプライヤとの情報共有のルールとプロトコルを契約で定義する。"
    text: "Define the rules and protocols for information sharing between the organization and its suppliers and sub-tier suppliers in agreements"
  - ref: "GV.SC-05.087"
    parent: "GV.SC-05"
    title: "Ex4"
    summary: "重要度と侵害時影響に基づき、契約にセキュリティ要件を含めてリスクを管理する。"
    text: "Manage risk by including security requirements in agreements based on their criticality and potential impact if compromised"
  - ref: "GV.SC-05.088"
    parent: "GV.SC-05"
    title: "Ex5"
    summary: "サプライヤ関係ライフサイクル全体での監視のため、SLA にセキュリティ要件を定義する。"
    text: "Define security requirements in service-level agreements (SLAs) for monitoring suppliers for acceptable security performance throughout the supplier relationship lifecycle"
  - ref: "GV.SC-05.089"
    parent: "GV.SC-05"
    title: "Ex6"
    summary: "サプライヤに、製品/サービスの寿命にわたるサイバー機能・脆弱性の開示を契約で義務付ける。"
    text: "Contractually require suppliers to disclose cybersecurity features, functions, and vulnerabilities of their products and services for the life of the product or the term of service"
  - ref: "GV.SC-05.090"
    parent: "GV.SC-05"
    title: "Ex7"
    summary: "重要製品について、サプライヤに現行の部品インベントリ(SBOM/HBOM 等)の提供・維持を契約で義務付ける。"
    text: "Contractually require suppliers to provide and maintain a current component inventory (e.g., software or hardware bill of materials) for critical products"
  - ref: "GV.SC-05.091"
    parent: "GV.SC-05"
    title: "Ex8"
    summary: "サプライヤに、従業員の身元確認とインサイダー脅威対策を契約で義務付ける。"
    text: "Contractually require suppliers to vet their employees and guard against insider threats"
  - ref: "GV.SC-05.092"
    parent: "GV.SC-05"
    title: "Ex9"
    summary: "サプライヤに、自己宣言・標準準拠・認証・検査等によるセキュリティ実践の証拠提供を契約で義務付ける。"
    text: "Contractually require suppliers to provide evidence of performing acceptable security practices through, for example, self-attestation, conformance to known standards, certifications, or inspections"
  - ref: "GV.SC-05.093"
    parent: "GV.SC-05"
    title: "Ex10"
    summary: "契約等で、潜在サイバーリスクに関する組織・サプライヤ・サプライチェーンの権利と責任を明示する。"
    text: "Specify in contracts and other agreements the rights and responsibilities of the organization, its suppliers, and their supply chains, with respect to potential cybersecurity risks"

  # ──── GV.SC-06 ────
  - ref: "GV.SC-06.094"
    parent: "GV.SC-06"
    title: "Ex1"
    summary: "調達計画と整合し、サプライヤ関係のリスク・重要度・複雑度に見合った徹底的なデューデリジェンスを実施する。"
    text: "Perform thorough due diligence on prospective suppliers that is consistent with procurement planning and commensurate with the level of risk, criticality, and complexity of each supplier relationship"
  - ref: "GV.SC-06.095"
    parent: "GV.SC-06"
    title: "Ex2"
    summary: "見込サプライヤの技術・サイバー能力・リスク管理プラクティスの適合性を評価する。"
    text: "Assess the suitability of the technology and cybersecurity capabilities and the risk management practices of prospective suppliers"
  - ref: "GV.SC-06.096"
    parent: "GV.SC-06"
    title: "Ex3"
    summary: "事業要件と該当サイバー要件に対するサプライヤリスク評価を実施する。"
    text: "Conduct supplier risk assessments against business and applicable cybersecurity requirements"
  - ref: "GV.SC-06.097"
    parent: "GV.SC-06"
    title: "Ex4"
    summary: "重要製品の取得・利用前に真正性・完全性・セキュリティを評価する。"
    text: "Assess the authenticity, integrity, and security of critical products prior to acquisition and use"

  # ──── GV.SC-07 ────
  - ref: "GV.SC-07.098"
    parent: "GV.SC-07"
    title: "Ex1"
    summary: "第三者の評判と提供する製品/サービスの重要度に基づき、評価のフォーマットと頻度を調整する。"
    text: "Adjust assessment formats and frequencies based on the third party's reputation and the criticality of the products or services they provide"
  - ref: "GV.SC-07.099"
    parent: "GV.SC-07"
    title: "Ex2"
    summary: "自己宣言、保証、認証等の契約サイバー要件への準拠証拠を評価する。"
    text: "Evaluate third parties' evidence of compliance with contractual cybersecurity requirements, such as self-attestations, warranties, certifications, and other artifacts"
  - ref: "GV.SC-07.100"
    parent: "GV.SC-07"
    title: "Ex3"
    summary: "検査、監査、テスト等の手法を用いて、関係ライフサイクル全体で重要サプライヤのセキュリティ義務履行を監視する。"
    text: "Monitor critical suppliers to ensure that they are fulfilling their security obligations throughout the supplier relationship lifecycle using a variety of methods and techniques, such as inspections, audits, tests, or other forms of evaluation"
  - ref: "GV.SC-07.101"
    parent: "GV.SC-07"
    title: "Ex4"
    summary: "重要サプライヤ・サービス・製品のリスクプロファイル変化を監視し、重要度とリスク影響を再評価する。"
    text: "Monitor critical suppliers, services, and products for changes to their risk profiles, and reevaluate supplier criticality and risk impact accordingly"
  - ref: "GV.SC-07.102"
    parent: "GV.SC-07"
    title: "Ex5"
    summary: "事業継続のため、想定外のサプライヤ・サプライチェーン関連の中断に備える。"
    text: "Plan for unexpected supplier and supply chain-related interruptions to ensure business continuity"

  # ──── GV.SC-08 ────
  - ref: "GV.SC-08.103"
    parent: "GV.SC-08"
    title: "Ex1"
    summary: "組織とサプライヤ間のインシデント対応・復旧活動とステータス報告のルールとプロトコルを定義・利用する。"
    text: "Define and use rules and protocols for reporting incident response and recovery activities and the status between the organization and its suppliers"
  - ref: "GV.SC-08.104"
    parent: "GV.SC-08"
    title: "Ex2"
    summary: "インシデント対応における組織とサプライヤの役割と責任を特定・文書化する。"
    text: "Identify and document the roles and responsibilities of the organization and its suppliers for incident response"
  - ref: "GV.SC-08.105"
    parent: "GV.SC-08"
    title: "Ex3"
    summary: "重要サプライヤをインシデント対応演習・シミュレーションに参加させる。"
    text: "Include critical suppliers in incident response exercises and simulations"
  - ref: "GV.SC-08.106"
    parent: "GV.SC-08"
    title: "Ex4"
    summary: "組織と重要サプライヤ間の危機コミュニケーション方法・プロトコルを定義・調整する。"
    text: "Define and coordinate crisis communication methods and protocols between the organization and its critical suppliers"
  - ref: "GV.SC-08.107"
    parent: "GV.SC-08"
    title: "Ex5"
    summary: "重要サプライヤと協働で振り返り(lessons learned)セッションを実施する。"
    text: "Conduct collaborative lessons learned sessions with critical suppliers"

  # ──── GV.SC-09 ────
  - ref: "GV.SC-09.108"
    parent: "GV.SC-09"
    title: "Ex1"
    summary: "ポリシー・手順で、全取得技術製品・サービスの来歴記録を必須とする。"
    text: "Policies and procedures require provenance records for all acquired technology products and services"
  - ref: "GV.SC-09.109"
    parent: "GV.SC-09"
    title: "Ex2"
    summary: "取得部品が改ざんされておらず真正であることの証跡について、定期的に経営層へリスク報告する。"
    text: "Periodically provide risk reporting to leaders about how acquired components are proven to be untampered and authentic"
  - ref: "GV.SC-09.110"
    parent: "GV.SC-09"
    title: "Ex3"
    summary: "認証された信頼できる提供元からのみソフトウェアパッチ・更新を取得する必要性を、関係者間で定期的に伝達する。"
    text: "Communicate regularly among cybersecurity risk managers and operations personnel about the need to acquire software patches, updates, and upgrades only from authenticated and trustworthy software providers"
  - ref: "GV.SC-09.111"
    parent: "GV.SC-09"
    title: "Ex4"
    summary: "サプライヤ製品の保守を、承認されたサプライヤ要員が実施することを要件化するポリシーを確認する。"
    text: "Review policies to ensure that they require approved supplier personnel to perform maintenance on supplier products"
  - ref: "GV.SC-09.112"
    parent: "GV.SC-09"
    title: "Ex5"
    summary: "重要ハードウェアのアップグレード時に、不正な変更がないかチェックすることをポリシーで要件化する。"
    text: "Policies and procedure require checking upgrades to critical hardware for unauthorized changes"

  # ──── GV.SC-10 ────
  - ref: "GV.SC-10.113"
    parent: "GV.SC-10"
    title: "Ex1"
    summary: "通常・有事の両条件下で、重要関係を終了するプロセスを確立する。"
    text: "Establish processes for terminating critical relationships under both normal and adverse circumstances"
  - ref: "GV.SC-10.114"
    parent: "GV.SC-10"
    title: "Ex2"
    summary: "部品の End-of-Life 保守支援と陳腐化に関する計画を定義・実装する。"
    text: "Define and implement plans for component end-of-life maintenance support and obsolescence"
  - ref: "GV.SC-10.115"
    parent: "GV.SC-10"
    title: "Ex3"
    summary: "サプライヤの組織リソースへのアクセスが不要になった時点で、速やかに無効化されることを検証する。"
    text: "Verify that supplier access to organization resources is deactivated promptly when it is no longer needed"
  - ref: "GV.SC-10.116"
    parent: "GV.SC-10"
    title: "Ex4"
    summary: "組織データを含む資産が、タイムリーに管理された安全な方法で返却または適切に廃棄されることを検証する。"
    text: "Verify that assets containing the organization's data are returned or properly disposed of in a timely, controlled, and safe manner"
  - ref: "GV.SC-10.117"
    parent: "GV.SC-10"
    title: "Ex5"
    summary: "サプライチェーンセキュリティのリスクとレジリエンスを考慮した、サプライヤ関係終了/移行計画を策定・実行する。"
    text: "Develop and execute a plan for terminating or transitioning supplier relationships that takes supply chain security risk and resiliency into account"
  - ref: "GV.SC-10.118"
    parent: "GV.SC-10"
    title: "Ex6"
    summary: "サプライヤ契約終了に起因するデータ・システムへのリスクを緩和する。"
    text: "Mitigate risks to data and systems created by supplier termination"
  - ref: "GV.SC-10.119"
    parent: "GV.SC-10"
    title: "Ex7"
    summary: "サプライヤ契約終了に伴うデータ漏洩リスクを管理する。"
    text: "Manage data leakage risks associated with supplier termination"

  # ──── ID.AM-01 ────
  - ref: "ID.AM-01.120"
    parent: "ID.AM-01"
    title: "Ex1"
    summary: "IT、IoT、OT、モバイル端末を含む全種類のハードウェアインベントリを維持する。"
    text: "Maintain inventories for all types of hardware, including IT, IoT, OT, and mobile devices"
  - ref: "ID.AM-01.121"
    parent: "ID.AM-01"
    title: "Ex2"
    summary: "ネットワークを継続的に監視し、新規ハードウェアを検出してインベントリを自動更新する。"
    text: "Constantly monitor networks to detect new hardware and automatically update inventories"

  # ──── ID.AM-02 ────
  - ref: "ID.AM-02.122"
    parent: "ID.AM-02"
    title: "Ex1"
    summary: "COTS、OSS、カスタムアプリ、API、クラウドサービス等、全種類のソフトウェア/サービスインベントリを維持する。"
    text: "Maintain inventories for all types of software and services, including commercial-off-the-shelf, open-source, custom applications, API services, and cloud-based applications and services"
  - ref: "ID.AM-02.123"
    parent: "ID.AM-02"
    title: "Ex2"
    summary: "コンテナや仮想マシンを含む全プラットフォームで、ソフトウェア・サービスインベントリ変更を継続監視する。"
    text: "Constantly monitor all platforms, including containers and virtual machines, for software and service inventory changes"
  - ref: "ID.AM-02.124"
    parent: "ID.AM-02"
    title: "Ex3"
    summary: "組織のシステムインベントリを維持する。"
    text: "Maintain an inventory of the organization's systems"

  # ──── ID.AM-03 ────
  - ref: "ID.AM-03.125"
    parent: "ID.AM-03"
    title: "Ex1"
    summary: "組織の有線・無線ネットワーク内の通信とデータフローのベースラインを維持する。"
    text: "Maintain baselines of communication and data flows within the organization's wired and wireless networks"
  - ref: "ID.AM-03.126"
    parent: "ID.AM-03"
    title: "Ex2"
    summary: "組織と第三者間の通信とデータフローのベースラインを維持する。"
    text: "Maintain baselines of communication and data flows between the organization and third parties"
  - ref: "ID.AM-03.127"
    parent: "ID.AM-03"
    title: "Ex3"
    summary: "組織の IaaS 利用に関する通信とデータフローのベースラインを維持する。"
    text: "Maintain baselines of communication and data flows for the organization's infrastructure-as-a-service (IaaS) usage"
  - ref: "ID.AM-03.128"
    parent: "ID.AM-03"
    title: "Ex4"
    summary: "認可システム間で通常利用されるネットワークポート・プロトコル・サービスの文書を維持する。"
    text: "Maintain documentation of expected network ports, protocols, and services that are typically used among authorized systems"

  # ──── ID.AM-04 ────
  - ref: "ID.AM-04.129"
    parent: "ID.AM-04"
    title: "Ex1"
    summary: "第三者の IaaS、PaaS、SaaS、API、外部ホスト型アプリ等、組織が利用する全外部サービスを棚卸する。"
    text: "Inventory all external services used by the organization, including third-party infrastructure-as-a-service (IaaS), platform-as-a-service (PaaS), and software-as-a-service (SaaS) offerings; APIs; and other externally hosted application services"
  - ref: "ID.AM-04.130"
    parent: "ID.AM-04"
    title: "Ex2"
    summary: "新規外部サービス利用時にインベントリを更新し、サイバーリスク管理監視を確保する。"
    text: "Update the inventory when a new external service is going to be utilized to ensure adequate cybersecurity risk management monitoring of the organization's use of that service"

  # ──── ID.AM-05 ────
  - ref: "ID.AM-05.131"
    parent: "ID.AM-05"
    title: "Ex1"
    summary: "資産クラスごとの優先順位付け基準を定義する。"
    text: "Define criteria for prioritizing each class of assets"
  - ref: "ID.AM-05.132"
    parent: "ID.AM-05"
    title: "Ex2"
    summary: "優先順位付け基準を資産に適用する。"
    text: "Apply the prioritization criteria to assets"
  - ref: "ID.AM-05.133"
    parent: "ID.AM-05"
    title: "Ex3"
    summary: "資産優先度を追跡し、定期的または組織重大変化時に更新する。"
    text: "Track the asset priorities and update them periodically or when significant changes to the organization occur"

  # ──── ID.AM-07 ────
  - ref: "ID.AM-07.134"
    parent: "ID.AM-07"
    title: "Ex1"
    summary: "PII、PHI、金融口座番号、知的財産、OT データ等、関心対象データ種別のリストを維持する。"
    text: "Maintain a list of the designated data types of interest (e.g., personally identifiable information, protected health information, financial account numbers, organization intellectual property, operational technology data)"
  - ref: "ID.AM-07.135"
    parent: "ID.AM-07"
    title: "Ex2"
    summary: "アドホックデータを継続的に発見・分析し、指定データ種別の新インスタンスを特定する。"
    text: "Continuously discover and analyze ad hoc data to identify new instances of designated data types"
  - ref: "ID.AM-07.136"
    parent: "ID.AM-07"
    title: "Ex3"
    summary: "タグやラベルにより指定データ種別へデータ分類を割り当てる。"
    text: "Assign data classifications to designated data types through tags or labels"
  - ref: "ID.AM-07.137"
    parent: "ID.AM-07"
    title: "Ex4"
    summary: "指定データ種別の各インスタンスについて、来歴・データオーナー・地理的位置を追跡する。"
    text: "Track the provenance, data owner, and geolocation of each instance of designated data types"

  # ──── ID.AM-08 ────
  - ref: "ID.AM-08.138"
    parent: "ID.AM-08"
    title: "Ex1"
    summary: "システム、ハードウェア、ソフトウェア、サービスのライフサイクル全体にサイバー考慮を組み込む。"
    text: "Integrate cybersecurity considerations throughout the life cycles of systems, hardware, software, and services"
  - ref: "ID.AM-08.139"
    parent: "ID.AM-08"
    title: "Ex2"
    summary: "製品ライフサイクルにサイバー考慮を統合する。"
    text: "Integrate cybersecurity considerations into product life cycles"
  - ref: "ID.AM-08.140"
    parent: "ID.AM-08"
    title: "Ex3"
    summary: "ミッション目的達成のための非公式な技術利用(シャドー IT)を特定する。"
    text: "Identify unofficial uses of technology to meet mission objectives (i.e., shadow IT)"
  - ref: "ID.AM-08.141"
    parent: "ID.AM-08"
    title: "Ex4"
    summary: "攻撃面を不必要に拡大する冗長なシステム・ハードウェア・ソフトウェア・サービスを定期的に特定する。"
    text: "Periodically identify redundant systems, hardware, software, and services that unnecessarily increase the organization's attack surface"
  - ref: "ID.AM-08.142"
    parent: "ID.AM-08"
    title: "Ex5"
    summary: "本番展開前に、システム・ハードウェア・ソフトウェア・サービスを適切に設定・セキュア化する。"
    text: "Properly configure and secure systems, hardware, software, and services prior to their deployment in production"
  - ref: "ID.AM-08.143"
    parent: "ID.AM-08"
    title: "Ex6"
    summary: "システム・ハードウェア・ソフトウェア・サービスの組織内移動・移管時にインベントリを更新する。"
    text: "Update inventories when systems, hardware, software, and services are moved or transferred within the organization"
  - ref: "ID.AM-08.144"
    parent: "ID.AM-08"
    title: "Ex7"
    summary: "データ保持ポリシーと所定の破壊方法に基づき保存データを安全に破壊し、破壊記録を維持管理する。"
    text: "Securely destroy stored data based on the organization's data retention policy using the prescribed destruction method, and keep and manage a record of the destructions"
  - ref: "ID.AM-08.145"
    parent: "ID.AM-08"
    title: "Ex8"
    summary: "ハードウェアの廃棄・廃止・再割当・修理・交換時にデータストレージを安全にサニタイズする。"
    text: "Securely sanitize data storage when hardware is being retired, decommissioned, reassigned, or sent for repairs or replacement"
  - ref: "ID.AM-08.146"
    parent: "ID.AM-08"
    title: "Ex9"
    summary: "紙、記憶媒体、その他物理形態のデータストレージの破壊方法を提供する。"
    text: "Offer methods for destroying paper, storage media, and other physical forms of data storage"

  # ──── ID.IM-01 ────
  - ref: "ID.IM-01.177"
    parent: "ID.IM-01"
    title: "Ex1"
    summary: "現状の脅威と TTP を考慮した、重要サービスの自己評価を実施する。"
    text: "Perform self-assessments of critical services that take current threats and TTPs into consideration"
  - ref: "ID.IM-01.178"
    parent: "ID.IM-01"
    title: "Ex2"
    summary: "改善領域特定のため、サイバープログラムの有効性に関する第三者評価や独立監査に投資する。"
    text: "Invest in third-party assessments or independent audits of the effectiveness of the organization's cybersecurity program to identify areas that need improvement"
  - ref: "ID.IM-01.179"
    parent: "ID.IM-01"
    title: "Ex3"
    summary: "自動化手段により、選定したサイバー要件への準拠を継続的に評価する。"
    text: "Constantly evaluate compliance with selected cybersecurity requirements through automated means"

  # ──── ID.IM-02 ────
  - ref: "ID.IM-02.180"
    parent: "ID.IM-02"
    title: "Ex1"
    summary: "卓上演習、シミュレーション、テスト、内部レビュー、独立監査等の評価結果から、将来の IR 改善点を特定する。"
    text: "Identify improvements for future incident response activities based on findings from incident response assessments (e.g., tabletop exercises and simulations, tests, internal reviews, independent audits)"
  - ref: "ID.IM-02.181"
    parent: "ID.IM-02"
    title: "Ex2"
    summary: "重要サービス提供者・製品サプライヤと連携した演習に基づき、BC・DR・IR 活動の改善点を特定する。"
    text: "Identify improvements for future business continuity, disaster recovery, and incident response activities based on exercises performed in coordination with critical service providers and product suppliers"
  - ref: "ID.IM-02.182"
    parent: "ID.IM-02"
    title: "Ex3"
    summary: "経営幹部、法務、HR 等の内部ステークホルダを、適宜セキュリティテスト・演習に関与させる。"
    text: "Involve internal stakeholders (e.g., senior executives, legal department, HR) in security tests and exercises as appropriate"
  - ref: "ID.IM-02.183"
    parent: "ID.IM-02"
    title: "Ex4"
    summary: "経営層承認のもと、選定された高リスクシステムのセキュリティ姿勢改善機会を特定するペネトレーションテストを実施する。"
    text: "Perform penetration testing to identify opportunities to improve the security posture of selected high-risk systems as approved by leadership"
  - ref: "ID.IM-02.184"
    parent: "ID.IM-02"
    title: "Ex5"
    summary: "契約サプライヤ・パートナー由来でない、または受領前に改変された製品/サービス発見時の対応・復旧コンティンジェンシー計画を演習する。"
    text: "Exercise contingency plans for responding to and recovering from the discovery that products or services did not originate with the contracted supplier or partner or were altered before receipt"
  - ref: "ID.IM-02.185"
    parent: "ID.IM-02"
    title: "Ex6"
    summary: "セキュリティツールとサービスでパフォーマンスメトリクスを収集・分析し、サイバープログラム改善に活用する。"
    text: "Collect and analyze performance metrics using security tools and services to inform improvements to the cybersecurity program"

  # ──── ID.IM-03 ────
  - ref: "ID.IM-03.186"
    parent: "ID.IM-03"
    title: "Ex1"
    summary: "サプライヤと協働の振り返りセッションを実施する。"
    text: "Conduct collaborative lessons learned sessions with suppliers"
  - ref: "ID.IM-03.187"
    parent: "ID.IM-03"
    title: "Ex2"
    summary: "教訓を反映するため、サイバーポリシー・プロセス・手順を年次レビューする。"
    text: "Annually review cybersecurity policies, processes, and procedures to take lessons learned into account"
  - ref: "ID.IM-03.188"
    parent: "ID.IM-03"
    title: "Ex3"
    summary: "運用サイバーパフォーマンスを時系列で評価するメトリクスを用いる。"
    text: "Use metrics to assess operational cybersecurity performance over time"

  # ──── ID.IM-04 ────
  - ref: "ID.IM-04.189"
    parent: "ID.IM-04"
    title: "Ex1"
    summary: "業務妨害、機密情報露出、ミッション危殆化に対応・復旧するためのコンティンジェンシー計画(IR、BCP、DR)を確立する。"
    text: "Establish contingency plans (e.g., incident response, business continuity, disaster recovery) for responding to and recovering from adverse events that can interfere with operations, expose confidential information, or otherwise endanger the organization's mission and viability"
  - ref: "ID.IM-04.190"
    parent: "ID.IM-04"
    title: "Ex2"
    summary: "全コンティンジェンシー計画に、連絡先・通信情報、定型シナリオ処理プロセス、優先順位・エスカレーション基準を含める。"
    text: "Include contact and communication information, processes for handling common scenarios, and criteria for prioritization, escalation, and elevation in all contingency plans"
  - ref: "ID.IM-04.191"
    parent: "ID.IM-04"
    title: "Ex3"
    summary: "全種類の脆弱性を特定・評価し、リスク対応の優先順位付け・テスト・実装を行う脆弱性管理計画を策定する。"
    text: "Create a vulnerability management plan to identify and assess all types of vulnerabilities and to prioritize, test, and implement risk responses"
  - ref: "ID.IM-04.192"
    parent: "ID.IM-04"
    title: "Ex4"
    summary: "サイバー計画(更新含む)を、実行責任者と影響を受ける関係者に伝達する。"
    text: "Communicate cybersecurity plans (including updates) to those responsible for carrying them out and to affected parties"
  - ref: "ID.IM-04.193"
    parent: "ID.IM-04"
    title: "Ex5"
    summary: "全サイバー計画を年次または重大改善要時にレビュー・更新する。"
    text: "Review and update all cybersecurity plans annually or when a need for significant improvements is identified"

  # ──── ID.RA-01 ────
  - ref: "ID.RA-01.147"
    parent: "ID.RA-01"
    title: "Ex1"
    summary: "脆弱性管理技術を用いて、未パッチや誤設定のソフトウェアを特定する。"
    text: "Use vulnerability management technologies to identify unpatched and misconfigured software"
  - ref: "ID.RA-01.148"
    parent: "ID.RA-01"
    title: "Ex2"
    summary: "ネットワーク・システムアーキテクチャを、サイバーに影響する設計・実装の弱点について評価する。"
    text: "Assess network and system architectures for design and implementation weaknesses that affect cybersecurity"
  - ref: "ID.RA-01.149"
    parent: "ID.RA-01"
    title: "Ex3"
    summary: "組織開発のソフトウェアをレビュー・分析・テストし、設計・コーディング・デフォルト設定の脆弱性を特定する。"
    text: "Review, analyze, or test organization-developed software to identify design, coding, and default configuration vulnerabilities"
  - ref: "ID.RA-01.150"
    parent: "ID.RA-01"
    title: "Ex4"
    summary: "重要計算資産を収容する施設の物理脆弱性とレジリエンス問題を評価する。"
    text: "Assess facilities that house critical computing assets for physical vulnerabilities and resilience issues"
  - ref: "ID.RA-01.151"
    parent: "ID.RA-01"
    title: "Ex5"
    summary: "脅威インテリジェンス情報源を監視し、製品・サービスの新規脆弱性情報を入手する。"
    text: "Monitor sources of cyber threat intelligence for information on new vulnerabilities in products and services"
  - ref: "ID.RA-01.152"
    parent: "ID.RA-01"
    title: "Ex6"
    summary: "サイバーに影響しうる悪用可能な弱点について、プロセス・手順をレビューする。"
    text: "Review processes and procedures for weaknesses that could be exploited to affect cybersecurity"

  # ──── ID.RA-02 ────
  - ref: "ID.RA-02.153"
    parent: "ID.RA-02"
    title: "Ex1"
    summary: "検知/対応機能を持つサイバーツールを、脅威インテリジェンスフィードを安全に取り込めるよう設定する。"
    text: "Configure cybersecurity tools and technologies with detection or response capabilities to securely ingest cyber threat intelligence feeds"
  - ref: "ID.RA-02.154"
    parent: "ID.RA-02"
    title: "Ex2"
    summary: "信頼できる第三者から、現在の脅威アクターと TTP に関する勧告を受領しレビューする。"
    text: "Receive and review advisories from reputable third parties on current threat actors and their tactics, techniques, and procedures (TTPs)"
  - ref: "ID.RA-02.155"
    parent: "ID.RA-02"
    title: "Ex3"
    summary: "脅威インテリジェンスを監視し、新興技術が持ちうる脆弱性種類の情報を入手する。"
    text: "Monitor sources of cyber threat intelligence for information on the types of vulnerabilities that emerging technologies may have"

  # ──── ID.RA-03 ────
  - ref: "ID.RA-03.156"
    parent: "ID.RA-03"
    title: "Ex1"
    summary: "組織を狙う可能性のある脅威アクター種別と利用しうる TTP の把握に、脅威インテリジェンスを活用する。"
    text: "Use cyber threat intelligence to maintain awareness of the types of threat actors likely to target the organization and the TTPs they are likely to use"
  - ref: "ID.RA-03.157"
    parent: "ID.RA-03"
    title: "Ex2"
    summary: "脅威アクターの痕跡を環境内で探索するスレットハンティングを実施する。"
    text: "Perform threat hunting to look for signs of threat actors within the environment"
  - ref: "ID.RA-03.158"
    parent: "ID.RA-03"
    title: "Ex3"
    summary: "内部脅威アクターを特定するプロセスを実装する。"
    text: "Implement processes for identifying internal threat actors"

  # ──── ID.RA-04 ────
  - ref: "ID.RA-04.159"
    parent: "ID.RA-04"
    title: "Ex1"
    summary: "事業リーダとサイバーリスク管理担当者が協働し、リスクシナリオの可能性・影響を推定してリスク登録簿に記録する。"
    text: "Business leaders and cybersecurity risk management practitioners work together to estimate the likelihood and impact of risk scenarios and record them in risk registers"
  - ref: "ID.RA-04.160"
    parent: "ID.RA-04"
    title: "Ex2"
    summary: "組織の通信・システム・処理データへの不正アクセスの潜在事業影響を列挙する。"
    text: "Enumerate the potential business impacts of unauthorized access to the organization's communications, systems, and data processed in or by those systems"
  - ref: "ID.RA-04.161"
    parent: "ID.RA-04"
    title: "Ex3"
    summary: "System of Systems における連鎖障害の潜在影響を考慮する。"
    text: "Account for the potential impacts of cascading failures for systems of systems"

  # ──── ID.RA-05 ────
  - ref: "ID.RA-05.162"
    parent: "ID.RA-05"
    title: "Ex1"
    summary: "脅威モデルを策定し、データへのリスクをより深く理解し適切な対応を特定する。"
    text: "Develop threat models to better understand risks to the data and identify appropriate risk responses"
  - ref: "ID.RA-05.163"
    parent: "ID.RA-05"
    title: "Ex2"
    summary: "推定可能性と影響に基づき、サイバーリソース配分と投資を優先順位付けする。"
    text: "Prioritize cybersecurity resource allocations and investments based on estimated likelihoods and impacts"

  # ──── ID.RA-06 ────
  - ref: "ID.RA-06.164"
    parent: "ID.RA-06"
    title: "Ex1"
    summary: "脆弱性管理計画の基準を適用し、リスクを受容/移転/緩和/回避するか判断する。"
    text: "Apply the vulnerability management plan's criteria for deciding whether to accept, transfer, mitigate, or avoid risk"
  - ref: "ID.RA-06.165"
    parent: "ID.RA-06"
    title: "Ex2"
    summary: "脆弱性管理計画の基準を適用し、リスク緩和のための補完統制を選定する。"
    text: "Apply the vulnerability management plan's criteria for selecting compensating controls to mitigate risk"
  - ref: "ID.RA-06.166"
    parent: "ID.RA-06"
    title: "Ex3"
    summary: "POA&M、リスク登録簿、リスク詳細レポート等でリスク対応実装の進捗を追跡する。"
    text: "Track the progress of risk response implementation (e.g., plan of action and milestones [POA&M], risk register, risk detail report)"
  - ref: "ID.RA-06.167"
    parent: "ID.RA-06"
    title: "Ex4"
    summary: "リスク評価結果をリスク対応の意思決定と行動に活用する。"
    text: "Use risk assessment findings to inform risk response decisions and actions"
  - ref: "ID.RA-06.168"
    parent: "ID.RA-06"
    title: "Ex5"
    summary: "計画されたリスク対応を、優先度順で影響を受けるステークホルダに伝達する。"
    text: "Communicate planned risk responses to affected stakeholders in priority order"

  # ──── ID.RA-07 ────
  - ref: "ID.RA-07.169"
    parent: "ID.RA-07"
    title: "Ex1"
    summary: "提案変更と例外要求の正式な文書化・レビュー・テスト・承認の手順を実装・遵守する。"
    text: "Implement and follow procedures for the formal documentation, review, testing, and approval of proposed changes and requested exceptions"
  - ref: "ID.RA-07.170"
    parent: "ID.RA-07"
    title: "Ex2"
    summary: "各提案変更の実施/不実施のリスクを文書化し、ロールバックのガイダンスを提供する。"
    text: "Document the possible risks of making or not making each proposed change, and provide guidance on rolling back changes"
  - ref: "ID.RA-07.171"
    parent: "ID.RA-07"
    title: "Ex3"
    summary: "各例外要求関連のリスクと対応計画を文書化する。"
    text: "Document the risks related to each requested exception and the plan for responding to those risks"
  - ref: "ID.RA-07.172"
    parent: "ID.RA-07"
    title: "Ex4"
    summary: "将来のアクションやマイルストーンに基づき受容されたリスクを定期的にレビューする。"
    text: "Periodically review risks that were accepted based upon planned future actions or milestones"

  # ──── ID.RA-08 ────
  - ref: "ID.RA-08.173"
    parent: "ID.RA-08"
    title: "Ex1"
    summary: "契約で定義されたルールとプロトコルに従い、組織とサプライヤ間で脆弱性情報を共有する。"
    text: "Conduct vulnerability information sharing between the organization and its suppliers following the rules and protocols defined in contracts"
  - ref: "ID.RA-08.174"
    parent: "ID.RA-08"
    title: "Ex2"
    summary: "サプライヤ・顧客・パートナー・政府機関からの脅威・脆弱性・インシデント開示の処理・影響分析・対応手順について、責任を割り当て実行を検証する。"
    text: "Assign responsibilities and verify the execution of procedures for processing, analyzing the impact of, and responding to cybersecurity threat, vulnerability, or incident disclosures by suppliers, customers, partners, and government cybersecurity organizations"

  # ──── ID.RA-09 ────
  - ref: "ID.RA-09.175"
    parent: "ID.RA-09"
    title: "Ex1"
    summary: "重要技術製品・サービスの真正性とサイバーを、取得・利用前に評価する。"
    text: "Assess the authenticity and cybersecurity of critical technology products and services prior to acquisition and use"

  # ──── ID.RA-10 ────
  - ref: "ID.RA-10.176"
    parent: "ID.RA-10"
    title: "Ex1"
    summary: "サプライチェーンを含む事業要件と該当サイバー要件に対し、サプライヤリスク評価を実施する。"
    text: "Conduct supplier risk assessments against business and applicable cybersecurity requirements, including the supply chain"

  # ──── PR.AA-01 ────
  - ref: "PR.AA-01.194"
    parent: "PR.AA-01"
    title: "Ex1"
    summary: "従業員・契約者等の新規・追加アクセス要求を、システム/データオーナーの許可を得て管理・追跡・処理する。"
    text: "Initiate requests for new access or additional access for employees, contractors, and others, and track, review, and fulfill the requests, with permission from system or data owners when needed"
  - ref: "PR.AA-01.195"
    parent: "PR.AA-01"
    title: "Ex2"
    summary: "暗号証明書、ID トークン、暗号鍵(鍵管理)、その他クレデンシャルを発行・管理・失効する。"
    text: "Issue, manage, and revoke cryptographic certificates and identity tokens, cryptographic keys (i.e., key management), and other credentials"
  - ref: "PR.AA-01.196"
    parent: "PR.AA-01"
    title: "Ex3"
    summary: "不変ハードウェア特性または安全にプロビジョニングされた識別子から、各デバイスの一意識別子を選定する。"
    text: "Select a unique identifier for each device from immutable hardware characteristics or an identifier securely provisioned to the device"
  - ref: "PR.AA-01.197"
    parent: "PR.AA-01"
    title: "Ex4"
    summary: "棚卸・保守目的で、認可ハードウェアに識別子を物理ラベリングする。"
    text: "Physically label authorized hardware with an identifier for inventory and servicing purposes"

  # ──── PR.AA-02 ────
  - ref: "PR.AA-02.198"
    parent: "PR.AA-02"
    title: "Ex1"
    summary: "登録時に、政府発行 ID(パスポート、ビザ、運転免許証等)を用いて主張された ID を検証する。"
    text: "Verify a person's claimed identity at enrollment time using government-issued identity credentials (e.g., passport, visa, driver's license)"
  - ref: "PR.AA-02.199"
    parent: "PR.AA-02"
    title: "Ex2"
    summary: "各人ごとに異なるクレデンシャルを発行する(クレデンシャル共有禁止)。"
    text: "Issue a different credential for each person (i.e., no credential sharing)"

  # ──── PR.AA-03 ────
  - ref: "PR.AA-03.200"
    parent: "PR.AA-03"
    title: "Ex1"
    summary: "多要素認証を必須とする。"
    text: "Require multifactor authentication"
  - ref: "PR.AA-03.201"
    parent: "PR.AA-03"
    title: "Ex2"
    summary: "パスワード、PIN 等の認証子の最小強度ポリシーを施行する。"
    text: "Enforce policies for the minimum strength of passwords, PINs, and similar authenticators"
  - ref: "PR.AA-03.202"
    parent: "PR.AA-03"
    title: "Ex3"
    summary: "リスクに応じて(ゼロトラスト等)、ユーザ・サービス・ハードウェアを定期的に再認証する。"
    text: "Periodically reauthenticate users, services, and hardware based on risk (e.g., in zero trust architectures)"
  - ref: "PR.AA-03.203"
    parent: "PR.AA-03"
    title: "Ex4"
    summary: "緊急時の安全保護に不可欠なアカウントに、認可された担当者がアクセスできることを確保する。"
    text: "Ensure that authorized personnel can access accounts essential for protecting safety under emergency conditions"

  # ──── PR.AA-04 ────
  - ref: "PR.AA-04.204"
    parent: "PR.AA-04"
    title: "Ex1"
    summary: "SSO システム経由で認証・ユーザ情報を伝達する ID アサーションを保護する。"
    text: "Protect identity assertions that are used to convey authentication and user information through single sign-on systems"
  - ref: "PR.AA-04.205"
    parent: "PR.AA-04"
    title: "Ex2"
    summary: "フェデレーションシステム間で認証・ユーザ情報を伝達する ID アサーションを保護する。"
    text: "Protect identity assertions that are used to convey authentication and user information between federated systems"
  - ref: "PR.AA-04.206"
    parent: "PR.AA-04"
    title: "Ex3"
    summary: "全コンテキストで標準ベースの ID アサーション手法を実装し、生成・保護・検証のガイダンスに従う。"
    text: "Implement standards-based approaches for identity assertions in all contexts, and follow all guidance for the generation (e.g., data models, metadata), protection (e.g., digital signing, encryption), and verification (e.g., signature validation) of identity assertions"

  # ──── PR.AA-05 ────
  - ref: "PR.AA-05.207"
    parent: "PR.AA-05"
    title: "Ex1"
    summary: "論理・物理アクセス権を、定期的および役割変更・離職時にレビューし、不要なものは速やかに失効させる。"
    text: "Review logical and physical access privileges periodically and whenever someone changes roles or leaves the organization, and promptly rescind privileges that are no longer needed"
  - ref: "PR.AA-05.208"
    parent: "PR.AA-05"
    title: "Ex2"
    summary: "認可判断において、要求者と要求リソースの属性(位置、時刻、要求者エンドポイントの健全性等)を考慮する。"
    text: "Take attributes of the requester and the requested resource into account for authorization decisions (e.g., geolocation, day/time, requester endpoint's cyber health)"
  - ref: "PR.AA-05.209"
    parent: "PR.AA-05"
    title: "Ex3"
    summary: "アクセス・特権を必要最小限に制限する(ゼロトラスト等)。"
    text: "Restrict access and privileges to the minimum necessary (e.g., zero trust architecture)"
  - ref: "PR.AA-05.210"
    parent: "PR.AA-05"
    title: "Ex4"
    summary: "重要事業機能に紐づく特権を定期レビューし、職務分掌を確認する。"
    text: "Periodically review the privileges associated with critical business functions to confirm proper separation of duties"

  # ──── PR.AA-06 ────
  - ref: "PR.AA-06.211"
    parent: "PR.AA-06"
    title: "Ex1"
    summary: "警備員、防犯カメラ、施錠入口、警報システム等の物理統制で施設を監視しアクセス制限する。"
    text: "Use security guards, security cameras, locked entrances, alarm systems, and other physical controls to monitor facilities and restrict access"
  - ref: "PR.AA-06.212"
    parent: "PR.AA-06"
    title: "Ex2"
    summary: "高リスク資産を含むエリアには追加の物理セキュリティ統制を採用する。"
    text: "Employ additional physical security controls for areas that contain high-risk assets"
  - ref: "PR.AA-06.213"
    parent: "PR.AA-06"
    title: "Ex3"
    summary: "重要事業資産を含むエリアでは、来客・ベンダ・第三者をエスコートする。"
    text: "Escort guests, vendors, and other third parties within areas that contain business-critical assets"

  # ──── PR.AT-01 ────
  - ref: "PR.AT-01.214"
    parent: "PR.AT-01"
    title: "Ex1"
    summary: "従業員・契約者・パートナー・サプライヤ等、組織非公開リソースの全利用者に基本サイバー認識教育・訓練を提供する。"
    text: "Provide basic cybersecurity awareness and training to employees, contractors, partners, suppliers, and all other users of the organization's non-public resources"
  - ref: "PR.AT-01.215"
    parent: "PR.AT-01"
    title: "Ex2"
    summary: "ソーシャルエンジニアリング検知、攻撃・不審活動の報告、AUP 遵守、基本サイバー衛生(パッチ、パスワード、クレデンシャル保護)を訓練する。"
    text: "Train personnel to recognize social engineering attempts and other common attacks, report attacks and suspicious activity, comply with acceptable use policies, and perform basic cyber hygiene tasks (e.g., patching software, choosing passwords, protecting credentials)"
  - ref: "PR.AT-01.216"
    parent: "PR.AT-01"
    title: "Ex3"
    summary: "サイバーポリシー違反が個人と組織全体に与える結果を説明する。"
    text: "Explain the consequences of cybersecurity policy violations, both to individual users and the organization as a whole"
  - ref: "PR.AT-01.217"
    parent: "PR.AT-01"
    title: "Ex4"
    summary: "基本サイバープラクティスの理解について、ユーザを定期的に評価・テストする。"
    text: "Periodically assess or test users on their understanding of basic cybersecurity practices"
  - ref: "PR.AT-01.218"
    parent: "PR.AT-01"
    title: "Ex5"
    summary: "既存プラクティスの強化と新規導入のため、年次リフレッシャーを必須とする。"
    text: "Require annual refreshers to reinforce existing practices and introduce new practices"

  # ──── PR.AT-02 ────
  - ref: "PR.AT-02.219"
    parent: "PR.AT-02"
    title: "Ex1"
    summary: "物理・サイバー要員、財務、経営層、重要データアクセス者等、追加サイバー訓練を要する特殊役割を組織内で特定する。"
    text: "Identify the specialized roles within the organization that require additional cybersecurity training, such as physical and cybersecurity personnel, finance personnel, senior leadership, and anyone with access to business-critical data"
  - ref: "PR.AT-02.220"
    parent: "PR.AT-02"
    title: "Ex2"
    summary: "契約者・パートナー・サプライヤ・第三者を含む特殊役割全員に、役割ベースのサイバー認識・訓練を提供する。"
    text: "Provide role-based cybersecurity awareness and training to all those in specialized roles, including contractors, partners, suppliers, and other third parties"
  - ref: "PR.AT-02.221"
    parent: "PR.AT-02"
    title: "Ex3"
    summary: "特殊役割のサイバープラクティス理解について、ユーザを定期的に評価・テストする。"
    text: "Periodically assess or test users on their understanding of cybersecurity practices for their specialized roles"
  - ref: "PR.AT-02.222"
    parent: "PR.AT-02"
    title: "Ex4"
    summary: "既存プラクティスの強化と新規導入のため、年次リフレッシャーを必須とする。"
    text: "Require annual refreshers to reinforce existing practices and introduce new practices"

  # ──── PR.DS-01 ────
  - ref: "PR.DS-01.223"
    parent: "PR.DS-01"
    title: "Ex1"
    summary: "ファイル、DB、VM ディスクイメージ、コンテナイメージ等の保存データの機密性・完全性を、暗号化・電子署名・暗号ハッシュで保護する。"
    text: "Use encryption, digital signatures, and cryptographic hashes to protect the confidentiality and integrity of stored data in files, databases, virtual machine disk images, container images, and other resources"
  - ref: "PR.DS-01.224"
    parent: "PR.DS-01"
    title: "Ex2"
    summary: "ユーザエンドポイントの保存データ保護に FDE(フルディスク暗号化)を使用する。"
    text: "Use full disk encryption to protect data stored on user endpoints"
  - ref: "PR.DS-01.225"
    parent: "PR.DS-01"
    title: "Ex3"
    summary: "署名検証によりソフトウェアの完全性を確認する。"
    text: "Confirm the integrity of software by validating signatures"
  - ref: "PR.DS-01.226"
    parent: "PR.DS-01"
    title: "Ex4"
    summary: "データ流出防止のため、リムーバブルメディアの利用を制限する。"
    text: "Restrict the use of removable media to prevent data exfiltration"
  - ref: "PR.DS-01.227"
    parent: "PR.DS-01"
    title: "Ex5"
    summary: "暗号化されていない機密情報を含むリムーバブルメディアを、施錠オフィスやファイルキャビネット等で物理的に保護する。"
    text: "Physically secure removable media containing unencrypted sensitive information, such as within locked offices or file cabinets"

  # ──── PR.DS-02 ────
  - ref: "PR.DS-02.228"
    parent: "PR.DS-02"
    title: "Ex1"
    summary: "ネットワーク通信の機密性・完全性を、暗号化・電子署名・暗号ハッシュで保護する。"
    text: "Use encryption, digital signatures, and cryptographic hashes to protect the confidentiality and integrity of network communications"
  - ref: "PR.DS-02.229"
    parent: "PR.DS-02"
    title: "Ex2"
    summary: "データ分類に応じて、機密データを含む送信メール等を自動暗号化またはブロックする。"
    text: "Automatically encrypt or block outbound emails and other communications that contain sensitive data, depending on the data classification"
  - ref: "PR.DS-02.230"
    parent: "PR.DS-02"
    title: "Ex3"
    summary: "組織システム・ネットワークから、個人用メール・ファイル共有・ストレージ・通信アプリへのアクセスをブロックする。"
    text: "Block access to personal email, file sharing, file storage services, and other personal communications applications and services from organizational systems and networks"
  - ref: "PR.DS-02.231"
    parent: "PR.DS-02"
    title: "Ex4"
    summary: "本番環境の機密データ(顧客レコード等)を、開発・テスト等の非本番環境で再利用しない。"
    text: "Prevent reuse of sensitive data from production environments (e.g., customer records) in development, testing, and other non-production environments"

  # ──── PR.DS-10 ────
  - ref: "PR.DS-10.232"
    parent: "PR.DS-10"
    title: "Ex1"
    summary: "機密データ(プロセッサ・メモリ等から)を、不要になった時点で速やかに削除する。"
    text: "Remove data that must remain confidential (e.g., from processors and memory) as soon as it is no longer needed"
  - ref: "PR.DS-10.233"
    parent: "PR.DS-10"
    title: "Ex2"
    summary: "利用中データを、同一プラットフォームの他ユーザ・他プロセスからのアクセスから保護する。"
    text: "Protect data in use from access by other users and processes of the same platform"

  # ──── PR.DS-11 ────
  - ref: "PR.DS-11.234"
    parent: "PR.DS-11"
    title: "Ex1"
    summary: "重要データはニアリアルタイムで継続バックアップし、それ以外は合意スケジュールで頻繁にバックアップする。"
    text: "Continuously back up critical data in near-real-time, and back up other data frequently at agreed-upon schedules"
  - ref: "PR.DS-11.235"
    parent: "PR.DS-11"
    title: "Ex2"
    summary: "全データソース種別について、少なくとも年次でバックアップとリストアをテストする。"
    text: "Test backups and restores for all types of data sources at least annually"
  - ref: "PR.DS-11.236"
    parent: "PR.DS-11"
    title: "Ex3"
    summary: "インシデント・災害で損なわれないよう、一部バックアップをオフライン・オフサイトで安全保管する。"
    text: "Securely store some backups offline and offsite so that an incident or disaster will not damage them"
  - ref: "PR.DS-11.237"
    parent: "PR.DS-11"
    title: "Ex4"
    summary: "データバックアップストレージに地理的分離と地理的位置の制約を施行する。"
    text: "Enforce geographic separation and geolocation restrictions for data backup storage"

  # ──── PR.IR-01 ────
  - ref: "PR.IR-01.260"
    parent: "PR.IR-01"
    title: "Ex1"
    summary: "信頼境界とプラットフォーム種別(IT、IoT、OT、モバイル、ゲスト等)に応じてネットワーク/クラウドを論理セグメント化し、セグメント間は必要な通信のみ許可する。"
    text: "Logically segment organization networks and cloud-based platforms according to trust boundaries and platform types (e.g., IT, IoT, OT, mobile, guests), and permit required communications only between segments"
  - ref: "PR.IR-01.261"
    parent: "PR.IR-01"
    title: "Ex2"
    summary: "組織ネットワークを外部ネットワークから論理分離し、外部から組織ネットワークへ必要な通信のみ許可する。"
    text: "Logically segment organization networks from external networks, and permit only necessary communications to enter the organization's networks from the external networks"
  - ref: "PR.IR-01.262"
    parent: "PR.IR-01"
    title: "Ex3"
    summary: "ゼロトラストアーキテクチャを実装し、各リソースへのネットワークアクセスを必要最小限に制限する。"
    text: "Implement zero trust architectures to restrict network access to each resource to the minimum necessary"
  - ref: "PR.IR-01.263"
    parent: "PR.IR-01"
    title: "Ex4"
    summary: "エンドポイントが本番リソースにアクセス・利用する前に、サイバー健全性をチェックする。"
    text: "Check the cyber health of endpoints before allowing them to access and use production resources"

  # ──── PR.IR-02 ────
  - ref: "PR.IR-02.264"
    parent: "PR.IR-02"
    title: "Ex1"
    summary: "洪水・火災・強風・過度な熱・湿度等、既知の環境的脅威から組織機器を保護する。"
    text: "Protect organizational equipment from known environmental threats, such as flooding, fire, wind, and excessive heat and humidity"
  - ref: "PR.IR-02.265"
    parent: "PR.IR-02"
    title: "Ex2"
    summary: "組織のためにシステムを運用するサービスプロバイダへの要件に、環境脅威保護と適切な運用基盤の規定を含める。"
    text: "Include protection from environmental threats and provisions for adequate operating infrastructure in requirements for service providers that operate systems on the organization's behalf"

  # ──── PR.IR-03 ────
  - ref: "PR.IR-03.266"
    parent: "PR.IR-03"
    title: "Ex1"
    summary: "システムとインフラの単一障害点を回避する。"
    text: "Avoid single points of failure in systems and infrastructure"
  - ref: "PR.IR-03.267"
    parent: "PR.IR-03"
    title: "Ex2"
    summary: "ロードバランシングを利用して容量を増やし信頼性を向上する。"
    text: "Use load balancing to increase capacity and improve reliability"
  - ref: "PR.IR-03.268"
    parent: "PR.IR-03"
    title: "Ex3"
    summary: "冗長ストレージや電源等の高可用性コンポーネントを使用してシステム信頼性を向上する。"
    text: "Use high-availability components like redundant storage and power supplies to improve system reliability"

  # ──── PR.IR-04 ────
  - ref: "PR.IR-04.269"
    parent: "PR.IR-04"
    title: "Ex1"
    summary: "ストレージ、電力、計算、ネットワーク帯域等のリソース使用状況を監視する。"
    text: "Monitor usage of storage, power, compute, network bandwidth, and other resources"
  - ref: "PR.IR-04.270"
    parent: "PR.IR-04"
    title: "Ex2"
    summary: "将来の需要を予測し、リソースをそれに応じてスケールさせる。"
    text: "Forecast future needs, and scale resources accordingly"

  # ──── PR.PS-01 ────
  - ref: "PR.PS-01.238"
    parent: "PR.PS-01"
    title: "Ex1"
    summary: "サイバーポリシーを施行し最小機能を提供するハードン化ベースラインを確立・テスト・展開・維持する。"
    text: "Establish, test, deploy, and maintain hardened baselines that enforce the organization's cybersecurity policies and provide only essential capabilities (i.e., principle of least functionality)"
  - ref: "PR.PS-01.239"
    parent: "PR.PS-01"
    title: "Ex2"
    summary: "ソフトウェアのインストール・アップグレード時に、サイバー影響しうる全デフォルト設定をレビューする。"
    text: "Review all default configuration settings that may potentially impact cybersecurity when installing or upgrading software"
  - ref: "PR.PS-01.240"
    parent: "PR.PS-01"
    title: "Ex3"
    summary: "実装ソフトウェアの承認ベースラインからの逸脱を監視する。"
    text: "Monitor implemented software for deviations from approved baselines"

  # ──── PR.PS-02 ────
  - ref: "PR.PS-02.241"
    parent: "PR.PS-02"
    title: "Ex1"
    summary: "脆弱性管理計画で指定された期間内に、定常・緊急パッチを適用する。"
    text: "Perform routine and emergency patching within the timeframes specified in the vulnerability management plan"
  - ref: "PR.PS-02.242"
    parent: "PR.PS-02"
    title: "Ex2"
    summary: "コンテナイメージを更新し、既存インスタンスを更新するのではなく新規コンテナインスタンスを展開して置換する。"
    text: "Update container images, and deploy new container instances to replace rather than update existing instances"
  - ref: "PR.PS-02.243"
    parent: "PR.PS-02"
    title: "Ex3"
    summary: "End-of-Life ソフトウェア・サービスバージョンを、サポートされた保守バージョンに置換する。"
    text: "Replace end-of-life software and service versions with supported, maintained versions"
  - ref: "PR.PS-02.244"
    parent: "PR.PS-02"
    title: "Ex4"
    summary: "過度なリスクをもたらす未認可ソフトウェア・サービスをアンインストール・削除する。"
    text: "Uninstall and remove unauthorized software and services that pose undue risks"
  - ref: "PR.PS-02.245"
    parent: "PR.PS-02"
    title: "Ex5"
    summary: "攻撃者に悪用されうる不要なソフトウェアコンポーネント(OS ユーティリティ等)をアンインストール・削除する。"
    text: "Uninstall and remove any unnecessary software components (e.g., operating system utilities) that attackers might misuse"
  - ref: "PR.PS-02.246"
    parent: "PR.PS-02"
    title: "Ex6"
    summary: "ソフトウェア・サービスの End-of-Life 保守支援と陳腐化に関する計画を定義・実装する。"
    text: "Define and implement plans for software and service end-of-life maintenance support and obsolescence"

  # ──── PR.PS-03 ────
  - ref: "PR.PS-03.247"
    parent: "PR.PS-03"
    title: "Ex1"
    summary: "必要なセキュリティ機能を欠く、または当該機能を持つソフトウェアをサポートできないハードウェアを置換する。"
    text: "Replace hardware when it lacks needed security capabilities or when it cannot support software with needed security capabilities"
  - ref: "PR.PS-03.248"
    parent: "PR.PS-03"
    title: "Ex2"
    summary: "ハードウェアの End-of-Life 保守支援と陳腐化に関する計画を定義・実装する。"
    text: "Define and implement plans for hardware end-of-life maintenance support and obsolescence"
  - ref: "PR.PS-03.249"
    parent: "PR.PS-03"
    title: "Ex3"
    summary: "ハードウェア廃棄を安全・責任ある・監査可能な方法で実施する。"
    text: "Perform hardware disposal in a secure, responsible, and auditable manner"

  # ──── PR.PS-04 ────
  - ref: "PR.PS-04.250"
    parent: "PR.PS-04"
    title: "Ex1"
    summary: "全 OS、アプリ、サービス(クラウド含む)がログレコードを生成するよう設定する。"
    text: "Configure all operating systems, applications, and services (including cloud-based services) to generate log records"
  - ref: "PR.PS-04.251"
    parent: "PR.PS-04"
    title: "Ex2"
    summary: "ログ生成元が、組織のロギング基盤システム・サービスへ安全にログを共有するよう設定する。"
    text: "Configure log generators to securely share their logs with the organization's logging infrastructure systems and services"
  - ref: "PR.PS-04.252"
    parent: "PR.PS-04"
    title: "Ex3"
    summary: "ゼロトラストアーキテクチャに必要なデータを記録するよう、ログ生成元を設定する。"
    text: "Configure log generators to record the data needed by zero-trust architectures"

  # ──── PR.PS-05 ────
  - ref: "PR.PS-05.253"
    parent: "PR.PS-05"
    title: "Ex1"
    summary: "リスクが正当化される場合、許可された製品のみのソフトウェア実行に制限する、または禁止・未認可ソフトウェアの実行を拒否する。"
    text: "When risk warrants it, restrict software execution to permitted products only or deny the execution of prohibited and unauthorized software"
  - ref: "PR.PS-05.254"
    parent: "PR.PS-05"
    title: "Ex2"
    summary: "新規ソフトウェアの提供元と完全性を、インストール前に検証する。"
    text: "Verify the source of new software and the software's integrity before installing it"
  - ref: "PR.PS-05.255"
    parent: "PR.PS-05"
    title: "Ex3"
    summary: "既知の悪意あるドメインへのアクセスをブロックする承認 DNS サービスのみを使用するよう、プラットフォームを設定する。"
    text: "Configure platforms to use only approved DNS services that block access to known malicious domains"
  - ref: "PR.PS-05.256"
    parent: "PR.PS-05"
    title: "Ex4"
    summary: "組織承認ソフトウェアのみのインストールを許可するよう、プラットフォームを設定する。"
    text: "Configure platforms to allow the installation of organization-approved software only"

  # ──── PR.PS-06 ────
  - ref: "PR.PS-06.257"
    parent: "PR.PS-06"
    title: "Ex1"
    summary: "組織開発ソフトウェアの全コンポーネントを、改ざんや未認可アクセスから保護する。"
    text: "Protect all components of organization-developed software from tampering and unauthorized access"
  - ref: "PR.PS-06.258"
    parent: "PR.PS-06"
    title: "Ex2"
    summary: "組織が生成する全ソフトウェアを、リリース時の脆弱性最小化を伴って安全化する。"
    text: "Secure all software produced by the organization, with minimal vulnerabilities in their releases"
  - ref: "PR.PS-06.259"
    parent: "PR.PS-06"
    title: "Ex3"
    summary: "本番環境のソフトウェアを維持し、不要となった時点で安全に廃棄する。"
    text: "Maintain the software used in production environments, and securely dispose of software once it is no longer needed"

  # ──── DE.AE-02 ────
  - ref: "DE.AE-02.290"
    parent: "DE.AE-02"
    title: "Ex1"
    summary: "SIEM 等で、既知の悪意ある活動・不審活動のログイベントを継続監視する。"
    text: "Use security information and event management (SIEM) or other tools to continuously monitor log events for known malicious and suspicious activity"
  - ref: "DE.AE-02.291"
    parent: "DE.AE-02"
    title: "Ex2"
    summary: "最新の脅威インテリジェンスをログ分析ツールで活用し、検知精度を高め、脅威アクター・手法・IoC を特徴づける。"
    text: "Utilize up-to-date cyber threat intelligence in log analysis tools to improve detection accuracy and characterize threat actors, their methods, and indicators of compromise"
  - ref: "DE.AE-02.292"
    parent: "DE.AE-02"
    title: "Ex3"
    summary: "自動化で十分監視できない技術については、ログイベントの手動レビューを定期実施する。"
    text: "Regularly conduct manual reviews of log events for technologies that cannot be sufficiently monitored through automation"
  - ref: "DE.AE-02.293"
    parent: "DE.AE-02"
    title: "Ex4"
    summary: "ログ分析ツールを用いて分析結果のレポートを生成する。"
    text: "Use log analysis tools to generate reports on their findings"

  # ──── DE.AE-03 ────
  - ref: "DE.AE-03.294"
    parent: "DE.AE-03"
    title: "Ex1"
    summary: "他のソースが生成するログデータを、比較的少数のログサーバへ継続的に転送する。"
    text: "Constantly transfer log data generated by other sources to a relatively small number of log servers"
  - ref: "DE.AE-03.295"
    parent: "DE.AE-03"
    title: "Ex2"
    summary: "SIEM 等のイベント相関技術で、複数ソースから取得した情報を収集する。"
    text: "Use event correlation technology (e.g., SIEM) to collect information captured by multiple sources"
  - ref: "DE.AE-03.296"
    parent: "DE.AE-03"
    title: "Ex3"
    summary: "ログソース間のイベント相関に脅威インテリジェンスを活用する。"
    text: "Utilize cyber threat intelligence to help correlate events among log sources"

  # ──── DE.AE-04 ────
  - ref: "DE.AE-04.297"
    parent: "DE.AE-04"
    title: "Ex1"
    summary: "SIEM 等で影響と範囲を推定し、推定をレビュー・精緻化する。"
    text: "Use SIEMs or other tools to estimate impact and scope, and review and refine the estimates"
  - ref: "DE.AE-04.298"
    parent: "DE.AE-04"
    title: "Ex2"
    summary: "担当者が独自に影響と範囲の推定を作成する。"
    text: "A person creates their own estimates of impact and scope"

  # ──── DE.AE-06 ────
  - ref: "DE.AE-06.299"
    parent: "DE.AE-06"
    title: "Ex1"
    summary: "サイバーソフトウェアでアラートを生成し、SOC、IR 担当、IR ツールに提供する。"
    text: "Use cybersecurity software to generate alerts and provide them to the security operations center (SOC), incident responders, and incident response tools"
  - ref: "DE.AE-06.300"
    parent: "DE.AE-06"
    title: "Ex2"
    summary: "IR 担当やその他認可担当者が、常時ログ分析結果にアクセス可能とする。"
    text: "Incident responders and other authorized personnel can access log analysis findings at all times"
  - ref: "DE.AE-06.301"
    parent: "DE.AE-06"
    title: "Ex3"
    summary: "特定種別のアラート発生時に、組織のチケットシステムでチケットを自動作成・割当する。"
    text: "Automatically create and assign tickets in the organization's ticketing system when certain types of alerts occur"
  - ref: "DE.AE-06.302"
    parent: "DE.AE-06"
    title: "Ex4"
    summary: "技術担当者が侵害指標を発見した際に、組織のチケットシステムでチケットを手動作成・割当する。"
    text: "Manually create and assign tickets in the organization's ticketing system when technical staff discover indicators of compromise"

  # ──── DE.AE-07 ────
  - ref: "DE.AE-07.303"
    parent: "DE.AE-07"
    title: "Ex1"
    summary: "脅威インテリジェンスフィードを、検知技術・プロセス・担当者へ安全に提供する。"
    text: "Securely provide cyber threat intelligence feeds to detection technologies, processes, and personnel"
  - ref: "DE.AE-07.304"
    parent: "DE.AE-07"
    title: "Ex2"
    summary: "資産インベントリからの情報を、検知技術・プロセス・担当者へ安全に提供する。"
    text: "Securely provide information from asset inventories to detection technologies, processes, and personnel"
  - ref: "DE.AE-07.305"
    parent: "DE.AE-07"
    title: "Ex3"
    summary: "サプライヤ・ベンダ・第三者セキュリティ勧告から、組織の技術に関する脆弱性開示を迅速に取得・分析する。"
    text: "Rapidly acquire and analyze vulnerability disclosures for the organization's technologies from suppliers, vendors, and third-party security advisories"

  # ──── DE.AE-08 ────
  - ref: "DE.AE-08.306"
    parent: "DE.AE-08"
    title: "Ex1"
    summary: "活動の既知・推定特性にインシデント基準を適用し、インシデントとして宣言すべきか判断する。"
    text: "Apply incident criteria to known and assumed characteristics of activity in order to determine whether an incident should be declared"
  - ref: "DE.AE-08.307"
    parent: "DE.AE-08"
    title: "Ex2"
    summary: "インシデント基準適用時、既知の誤検知を考慮する。"
    text: "Take known false positives into account when applying incident criteria"

  # ──── DE.CM-01 ────
  - ref: "DE.CM-01.271"
    parent: "DE.CM-01"
    title: "Ex1"
    summary: "DNS、BGP 等のネットワークサービスを監視し、有害事象を検出する。"
    text: "Monitor DNS, BGP, and other network services for adverse events"
  - ref: "DE.CM-01.272"
    parent: "DE.CM-01"
    title: "Ex2"
    summary: "未認可エンドポイントからの接続を検知するため、有線・無線ネットワークを監視する。"
    text: "Monitor wired and wireless networks for connections from unauthorized endpoints"
  - ref: "DE.CM-01.273"
    parent: "DE.CM-01"
    title: "Ex3"
    summary: "未認可・不正な無線ネットワークがないか、施設を監視する。"
    text: "Monitor facilities for unauthorized or rogue wireless networks"
  - ref: "DE.CM-01.274"
    parent: "DE.CM-01"
    title: "Ex4"
    summary: "実際のネットワークフローをベースラインと比較して逸脱を検知する。"
    text: "Compare actual network flows against baselines to detect deviations"
  - ref: "DE.CM-01.275"
    parent: "DE.CM-01"
    title: "Ex5"
    summary: "ゼロトラスト目的で、ネットワーク通信を監視してセキュリティ姿勢の変化を特定する。"
    text: "Monitor network communications to identify changes in security postures for zero trust purposes"

  # ──── DE.CM-02 ────
  - ref: "DE.CM-02.276"
    parent: "DE.CM-02"
    title: "Ex1"
    summary: "物理アクセス制御システム(バッジリーダ等)のログを監視し、異常アクセスパターンや失敗アクセス試行を発見する。"
    text: "Monitor logs from physical access control systems (e.g., badge readers) to find unusual access patterns (e.g., deviations from the norm) and failed access attempts"
  - ref: "DE.CM-02.277"
    parent: "DE.CM-02"
    title: "Ex2"
    summary: "訪問者登録、サインインシート等の物理アクセス記録をレビュー・監視する。"
    text: "Review and monitor physical access records (e.g., from visitor registration, sign-in sheets)"
  - ref: "DE.CM-02.278"
    parent: "DE.CM-02"
    title: "Ex3"
    summary: "物理アクセス制御(錠、掛金、ヒンジピン、警報等)の改ざん兆候を監視する。"
    text: "Monitor physical access controls (e.g., locks, latches, hinge pins, alarms) for signs of tampering"
  - ref: "DE.CM-02.279"
    parent: "DE.CM-02"
    title: "Ex4"
    summary: "警報システム、カメラ、警備員で物理環境を監視する。"
    text: "Monitor the physical environment using alarm systems, cameras, and security guards"

  # ──── DE.CM-03 ────
  - ref: "DE.CM-03.280"
    parent: "DE.CM-03"
    title: "Ex1"
    summary: "行動分析ソフトウェアで異常なユーザ活動を検知し、インサイダー脅威を緩和する。"
    text: "Use behavior analytics software to detect anomalous user activity to mitigate insider threats"
  - ref: "DE.CM-03.281"
    parent: "DE.CM-03"
    title: "Ex2"
    summary: "論理アクセス制御システムのログを監視し、異常アクセスパターンや失敗アクセス試行を発見する。"
    text: "Monitor logs from logical access control systems to find unusual access patterns and failed access attempts"
  - ref: "DE.CM-03.282"
    parent: "DE.CM-03"
    title: "Ex3"
    summary: "ユーザアカウント等を含むデセプション技術を、利用兆候について継続監視する。"
    text: "Continuously monitor deception technology, including user accounts, for any usage"

  # ──── DE.CM-06 ────
  - ref: "DE.CM-06.283"
    parent: "DE.CM-06"
    title: "Ex1"
    summary: "外部プロバイダが組織システムに対して行うリモート・オンサイトの管理・保守活動を監視する。"
    text: "Monitor remote and onsite administration and maintenance activities that external providers perform on organizational systems"
  - ref: "DE.CM-06.284"
    parent: "DE.CM-06"
    title: "Ex2"
    summary: "クラウドサービス、ISP 等のサービスプロバイダの活動を、想定動作からの逸脱について監視する。"
    text: "Monitor activity from cloud-based services, internet service providers, and other service providers for deviations from expected behavior"

  # ──── DE.CM-09 ────
  - ref: "DE.CM-09.285"
    parent: "DE.CM-09"
    title: "Ex1"
    summary: "メール、Web、ファイル共有、コラボサービス等の一般的攻撃ベクタを監視し、マルウェア、フィッシング、漏洩等の有害事象を検知する。"
    text: "Monitor email, web, file sharing, collaboration services, and other common attack vectors to detect malware, phishing, data leaks and exfiltration, and other adverse events"
  - ref: "DE.CM-09.286"
    parent: "DE.CM-09"
    title: "Ex2"
    summary: "認証試行を監視し、クレデンシャル攻撃や未認可クレデンシャル再利用を特定する。"
    text: "Monitor authentication attempts to identify attacks against credentials and unauthorized credential reuse"
  - ref: "DE.CM-09.287"
    parent: "DE.CM-09"
    title: "Ex3"
    summary: "ソフトウェア設定をセキュリティベースラインからの逸脱について監視する。"
    text: "Monitor software configurations for deviations from security baselines"
  - ref: "DE.CM-09.288"
    parent: "DE.CM-09"
    title: "Ex4"
    summary: "ハードウェア・ソフトウェアの改ざん兆候を監視する。"
    text: "Monitor hardware and software for signs of tampering"
  - ref: "DE.CM-09.289"
    parent: "DE.CM-09"
    title: "Ex5"
    summary: "エンドポイント上に常駐する技術でサイバー健全性問題(未パッチ、マルウェア感染、未認可ソフト等)を検知し、アクセス許可前に修復環境へリダイレクトする。"
    text: "Use technologies with a presence on endpoints to detect cyber health issues (e.g., missing patches, malware infections, unauthorized software), and redirect the endpoints to a remediation environment before access is authorized"

  # ──── RS.AN-03 ────
  - ref: "RS.AN-03.321"
    parent: "RS.AN-03"
    title: "Ex1"
    summary: "インシデント中の事象シーケンスと、各事象に関与した資産・リソースを特定する。"
    text: "Determine the sequence of events that occurred during the incident and which assets and resources were involved in each event"
  - ref: "RS.AN-03.322"
    parent: "RS.AN-03"
    title: "Ex2"
    summary: "インシデントに直接・間接的に関与した脆弱性、脅威、脅威アクターを特定する。"
    text: "Attempt to determine what vulnerabilities, threats, and threat actors were directly or indirectly involved in the incident"
  - ref: "RS.AN-03.323"
    parent: "RS.AN-03"
    title: "Ex3"
    summary: "インシデントを分析し、根底にあるシステム的な根本原因を見つける。"
    text: "Analyze the incident to find the underlying, systemic root causes"
  - ref: "RS.AN-03.324"
    parent: "RS.AN-03"
    title: "Ex4"
    summary: "攻撃者行動の追加情報のため、サイバーデセプション技術を確認する。"
    text: "Check any cyber deception technology for additional information on attacker behavior"

  # ──── RS.AN-06 ────
  - ref: "RS.AN-06.325"
    parent: "RS.AN-06"
    title: "Ex1"
    summary: "IR 担当者および IR タスクを行う者(システム管理者、サイバー技術者等)に、行動を記録し記録を不変化することを要件化する。"
    text: "Require each incident responder and others (e.g., system administrators, cybersecurity engineers) who perform incident response tasks to record their actions and make the record immutable"
  - ref: "RS.AN-06.326"
    parent: "RS.AN-06"
    title: "Ex2"
    summary: "インシデントリードに、インシデントの詳細文書化と、報告される全情報の文書・ソースの完全性保全を責任付ける。"
    text: "Require the incident lead to document the incident in detail and be responsible for preserving the integrity of the documentation and the sources of all information being reported"

  # ──── RS.AN-07 ────
  - ref: "RS.AN-07.327"
    parent: "RS.AN-07"
    title: "Ex1"
    summary: "証拠保全と Chain-of-Custody 手順に基づき、全関連インシデントデータ・メタデータを収集・保存し完全性を保護する。"
    text: "Collect, preserve, and safeguard the integrity of all pertinent incident data and metadata (e.g., data source, date/time of collection) based on evidence preservation and chain-of-custody procedures"

  # ──── RS.AN-08 ────
  - ref: "RS.AN-08.328"
    parent: "RS.AN-08"
    title: "Ex1"
    summary: "他のインシデント潜在対象をレビューし、IoC と永続性の証拠を探索する。"
    text: "Review other potential targets of the incident to search for indicators of compromise and evidence of persistence"
  - ref: "RS.AN-08.329"
    parent: "RS.AN-08"
    title: "Ex2"
    summary: "対象上でツールを自動実行し、IoC と永続性の証拠を探索する。"
    text: "Automatically run tools on targets to look for indicators of compromise and evidence of persistence"

  # ──── RS.CO-02 ────
  - ref: "RS.CO-02.330"
    parent: "RS.CO-02"
    title: "Ex1"
    summary: "データ侵害発見後、影響を受けた顧客への通知を含む、組織の侵害通知手順に従う。"
    text: "Follow the organization's breach notification procedures after discovering a data breach incident, including notifying affected customers"
  - ref: "RS.CO-02.331"
    parent: "RS.CO-02"
    title: "Ex2"
    summary: "契約要件に従って、ビジネスパートナーと顧客にインシデントを通知する。"
    text: "Notify business partners and customers of incidents in accordance with contractual requirements"
  - ref: "RS.CO-02.332"
    parent: "RS.CO-02"
    title: "Ex3"
    summary: "IR 計画の基準と経営承認に基づき、法執行機関と規制当局にインシデントを通知する。"
    text: "Notify law enforcement agencies and regulatory bodies of incidents based on criteria in the incident response plan and management approval"

  # ──── RS.CO-03 ────
  - ref: "RS.CO-03.333"
    parent: "RS.CO-03"
    title: "Ex1"
    summary: "対応計画と情報共有合意に従って情報を安全に共有する。"
    text: "Securely share information consistent with response plans and information sharing agreements"
  - ref: "RS.CO-03.334"
    parent: "RS.CO-03"
    title: "Ex2"
    summary: "機微データを除去した上で、攻撃者の観測 TTP 情報を ISAC と自発的に共有する。"
    text: "Voluntarily share information about an attacker's observed TTPs, with all sensitive data removed, with an Information Sharing and Analysis Center (ISAC)"
  - ref: "RS.CO-03.335"
    parent: "RS.CO-03"
    title: "Ex3"
    summary: "悪意あるインサイダー活動発生時に HR へ通知する。"
    text: "Notify HR when malicious insider activity occurs"
  - ref: "RS.CO-03.336"
    parent: "RS.CO-03"
    title: "Ex4"
    summary: "重大インシデントのステータスを経営層に定期的に更新する。"
    text: "Regularly update senior leadership on the status of major incidents"
  - ref: "RS.CO-03.337"
    parent: "RS.CO-03"
    title: "Ex5"
    summary: "組織とサプライヤ間のインシデント情報共有について、契約で定義されたルールとプロトコルに従う。"
    text: "Follow the rules and protocols defined in contracts for incident information sharing between the organization and its suppliers"
  - ref: "RS.CO-03.338"
    parent: "RS.CO-03"
    title: "Ex6"
    summary: "組織と重要サプライヤ間の危機コミュニケーション手法を調整する。"
    text: "Coordinate crisis communication methods between the organization and its critical suppliers"

  # ──── RS.MA-01 ────
  - ref: "RS.MA-01.308"
    parent: "RS.MA-01"
    title: "Ex1"
    summary: "検知技術が確認済みインシデントを自動報告する。"
    text: "Detection technologies automatically report confirmed incidents"
  - ref: "RS.MA-01.309"
    parent: "RS.MA-01"
    title: "Ex2"
    summary: "組織の IR アウトソーサーに支援を要請する。"
    text: "Request incident response assistance from the organization's incident response outsourcer"
  - ref: "RS.MA-01.310"
    parent: "RS.MA-01"
    title: "Ex3"
    summary: "各インシデントにインシデントリードを指定する。"
    text: "Designate an incident lead for each incident"
  - ref: "RS.MA-01.311"
    parent: "RS.MA-01"
    title: "Ex4"
    summary: "IR を支援するため、追加のサイバー計画(BCP、DR 等)を必要に応じて開始する。"
    text: "Initiate execution of additional cybersecurity plans as needed to support incident response (for example, business continuity and disaster recovery)"

  # ──── RS.MA-02 ────
  - ref: "RS.MA-02.312"
    parent: "RS.MA-02"
    title: "Ex1"
    summary: "インシデントレポートを予備レビューし、サイバー関連かつ IR 活動を要するか確認する。"
    text: "Preliminarily review incident reports to confirm that they are cybersecurity-related and necessitate incident response activities"
  - ref: "RS.MA-02.313"
    parent: "RS.MA-02"
    title: "Ex2"
    summary: "基準を適用してインシデントの重大度を推定する。"
    text: "Apply criteria to estimate the severity of an incident"

  # ──── RS.MA-03 ────
  - ref: "RS.MA-03.314"
    parent: "RS.MA-03"
    title: "Ex1"
    summary: "データ侵害、ランサムウェア、DDoS、アカウント侵害等のインシデント種別に基づき、詳細にレビュー・分類する。"
    text: "Further review and categorize incidents based on the type of incident (e.g., data breach, ransomware, DDoS, account compromise)"
  - ref: "RS.MA-03.315"
    parent: "RS.MA-03"
    title: "Ex2"
    summary: "範囲、影響可能性、時間緊急性に基づきインシデントを優先順位付けする。"
    text: "Prioritize incidents based on their scope, likely impact, and time-critical nature"
  - ref: "RS.MA-03.316"
    parent: "RS.MA-03"
    title: "Ex3"
    summary: "迅速復旧の必要性と、攻撃者観察・詳細調査の必要性のバランスをとり、能動的インシデントの IR 戦略を選択する。"
    text: "Select incident response strategies for active incidents by balancing the need to quickly recover from an incident with the need to observe the attacker or conduct a more thorough investigation"

  # ──── RS.MA-04 ────
  - ref: "RS.MA-04.317"
    parent: "RS.MA-04"
    title: "Ex1"
    summary: "進行中の全インシデントのステータスを追跡・検証する。"
    text: "Track and validate the status of all ongoing incidents"
  - ref: "RS.MA-04.318"
    parent: "RS.MA-04"
    title: "Ex2"
    summary: "指定された内外ステークホルダとインシデントエスカレーション・上申を調整する。"
    text: "Coordinate incident escalation or elevation with designated internal and external stakeholders"

  # ──── RS.MA-05 ────
  - ref: "RS.MA-05.319"
    parent: "RS.MA-05"
    title: "Ex1"
    summary: "インシデントの既知・推定特性にインシデント復旧基準を適用し、復旧プロセスを開始すべきか判断する。"
    text: "Apply incident recovery criteria to known and assumed characteristics of the incident to determine whether incident recovery processes should be initiated"
  - ref: "RS.MA-05.320"
    parent: "RS.MA-05"
    title: "Ex2"
    summary: "IR 復旧活動による業務中断の可能性を考慮する。"
    text: "Take the possible operational disruption of incident recovery activities into account"

  # ──── RS.MI-01 ────
  - ref: "RS.MI-01.339"
    parent: "RS.MI-01"
    title: "Ex1"
    summary: "サイバー技術(アンチウイルス等)や他技術のサイバー機能(OS、ネットワーク機器等)が、封じ込めアクションを自動実行する。"
    text: "Cybersecurity technologies (e.g., antivirus software) and cybersecurity features of other technologies (e.g., operating systems, network infrastructure devices) automatically perform containment actions"
  - ref: "RS.MI-01.340"
    parent: "RS.MI-01"
    title: "Ex2"
    summary: "IR 担当者が手動で封じ込めアクションを選択・実行できるようにする。"
    text: "Allow incident responders to manually select and perform containment actions"
  - ref: "RS.MI-01.341"
    parent: "RS.MI-01"
    title: "Ex3"
    summary: "ISP やマネージドセキュリティサービスプロバイダ等の第三者が、組織に代わって封じ込めアクションを実行できるようにする。"
    text: "Allow a third party (e.g., internet service provider, managed security service provider) to perform containment actions on behalf of the organization"
  - ref: "RS.MI-01.342"
    parent: "RS.MI-01"
    title: "Ex4"
    summary: "侵害されたエンドポイントを修復用 VLAN へ自動的に移転する。"
    text: "Automatically transfer compromised endpoints to a remediation virtual local area network (VLAN)"

  # ──── RS.MI-02 ────
  - ref: "RS.MI-02.343"
    parent: "RS.MI-02"
    title: "Ex1"
    summary: "サイバー技術や他技術のサイバー機能(OS、ネットワーク機器等)が、根絶アクションを自動実行する。"
    text: "Cybersecurity technologies and cybersecurity features of other technologies (e.g., operating systems, network infrastructure devices) automatically perform eradication actions"
  - ref: "RS.MI-02.344"
    parent: "RS.MI-02"
    title: "Ex2"
    summary: "IR 担当者が手動で根絶アクションを選択・実行できるようにする。"
    text: "Allow incident responders to manually select and perform eradication actions"
  - ref: "RS.MI-02.345"
    parent: "RS.MI-02"
    title: "Ex3"
    summary: "マネージドセキュリティサービスプロバイダ等の第三者が、組織に代わって根絶アクションを実行できるようにする。"
    text: "Allow a third party (e.g., managed security service provider) to perform eradication actions on behalf of the organization"

  # ──── RC.CO-03 ────
  - ref: "RC.CO-03.358"
    parent: "RC.CO-03"
    title: "Ex1"
    summary: "対応計画と情報共有合意に従い、復旧進捗を含む復旧情報を安全に共有する。"
    text: "Securely share recovery information, including restoration progress, consistent with response plans and information sharing agreements"
  - ref: "RC.CO-03.359"
    parent: "RC.CO-03"
    title: "Ex2"
    summary: "重大インシデントの復旧ステータスと進捗を経営層に定期更新する。"
    text: "Regularly update senior leadership on recovery status and restoration progress for major incidents"
  - ref: "RC.CO-03.360"
    parent: "RC.CO-03"
    title: "Ex3"
    summary: "組織とサプライヤ間のインシデント情報共有について、契約で定義されたルールとプロトコルに従う。"
    text: "Follow the rules and protocols defined in contracts for incident information sharing between the organization and its suppliers"
  - ref: "RC.CO-03.361"
    parent: "RC.CO-03"
    title: "Ex4"
    summary: "組織と重要サプライヤ間の危機コミュニケーションを調整する。"
    text: "Coordinate crisis communication between the organization and its critical suppliers"

  # ──── RC.CO-04 ────
  - ref: "RC.CO-04.362"
    parent: "RC.CO-04"
    title: "Ex1"
    summary: "データ侵害インシデントからの復旧について、組織の侵害通知手順に従う。"
    text: "Follow the organization's breach notification procedures for recovering from a data breach incident"
  - ref: "RC.CO-04.363"
    parent: "RC.CO-04"
    title: "Ex2"
    summary: "インシデント復旧と再発防止のためのステップを説明する。"
    text: "Explain the steps being taken to recover from the incident and to prevent a recurrence"

  # ──── RC.RP-01 ────
  - ref: "RC.RP-01.346"
    parent: "RC.RP-01"
    title: "Ex1"
    summary: "IR プロセス中または終了後に復旧手順を開始する。"
    text: "Begin recovery procedures during or after incident response processes"
  - ref: "RC.RP-01.347"
    parent: "RC.RP-01"
    title: "Ex2"
    summary: "復旧責任者全員に、復旧計画と各側面の実装に必要な認可を周知する。"
    text: "Make all individuals with recovery responsibilities aware of the plans for recovery and the authorizations required to implement each aspect of the plans"

  # ──── RC.RP-02 ────
  - ref: "RC.RP-02.348"
    parent: "RC.RP-02"
    title: "Ex1"
    summary: "IR 計画で定義された基準と利用可能リソースに基づき、復旧アクションを選定する。"
    text: "Select recovery actions based on the criteria defined in the incident response plan and available resources"
  - ref: "RC.RP-02.349"
    parent: "RC.RP-02"
    title: "Ex2"
    summary: "組織のニーズとリソースの再評価に基づき、計画された復旧アクションを変更する。"
    text: "Change planned recovery actions based on a reassessment of organizational needs and resources"

  # ──── RC.RP-03 ────
  - ref: "RC.RP-03.350"
    parent: "RC.RP-03"
    title: "Ex1"
    summary: "利用前に、復元資産の IoC、ファイル破損、その他完全性問題をチェックする。"
    text: "Check restoration assets for indicators of compromise, file corruption, and other integrity issues before use"

  # ──── RC.RP-04 ────
  - ref: "RC.RP-04.351"
    parent: "RC.RP-04"
    title: "Ex1"
    summary: "ビジネスインパクトとシステム分類記録(サービス提供目標を含む)を用いて、不可欠サービスが適切な順序で復元されたことを検証する。"
    text: "Use business impact and system categorization records (including service delivery objectives) to validate that essential services are restored in the appropriate order"
  - ref: "RC.RP-04.352"
    parent: "RC.RP-04"
    title: "Ex2"
    summary: "システムオーナーと連携し、システムの復元成功と通常運用への復帰を確認する。"
    text: "Work with system owners to confirm the successful restoration of systems and the return to normal operations"
  - ref: "RC.RP-04.353"
    parent: "RC.RP-04"
    title: "Ex3"
    summary: "復元済みシステムのパフォーマンスを監視し、復元の妥当性を検証する。"
    text: "Monitor the performance of restored systems to verify the adequacy of the restoration"

  # ──── RC.RP-05 ────
  - ref: "RC.RP-05.354"
    parent: "RC.RP-05"
    title: "Ex1"
    summary: "本番利用前に、復元済み資産の IoC とインシデント根本原因の修復をチェックする。"
    text: "Check restored assets for indicators of compromise and remediation of root causes of the incident before production use"
  - ref: "RC.RP-05.355"
    parent: "RC.RP-05"
    title: "Ex2"
    summary: "復元システムをオンラインにする前に、復元アクションの正確性と妥当性を検証する。"
    text: "Verify the correctness and adequacy of the restoration actions taken before putting a restored system online"

  # ──── RC.RP-06 ────
  - ref: "RC.RP-06.356"
    parent: "RC.RP-06"
    title: "Ex1"
    summary: "インシデント、対応・復旧アクション、教訓を文書化するアフターアクションレポートを作成する。"
    text: "Prepare an after-action report that documents the incident itself, the response and recovery actions taken, and lessons learned"
  - ref: "RC.RP-06.357"
    parent: "RC.RP-06"
    title: "Ex2"
    summary: "基準を満たした時点でインシデント復旧の終了を宣言する。"
    text: "Declare the end of incident recovery once the criteria are met"
