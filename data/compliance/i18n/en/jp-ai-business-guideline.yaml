# document, so its name and section names stay in the original and carry an English
# gloss — the same treatment the threat library gives the CRYPTREC citations. A reader
# must still be able to find the cited section in the official text.
#
# `ref` itself is the lookup key that threat rules point at and is never replaced;
# `refLabels` only supplies what to *display*.
#
# Source: METI / MIC "AI 事業者ガイドライン" v1.01 (April 2024)
#
# SPDX-License-Identifier: Apache-2.0

