schemaVersion: 1

standard:
  id: d3fend
  title: "MITRE D3FEND"
  version: "1.6.0"
  url: "https://d3fend.mitre.org/"
  license: "MIT License (d3fend/d3fend-ontology)"
  disclaimer: "title / summary は D3FEND 1.6.0 の防御策名の翻案と独自要約。定義の原文は出典 URL を参照。"

items:
  # ────────────────────────────────────────────────
  # Harden — 守りを固める
  # ────────────────────────────────────────────────
  - ref: "D3-MFA"
    title: "多要素認証"
    summary: "二つ以上の証拠を求めて本人を確認し、パスワードの漏えいだけでは入れないようにする。"
  - ref: "D3-CBAN"
    title: "証明書による認証"
    summary: "デジタル証明書を持つ主体だけを認証する。サービス間の相互 TLS や端末証明書での接続が当たる。"
  - ref: "D3-SPP"
    title: "強いパスワードポリシー"
    summary: "パスワードの長さや複雑さの要件を引き上げ、総当たりやオフライン解析で破られにくくする。"
  - ref: "D3-CRO"
    title: "資格情報の定期更新"
    summary: "パスワード・API キー・証明書などを定期的に入れ替え、漏えいした資格情報が使える期間を短くする。"
  - ref: "D3-CERO"
    title: "証明書の更新"
    summary: "証明書と秘密鍵を計画的に入れ替え、鍵が漏れても悪用できる期間と範囲を限る。"
  - ref: "D3-TAAN"
    title: "メール中継サーバーの認証"
    summary: "メッセージを中継するサーバーが送信を許可された相手であることを検証する。"
  - ref: "D3-MENCR"
    title: "メッセージの暗号化"
    summary: "メッセージ本文を暗号鍵で暗号化し、経路の途中で読まれても中身が分からないようにする。"
  - ref: "D3-FE"
    title: "ファイルの暗号化"
    summary: "保管するファイルを暗号鍵で暗号化し、保管場所が漏えいしても内容が読めないようにする。"
  - ref: "D3-SU"
    title: "ソフトウェアの更新"
    summary: "古いソフトウェアを修正版に置き換え、公開済みの脆弱性を塞ぐ。"
  - ref: "D3-ACH"
    title: "アプリケーション設定の堅牢化"
    summary: "アプリケーションの設定を見直し、不要な機能や緩い設定を減らして攻撃される面を小さくする。"

  # ────────────────────────────────────────────────
  # Detect — 検知する
  # ────────────────────────────────────────────────
  - ref: "D3-RTA"
    title: "RPC 通信の分析"
    summary: "リモートプロシージャコールの通信を監視して通常の動きを把握し、不審な呼び出しを見つける。"
  - ref: "D3-DAM"
    title: "ドメインアカウントの監視"
    summary: "ドメインのユーザーアカウントの作成や変更を監視し、不正な改ざんを検知する。"
  - ref: "D3-LAM"
    title: "ローカルアカウントの監視"
    summary: "各システムが持つローカルアカウントを調べ、放置された口座や不審な利用を見つける。"
  - ref: "D3-FIM"
    title: "ファイル完全性の監視"
    summary: "ファイルへの不審な変更を検知する。ログや設定の改ざん・削除の発見に使う。"
  - ref: "D3-SDM"
    title: "システムデーモンの監視"
    summary: "重要な常駐プロセスの状態や設定の変化を追い、エージェントの停止などを検知する。"
  - ref: "D3-EHB"
    title: "エンドポイントの死活信号"
    summary: "端末が定期的に状態を送り、信号が途絶えたことを侵害や停止の兆候として扱う。"

  # ────────────────────────────────────────────────
  # Isolate — 隔離する
  # ────────────────────────────────────────────────
  - ref: "D3-UAP"
    title: "ユーザーアカウントの権限制限"
    summary: "アカウントがアクセスできる資源を必要最小限に絞り、権限の持ちすぎを防ぐ。"
  - ref: "D3-LFP"
    title: "ローカルファイルの権限設定"
    summary: "OS の機能でファイルの読み書きできる主体を定め、共有フォルダなどの書き込み権限を絞る。"
  - ref: "D3-DTP"
    title: "ドメイン間の信頼ポリシー"
    summary: "ドメイン同士の信頼関係を設定で絞り、不要な信頼や不正な信頼の追加を許さない。"
  - ref: "D3-NRAM"
    title: "ネットワーク越しの資源へのアクセス仲介"
    summary: "利用者やプロセスがネットワーク越しにシステムやサービスへ届くとき、可否を判定してから通す。"
  - ref: "D3-LAMED"
    title: "LAN への接続の仲介"
    summary: "LAN に接続する機器を認証・検証してから通し、未認証の機器の接続を拒む（802.1X など）。"
  - ref: "D3-BDI"
    title: "ブロードキャストドメインの分離"
    summary: "同じ LAN 内で通信できる範囲を区切り、一台の侵害が同じ区画の全端末に及ばないようにする。"
  - ref: "D3-ITF"
    title: "受信通信のフィルタリング"
    summary: "信頼できないネットワークから内側への通信を制限し、許可した送信元以外を通さない。"
  - ref: "D3-OTF"
    title: "送信通信のフィルタリング"
    summary: "内側から信頼できないネットワークへの通信を制限し、許可した宛先以外への持ち出しを防ぐ。"
  - ref: "D3-NTF"
    title: "ネットワーク通信のフィルタリング"
    summary: "通信の向きを問わず、許可した通信だけを通す。管理用ネットワークの分離などに使う。"
  - ref: "D3-ET"
    title: "暗号化トンネル"
    summary: "経路上の通信を暗号化して包み、専用線や VPN の区間での盗聴や改ざんを防ぐ。"
  - ref: "D3-DNSAL"
    title: "DNS の許可リスト"
    summary: "名前解決を承認したドメインに限り、想定外の宛先への誘導や接続を防ぐ。"
  - ref: "D3-CM"
    title: "コンテンツの書き換え"
    summary: "ポリシーに合わない内容を書き換えて通す。要求に含まれる不正なヘッダーの除去や上書きが当たる。"

  # ────────────────────────────────────────────────
  # Evict — 排除する
  # ────────────────────────────────────────────────
  - ref: "D3-CR"
    title: "資格情報の失効"
    summary: "盗まれたおそれのある資格情報を失効させ、以後の認証に使えないようにする。"
