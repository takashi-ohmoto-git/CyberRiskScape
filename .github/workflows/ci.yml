# 型チェック・テスト・ビルドの継続的インテグレーション。
# main への push と、main 宛ての Pull Request で実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 型チェック（strict）
        run: npx tsc --noEmit

      # ラチェット：残り 3 件（§6.1 違反は 0）。増えたら落とす。
      # 警告を減らしたらこの数値も下げること。
      - name: Lint（警告がベースラインを超えたら失敗）
        run: npm run lint -- --max-warnings 3

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
