# 型チェック・テスト・ビルドの継続的インテグレーション。
# main への push と、main 宛ての Pull Request で実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 型チェック（strict）
        run: npx tsc --noEmit

      # 警告ゼロを維持する。1 件でも出たら落とす。
      - name: Lint（警告ゼロを維持）
        run: npm run lint -- --max-warnings 0

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
