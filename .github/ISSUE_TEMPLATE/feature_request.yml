name: Feature request
description: Suggest a capability the tool does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the Roadmap in the [README](https://github.com/takashi-ohmoto-git/CyberRiskScape#roadmap)
        first — English UI coverage, a structured audit report, and an English threat library
        are already planned.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation you are in, not only the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or manual steps.
